da, 2022) e <em>La digitalizzazione del  lavoro<\/em> (Guida, 2023)."}, "Daria Perrotta": {"bio": "<strong>Daria Perrotta<\/strong> è Ragioniere Generale dello Stato dal 2024. Magistrato contabile, è laureata in Scienze Politiche (LUISS) e Giurisprudenza (Urbino) e ha conseguito un Master in econometria applicata (Scuola Superiore dell’Economia e delle Finanze). Ha acquisito una lunga esperienza nelle istituzioni, prima presso la V Commissione della Camera dei deputati, poi in ambito governativo, in particolare come Capo di gabinetto del Sottosegretario alla Presidenza del Consiglio dei Ministri e Capo dell’U!icio del coordinamento legislativo del Ministero dell’economia e delle finanze."}, "Mario Comana": {"bio": "<strong>Mario Comana<\/strong> è professore di Economia degli Intermediari Finanziari alla LUISS di Roma. Dopo la laurea a Bergamo e una specializzazione alla Harvard University, ha insegnato in diverse università italiane e internazionali. È presidente dell’Organismo di vigilanza sui Confidi Minori, consulente scientifico di associazioni bancarie, vicepresidente del comitato scientifico di Napoli Fintech Lab e founding partner di Simmetrix. Ha ricoperto incarichi come consigliere indipendente e presidente di società quotate. Esperto in strategia bancaria, innovazione finanziaria e gestione del rischio, è autore di numerose pubblicazioni ed editorialista di <em>Milano Finanza<\/em>."}, "Fabio Massoli": {"bio": "<strong>Fabio Massoli<\/strong> è Direttore Amministrazione, Finanza e Controllo di Cassa Depositi e Prestiti. In CDP dal 2015, ha ricoperto negli anni il ruolo di Responsabile Finanza e Deputy CFO, contribuendo allo sviluppo delle strategie finanziarie del gruppo. In precedenza ha lavorato con incarichi di crescente responsabilità in Unicredit e nel Gruppo BNP Paribas, maturando una solida esperienza nel settore bancario e finanziario. È stato membro di numerosi consigli di amministrazione, ed è attualmente consigliere di ASPI. A!ianca l’attività manageriale a quella accademica, come professore a contratto presso la Luiss Business School, dove insegna al Master in Corporate Finance."}, "Ugo Biggeri": {"bio": "<strong>Ugo Biggeri <\/strong>è laureato in Fisica e da sempre impegnato nei movimenti della società civile. È stato fondatore di Banca Etica e dal 2009 è docente a contratto in Finanza etica e microcredito presso l’Università di Firenze. È stato fondatore e quindi presidente di Banca popolare Etica e di Etica Sgr. Attualmente è il rappresentante per l&#x27;Europa della rete internazionale Global Alliance for Banking on Values. I suoi libri i più recenti: <em>I  soldi danno la felicità<\/em> (Chiarelettere, 2020), <em>Finanza Etica<\/em> (Il Mulino, 2021), <em>Ethical Finance and  prosperity, beyond ESG investment<\/em> (Routledge, 2023)."}, "Daniele Atzori": {"bio": "<strong>Daniele Atzori<\/strong> è un ricercatore e analista specializzato in geopolitica, energia e mercato del carbonio. Vive e lavora nel Regno Unito, coordinando attività di ricerca strategica e formazione su temi legati alla transizione energetica. Ha collaborato con imprese, università e istituzioni, contribuendo al dibattito sulle politiche energetiche attraverso articoli, seminari e interventi accademici. Ha conseguito un dottorato di ricerca presso la Durham University e pubblicato con Routledge e il Mulino. Il suo lavoro unisce rigore analitico, chiarezza comunicativa e una prospettiva interculturale sulle sfide della sostenibilità."}, "Starting Finance": {"bio": "<strong>Starting Finance<\/strong> è la principale startup italiana dedicata all’educazione e all’informazione economico-finanziaria per le nuove generazioni. Nata nel 2018 da un gruppo di studenti universitari, ha costruito la più grande community under 35 del settore, raggiungendo oltre 7 milioni di utenti al mese sui social. Attraverso contenuti digitali, eventi, corsi e una propria business school, Starting Finance promuove la consapevolezza finanziaria come strumento di benessere e cittadinanza. Con iniziative come il <em>Manifesto per l’educazione  finanziaria<\/em> e l’<em>Investment Meeting<\/em>, si è a!ermata come realtà di riferimento a livello nazionale."}, "Paolo Bonolis": {"bio": "<strong>Paolo Bonolis <\/strong>è socio dello studio internazionale CMS e professore a contratto presso l’Università LUISS Guido Carli e la Luiss Business School, dove insegna fintech, digital finance e business law. Esperto di diritto bancario e dei mercati finanziari, ha una consolidata esperienza come consulente legale e advisor strategico per istituzioni e aziende del settore finanziario. È autore di pubblicazioni in materia di moneta elettronica, finanza decentralizzata e criptovalute. Il suo lavoro si concentra sui rapporti tra finanza, tecnologia e inclusione, con particolare attenzione alla transizione verso una società <em>cashless<\/em> e sostenibile. Le opinioni espresse in questa intervista sono esclusivamente attribuibili all’intervistato  e non riflettono necessariamente la posizione delle istituzioni di cui egli fa parte."}, "Massimo Bernaschi": {"bio": "<strong>Massimo Bernaschi<\/strong> è Professore di Blockchain and Cryptocurrencies all’Università LUISS di Roma e rappresenta l’Italia come delegato governativo presso l’Agenzia Europea della Difesa per il CapTech Communication, Information System and Networks. Laureato in Fisica nel 1987 sotto la guida di Giorgio Parisi, ha partecipato allo sviluppo del computer APE dell’INFN. Ha lavorato per dieci anni allo European Center for Scientific and Engineering Computing di IBM, dove ha ricevuto due Outstanding Technical Achievement Awards. Durante l’emergenza COVID-19 ha fatto parte della task force del Ministero per l’Innovazione, contribuendo alla gestione dei dati. Attualmente è Dirigente Tecnologo presso l’Istituto per le Applicazioni del Calcolo del CNR, Vicepresidente del Consortium GARR e fa parte del Consiglio Tecnico-Scientifico degli esperti del Ministero dell&#x27;Economia e Finanze."}, "Luca Fantacci": {"bio": "<strong>Luca Fantacci <\/strong>è docente di Economia Politica e di Storia Economica all’Università degli Studi di Milano e insegna Storia Finanziaria e Storia del Pensiero Economico all’Università Bocconi di Milano. Si occupa dell’evoluzione delle teorie e dei sistemi monetari e finanziari. È co-autore, con Massimo Amato, di <em>The End of  Finance<\/em> (Polity Pr, 2011), <em>Saving  the Market from Capitalism<\/em> (Polity, 2014) e <em>A Fistful of Bitcoin<\/em> (Bocconi University Press, 2020). Ha scritto <em>La moneta. Storia di un’istituzione  mancata<\/em> (Marsilio, 2005) e, assieme a Antonio Nicaso, Greta Nasi e Walter Rauti, <em>The Darkweb Side of  Mafias. Appalti, crypto e cybercrime.  Le mafie adesso, più invisibili e  potenti<\/em> (Zolfo, 2024)."}, "Marco Migliorelli": {"bio": "<strong>Marco Migliorelli <\/strong>è un funzionario della Commissione europea. È esperto in finanza sostenibile e ha pubblicato, tra gli altri, i libri <em>The  Rise of Green Finance in Europe<\/em> (Springer, 2019) e <em>Sustainability  and Financial Risks<\/em> (Palgrave Macmillan, 2020). Ha collaborato con l’Università di Roma Tor Vergata e l’Università di Parigi-1 PanthéonSorbonne. Attualmente si occupa di cooperazione allo sviluppo per i Paesi del Mediterraneo."}, "Marco Margheri": {"bio": "<strong>Marco Margheri<\/strong> è Presidente della sezione italiana di WEC – World Energy Council, che riunisce istituzioni, accademia, associazioni e aziende attorno ai principali temi del dibattito energetico. Oggi negli USA è Head of US Relations per Eni. Nel settore energetico, ha a lungo lavorato in Edison e precedentemente in GE Oil&amp;Gas. È componente del Consiglio di Amministrazione dell’Atlantic Council, professore a contratto presso l’Università LUISS Guido Carli di Roma, e Membro Onorario della Fondazione Milano per La Scala."}, "Massimo Nicolazzi": {"bio": "<strong>Massimo Nicolazzi <\/strong>ha una lunga carriera in ambito energetico, avendo lavorato per Eni e Lukoil prima di essere nominato amministratore delegato di Centrex Europe. Oggi svolge attività di consulenza ed è Presidente di ISAB. Ha sviluppato e gestito importanti progetti energetici in Europa Centrale e Orientale, Kazakistan, Libia e altri Paesi del Mediterraneo. Senior Advisor del Programma di Sicurezza Energetica dell’ISPI. Dal 2015 è Professore a contratto di Economia e Management delle Fonti Energetiche all’Università di Torino. È autore di numerose pubblicazioni ed è membro del comitato scientifico della rivista geopolitica italiana <em>Limes<\/em>."}, "Gilberto Pichetto Fratin": {"bio": "<strong>Gilberto Pichetto Fratin<\/strong> è Ministro dell’Ambiente e della Sicurezza Energetica ed esponente di Forza Italia. Laureato in Economia e Commercio all’Università di Torino, ha esercitato come dottore commercialista e docente di ragioneria. Attivo in politica sin da giovane, ha ricoperto incarichi di amministrazione locale e regionale in Piemonte, entrando in Forza Italia nel 1995. È stato Senatore della Repubblica e, dal 2021, Viceministro dello Sviluppo Economico nel Governo Draghi. Il 22 ottobre 2022 ha giurato come Ministro nel Governo Meloni e, con il suo dicastero, è attualmente al lavoro per la reintroduzione dell’energia nucleare nel mix energetico nazionale."}, "Giovanni Guzzetta": {"bio": "<strong>Giovanni Guzzetta<\/strong> è professore ordinario di Diritto costituzionale presso l’Università di Roma “Tor Vergata”. Accademico di riconosciuto prestigio, ha alle spalle una lunga esperienza nell’ambito delle riforme istituzionali e della legislazione elettorale. Tra i suoi incarichi istituzionali di rilievo, è Consigliere giuridico del Ministro dell’Ambiente e della Sicurezza Energetica, incaricato di redigere il quadro giuridico per la disciplina organica del nucleare sostenibile. È stato Componente del CLEP, Presidente della Corte costituzionale di San Marino, Capo di Gabinetto del Ministro della PA, Vicepresidente del Consiglio di Presidenza della Giustizia amministrativa. È coordinatore di un Master in Lobby e processi decisionali e di un Master in Diritto dell’intelligenza artificiale e dell’innovazione tecnologica. È avvocato e Partner dello studio legale associato Legal Protection. Autore di numerosi saggi e pubblicazioni, nonché editorialista di vari quotidiani, Guzzetta è da anni protagonista del dibattito pubblico su temi di diritto costituzionale, amministrativo, europeo, governance e qualità delle istituzioni."}, "Maurizio Zinni": {"bio": "<strong>Maurizio Zinni<\/strong> insegna Storia contemporanea e Storia dei partiti politici e dei movimenti sociali presso l’Università di Roma Sapienza. I suoi interessi di ricerca riguardano i rapporti fra culturale e politica nel XX e XXI secolo, in particolare lo studio delle icone moderne e dei media come fonti della storia contemporanea. Tra le sue pubblicazioni <em>Fascisti di celluloide.  La memoria del ventennio nel cinema  italiano (1945-2000)<\/em> e <em>Schermi  radioattivi. L’America, Hollywood e l’incubo nucleare da  Hiroshima alla crisi di Cuba<\/em> entrambi editi da Marsilio. Nel 2021 ha pubblicato con Alessandro Volterra il volume <em>Il leone, il giudice e il capestro.  Storia e immagini della repressione  italiana in Cirenaica (1928-1932)<\/em> con l’editore Donzelli."}, "Giuseppe Zollino": {"bio": "<strong>Giuseppe Zollino<\/strong> è professore di Tecnica ed Economia dell’Energia e di Impianti Nucleari all’Università di Padova dal 2001 ed è autore di oltre 90 pubblicazioni nel campo delle tecnologie e degli scenari energetici. Ha già ricoperto importanti incarichi in ambito europeo: ha lavorato a lungo alla Commissione ITRE del Parlamento Europeo, responsabile di molti dossier sull’energia, ed è stato delegato Italiano nel Comitato Energia del 7° Programma Quadro, collaborando con la Commissione Europea sui programmi di sviluppo di tecnologie energetiche innovative. È stato presidente di Sogin S.p.A., la società di Stato incaricata dello smantellamento di vecchi impianti e centrali nucleari."}, "Giovanni Biassoni": {"bio": "<strong>Giovanni Biassoni<\/strong> si laurea in Lettere e Filosofia alla Sapienza di Roma in triennale con una tesi sul concetto di guerra giusta in Sant’Agostino e consegue la laurea magistrale in scienze filosofiche a RomaTre con una tesi dedicata a Ernesto De Martino e al suo concetto di apocalisse culturale. In questi anni si è occupato di rap e formazione attraverso la promozione di laboratori creativi di scrittura in metrica presso cooperative sociali e scuole di Roma, in particolare Spazio Incontro Scholè, nel ruolo di educatore. Attualmente collabora con “Equilibri Magazine”, la rivista per lo sviluppo sostenibile della Fondazione Mattei, e con la rivista “Comprendere” nel ruolo di ricercatore e articolista."}, "Francesca Salvemini": {"bio": "<strong>Francesca Salvemini<\/strong> è Capo della Segreteria Tecnica del Ministro dell’Ambiente e della Sicurezza Energetica, incarico che ricopre dal gennaio 2023. In questo ruolo ha guidato l’aggiornamento del Piano Nazionale Energia e Clima e coordinato la Piattaforma Nazionale per un Nucleare Sostenibile. È membro di comitati strategici, quali quello per i Green Bond, il Comitato di Indirizzo del Fondo Italiano per il Clima e il Board europeo sulle materie prime critiche. In precedenza, ha maturato una vasta esperienza nel settore energetico, lavorando nel Gabinetto di Mario Monti come Commissario Europeo per il Mercato Interno, presso l’Autorità per l’Energia Elettrica e il Gas, e nel Gabinetto del Ministro dello Sviluppo Economico durante il secondo governo Berlusconi. Ha ricoperto incarichi di responsabilità nel mercato elettrico italiano e in Sogin, dove si è occupata del decommissioning e della chiusura del ciclo del combustibile nucleare."}, "Maria Luisa De Rimini": {"bio": "<strong>Maria Luisa De Rimini<\/strong> è dirigente medico e Direttore dell’UOC di Medicina Nucleare dell’Ospedale dei Colli - Monaldi di Napoli, nonché Presidente dell’Associazione Italiana di Medicina Nucleare, Imaging Molecolare e Terapia. Si è laureata in Medicina e Chirurgia nel 1979 presso l’Università degli Studi di Napoli Federico II, specializzandosi successivamente in Malattie dell’Apparato Cardiovascolare, Medicina Nucleare e Radiodiagnostica. Attualmente è Professore presso l’Università degli Studi della Campania, all’interno della Scuola di Specializzazione in Cardiologia. Nel corso della sua carriera ha partecipato a numerosi congressi scientifici nei settori della Medicina Nucleare, Radiologia, Oncologia e Cardiologia."}, "Antonio Zoccoli": {"bio": "<strong>Antonio Zoccoli<\/strong>, Presidente dell’Istituto Nazionale di Fisica Nucleare (INFN) dal luglio 2019, è professore di fisica all’Università degli Studi di Bologna, già membro della giunta esecutiva e del consiglio direttivo dell’INFN. Dal 2022 è presidente della Fondazione ICSC che gestisce il Centro Nazionale di ricerca High Performance Computing, Big Data e Quantum Computing. Svolge attività di ricerca sperimentale nel campo della fisica fondamentale, nucleare e subnucleare, ed è stato membro di diverse collaborazioni internazionali, al Rutherford Lab, nel Regno Unito, al CERN a Ginevra, in Svizzera, e al laboratorio DESY ad Amburgo, in Germania. Dal 2005 è membro della collaborazione ATLAS al CERN, che insieme alla collaborazione CMS ha annunciato la prima osservazione del bosone di Higgs, nel luglio 2012."}, "Laura Luigia Martini": {"bio": "<strong>Laura Luigia Martini<\/strong> è un ingegnere nucleare laureato al Politecnico di Milano, con un Executive MBA e un master in ESG presso SDA Bocconi. Ha oltre 25 anni di esperienza nei settori industriali e dei servizi, specializzandosi in strategia di mercato e sviluppo del business per aziende pubbliche ad alta tecnologia. Esperta di gestione dati, telecomunicazioni e automotive, è una leader multiculturale con ruoli dirigenziali globali. Collabora con SDA Bocconi come Senior Executive Fellow in strategia aziendale ed ESG. Scrive per «Rinnovabili.it», Fondazione Marisa Bellisario, «Il Nuovo Giornale Nazionale» e Tota Pulchra in Vaticano."}, "Francesco Sassi": {"bio": "<strong>Francesco Sassi<\/strong> è ricercatore in geopolitica dell&#x27;energia e sicurezza energetica. Dopo un dottorato di ricerca in GeopoliticaScienze politiche all’Università di Pisa, oggi è ricercatore per la società di consulenza e centro di ricerca RIE. Si occupa di analizzare le politiche e le strategie in campo di sicurezza energetica e la diplomazia energetica dei principali attori globali. Ha pubblicato ricerche e studi per diverse riviste italiane e straniere, collabora al Focus su Sicurezza Energetica dell’Osservatorio di politica internazionale del Parlamento italiano."}, "Gregory Alegi": {"bio": "<strong>Gregory Alegi<\/strong> studia difesa, strategia, politica USA e storia militare. Insegna Storia e politica degli Stati Uniti alla LUISS e Studi strategici presso l’UNINT. Nel 2024 ha curato <em>Uscire dal labirinto.  Ustica dalla A alla Z<\/em> (LoGisma, 2024) e la voce “Aeronautiche e aerospaziali, tecnologie” dell’Enciclopedia Treccani. Tra i suoi saggi più recenti, “Le ragioni della non partecipazione: la fine dei partito e l’«impasse» della politica”, (2024), “Un’Unione più completa: l’esperienza USA come modello per l’UE e il timore di un Atlantico più largo” (2023), “Il sistema politico degli Stati Uniti (1787-2021)” (2022). Scrive sul «Il Sole 24 Ore», «AirPress» e «Startmag». I Paesi più esposti al rischio di attacchi contro le centrali nucleari sono quelli che hanno più centrali. Ma perché le hanno? La diffusione delle centrali corrisponde quasi sempre a un disegno strategico, legato allo sviluppo di un deterrente atomico nazionale. Non stupisce dunque che il maggior produttore di energia nucleare siano gli USA, seguiti da Francia, Cina e Russia, così come sono produttori di energia nucleare le altre potenze atomiche riconosciute: Regno Unito, India e Pakistan. Pur non avendo centrali, si ritiene che Israele e Corea del Nord posseggano circa un centinaio di testate ciascuna. I Paesi dell’ex URSS posseggono una sessantina di centrali, delle quali 37 in Russia e 15 in Ucraina, più un’altra ventina nei Paesi dell’ex Patto di Varsavia, delle quali 11 nella sola ex Cecoslovacchia. Tale diffusione non era legata all’indipendenza energetica. Ieri come oggi, la Russia e le repubbliche (ex) sovietiche sono ricchissime di fonti fossili e dunque ma anche grandi esportatrici. Nella corsa agli armamenti, il numero di centrali delle potenze nucleari si rispecchiava in quello delle bombe. Proprio per questo, il ricorso all’energia atomica serviva per le esigenze militari: il combustibile produceva il materiale da arricchire per le bombe e testate dell’arsenale strategico sovietico. Da tale premessa si comprende perché certe soluzioni tecniche degli impianti sovietici, compresa Chernobyl (oggi in Ucraina), servissero per massimizzare la produzione di materiale fissile, anche a scapito della sicurezza. Altrettanto vale per la Francia, il cui programma nucleare civile nacque nel 1960 per alimentare la <em>force de frappe<\/em>. Oggi è il secondo produttore mondiale di energia atomica, con 56 centrali e oltre 61 MW installati."}, "Axel Berkofsky": {"bio": "<strong>Axel Berkofsky<\/strong> è professore associato presso l’Università di Pavia e Co-Direttore dell’Asia Centre presso l’ISPI. È inoltre membro del Comitato Esecutivo dell’European Japan Advanced Research Network (EJARN) con sede a Stoccolma e affiliato alla ricerca presso l’Istituto Europeo di Studi Giapponesi della Stockholm School of Economics. Ha pubblicato numerosi articoli, saggi e interventi su riviste, giornali e riviste ed ha tenuto conferenze e insegnato in numerosi think tank, istituti di ricerca e università in Europa e in Asia. I suoi interessi di ricerca includono le politiche estere e di sicurezza giapponesi e cinesi, la storia cinese, la sicurezza asiatica e le relazioni tra UE e Asia."}, "Stefano Cingolani": {"bio": "<strong>Stefano Cingolani<\/strong> è un giornalista e scrittore italiano, specializzato in politica estera ed economia. Dopo aver studiato filosofia ed economia a Roma, inizia la carriera giornalistica nella stampa comunista, contribuendo all’Unità con le prime pagine dedicate all’economia negli anni ’70. Successivamente passa al «Mondo» e al «Corriere della Sera», dove lavora per 16 anni, ricoprendo il ruolo di inviato da New York e Parigi. Collabora regolarmente con «Il Foglio»."}, "Antonio Gozzi": {"bio": "<strong>Antonio Gozzi<\/strong> è Presidente di Duferco, multinazionale attiva nei settori siderurgico, energetico, ingegneristico, logistico e dello shipping, con oltre 2.500 dipendenti in 30 Paesi. Dal 2012 al 2018 ha presieduto Federacciai, di cui è attualmente Presidente dal giugno 2022. Special Advisor di Confindustria dal 2024 per autonomia strategica europea, Piano Mattei e competitività, è anche Presidente di Interconnector Energy Italia e della Virtus Entella. Membro dell’Esecutivo dell’Aspen Institute e del Comitato Tecnico Energia di Confindustria, ha fondato Gmedia, editore del settimanale Piazza Levante."}, "Alessandro Dodaro": {"bio": "<strong>Alessandro Dodaro<\/strong>, laureato in Ingegneria Nucleare, è Direttore del Dipartimento Nucleare dell’Agenzia nazionale per le nuove tecnologie, l’energia e lo sviluppo economico sostenibile (ENEA). Il dipartimento si occupa di tutte le tecnologie in campo nucleare, spaziando dallo sviluppo della produzione di energia (sia fissione che fusione) alle radiazioni ionizzanti dalla metrologia alla gestione dei rifiuti, smantellamento e questioni di sicurezza. Ricopre il ruolo di Program Manager italiano nell’ambito del Programma Europeo per l’Energia da Fusione e coordina, lato ENEA, le attività per la realizzazione del Divertor Tokamak Test facility; inoltre, dal 2015 è operatore di due dei principali reattori di ricerca nazionali TRIGA RC1 e RSV TAPIRO."}, "Viviana Cruciani": {"bio": "<strong>Viviana Cruciani<\/strong> è laureata in Chimica Industriale, e ha ottenuto successivamente un Master di II Livello in “Tecnologie Nucleari e delle Radiazioni Nucleari”. Da vent’anni è in Sogin. La prima esperienza nel 2004 è negli impianti Ipu e Opec del centro di Casaccia come responsabile dei laboratori di chimica e radiochimica. Dal 2011 al 2019 ha fatto parte della Direzione Disattivazione Centro Sud e poi della Direzione Centrali dove si è occupata del coordinamento di tutti i progetti di decommissioning. Nel 2020 diventa Responsabile Disattivazione dell’impianto FN di Bosco Marengo. Dal 2021 è Responsabile Disattivazione della Centrale nucleare di Caorso, la più grande fra quelle in dismissione."}, "Stefano Monti": {"bio": "<strong>Stefano Monti<\/strong> è un ingegnere nucleare con oltre 40 anni di esperienza nel settore. Attualmente è Presidente dell’Associazione Italiana Nucleare (AIN) e della European Nuclear Society, la più grande associazione nucleare in Europa, che riunisce più di 12.000 professionisti del mondo accademico, dell’industria, dei centri di ricerca e delle autorità di sicurezza. Ha lavorato per oltre dieci anni presso la International Atomic Energy Agency di Vienna, ricoprendo anche il ruolo di Head of Nuclear Power Technology Development. Inoltre, è stato responsabile della Divisione Metodi per la Sicurezza dei Reattori e del Ciclo del Combustibile dell’ENEA."}, "Massimo Sideri": {"bio": "<strong>Massimo Sideri<\/strong> è inviato ed editorialista del «Corriere della Sera», testata dove lavora dal 2000 occupandosi di economia, scienza e innovazione. Ha fondato e diretto il mensile «Corriere Innovazione» dal 2017 al 2021, è direttore scientifico della RCS Academy AI &amp; Innovation ed è professore aggiunto di Storia socio-economica dell’Innovazione all&#x27;Università Luiss. Ha pubblicato numerosi saggi, fra cui <em>L’innovatore  rampante<\/em> (tradotto in inglese per McMillan), <em>Il Visconte Cibernetico<\/em> e <em>La sindrome di Eustachio<\/em> (finalista “Premio Biella Letteratura e Industria”). Laureato cum laude in Economia alla Sapienza di Roma, ha frequentato il biennio dell’Ifg Walter Tobagi. Ha ricevuto l’Assobiotec Media Award."}, "Davide Malacalza": {"bio": "<strong>Davide Malacalza<\/strong> diventa amministratore delegato di Trametal, attiva nella produzione di lamiere da treno al carbonio, dopo la Laurea in Economia e commercio. Negli anni 2000, insieme alla sua famiglia avvia, come azionista, lo sviluppo di una filiera industriale della superconduttività con l’acquisizione dell’Unità Magneti di Ansaldo, ora ASG Superconductors, di cui diventa Presidente. Oltre a confermare l’eccellenza tecnologica – sono di ASG i magneti che hanno consentito la scoperta del Bosone di Higgs al CERN – inizia lo sviluppo di nuovi materiali e sistemi che portano la superconduttività più vicina alle applicazioni industriali. Nel 2024 l’Università di Genova gli ha conferito la laurea honoris causa in Scienza dei materiali."}, "Davide Tabarelli": {"bio": "<strong>Davide Tabarelli<\/strong> è presidente e fondatore di NE Nomisma Energia dal 2006, società di ricerca su energia e ambiente. Si laurea in Economia presso l’Università di Modena nel 1985, con lode, con una tesi sui mercati del petrolio. Nel 1986 entra nella sezione Energia di Nomisma, guidando circa 90 studi. Nel corso della propria carriera collabora con il Ministero dell’Industria e il Ministero dell’Ambiente. Dal 2017 al 2020 è membro dell’Advisory Board di ENI sulla transizione energetica, e dal 2024 è Commissario di Acciaierie d&#x27;Italia. È professore a contratto ed editorialista de «Il Sole 24 Ore»."}, "Luca Romano": {"bio": "<strong>Luca Romano<\/strong> è laureato in Fisica (curriculum Astrofisica e Fisica teorica) presso l’Università di Torino e consegue successivamente un master in Giornalismo scientifico e Comunicazione della Scienza presso lo IUSS di Ferrara. Nel 2020 ha aperto la pagina Facebook L’Avvocato dell’Atomo nel tentativo di rivoluzionare l’approccio all’ambientalismo e riportare il tema del nucleare nel dibattito pubblico. Nel 2022 pubblica <em>L&#x27;avvocato  dell’atomo. In difesa dell&#x27;energia  nucleare,<\/em> Fazi Editore."}, "Mattia Ferraresi": {"bio": "<strong>Mattia Ferraresi<\/strong> è giornalista per il quotidiano “Domani”. È stato per dieci anni corrispondente per “Il Foglio” dagli Stati Uniti e, tra il 2018 e il 2019, <em>fellow<\/em> alla Nieman Foundation for Journalism di Harvard. Scrive regolarmente per alcuni giornali americani,fra cui “The New York Times” e “The Boston Globe”. Ha scritto con Martino Cervo <em>Obama. L’irresistibile  ascesa di un’illusione<\/em>, <em>Politica  americana<\/em>, <em>La febbre di Trump<\/em>, <em>Il secolo greve<\/em>, con Massimo Camisasca <em>Oltre la paura<\/em>, <em>Solitudine<\/em> e ha pubblicato quest’anno <em>I demoni  della mente<\/em>."}, "Lorenzo Castellani": {"bio": "<strong>Lorenzo Castellani<\/strong> è Ricercatore Tenure Track presso il Dipartimento di Scienze Politiche della LUISS Guido Carli di Roma, dove insegna Storia delle Istituzioni Politiche. È editorialista del quotidiano “Domani” e del “Quotidiano Nazionale”. Il suo ultimo libro è <em>Eminenze grigie. Uomini all&#x27;ombra  del potere<\/em> (LiberiLibri 2024)."}, "Massimo Bernardini": {"bio": "<strong>Massimo Bernardini<\/strong> è uno dei volti del giornalismo televisivo italiano. Inizia la carriera giornalistica negli anni Ottanta come critico musicale per importanti testate come “Radiocorriere Tv”, “Famiglia Cristiana” e “Avvenire”, di cui ha guidato per anni la redazione spettacoli. Inizia l’esperienza televisiva alla fine degli anni ’90 e dal 2005 al 2024 è stato il volto e l’autore di <em>TV Talk<\/em>, il programma di RaiTre che analizza e commenta la settimana televisiva."}, "Cecilia Sala": {"bio": "<strong>Cecilia Sala<\/strong>, 29 anni, romana, è una giornalista e inviata di guerra italiana, una delle voci emergenti più influenti nel panorama del giornalismo contemporaneo. Scrive per “Il Foglio” ed è autrice e conduttrice di podcast di successo per Chora News, tra cui <em>Stories<\/em> e <em>Polvere<\/em>."}, "Giovanni Castellaneta": {"bio": "<strong>Giovanni Castellaneta<\/strong> è un diplomatico italiano. Presidente di SACE dal 2009, ha ricoperto, tra gli altri, gli incarichi di Ambasciatore a Washington, Teheran e Canberra; e di Consigliere Diplomatico del Presidente del Consiglio dei Ministri e di suo Rappresentante Personale per i Vertici del G8. È stato Consigliere Diplomatico del Ministro del Tesoro, Portavoce del Ministero degli A&quot;ari Esteri, Vice Rappresentante Permanente d’Italia presso le Organizzazioni Internazionali a Ginevra. Ha ricoperto la carica di Vicepresidente del Gruppo Finmeccanica, Presidente del Comitato scientifico della Regione Lazio per le tecnologie innovative e la ricerca avanzata e Presidente di Milanosesto S.p.A. Attualmente è Presidente di doValue spa, consigliere di Exprivia spa e di Vantea Smart spa, e sin dalla sua fondazione, è Senior Advisor di Comin &amp; Partners.", "role": "Membro del Comitato editoriale di Comprendere."}, "Luigi Di Gregorio": {"bio": "<strong>Luigi Di Gregorio<\/strong> è docente di Comunicazione Pubblica, Politica e Sfera Digitale e di Web e Social Media per la Politica presso l’Università degli Studi della Tuscia. Insegna inoltre Campaign Management in diversi master e scuole di specializzazione. Da circa 20 anni svolge attività di consulenza politico-elettorale. Già responsabile della comunicazione istituzionale del Comune di Roma, attualmente è consulente di comunicazione strategica del Presidente della Regione Lazio. I suoi libri più recenti sono <em>Demopathy and the Democratic  Malaise. Symptoms, Diagnosis  and Therapy<\/em> (Edward Elgar, 2021) e <em>War Room. Attori, strutture e  processi della politica in campagna  permanente<\/em> (Rubbettino, 2024)."}, "Virginia Stagni": {"bio": "<strong>Virginia Stagni<\/strong> è Chief Marketing O&quot;icer di The Adecco Group. Già Head of Business Development e Talent Director al “Financial Times”, è stata la più giovane manager in oltre 130 anni di storia del quotidiano dove ha ricoperto un ruolo centrale nella definizione della strategia di crescita. Si occupa di sfide intergenerazionali in ambito aziendale e dell’arte di attrarre nuovi talenti, oltre che di innovazione nel campo dei nuovi media."}, "Gianfranco Ravasi": {"bio": "<strong>Gianfranco Ravasi<\/strong> nato nel 1942 a Merate (Lecco), esperto biblista ed ebraista, è stato docente di Esegesi biblica e Prefetto della Biblioteca-Pinacoteca Ambrosiana di Milano. Arcivescovo dal 2007, creato cardinale da Benedetto XVI nel 2010, è Presidente emerito del Pontificio Consiglio della Cultura e della Pontificia Commissione di Archeologia Sacra. È il Fondatore del <em>Cortile dei Gentili<\/em>, Fondazione che sotto la sua guida si occupa di promuovere il dialogo tra credenti e non credenti sui grandi temi e le sfide che interessano la società contemporanea. Autore di oltre 150 volumi, è apprezzato per la sua capacità divulgativa. Il suo ultimo libro è <em>Ero un blasfemo, un  persecutore e un violento. Biografia  di Paolo<\/em> (2024)."}, "Tommaso Cappelli": {"bio": "<strong>Tommaso Cappelli<\/strong> è laureato in Sociologia, Scuola di Scienze Politiche, all’Alma Mater Studiorum Università di Bologna e ha studiato Relazioni istituzionali e Public A&quot;airs. Successivamente ha conseguito un Master in Sicurezza Economica, Geopolitica e Intelligence presso la Società Italiana per l’Organizzazione Internazionale. Dal 2018 si occupa di comunicazione per istituzioni, enti locali e aziende. Ha curato diverse campagne elettorali e ricoperto incarichi di segreteria e consulenza presso l’Assemblea Legislativa della Regione EmiliaRomagna, Senato della Repubblica e Presidenza del Consiglio dei Ministri. Membro dello sta&quot; della Segreteria Generale del Sinodo, attualmente è <em>Institutional Relations specialist<\/em> per Maroni &amp; Associati e consulente per la comunicazione della Presidenza nazionale di Azione Cattolica Italiana."}, "Umberto Guidoni": {"bio": "<strong>Umberto Guidoni<\/strong> è un astronauta, astrofisico e divulgatore. Selezionato come astronauta dalla NASA, e&quot;ettua il suo primo volo in orbita nel 1996 a bordo dello Space Shuttle <em>Columbia<\/em>. Nel 2001, con la navetta <em>Endeavour<\/em>, diventa il primo europeo a salire a bordo della Stazione Spaziale Internazionale. In qualità di esperto di spazio, partecipa a trasmissioni radiofoniche e televisive, pubblica articoli per giornali e riviste ed è autore di saggi e libri per ragazzi. Nominato <em>Commendatore<\/em> dal Presidente Scalfaro e successivamente <em>Grande Ufficiale<\/em> dal Presidente Ciampi, ha ricevuto la medaglia di <em>Exceptional Service<\/em> dalla NASA per le attività svolte durante i suoi voli spaziali."}, "Davide Petrillo": {"bio": "<strong>Davide Petrillo<\/strong> è Amministratore Delegato di Voyager Space Europe. È stato Vice Presidente per l&#x27;Istruzione e lo Sviluppo della Forza Lavoro dell&#x27;International Astronautical Federation e Direttore dello Space Generation Advisory Council."}, "Virginia Di Biagio Missaglia": {"bio": "<strong>Virginia Di Biagio  Missaglia <\/strong>è laureata in Ingegneria Spaziale al Politecnico di Milano e ha vissuto a lungo all’estero, diplomandosi in Canada. Esperta di marketing e comunicazione ha una specializzazione in Copywriting presso la Scuola Holden."}, "Massimo Birattari": {"bio": "<strong>Massimo Birattari<\/strong> è laureato in storia e diplomato presso la Scuola Normale Superiore di Pisa. Ha curato <em>Io scrivo<\/em>, corso di scrittura in 24 volumi del “Corriere della Sera”, e ha scritto vari libri sull’italiano, tra cui <em>È più facile scrivere bene  che scrivere male<\/em>, <em>Grammatica per  cani e porci<\/em> e, per i ragazzi delle superiori, <em>Come si fa il tema<\/em>. Ha pubblicato una fortunata serie di <em>romanzi grammaticali<\/em> per bambini, inaugurata da Benvenuti a Grammaland. Insegna al corso di laurea triennale della Scuola Holden di Torino e ha tenuto seminari e corsi di formazione in tutta Italia. È autore, con Caterina Ragghianti, del manuale per il biennio delle superiori <em>Grammatica per pensare<\/em>."}, "Pietro Terzini": {"bio": "<strong>Pietro Terzini<\/strong> è un artista nato nel 1990 laureato in architettura. Il suo lavoro spazia dal digitale alla fine art, passando per la street art. Al centro della sua arte c’è infatti il mondo contemporaneo in cui la moda gioca un ruolo centrale insieme al capitalismo, al consumismo e all’amore nell’era dei social media. L’artista collabora con alcuni dei più importanti brand del mondo, tra cui Nike e Tod’s, e ha esposto le sue opere in Italia, Svizzera e negli Stati Uniti."}, "Ilaria Capua": {"bio": "<strong>Ilaria Capua<\/strong> è Senior Fellow of Global Health presso la Johns Hopkins University – SAIS Europe e Courtesy Professor, nonché direttore emerito del One Health Center of Excellence dell&#x27;Università della Florida. Laureata cum laude in medicina veterinaria, ha conseguito una specializzazione e un dottorato in Virologia e Sanità Pubblica. Riconosciuta per i suoi studi sulle infezioni virali animali trasmissibili all’uomo, è stata pioniera nel 2006 nell’adozione di nuove strategie per la condivisione delle informazioni genetiche sui virus zoonotici. Autrice di oltre 230 articoli scientifici e vincitrice di prestigiosi premi internazionali, ha anche ricoperto il ruolo di deputata nel Parlamento italiano."}, "Paolo Parente": {"bio": "<strong>Paolo Parente<\/strong> è Dirigente Medico presso la ASL Roma 1, docente di Sanità Pubblica presso l’Università Cattolica del Sacro Cuore e di Community Medicine presso l’Università Campus Biomedico di Roma. Dottore di Ricerca in Servizi Sanitari e Sanità Pubblica, dal gennaio 2015 technical leader per le aree di Vaccinazione, Risorse Umane, Health Services Provision per la “Global Health Security Agenda” e per le Joint External Evaluation dell&#x27;OMS. Già consulente dell’OMS per il Programma Migrazioni e Salute, è Segretario della Società Italiana per la Leadership e il Management in Medicina e Coordinatore del Gruppo di Lavoro PHC per la Società Italiana di Igiene e Medicina Preventiva."}, "Fabiana Giacomotti": {"bio": "<strong>Fabiana Giacomotti<\/strong>, storica del costume, curatrice di mostre presso i principali musei italiani, da Palazzo Mocenigo e Palazzo Morando ai Musei di san Domenico, ha diretto numerose testate periodiche e quotidiane, da &quot;Amica&quot; a &quot;MfFashion&quot;, pubblicato saggi e guide in Italia e all&#x27;estero, principalmente in Inghilterra con Cambridge Scholars, fondato un master universitario alla Sapienza, dove è stata docente per diciotto anni. Attualmente cura l&#x27;inserto di cultura e industria della moda del &quot;Foglio&quot;, &quot;Il Foglio della Moda&quot;, unica testata a diventare libro a cadenza annuale, è autrice e conduttrice di una rubrica su Rai Italia e collabora con prestigiose fondazioni."}, "Jacopo Ascari": {"bio": "<strong>Jacopo Ascari<\/strong>, architetto, nasce a Modena nel 1993. Cresciuto in un ambiente creativo e stimolante, inizia a lavorare come illustratore freelance e consolida la propria formazione nel mondo dell’Arte Contemporanea e dietro le quinte delle grandi mostre internazionali presso la Biennale di Venezia. Nel 2020 fonda Atelier Ascari, studio di consulenza d’immagine e di comunicazione; nel 2022 espone presso la Galleria Winarts di Milano, e nel 2024 la partecipa al Fuori Salone."}, "Pablo Molezún": {"bio": "<strong>Pablo Molezún <\/strong>si è laureato in Interior Design a Madrid nel 2011. Le prime esperienze professionali lo hanno portato a Londra, dove ha svolto uno stage come interior designer specializzato in ospitalità di lusso. Appassionato di arte, storia, architettura, cinema, moda e design, ha collaborato per diversi anni con Dimorestudio, uno studio internazionale d&#x27;avanguardia noto per la sua capacità di rendere labili i confini tra arte e design, moda e architettura. Oggi collabora con lo studio di design del regista Luca Guadagnino, dirige il dipartimento di styling di Matteo Thun &amp; Partners e guida la direzione creativa del suo nuovo studio."}, "Giorgio Legnani": {"bio": "<strong>Giorgio Legnani<\/strong> è medico psichiatra e psicoterapeuta. Ha lavorato in ospedale psichiatrico, quindi come primario all’Ospedale Bassini di Cinisello Balsamo e come direttore di dipartimento dell’ospedale San Gerardo di Monza."}, "Matteo Piantedosi": {"bio": "<strong>Matteo Piantedosi<\/strong> è Ministro dell’Interno. Nato a Napoli nel 1963, laureato in Giurisprudenza, è avvocato. Assegnato alla Prefettura di Bologna nel 1989, diventa Vice Prefetto nel 2007. Dal 2009 al Ministero dell’Interno, ha diretto l’Ufficio Relazioni Parlamentari e ricoperto vari incarichi di gabinetto e coordinamento. È stato Prefetto di Lodi e Bologna, e dal 2020 al 2022 Prefetto di Roma. Nel Governo Conte I, è stato Capo di Gabinetto del Ministro dell’Interno Matteo Salvini."}, "Marta Dassù": {"bio": "<strong>Marta Dassù<\/strong> dirige la rivista “Aspenia” ed è Senior Advisor European Affairs di Aspen Institute. È stata Vice-Ministro agli Affari Esteri negli anni 2011-2014. È VicePresidente del Centro Studi Americani e membro del Board dello European Council for Foreign Relations. Fa parte del Consiglio di Amministrazione di Renantis, della Fondazione Eni Enrico Mattei, dell’Advisory Board del Gruppo Marcegaglia. Fra le sue pubblicazioni recenti <em>L’età  della nostalgia. L’emozione che  divide l’Occidente<\/em> (2020, Egea). È editorialista del quotidiano “la Repubblica”. Ha ricevuto il Dottorato Honoris Causa in International Affairs dalla John Cabot University."}, "Giusella Finocchiaro": {"bio": "<strong>Giusella Finocchiaro<\/strong> è professoressa ordinaria di Diritto di internet e Diritto privato nell’Università di Bologna e socio dell’Accademia delle Scienze dell’Istituto di Bologna e Fondatrice dello Studio Legale Finocchiaro. Affianca alla carriera accademica collaborazioni di carattere scientifico, di livello nazionale e internazionale. È di recente pubblicazione il libro <em>Intelligenza Artificiale, quali regole?<\/em>. È stata presidente, dal 2014 al 2022, della Commissione UNCITRAL sul commercio elettronico, di cui oggi è membro e rappresentante per l’Italia. È membro della Commissione intelligenza artificiale per l’informazione costituita presso il Dipartimento per l’informazione e l’editoria della Presidenza del Consiglio dei Ministri. È esperto legale presso la Banca Mondiale. È esperto legale UNIDROIT nel <em>Digital Assets  and Private Law Project<\/em>."}, "Roberto Cingolani": {"bio": "<strong>Roberto Cingolani<\/strong> è Amministratore Delegato e Direttore Generale di Leonardo da maggio 2023. Laureato in Fisica all’Università di Bari, ha conseguito il Dottorato di Ricerca in Fisica presso la Scuola Normale Superiore di Pisa e insegnato Fisica e Fisica sperimentale presso l&#x27;Università del Salento. Nel 2001 ha fondato il Laboratorio Nazionale di Nanotecnologie dell’INFN (Istituto Nazionale per la Fisica della Materia) di Lecce e cinque anni dopo l’Istituto Italiano di Tecnologia (IIT) di cui è stato Direttore Scientifico e Amministratore Delegato fino alla nomina a Chief Technology &amp; Innovation Officer di Leonardo nel 2019. È stato Ministro per la Transizione Ecologica nel Governo italiano di Mario Draghi (2021), e dal 2023 è Senior Board Director del NATO Innovation Fund. Insignito dei titoli di Alfiere del Lavoro nel 1981, di Commendatore della Repubblica Italiana nel 2006 e di Grand Ufficiale al merito della Repubblica Italiana nel 2021, Cingolani è autore o co-autore di oltre 1.100 pubblicazioni e ha al suo attivo oltre 100 brevetti."}, "Gustavo Pietropolli Charmet": {"bio": "<strong>Gustavo Pietropolli Charmet<\/strong> è uno psichiatra e psicoterapeuta italiano. È stato primario in diversi ospedali psichiatrici, e docente di Psicologia Dinamica all’Università Statale di Milano e all’Università di Milano Bicocca. Nel 1985, con l’appoggio di Franco Fornari e con altri soci, ha fondato l’Istituto Minotauro di cui è stato presidente fino al 2011. È docente della Scuola di Psicoterapia dell’Adolescenza Minotauro e direttore del Consultorio gratuito della omonima cooperativa. Oltre alla sua produzione scientifica, ha scritto numerosi saggi divulgativi sull’adolescenza, tra cui <em>I nuovi  adolescenti<\/em>. <em>Padri e madri di fronte  a una sfida<\/em> (Raffaello Cortina, 2000), <em>Fragile e spavaldo. Ritratto  dell’adolescente di oggi<\/em> (Laterza, 2008) e <em>L’insostenibile bisogno di  ammirazione<\/em> (Laterza, 2018)."}, "Cathy La Torre": {"bio": "<strong>Cathy La Torre<\/strong> è avvocata, consulente e attivista. Ha fondato e dirige lo studio legale Wildside Human First Milano, Bologna e Roma e si occupa di diritti umani e civili, diritto antidiscriminatorio, di diritti digitali e delle nuove tecnologie e trattamento dei dati personali. Progetta percorsi di Diversity &amp; Inclusion per aziende, enti pubblici, no profit, ed è speaker e formatrice in materia di parità di trattamento, eguaglianza, educazione all’uso consapevole del digitale. Nel 2019 è stata insignita a Bruxelles del premio The Good Lobby come miglior avvocata probono d’Europa, nel 2020 del premio Coraggio Emanuela Loi e nel 2023 ha vinto i Factanza media awards nella sezione divulgazione sulla diversità e l’inclusione."}, "Mauro Magatti": {"bio": "<strong>Mauro Magatti<\/strong> è sociologo ed economista e si occupa del rapporto tra economia e società, studiando la trasformazione del capitalismo contemporaneo, visto come una costruzione storicosociale che combina  apparati tecno-economici, assetti politicoistituzionali e visioni culturali. Laureato in Discipline Economiche e Sociali all’Università Bocconi di Milano e con un Ph.D. in Social Sciences conseguito a Canterbury, è professore ordinario all’Università Cattolica di Milano. È editorialista di “Avvenire” e del “Corriere della Sera”, membro della Commissione Centrale di Beneficenza della Fondazione Cariplo, del Comitato per la Solidarietà e lo sviluppo di Banca Prossima e del Comitato Permanente della Fondazione Ambrosianeum. Dal 2008 è direttore del Centro ARC (Anthropology of Religion and Cultural Change)."}, "Rick Smith": {"bio": "<strong>Rick Smith<\/strong> è Fondatore e AD di Axon Enterprise, azienda fondata nel 1993 in un garage di Tucson (Arizona). È laureato in Neuroscienze presso l’Università di Harvard, e ha ottenuto un Master in Finanza Internazionale presso l’Università di Lovanio in Belgio e un MBA presso l’Università di Chicago. La missione di Axon è salvare vite umane, rendendo obsoleti i proiettili e supportando le forze dell’ordine impegnate a garantire la sicurezza delle comunità. Con Axon, Rick Smith ha introdotto i dispositivi TASER, ha innovato il settore delle body cam e ha costruito la piattaforma di gestione delle prove leader nel mondo, Evidence.com."}, "Nunzia Ciardi": {"bio": "<strong>Nunzia Ciardi<\/strong> è Vice Direttore Generale dell’Agenzia per la cybersicurezza nazionale. Per oltre quattro anni è stata a capo della Polizia Postale e delle Comunicazioni, massimo organo di Polizia nel contrasto al <em>cybercrime<\/em>. È membro del Comitato Scientifico dell’Osservatorio Permanente sulla Sicurezza e del Comitato Scientifico dell’Osservatorio Permanente sulle politiche educative dell’EURISPES. È membro componente del Consiglio del “Women4Cyber Foundation”, iniziativa avviata dall’Organizzazione Europea per la Sicurezza Cibernetica (ECSO) per implementare il coinvolgimento delle donne nel settore, nonché socio onorario del Capitolo Italiano “Women4Cyber Italia”. È stata vincitrice del premio “Inspiring Fifty 2021 Italy”, e del premio Marisa Bellisario. È autrice del libro <em>Con lo smartphone  usa la testa <\/em>(Sperling &amp; Kupfer, 2018)."}, "Matteo Flora": {"bio": "<strong>Matteo Flora<\/strong> è Professore in Sicurezza delle AI e Superintelligenze all’European School of Economics Roma, esperto in Corporate Reputation &amp; Business Storytelling, <em>CyberSecurity<\/em> e <em>Data  Driven Strategies<\/em>. Ha fondato The Fool, leader italiano in <em>Customer  Insight<\/em>, co-fondato The Magician per l’advocacy in contesti di crisi, LT42 per l&#x27;automazione legale, e <em>42 Law Firm<\/em> per la trasformazione digitale. Presiede PermessoNegato APS, supporto tecnologico alle vittime di Revenge Porn, e ha co-fondato il Centro Hermes per la Trasparenza e i Diritti Digitali. È stato Future Leader IVLP del Dipartimento di Stato USA, editorialista, keynote panelist, podcaster per Forbes e conduce <em>Ciao Internet!<\/em>, una video-rubrica che parla di algoritmi e regole che governano macchine e umani."}, "Giuseppe Di Franco": {"bio": "<strong>Giuseppe Di Franco<\/strong> è CEO del Gruppo Lutech, azienda leader del Digitale e dell’Intelligenza Artificiale. Nella sua carriera, ha ricoperto ruoli apicali in Siemens, come Global Head of Energy, e in Atos, come Global Head of Resources &amp; Services, gestendo oltre 71 Paesi, e CEO di Atos Italia. Nel 2023, Di Franco ha guidato l’acquisizione trasformativa di Atos Italia da parte dei fondi Lutech/ Apax, creando così il nuovo Gruppo Lutech. Laureato in Ingegneria Gestionale al Politecnico di Milano e Alumnus, Di Franco è Professore Aggiunto della Graduate School of Management del Politecnico di Milano, nonché membro di diverse associazioni italiane e internazionali."}, "Angelo Panebianco": {"bio": "<strong>Angelo Panebianco<\/strong> è politologo, professore emerito presso l’Università degli Studi di Bologna, editorialista del “Corriere della Sera”. Studioso dell’organizzazione dei partiti politici e del sistema politico italiano, nonché di politica internazionale, ha pubblicato, tra gli altri: <em>Modelli di partito<\/em> (1982); <em>L&#x27;Italia che non c’è<\/em> (1995); <em>Guerrieri  democratici. Le democrazie e la  politica di potenza<\/em> (1997);<em> Il potere,  lo stato, la libertà. La gracile  costituzione della società libera<\/em> (2004); <em>L’automa e lo spirito<\/em> (2009); <em>Persone e mondi. Azioni individuali  e ordine internazionale<\/em> (2018); <em>La  parabola della Repubblica<\/em> (con M. Teodori, 2022). Ha inoltre curato il volume <em>L’analisi della politica<\/em> (1989) e <em>Democrazia e sicurezza<\/em> (2021) ."}, "Gino Lanzara": {"bio": "<strong>Gino Lanzara<\/strong> è Ufficiale superiore del Corpo del Commissariato Militare Marittimo specializzato in selezione psicoattitudinale. Ha frequentato il Corso DIU presso il Centro CRI di Jesolo, e quello di Diritto Internazionale Bellico presso SMD - ISSMI. In possesso di abilitazione BCRN dopo corso presso la Scuola di Guerra BCRN di Rieti. In qualità di analista geopolitico, specializzato nell’area MENA, collabora con diverse testate, tra cui Difesaonline, Geopolitica.info, La Voce di Ginevra, Dissipatio, Geopolitica, Mediterranean Insecurity. Ha pubblicato il saggio <em>Guerra economica. Quando l’economia  diventa un’arma<\/em>. È ricercatore presso il centro studi Geopolitica. info dell’Università La Sapienza e, in precedenza, presso la Webster University di Ginevra."}, "Mara Morini": {"bio": "<strong>Mara Morini<\/strong> è professoressa associata di Scienza politica all’Università degli Studi di Genova dove insegna <em>Politics of Eastern  Europe<\/em>, Politica comparata, partiti, lobbies e gruppi di pressione. Editorialista del quotidiano “Domani”, è autrice del libro <em>La Russia di Putin<\/em> (Il Mulino, 2020) e con G. Natalizia della curatela <em>La svolta della Russia<\/em> (Carocci, 2023). È stata osservatrice elettorale OSCE-ODIHR in Russia, Moldova, Uzbekistan e Nord Macedonia, project manager di alcuni progetti Tempus-Tacis nell’Est Europa e Visiting Professor alla High School of Economics di Mosca nel 2020. È anche analista politica per diverse trasmissioni radiofoniche e televisive."}, "Piero Martin": {"bio": "<strong>Piero Martin<\/strong> è professore di Fisica sperimentale all’Università di Padova, attualmente distaccato presso il Centro Interdisciplinare B. Segre dell’Accademia Nazionale dei Lincei. Studia la fusione quale sorgente di energia. Fellow dell’American Physical Society, è stato responsabile scientifico di grandi progetti internazionali e oggi coordina le attività di fisica di DTT, il nuovo grande esperimento di fusione italiano. Scrive per “La Stampa” e “lavoce.info” e ha vinto il Premio Fiuggi Scienza. Ha pubblicato <em>L’era  dell’atomo<\/em> (Il Mulino, 2014), <em>Zerologia<\/em> (Il Mulino, 2016); <em>Trash. Tutto quello  che dovreste sapere sui rifiuti<\/em> (Codice edizioni, 2018, finalista al Premio Galileo 2018 e vincitore del Premio nazionale di divulgazione scientifica, sezione Scienze) e <em>Le 7 misure del  mondo<\/em> (Laterza, 2021)."}, "Marco Casini": {"bio": "<strong>Marco Casini<\/strong> è ingegnere ambientale e Dottore di ricerca in ingegneria ambientale. È professore associato presso la Sapienza Università di Roma e Segretario Generale dell’Autorità di Bacino Distrettuale dell’Appennino Centrale dal 2022. Componente del Comitato Tecnico Scientifico sulla Sostenibilità della Sapienza Università di Roma, è Docente della Scuola Nazionale dell’Amministrazione (SNA) - Presidenza del Consiglio dei Ministri. Responsabile scientifico di progetti di rilevanza nazionale e internazionale in materia di <em>green building<\/em> e <em>smart  city<\/em> e membro del comitato editoriale di riviste scientifiche. È autore di oltre 80 pubblicazioni scientifiche, di cui 10 monografie."}, "Lucia Scaffardi": {"bio": "<strong>Lucia Scaffardi<\/strong> è Coordinatore Scientifico Food4Future e Professore ordinario di Diritto pubblico comparato presso l’Università degli Studi di Parma, dove insegna Diritto pubblico comparato e Diritto costituzionale italiano e comparato nei corsi di laurea in Giurisprudenza e in Scienze Politiche e delle Relazioni Internazionali. Fra i temi di ricerca maggiormente sviluppati si richiamano la libertà di manifestazione del pensiero e l’Hate speech, la giustizia genetica e l’impiego di banche dati genetiche e biometrici per fini giudiziari, i Novel Foods e la sostenibilità alimentare, il legal network tra Paesi BRICS, tema sviluppato anche grazie alla creazione e al coordinamento del BRICS Parma Research Group. È membro di numerose associazioni e del comitato scientifico di svariate riviste e ha diretto in qualità di responsabile diversi progetti di rilevanza regionale e nazionale."}, "Giordano Stefano Cavini Casalini": {"bio": "<strong>Giordano Stefano Cavini  Casalini<\/strong>, 33 anni, operatore socio sanitario, ha scelto di unirsi alla disobbedienza civile non violenta di Ultima Generazione per professionalità e mantenere fede alla promessa di fare tutto il possibile per aiutare le persone che ha incontrato nei 10 anni di lavoro nella sanità pubblica."}, "Carlotta Muston": {"bio": "<strong>Carlotta Muston<\/strong>, 34 anni, laureata in sociologia, libera professionista ed esperta di processi partecipativi. Si è unita alla campagna di Ultima Generazione perché crede nell’impegno civico e nel dovere dei cittadini di tenere viva la democrazia, oltre l’esercizio di voto."}, "Roberto Prioreschi": {"bio": "<strong>Roberto Prioreschi<\/strong> guida la nuova area SEMEA di Bain &amp; Company. Nel ruolo di Regional Managing Partner SEMEA, coordina i 10 uffici in Italia, Spagna, Portogallo, Grecia, Polonia, Turchia e Medio Oriente che occupano oltre 1.900 persone. In Bain dal 1995, si è occupato prevalentemente di Energy &amp; Utilities e Advanced Manufacturing &amp; Services. Prima di entrare in Bain, è stato analista finanziario e profit forecaster in Procter &amp; Gamble e Group Controller in Enel."}, "Chiara Giaccardi": {"bio": "<strong>Chiara Giaccardi<\/strong> è professoressa ordinaria di Sociologia dei processi culturali e comunicativi presso l’Università Cattolica del Sacro Cuore, dove insegna Sociologia e Antropologia dei media e dirige la rivista “Comunicazioni Sociali”. Collabora con il quotidiano “Avvenire”. Si occupa di trasformazioni culturali legati ai processi di globalizzazione e alla rete ed è membro della Pontificia Accademia per la Vita ed è presidente di Eskenosen, associazione di famiglie che opera dal 2006 per l’accoglienza e l’accompagnamento di famiglie di migranti e rifugiati."}, "Enea Dallaglio": {"bio": "<strong>Enea Dallaglio<\/strong> è senior advisor di MBS Consulting, società di consulenza del Gruppo Cerved. È stato amministratore delegato di IAMA Consulting e direttore generale dell’IRSA, istituto di ricerca e studi del settore assicurativo. Più recentemente ha fondato la società di ricerca Innovation Team, in partnership con MBS Consulting. La sua stella polare è il cambiamento sociale come guida per le strategie aziendali. Dirige il progetto di ricerca Welfare Index PMI, promosso da Generali Italia, che dal 2016 monitora l’evoluzione del welfare aziendale in Italia."}, "Stefano Nazzi": {"bio": "<strong>Stefano Nazzi <\/strong>è giornalista de “Il Post”, ha lavorato per importanti testate nazionali. Si è occupato di cronaca, seguendo i casi più conosciuti e di maggiore risonanza, ma anche vicende meno note. È ideatore e autore di <em>Indagini<\/em>, ai primi posti delle classifiche dei podcast, e di <em>Altre indagini<\/em>, realizzato sempre per “Il Post”. È autore de <em>Il volto del male<\/em> (2023) e <em>Kronaka<\/em>. <em>Viaggio nel cuore oscuro del nord<\/em> (2023)."}, "Luigi Sbarra": {"bio": "<strong>Luigi Sbarra <\/strong>è Segretario Generale della CISL. Ha iniziato la propria esperienza sindacale a Locri, come operatore territoriale Fisba Cisl, la Federazione dei braccianti agricoli. Nel 1984 perfeziona la propria formazione partecipando al corso per dirigenti del Centro Studi Cisl di Taranto. Nel 1985 viene eletto Segretario Generale della Fisba di Locri, e dal 1988 al 1993 guida la Cisl del Comprensorio Locrideo per poi diventare Segretario Generale della Provincia di Reggio Calabria, dove rimane fino al 2000. In quell’anno arriva al vertice della Cisl Calabria, ruolo che ricopre fino al dicembre 2009, quando è chiamato a Roma per far parte della Segreteria Confederale Nazionale. Nell’aprile 2016 è eletto Segretario Generale della Fai Cisl Nazionale. Il 28 marzo 2018 è eletto dal Consiglio Generale Segretario Generale Aggiunto della Cisl Nazionale. Il 3 Marzo 2021 è eletto Segretario Generale e il 28 Maggio 2022, al termine del XIX Congresso Confederale, è riconfermato all’unanimità in tale ruolo."}, "Emilio Isgrò": {"bio": "<strong>Emilio Isgrò<\/strong> Artista concettuale – ma anche poeta, scrittore, drammaturgo e regista – Emilio Isgrò vive e lavora a Milano, dove espone fin dai primi anni ’60. La cancellazione è il suo segno distintivo che diventa gesto artistico di affermazione di nuovi significati: allo stesso modo la sua pratica rimane in bilico tra l’arte della poesia visiva e quella concettuale, confermando la sua produzione artistica come un unicum nel panorama creativo italiano e internazionale. Tutto il suo lavoro è sperimentazione giocata su vari piani: il significato della parola, i suoni dei sintagmi, la collocazione della parola all’interno della frase e l’effetto visivo della distribuzione della scrittura nello spazio sono i caratteri distintivi della poetica dell’opera di Emilio Isgrò fino ad oggi."}, "Giulia Paganelli": {"bio": "<strong>Giulia Paganelli<\/strong> è un’antropologa e scrittrice che parla di corpi non conformi ai diktat della società moderna attraverso la pagina Instagram @Evastaizitta."}, "Maurizio Carvelli": {"bio": "<strong>Maurizio Carvelli<\/strong> è Founder &amp; Ceo Camplus e della Fondazione CEUR, ed è Presidente dell’Associazione REUNI, l’associazione che riunisce i tre principali player del settore <em>student housing<\/em> italiano."}, "Raoul Chiesa": {"bio": "<strong>Raoul “Nobody” Chiesa<\/strong>, classe 1973, è stato uno dei primi hacker italiani tra gli anni ’80 e ’90, e, attualmente è uno dei principali esperti al mondo in <em>Ethical Hacking<\/em> e <em>Cyber Security<\/em>. Fondatore e Presidente di <em>The Security Brokers<\/em>, Raoul opera come consulente, advisor e formatore, aiutando numerose agenzie internazionali, tra cui UN, NATO, INTERPOL, UNICRI, così come imprese e compagnie multinazionali, a migliorare la loro <em>security posture<\/em> e a ridurre il loro livello di rischio <em>cyber<\/em>. È autore di svariate pubblicazioni e <em>key-note speaker<\/em> a conferenze sui temi <em>cyber<\/em> nazionali e internazionali."}, "Alessandra Dal Verme": {"bio": "<strong>Alessandra dal Verme<\/strong> è una manager pubblica, esperta di amministrazione, finanza ed economia, specializzata nella definizione e realizzazione di politiche pubbliche in materia di investimenti. Da maggio 2021 è Direttore dell’Agenzia del Demanio, dove ha portato una visione innovativa della gestione e valorizzazione del patrimonio immobiliare dello Stato che vede nella centralità dell’utenza, nella sostenibilità e nella digitalizzazione i tre criteri portanti. Ha ricoperto incarichi pubblici prestigiosi presso il Ministero dell’Economia e delle Finanze, ha fatto parte dello Steering Committee del PNRR, è stata membro del Nucleo di consulenza per l’attuazione delle linee guida per la regolazione dei servizi di pubblica utilità, rappresentante del Governo nel CdA per il Progetto Expo di Milano, ha rappresentato il MEF presso ECMWF, è stata Presidente del Collegio Sindacale di vari enti e società, tra cui Ferrovie dello Stato, Società Aeroporti di Roma; Consip; Anas, CDP."}, "Carlo Ambrogio Favero": {"bio": "<strong>Carlo Favero<\/strong> D.Phil. a Oxford, è professore di Econometria alla Bocconi. Ha pubblicato su riviste accademiche nei campi dell’econometria applicata, della politica monetaria e fiscale, e dei mercati finanziari. È research fellow del CEPR e dell’Istituto Gasparini e dell’Istituto per le Politiche Europee della Bocconi. Consulente del Ministero del Tesoro italiano, è membro del Monetary Policy Expert Panel del Parlamento Europeo. Ha collaborato con BCE, Commissione Europea e Banca Mondiale. È coautore, con Alesina e Giavazzi, di <em>Austerity. When it Works and  When it Doesn’t<\/em> (Princeton, 2019), premiato con l’’Hayek Book Prize nel 2020."}, "Gigi De Palo": {"bio": "<strong>Gianluigi (Gigi) De Palo<\/strong> è presidente della Fondazione per la Natalità e ideatore degli Stati Generali della Natalità e del progetto “Immischiati” sulla cittadinanza attiva. È stato presidente nazionale del Forum delle Famiglie, in rappresentanza di oltre 5 milioni di famiglie. Attualmente è membro dell’Osservatorio nazionale per l&#x27;infanzia e l’adolescenza presso la Presidenza del Consiglio. Già presidente delle Acli di Roma e assessore alla Scuola, Famiglia e Giovani del Comune di Roma, è giornalista, scrittore e formatore sui temi dell&#x27;educazione. Dal 2024 è direttore generale della Fondazione Oltre (Angelini). Sposato, è padre di cinque figli."}, "Massimiliano Fuksas": {"bio": "<strong>Massimiliano e Doriana Fuksas<\/strong> sono una coppia di architetti italiani di fama internazionale, noti per il loro approccio innovativo e visionario all’architettura contemporanea. Massimiliano Fuksas, nato a Roma nel 1944, ha fondato lo studio Fuksas negli anni ‘80, e Doriana, laureata in architettura e in storia dell’arte, si è unita a lui nel 1985. Lo studio è conosciuto per progetti iconici come il nuovo centro congressi La Nuvola a Roma e il Terminal 3 dell’aeroporto di Shenzhen. Il loro lavoro combina estetica, sostenibilità e tecnologie avanzate, con un focus su grandi spazi pubblici, trasparenza e materiali innovativi."}, "Doriana Fuksas": {"bio": "<strong>Massimiliano e Doriana Fuksas<\/strong> sono una coppia di architetti italiani di fama internazionale, noti per il loro approccio innovativo e visionario all’architettura contemporanea. Massimiliano Fuksas, nato a Roma nel 1944, ha fondato lo studio Fuksas negli anni ‘80, e Doriana, laureata in architettura e in storia dell’arte, si è unita a lui nel 1985. Lo studio è conosciuto per progetti iconici come il nuovo centro congressi La Nuvola a Roma e il Terminal 3 dell’aeroporto di Shenzhen. Il loro lavoro combina estetica, sostenibilità e tecnologie avanzate, con un focus su grandi spazi pubblici, trasparenza e materiali innovativi."}, "Giulio Sapelli": {"role": "Coordinatore scientifico di Comprendere e membro del Comitato editoriale. Firma l’editoriale di apertura di ogni numero."}, "Gianluca Comin": {"role": "Direttore editoriale di Comprendere e membro del Comitato editoriale.", "social": [["X", "https://x.com/gcomin", "@gcomin"], ["LinkedIn", "https://www.linkedin.com/pub/gianluca-comin/0/2aa/a79", "Gianluca Comin"], ["Facebook", "https://www.facebook.com/gianluca.comin.9", "gianluca.comin.9"]]}, "Lelio Alfonso": {"role": "Direttore responsabile di Comprendere e membro del Comitato editoriale."}, "Beatrice Pecchiari": {"role": "Redazione di Comprendere dal numero 4. Coordinatrice di redazione dal numero 9."}, "Elisa Russo": {"role": "Redazione di Comprendere. Art director e coordinatrice di redazione dal numero 4 al numero 8."}, "Andrea Vallone": {"role": "Redazione di Comprendere."}, "Gaetano Febbraio": {"role": "Redazione di Comprendere dal numero 6."}, "Matilde Flati": {"role": "Redazione di Comprendere (numero 8)."}, "Elena Di Giovanni": {"role": "Membro del Comitato editoriale di Comprendere."}, "Gianluca Giansante": {"role": "Membro del Comitato editoriale di Comprendere."}, "Federico Fabretti": {"role": "Membro del Comitato editoriale di Comprendere."}}, "redazione": ["Beatrice Pecchiari", "Elisa Russo", "Andrea Vallone", "Gaetano Febbraio", "Matilde Flati", "Alessandro Antonelli", "Ludovica Medici", "Francesca Martella"], "themes": [{"id": "energia", "name": "Energia, clima e ambiente", "intro": "Dal nucleare alla transizione, dall’acqua al cibo: come la rivista ha seguito la questione energetica e climatica da un numero all’altro, tra sicurezza degli approvvigionamenti, costi e accettazione sociale."}, {"id": "democrazia", "name": "Democrazia e istituzioni", "intro": "Sfiducia, populismo, istituzioni sotto pressione e nuovi poteri: le analisi sullo stato di salute delle democrazie e sul rapporto tra cittadini e Stato."}, {"id": "tecnologia", "name": "Scienza, tecnologia e IA", "intro": "Intelligenza artificiale, sicurezza informatica, spazio, fisica e dati: le trasformazioni scientifiche e tecnologiche lette per le loro conseguenze economiche e politiche."}, {"id": "demografia", "name": "Demografia e generazioni", "intro": "Natalità, invecchiamento, migrazioni e rapporto tra generazioni: il cambiamento demografico e il patto sociale che ne dipende."}, {"id": "geopolitica", "name": "Geopolitica e ordine mondiale", "intro": "Potenze, conflitti, alleanze e diplomazia: il mondo multipolare visto dall’Europa, dalla Russia all’Asia, dal Golfo agli Stati Uniti."}, {"id": "economia", "name": "Economia, finanza e lavoro", "intro": "Mercati, debito, banche centrali, imprese e lavoro: la finanza come leva di potere e l’economia reale che ne subisce le scelte."}, {"id": "informazione", "name": "Informazione, media e linguaggi", "intro": "Giornalismo, podcast, social e nuovi linguaggi: come cambiano il modo di raccontare il mondo e il mestiere di chi comunica."}, {"id": "societa", "name": "Società, corpo e salute", "intro": "Paure, corpi, sport, cura e benessere: la società osservata dal punto di vista delle persone, delle fragilità e delle comunità."}], "quotes": {"n9-sapelli": {"q": "Nessuna civiltà ha mai affrontato un simile svuotamento demografico in condizioni di pace e di relativo benessere, il che rende ancor più paradossale e drammatico il fenomeno.", "by": null}, "n9-comin": {"q": "È la metafora più precisa del nostro presente: un’intera area del mondo che ha saputo allungare la vita senza ancora aver imparato a generarla, e che rischia di diventare la grande età di Titone, ricca di anni e povera di inizi.", "by": null}, "n9-a1": {"q": "Solo riconoscendo la validità e la dignità delle istanze di ciascuno, vecchi e giovani, sarà possibile trasformare l’inverno demografico in una nuova primavera sociale.", "by": null}, "n9-a2": {"q": "In una società longeva e a bassa fecondità, la decisione di avere un figlio diventa così un indicatore chiave della qualità complessiva del sistema sociale.", "by": null}, "n9-a3": {"q": "Per fare figli occorre avere fiducia negli altri, perché solo attraverso azioni collettive, azioni da intraprendere nel presente, è possibile migliorare il futuro.", "by": null}, "n8-sapelli": {"q": "Lo sport rappresenta un microcosmo sociale in cui emergono implicazioni etiche e valoriali che devono essere indagate con sguardo critico.", "by": null}, "n8-alfonso": {"q": "Ancora una volta siamo di fronte alla metafora della vita, dove cadere e rialzarsi conta più del podio.", "by": null}, "n8-a1": {"q": "Lo sport è vita, è una difesa immunitaria sociale e comunitaria, da difendere, promuovere e rafforzare.", "by": null}, "n8-a3": {"q": "Se c’è una lezione che lo sport mi ha dato, è questa: l’inclusione non è un tema da trattare, è un modo di stare al mondo.", "by": null}, "n7-sapelli": {"q": "In Karl Polanyi, infatti, la finanza è vista come parte integrante della dinamica della società e del mercato, e non come sfera separata e autonoma.", "by": null}, "n7-comin": {"q": "È questa la sfida di oggi: riportare il mercato alla sua dimensione autenticamente umana, fatta di limiti e possibilità, di regole e trasgressioni, di solidarietà e conflitti.", "by": null}, "n7-a2": {"q": "Così torna particolarmente attuale la lezione di Karl Polanyi sul radicamento delle élites finanziarie nelle società in cui operano.", "by": null}, "n6-sapelli": {"q": "Così continuiamo a placare i nostri terrori di un conflitto nucleare combattendo guerre convenzionali.", "by": null}, "n6-alfonso": {"q": "Sappiamo bene come l’opinione pubblica “respiri” e formi la sua “coscienza” indistinta attraverso gli eventi più recenti e le prese di posizione maggiormente amplificate, per toni e gesti.", "by": null}, "n6-a1": {"q": "Sono convinto che a partire dai primi anni ’30 il nucleare sarà una realtà operativa anche in Italia.", "by": null}, "n6-a2": {"q": "In questa materia nessun pasto è gratis e ogni soluzione ha i suoi rischi e i suoi costi, non solo economici.", "by": null}, "n6-a3": {"q": "L’immaginario collettivo sull’energia nucleare si è nutrito tra seconda metà del Novecento ed inizio del nuovo millennio di un flusso ormai canonizzato di immagini-simbolo, su tutte il fungo atomico.", "by": null}, "n6-comin": {"q": "L’eccessiva dipendenza da una risorsa e da un Paese – il gas russo – ha dimostrato la fragilità del nostro sistema.", "by": null}, "n5-sapelli": {"q": "Per questo il filo della comprensione e della relazione sociale non si deve spezzare, anche se pare che, invece, possa accadere ogni momento.", "by": null}, "n5-comin": {"q": "La sfida è stata dare vita a una comunità viva, fatta di persone, soprattutto giovani, con cui abbiamo esplorato nuovi orizzonti, mescolando competenze, intuizioni e, soprattutto, energia.", "by": null}, "n5-a3": {"q": "La generazione dei millennial che si è affacciata sul mercato del lavoro in quegli anni di sofferenza è cresciuta alla scuola della frustrazione e ha interiorizzato il senso di una promessa tradita.", "by": null}, "n4-sapelli": {"q": "Ma esiste una storicità dell’insicurezza e ogni epoca storica ha elaborato delle rappresentazioni della medesima che sono nel contempo tentativi di spiegazione e di cura.", "by": null}, "n4-alfonso": {"q": "Conoscere il Male, il proprio corpo, le pieghe dell’anima, le paure generazionali, le contese territoriali non è esercizio semplice, ma assolutamente necessario.", "by": null}, "n4-a2": {"q": "Se la sicurezza è presupposto delle libertà, è attorno a un progetto comune e condiviso di sicurezza che possono essere esercitati diritti e libertà fuori da ogni sentimento di incertezza, di precarietà, di frammentazione sociale.", "by": null}, "n4-a3": {"q": "L’Unione europea, a valle di una successione di crisi, deve insomma cambiare in modo sostanziale per invertire la sua parabola negativa.", "by": null}, "n5-a1": {"q": "Anche dopo decenni di esperienza, il nostro percorso continua perché solo chi non smette di cercare sa trovare nuove strade.", "by": "Gianluca Comin"}, "n5-a2": {"q": "In passato, il percorso di individuazione della Persona avveniva attraverso la relazione, mentre oggi è sempre più definita dalla performance.", "by": "Giulio Sapelli"}, "n4-a1": {"q": "La vergogna, invece, è qualcosa che si trova dentro di sé, e che non si sa dove mettere, perché non c’è un oggetto su cui proiettare la vergogna, se non dentro di sé.", "by": "Giorgio Legnani"}, "n7-a1": {"q": "La moneta delle nazioni è il debito delle banche, è la loro promessa di pagare chi la riceve", "by": "Paolo Zannoni"}, "n7-a3": {"q": "Ormai la finanza sta sopra, sotto c’è l’economia e sotto ancora tutti quanti noi", "by": "Roberto Sommella"}, "n8-a2": {"q": "Per costruire una legacy duratura, rispettare i budget e generare un impatto economico e sociale concreto serve una parola semplice, spesso dimenticata in Italia: programmazione", "by": "Michele Uva"}}, "quadro": {"n9": {"issue": "n9", "title": "Natalità e famiglie", "dek": "Le misure in vigore nel 2026 per chi ha figli o li aspetta: sostegni economici, congedi, lavoro.", "updated": "2026-10-14", "brief": ["Nel 2026 il sostegno pubblico alle famiglie con figli poggia su quattro strumenti principali: l’assegno unico, il bonus di 1.000 euro per i nuovi nati, il bonus per le madri lavoratrici e i congedi.", "La legge di bilancio 2026 (legge 199/2025) ha portato il bonus mamme da 40 a 60 euro al mese, ha esteso il congedo parentale fino ai 14 anni del figlio, ha raddoppiato i giorni di congedo per la malattia dei figli e ha introdotto un ISEE più favorevole alle famiglie per le prestazioni familiari.", "Il governo sta preparando la legge di bilancio per il 2027: tra le misure allo studio ci sono interventi sulla natalità, ancora senza un testo ufficiale."], "measures": [{"id": "auu", "area": "Sostegno economico", "title": "Assegno unico e universale", "brief": "Un contributo mensile per ogni figlio a carico, dal settimo mese di gravidanza fino ai 21 anni (senza limite di età per i figli con disabilità). L’importo dipende dall’ISEE.", "figures": [["da 58,30 a 203,80 €", "al mese per ogni figlio minorenne nel 2026"], ["+1,4%", "rivalutazione degli importi rispetto al 2025"]], "rows": [["Importo pieno", "Con ISEE fino a 17.468,51 euro. Con ISEE da 46.582,71 euro in su, o senza ISEE, spetta l’importo minimo."], ["Maggiorazioni", "+50% per i figli sotto un anno. +50% per i figli tra uno e tre anni nei nuclei con almeno tre figli e ISEE entro 46.582,71 euro. 150 euro al mese in più per i nuclei con almeno quattro figli."], ["Come", "Chi lo riceve già non deve ripresentare la domanda. Serve un ISEE aggiornato: senza, dal mese di marzo spetta l’importo minimo."]], "src": ["s3", "s4"]}, {"id": "nuovinati", "area": "Sostegno economico", "title": "Bonus nuovi nati", "brief": "Un contributo una tantum per ogni figlio nato, adottato o in affidamento preadottivo nel corso del 2026.", "figures": [["1.000 €", "una tantum per ogni figlio"], ["120 giorni", "dalla nascita o dall’ingresso in famiglia per fare domanda"]], "rows": [["Requisiti", "ISEE per le prestazioni familiari non superiore a 40.000 euro, calcolato senza contare l’assegno unico. Residenza in Italia e requisiti di cittadinanza o di soggiorno."], ["Come", "Domanda all’INPS di uno dei genitori, online, tramite app, contact center o patronato. Per i figli nati o adottati prima dell’apertura del servizio il termine era il 12 agosto 2026."], ["Da sapere", "Le risorse sono di 360 milioni di euro l’anno: le domande accolte sono pagate in ordine cronologico fino a esaurimento. Il bonus non è tassato."]], "src": ["s7", "s8"]}, {"id": "mamme", "area": "Lavoro", "title": "Bonus mamme", "brief": "Un’integrazione al reddito per le madri lavoratrici con almeno due figli, pagata in un’unica soluzione a fine anno.", "figures": [["60 €", "per ogni mese di lavoro nel 2026 (erano 40)"], ["720 €", "al massimo in un anno"]], "rows": [["Chi", "Lavoratrici dipendenti, escluso il lavoro domestico, e autonome iscritte a una gestione previdenziale obbligatoria, con reddito da lavoro non superiore a 40.000 euro l’anno."], ["Fino a quando", "Con due figli, fino al mese in cui il più piccolo compie 10 anni. Con tre o più figli, fino ai 18 anni del più piccolo, ma non nei mesi con un contratto a tempo indeterminato, coperti da un esonero contributivo diverso."], ["Come", "Serve una domanda all’INPS. Il bonus non è tassato e non conta ai fini ISEE."]], "src": ["s1", "s9", "s10"]}, {"id": "congedo", "area": "Congedi", "title": "Congedo parentale", "brief": "Il periodo di astensione facoltativa dal lavoro per i genitori dipendenti ora si può usare fino ai 14 anni del figlio. Prima il limite era 12 anni.", "figures": [["14 anni", "età del figlio entro cui usare il congedo (era 12)"], ["3 mesi", "pagati all’80% della retribuzione entro i 6 anni del figlio"]], "rows": [["Chi", "Genitori lavoratori dipendenti. Per gli iscritti alla gestione separata e per gli autonomi i limiti restano quelli precedenti."], ["Indennità", "Fino a tre mesi all’80% entro i sei anni del figlio, per i nati dal 2025, divisibili tra i genitori. Gli altri mesi indennizzati sono pagati al 30%. I limiti complessivi di durata non cambiano."], ["Adozione e affidamento", "Il limite vale entro 14 anni dall’ingresso del minore in famiglia, e comunque non oltre la maggiore età."]], "src": ["s1", "s5", "s6"]}, {"id": "malattia", "area": "Congedi", "title": "Congedo per la malattia del figlio", "brief": "I giorni di assenza dal lavoro per la malattia dei figli tra i 3 e i 14 anni passano da 5 a 10 l’anno. Prima la fascia si fermava agli 8 anni.", "figures": [["10 giorni", "lavorativi l’anno per ogni figlio tra i 3 e i 14 anni (erano 5)"], ["Senza limite", "per i figli fino a 3 anni, per tutta la durata della malattia"]], "rows": [["Come", "Ciascun genitore, in alternativa all’altro, con il certificato del medico. I giorni contano per l’anzianità di servizio."], ["Da sapere", "Salvo condizioni migliori previste dai contratti collettivi, questi giorni non sono retribuiti."]], "src": ["s1", "s2"]}, {"id": "isee", "area": "ISEE", "title": "ISEE per le prestazioni familiari", "brief": "Un ISEE dedicato, più favorevole alle famiglie con figli, usato per assegno unico, bonus nuovi nati, bonus asilo nido, assegno di inclusione e supporto per la formazione e il lavoro.", "figures": [["91.500 €", "valore della casa di abitazione escluso dal calcolo"], ["+2.500 €", "di franchigia per ogni figlio convivente dopo il primo"]], "rows": [["Nelle grandi città", "Nei comuni capoluogo delle città metropolitane la franchigia sulla casa sale a 120.000 euro."], ["Famiglie numerose", "Le maggiorazioni della scala di equivalenza crescono con il numero dei figli."], ["Come", "L’INPS calcola il nuovo indicatore dalle DSU presentate dal 1° gennaio 2026, senza adempimenti aggiuntivi per i cittadini."]], "src": ["s1", "s4"]}, {"id": "imprese", "area": "Lavoro", "title": "Per le imprese: assunzione di madri con tre figli", "brief": "Esonero totale dei contributi a carico del datore di lavoro privato che assume, dal 1° gennaio 2026, una madre di almeno tre figli minorenni senza un impiego regolarmente retribuito da almeno sei mesi.", "figures": [["24 mesi", "di esonero per un contratto a tempo indeterminato"], ["12 mesi", "per un contratto a
