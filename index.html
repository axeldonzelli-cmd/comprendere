."}, {"t": "p", "h": "La più grande migrazione della storia umana è avvenuta nell’ultimo secolo e continua ancora oggi: si tratta di persone che si spostano dalla campagna alla città. Nel 1960, un terzo dell’umanità viveva in una città, oggi è quasi il 60%. Spostarsi dalla campagna alla città significa adattarsi a un nuovo stile di vita, in cui il prezzo da pagare, per le famiglie numerose, è ancor più elevato. In città gli spazi sono ridotti, i costi degli affitti proibitivi, i ritmi di lavoro incompatibili con la cura di più figli piccoli, e la rete di supporto informale dei parenti – che in campagna ammortizzava i costi della genitorialità – tende a dissolversi nella frammentazione anonima della vita metropolitana."}, {"t": "p", "h": "Un ulteriore aspetto è dato dall’emancipazione femminile. Trasferirsi in città muta la vita delle donne, esponendole a una versione diversa della vita rispetto a quella che le loro madri e nonne vivevano in campagna. Le donne urbane hanno ora molte più probabilità di aver accesso a un’istruzione, di fare carriera e di essere informate su prevenzione e metodi contraccettivi. Il risultato, inevitabile, è un tasso di natalità più basso e questo rappresenta il motivo per cui si hanno meno figli, l’età media delle donne che diventano madri si è alzata e le gravidanze adolescenziali sono diminuite drasticamente."}, {"t": "p", "h": "Nella maggior parte dei Paesi sviluppati oggi il tasso di natalità delle donne oltre i 40 anni ha superato quello delle donne di 20 anni e più giovani. Affinché l’umanità si mantenga semplicemente stabile, c’è bisogno di un tasso di natalità di 2,1. Questo è chiamato il tasso di sostituzione naturale della popolazione ed è lo scenario in cui ci sono abbastanza nascite per sostituire le morti che si hanno ogni anno. Dal 1960, il tasso di natalità nei dieci Paesi più popolosi è diminuito di oltre la metà e in 8 di questi 10 Paesi è già al tasso di sostituzione naturale o al di sotto."}, {"t": "p", "h": "La crescita della popolazione mondiale attuale non sta avvenendo in relazione al numero di nascite, ma all’allungamento della vita: si vive di più, ma allo stesso tempo il mondo invecchia. È una transizione silenziosa ma inesorabile, che trasforma la struttura per età delle società con una velocità mai vista prima: popolazioni che un tempo erano giovani e dinamiche si trovano a gestire piramidi demografiche rovesciate, in cui i pensionati superano i lavoratori attivi e i bambini diventano una presenza sempre più rara nel paesaggio urbano e rurale.Con tutte le conseguenze economiche del caso. Sistemi pensionistici progettati per popolazioni giovani si trovano a fare fronte a un numero crescente di anziani con un numero decrescente di contribuenti; i servizi sanitari vengono travolti da una domanda strutturale di assistenza a lungo termine che nessun modello di welfare tradizionale era stato concepito per sostenere; e le politiche del lavoro devono essere ripensate in contesti in cui la scarsità di manifattura giovane coesiste con una disoccupazione giovanile endemica, frutto di sistemi formativi incapaci di rispondere alla velocità dei cambiamenti produttivi. Ma su questo moltissimo si discute e noi possiamo, invece, fermarci qui."}], "bio": "", "notes": [{"n": "1", "h": "Caldwell, J. C., &amp; Schindlmayr, T.,<em> Explanations  of the fertility crisis in modern societies: a search  for commodities<\/em>, in «Populations Studies», vol. 57, 2003, p. 257."}]}, "n9-comin": {"paras": [{"t": "p", "h": "C’è un mito greco che oggi parla di noi più di mille statistiche. Titone, amato dall’Aurora, ottenne dagli dèi il dono dell’immortalità, ma non quello dell’eterna giovinezza: e così invecchiò senza fine, fino a diventare voce senza corpo, prigioniero di un tempo che non sapeva più finire. È la metafora più precisa del nostro presente: un’intera area del mondo che ha saputo allungare la vita senza ancora aver imparato a generarla, e che rischia di diventare la grande età di Titone, ricca di anni e povera di inizi. Una resa incondizionata – la nostra – al declino demografico come destino ineluttabile? Nelle pagine che seguono i lettori si renderanno conto che non è così. Ci siamo metaforicamente messi in ascolto di voci, dati e sguardi che si intrecciano, così da entrare nel tema con la consapevolezza che, ancora una volta, “comprendere non è conoscere”. Perché, nonostante il prevalere di letture parziali e allarmistiche, è ancora possibile individuare il vero senso di ciò che stiamo vivendo: una grande, silenziosa trasformazione del rapporto tra la vita, il tempo e le generazioni."}, {"t": "p", "h": "Questa trasformazione conserva un potere unico: quello di interrogare ciò che diamo per scontato, dal welfare al lavoro, dalla famiglia al senso stesso del futuro. Per la prima volta nella storia, in gran parte del pianeta convivono quattro o cinque generazioni contemporaneamente, mentre le coorti più giovani diventano via via meno numerose. È una rivoluzione antropologica prima ancora che statistica, che modifica il modo in cui si lavora, si abita, si invecchia, si trasmette il sapere. Le società che hanno fondato il proprio modello sull’idea di una piramide demografica regolare si scoprono oggi a guardare clessidre rovesciate, in cui la base si assottiglia mentre la sommità si dilata. Qui si gioca una partita che è insieme economica, culturale e morale. Non tutto, però, è promessa. Come ogni “laboratorio sociale” anche questo è competizione, mercato, talvolta cinismo. Gli aneddoti e i protagonisti che disegnano questo tracciato di ambiguità sono molti, ma il caso che travalica in modo siderale il senso del prendersi cura è quello dell’industria globale dell’anti-aging che promette di sconfiggere il tempo, o delle derive di una procreazione assistita ridotta a catalogo internazionale di scelte. Siamo di fronte a quella che potremmo definire una “guerra senza spari” contro il limite umano, una spirale di onnipotenza tecnologica che è la negazione stessa del senso della finitezza. Desiderare la vita è bellissimo, pretendere di possederla è la peggiore delle sconfitte, quella dell’uomo. Eppure è proprio in questa zona di confine – tra ciò che la scienza può fare e ciò che la coscienza deve interrogare – che si misura la maturità di una civiltà."}, {"t": "p", "h": "Al di là degli eccessi, questa stagione ci consegna lezioni profonde. Oggi, tra silver economy emergente, nuove forme di genitorialità, biotecnologie e politiche per la famiglia, siamo di fronte a un’evoluzione che va stimolata da un lato e governata dall’altro. In base a una stima delle Nazioni Unite, nel 2050 il numero di ultrasessantacinquenni a livello mondiale sarà doppio rispetto a quello dei bambini sotto i cinque anni. Mentre l’Europa e l’Asia orientale invecchiano rapidamente, e potenze come la Cina e il Giappone affrontano un inverno demografico senza precedenti, l’Africa sub-sahariana resta il grande continente dei giovani, e nuove geografie umane ridisegnano gli equilibri del pianeta. In questo scenario, l’anello mancante è nelle mani di donne e uomini che non pensano a quanti anni guadagnare o a quante nascite contabilizzare, ma a come tenere insieme durata e fecondità, esperienza e novità. Perché se la longevità è dono dello sforzo collettivo, conquista della medicina, frutto del benessere, e se la natalità è scelta, desiderio, atto di fiducia nel domani, l’una e l’altra insieme sono molto di più: sono il modo in cui una civiltà decide se credere ancora nel proprio futuro."}, {"t": "p", "h": "Le proiezioni delle Nazioni Unite raccontano un mondo a due velocità: paesi in cui la popolazione si dimezzerà entro fine secolo e paesi in cui raddoppierà, con conseguenze profonde su migrazioni, lavoro, geopolitica. È in questa asimmetria che si annida la grande questione del nostro tempo: come costruire un nuovo patto generazionale, fatto di scelte concrete – lavoro, casa, servizi, educazione, fiducia – senza cedere né alla nostalgia del passato né alla paura del futuro. La demografia, la più antica delle scienze sociali, torna così a essere uno specchio implacabile: misura il numero delle persone, ma racconta soprattutto la qualità dei legami che le tengono insieme. Ancora una volta siamo di fronte alla metafora della vita, dove generare e custodire conta più di durare. Riscoprirlo è il primo passo per immaginare un mondo più giusto, equo e solidale."}], "bio": "", "notes": []}, "n9-a1": {"paras": [{"t": "p", "h": "L’Italia sta attraversando una delle trasformazioni più dirompenti della sua storia recente: il cambiamento demografico. Con un tasso di natalità ai minimi storici e un’aspettativa di vita tra le più alte al mondo (siamo al secondo posto, preceduti dal Giappone), il Paese si trova a essere un laboratorio dove diverse generazioni si confrontano, a volte si scontrano e, inevitabilmente, cercano un modo per convivere. Le aspettative, le paure e i desideri degli italiani mutano profondamente a seconda dell’età."}, {"t": "p", "h": "Da un lato ci sono i cosiddetti “Baby Boomer” e le generazioni della Terza Età. Le persone di oltre 65 anni oggi superano i 14,3 milioni e rappresentano circa un quarto della popolazione. Per loro, l’Italia di oggi è un Paese profondamente diverso da quello in cui sono cresciuti, un’epoca caratterizzata dal boom economico, da una forte mobilità sociale e da certezze lavorative e previdenziali che oggi sembrano miraggi. La loro aspettativa principale è quella di poter vivere una vecchiaia dignitosa, supportata da un sistema sanitario nazionale efficiente e da una rete di assistenza solida. Tuttavia, la paura più grande che serpeggia tra gli over 65 è quella della solitudine, dell’isolamento e della perdita di autosufficienza. Con famiglie sempre più ristrette e figli spesso costretti a trasferirsi lontano per lavoro, il timore di non avere nessuno su cui contare nel momento del bisogno è palpabile. Il loro desiderio più profondo, spesso inespresso, è quello di non essere considerati un peso per la società, ma di poter ancora contribuire. La preoccupazione più diffusa, soprattutto tra i 65 e i 75 anni, è la mancanza di un ruolo sociale."}, {"t": "p", "h": "Nel mezzo si trovano la Generazione X e i Millennial che spesso si trovano schiacciati tra due forze opposte e ugualmente esigenti: da una parte la cura dei genitori che invecchiano, dall’altra la crescita dei figli (per chi ha scelto o ha avuto la possibilità economica di averne). Le loro aspettative sono state profondamente ridimensionate rispetto a quelle dei loro genitori. Cresciuti con la promessa che lo studio e il duro lavoro avrebbero garantito il successo e l’ascensore sociale, si sono scontrati con crisi economiche ricorrenti, precariato cronico e un mercato del lavoro asfittico. La loro paura più grande è l’instabilità presente e futura (sono convinti che a tempo debito non percepiranno una pensione). Il desiderio di queste generazioni di mezzo è la stabilità, non intesa necessariamente come il “posto fisso” di un tempo, ma come la possibilità di pianificare il futuro, di accendere un mutuo senza l’ansia del domani, di poter conciliare i tempi di vita e di lavoro in un Paese che spesso richiede sacrifici enormi per mantenere un equilibrio familiare. Infine, ci sono i giovanissimi: la Generazione Z e i nativi digitali (Generazione Alpha). Per loro, il cambiamento demografico si intreccia inesorabilmente con altre crisi globali, prima fra tutte quella ambientale. Le loro aspettative verso il mondo del lavoro e la società sono radicalmente diverse da chi li ha preceduti. Non cercano più l’impiego a vita a ogni costo, ma un lavoro che abbia un senso, che rispetti i loro valori etici e che garantisca un reale benessere psicologico e un buon bilanciamento tra vita privata e professione. La loro paura più grande è quella di rimanere intrappolati in un Paese “per vecchi”, dove le decisioni politiche ed economiche sono prese da e per le generazioni più anziane, ignorando le istanze dei giovani. Questo timore si traduce spesso in una scelta dolorosa: la fuga all’estero. Il desiderio dei giovani italiani è quello di vivere in una società più inclusiva, meritocratica e dinamica, dove il talento venga riconosciuto, dove i diritti civili siano garantiti e dove non sia necessario fare le valigie per vedere realizzate le proprie ambizioni."}, {"t": "p", "h": "Questo serrato confronto generazionale porta inevitabilmente a delle frizioni. Il dibattito pubblico italiano è spesso attraversato da una narrazione che contrappone i giovani agli anziani: la spesa per le pensioni contro gli investimenti per l’istruzione, i costi della sanità contro le politiche per il lavoro, ecc. È una sorta di guerra tra poveri in cui le risorse, sempre più scarse, sembrano dover essere sottratte a una generazione per essere date all’altra. Tuttavia, la vera sfida che l’Italia ha davanti non è quella di far vincere una generazione sull’altra, ma di stipulare un nuovo e coraggioso patto intergenerazionale. I desideri di giovani, adulti e anziani, se guardati da vicino, convergono tutti verso un unico punto focale: la ricerca di una qualità della vita migliore, di una comunità coesa che non lasci indietro nessuno e di un Paese che sappia ancora immaginare il proprio domani."}, {"t": "p", "h": "Per realizzare questo nuovo patto, è necessario che politica, imprese, corpi intermedi e istituzioni smettano di ragionare per compartimenti stagni e, nel caso della politica, per cicli elettorali brevi. Affrontare il calo delle nascite non significa solo erogare bonus una tantum, ma costruire un’infrastruttura sociale solida, fatta di asili nido accessibili a tutti, congedi parentali paritari che non penalizzino le donne sul lavoro, politiche retributive (interventi sul salario di ingresso) e politiche abitative che permettano ai giovani di uscire di casa prima dei trent’anni (secondo ISTAT il 68% dei giovani di età compresa tra 18 e 34 anni vive ancora nella famiglia di origine, siamo al penultimo posto tra i Paesi UE). Allo stesso tempo, gestire l’invecchiamento della popolazione richiede un ripensamento della medicina territoriale, lo sviluppo della telemedicina, la creazione di soluzioni abitative condivise (come il <em>co-housing<\/em> intergenerazionale) e la promozione di un invecchiamento attivo, dove l’anziano non è visto come un paziente da curare, ma come una risorsa da valorizzare."}, {"t": "p", "h": "Solo riconoscendo la validità e la dignità delle istanze di ciascuno, vecchi e giovani, sarà possibile trasformare l’inverno demografico in una nuova primavera sociale. Il dialogo e la solidarietà tra le generazioni non sono un’opzione romantica, ma l’unica via di salvezza pragmatica per un Paese che vuole continuare a scrivere, insieme, la propria storia."}], "bio": "<strong>Nando Pagnoncelli<\/strong>, da 41 anni ricercatore sociale e di mercato, è presidente di Ipsos, società leader in Italia nel settore delle ricerche demoscopiche. È Consigliere di Amministrazione dell’Università Cattolica, dove insegna <em>“Analisi  della pubblica opinione”<\/em>, e della Fondation Robert Schumann di Parigi. È Presidente della School of Government della LUISS e membro del Consiglio Generale di ISPI, del Comitato Scientifico della Fondazione Symbola, nonché del Consiglio Direttivo del Touring Club Italiano. Collabora con Giovanni Floris al programma <em>Di Martedì<\/em> e cura la rubrica settimanale <em>Scenari<\/em> del «Corriere della Sera». È autore di saggi su argomenti di attualità sociale.", "notes": []}, "n9-a2": {"paras": [{"t": "p", "h": "Su scala globale, il numero medio di figli per donna (o coppia) è sceso da cinque a metà del Novecento a circa 2,3 oggi, con prospettive di continua riduzione nel resto del secolo. I paesi con tasso di fecondità sopra il livello di sostituzione (attorno a due) sono sempre meno e concentrati in specifiche aree, in particolare nell’Africa subsahariana. Al contrario, oltre la metà dei paesi del mondo si colloca ormai stabilmente sotto tale soglia, inclusi tutti quelli economicamente avanzati."}, {"t": "p", "h": "Si tratta di uno scenario inedito. Per la prima volta nella storia dell’umanità, la capacità di una popolazione di assicurare la propria continuità nel tempo non è messa in crisi prevalentemente da fattori esogeni – guerre, carestie, epidemie – ma da fattori endogeni, legati alle scelte individuali e alle condizioni offerte dal contesto sociale ed economico."}, {"t": "p", "h": "Nelle società moderne avanzate avere un figlio non è più un passaggio implicito della vita adulta. È diventato una decisione deliberata, sempre più consapevole e, proprio per questo, meno scontata. Detto in altri termini, se in passato la genitorialità era tradizionalmente incorporata in norme sociali e aspettative implicite, oggi è sempre più interpretata come una scelta del tutto libera: non un obbligo, ma un progetto intenzionale; non un sacrificio, ma in coerenza con possibilità di realizzazione personale e di benessere relazionale. Le indagini continuano a mostrare che il numero di figli desiderato resta vicino a due, mentre cresce la distanza tra intenzioni e realizzazioni. Il nodo non è quindi il desiderio in sé, ma il processo debole che porta a tradurlo in progetto concreto. Non si tratta di convincere ad avere figli o di esercitare pressioni normative, ma di rendere effettivamente praticabile una scelta che la maggioranza delle persone continua a considerare significativa."}, {"t": "p", "h": "Questo cambiamento si inserisce anche in una trasformazione culturale profonda. È considerato superato il modello tradizionale in cui il ruolo femminile era centrato sulla maternità. Oggi la quota di persone che ritiene possibile realizzarsi pienamente anche senza figli è diventata maggioritaria. Allo stesso tempo, però, la maggioranza continua a esprimere il desiderio di averne."}, {"t": "p", "h": "La libertà da garantire è duplice: quella di non avere figli e quella di poterli avere se desiderati. Le due dimensioni non sono in contrapposizione. Anzi, una società che consente a chi lo desidera di avere figli è anche una società più sostenibile e inclusiva per chi sceglie di non averne."}, {"t": "p", "h": "In questo contesto si colloca anche la maggiore visibilità del fenomeno <em>childfree<\/em>. Ma la sua crescita non va interpretata come il fattore principale della bassa fecondità: il punto cruciale resta piuttosto la crescente difficoltà di realizzare progetti di genitorialità per chi ha un orientamento positivo."}, {"t": "p", "h": "Il contesto in cui queste decisioni maturano è, infatti, caratterizzato da elevata incertezza. Le nuove generazioni si confrontano con mercati del lavoro instabili, difficoltà di accesso all’autonomia abitativa, rapide trasformazioni tecnologiche e rischi globali – dalle crisi sanitarie ai cambiamenti climatici, all’instabilità geopolitica – che rendono più complesso immaginare il futuro. Le differenze tra paesi mostrano chiaramente che non si tratta di una dinamica inevitabile. Nei contesti in cui esistono politiche solide e continuative – servizi per l’infanzia, sostegno al reddito, strumenti efficaci di conciliazione tra lavoro e famiglia – la fecondità si mantiene su livelli meno distanti dalla soglia di equilibrio. Dove tali condizioni risultano deboli, come in parte rilevante dell’Europa meridionale, si osservano livelli molto bassi e squilibri crescenti nella struttura per età."}, {"t": "p", "h": "Il caso italiano è emblematico. A una delle più basse fecondità si associa una limitata partecipazione femminile al mercato del lavoro e una persistente carenza di politiche di conciliazione. Ne deriva una situazione in cui la scelta tra lavoro e figli è ancora troppo spesso percepita come alternativa, soprattutto per le donne. Questo non solo riduce le nascite, ma indebolisce anche il potenziale di sviluppo economico e sociale."}, {"t": "p", "h": "Va inoltre considerato che bassi livelli di natalità tendono ad autoalimentarsi: la riduzione delle nascite nel passato comporta oggi un minor numero di potenziali genitori, amplificando il calo futuro. È il meccanismo della cosiddetta “trappola demografica”, che rende sempre più difficile invertire la tendenza (per approfondimenti rimando al mio libro <em>La scomparsa dei giovani.  Le 10 mappe che spiegano il declino demografico dell’Italia<\/em>, Chiarelettere, 2025). In questo quadro, la questione centrale non è incentivare in modo generico le nascite, ma comprendere come sta cambiando il senso della genitorialità e quali condizioni ne favoriscono la realizzazione. Le nuove generazioni non vogliono avere figli per pressione o obbligo esterno, ma come risposta al desiderio di condividere con essi il piacere di vederli crescere in un condizioni di sicurezza, con adeguate opportunità e benessere. La considerano una possibilità da integrare in un progetto di vita più ampio, che comprende lavoro, autonomia, relazioni e realizzazione personale."}, {"t": "p", "h": "Le implicazioni per le politiche pubbliche sono rilevanti. Occorre ridurre il divario tra figli desiderati e figli realizzati, creando un contesto che renda effettivamente praticabile questa scelta. Ciò significa investire nella qualità del lavoro, nei servizi, nelle opportunità per i giovani e nella parità di genere. Ma significa anche rafforzare il riconoscimento culturale della genitorialità come valore collettivo, non solo come costo individuale."}, {"t": "p", "h": "In una società longeva e a bassa fecondità, la decisione di avere un figlio diventa così un indicatore chiave della qualità complessiva del sistema sociale. Dove esistono fiducia, opportunità e supporto, può esprimersi come scelta piena e generativa. Dove tali condizioni sono deboli, tende invece a restare sospesa, a essere rinviata fino a trasformarsi in rinuncia. Comprendere e accompagnare questo cambiamento è una delle sfide decisive per il futuro delle società contemporanee."}], "bio": "<strong>Alessandro Rosina<\/strong> è Professore ordinario di Demografia e Statistica sociale dell’Università Cattolica di Milano, dove dirige il Center for Applied Statistics in Business and Economics. È Consigliere esperto del CNEL su nomina del Presidente della Repubblica; coordinatore scientifico del “Rapporto giovani” dell’Istituto Toniolo; esperto della Commissione parlamentare di inchiesta sugli effetti economici e sociali della transizione demografica; parte del Team di Thematic Experts della European Commission. È autore di diverse pubblicazioni, fra cui <em>La  scomparsa dei giovani. Le 10 mappe  che spiegano il declino demografico  dell’Italia<\/em> (Chiarelettere) ed editorialista per «Il Sole 24 Ore».", "notes": []}, "n9-a3": {"paras": [{"t": "p", "h": "Non voglio appesantire questo breve scritto con dati che tutti conoscono. Certo sì è che ci troviamo davanti ad una correlazione inversa, che dobbiamo capire: via via che, grazie alle tecnologie, sono venute aumentando le modalità procreative, è venuto invece scendendo il tasso di natalità. I figli li si fa in più modi, ma se ne fanno di meno."}, {"t": "p", "h": "Indubbiamente la fecondazione medicalmente assistita è anche servita, e serve, a porre rimedio ai fenomeni di sterilità o infertilità che riducono la fecondazione naturale. La legge italiana, la n. 40 del 2004, fu scritta proprio con questa specifica finalità. Ma serve anche per consentire a chi vuole figli e non è nelle condizioni della famiglia tradizionale – si tratti di single o di coppie dello stesso sesso – di vivere la genitorialità anche in queste diverse condizioni. Ciò pone rilevanti problemi che non ci sono nell’altro caso – la riconoscibilità dei figli da parte di genitori intenzionali ma non biologici, la presenza nella vicenda di un terzo, il donatore di seme (a volte la donatrice dell’ovulo), che dà un connotato nuovo al futuro essere umano, alla sua stessa identità, con conseguenze di cui non sempre si è consapevoli."}, {"t": "p", "h": "C’è un documento del Cortile dei Gentili che se ne occupa, <em>Padri, madri e  figli<\/em>. Ma il tema che qui vogliamo trattare è un altro, è perché la vita appaia sempre meno compatibile con la natalità, col risultato che molti giovani sono indotti a pensarla senza figli, che vedono come un ostacolo. Sotto questo profilo, la fecondazione assistita può servire in quanto – e non è comunque poco – consente a molte coppie di spostare la nascita dei figli più avanti negli anni, quando le loro vite si sono assestate su binari sicuri e loro se la sentono di assumere la nuova responsabilità."}, {"t": "p", "h": "Domandatevi quante cose sono cambiate da quando ciascuna coppia di figli ne faceva tanti, non solo perché le malattie potevano portarne via una buona metà, ma anche e soprattutto perché qualcuno doveva rimanere per provvedere alla vecchiaia dei genitori. Senza figli, e senza previdenza, come vivevano i vecchi? I cambiamenti intervenuti da quando era così, così positivi a garanzia del benessere individuale e collettivo e dei diritti sociali dei più deboli, hanno spostato su altri terreni la decisione di avere dei figli, con la valutazione dei relativi pro e contro. E al nostro tempo la valutazione è evidentemente giunta a vederne più i contro che i pro, con l’effetto o di escludere del tutto la prospettiva dei figli, o di ridurne drasticamente il numero o, nel migliore dei casi, di ritardarne la nascita, se verrà."}, {"t": "p", "h": "Non mettiamo perciò sotto processo la fecondazione assistita. Salvo la maternità surrogata, che, a parte i rari casi di solidarietà familiare, affitta per la gravidanza il corpo di donne spesso bisognose, offendendo la loro dignità (per non parlare del bambino, che passa dalla madre nel cui ventre si è formato a un’altra madre), tutto il resto, nonostante i problemi che a volte crea, può essere salutato con favore; ci aiuta ad avere bambini di cui abbiamo un gran bisogno e che altrimenti non avremmo. Sotto processo, se così si può dire, dovremmo mettere le vite che poco alla volta abbiamo preparato per i nostri giovani, rendendo la genitorialità una variabile troppo spesso indesiderata, incompatibile con le loro possibilità e con le loro aspettative. Perché è così ed è così – si badi – non soltanto da noi, ma anche in paesi che continuano ad avere tassi di natalità più alti del nostro? Per anni abbiamo pensato che il problema fosse nostro, italiano, e che lo fosse perché noi non avevamo stabili politiche a favore della famiglia, dai congedi parentali agli asili nido, ai robusti assegni familiari, al regime fiscale. Per anni, su questo terreno, ci ha umiliato il confronto con la Francia. Ma è accaduto che la Francia ha mantenuto le sue politiche, ma il tasso di natalità ha preso a scendere anche da loro. Intendiamoci. Non è che, in ragione di ciò, si debba ritenere irrilevante ciò che si fa o non si fa per favorire la famiglia. Quelle politiche contano, è bene averle, è bene perfezionarle se sono imperfette come da noi. Ma quanto è venuto accadendo non solo da noi dimostra che c’è qualcosa di più, che va al di là dello specifico terreno della famiglia ed investe evidentemente l’organizzazione sociale complessiva, l’organizzazione della vita lavorativa, gli effetti che ne escono sulla cultura individuale e collettiva. Sembra un insieme, questo, talmente vasto da rendere prometeico il tentativo di influenzarlo e di cambiarlo. Eppure è da lì che sono venuti gli impulsi ai quali i nostri giovani hanno sempre più reagito allontanando da sé le responsabilità della famiglia e nella migliore delle ipotesi riducendole. Diciamolo nel modo più semplice: per fare dei figli all’età giusta occorre che la precarietà del lavoro e la gavetta professionale non accompagnino gli esseri umani sino a quarant’anni. E meno male, lo dicevamo, che ora la fecondazione assistita aiuta a farli anche a quell’età. Per fare dei figli a qualunque età occorre avere fiducia nel futuro. Oggi, davanti al cambiamento climatico che galoppa verso guasti sempre più estesi e sempre più intensi, c’è chi ritiene una scelta di responsabilità quella di non fare figli, che si troverebbero altrimenti in un mondo invivibile. Per fare figli occorre avere fiducia negli altri, perché solo attraverso azioni collettive, azioni da intraprendere nel presente, è possibile migliorare il futuro."}, {"t": "p", "h": "Nessuno può assumere questo come proprio programma di vita, perché nessuno, da solo, potrebbe mai realizzarlo. Ma una società nel suo insieme lo può assumere, con una politica che abbia il coraggio di proporlo, di farlo condividere, di dargli corso nelle sue diverse parti con appropriate responsabilità. È così che si cambia e che cambiano anche le aspettative e le culture. E i figli possono tornare ad essere ciò che la parola procreazione ha sempre portato in sé: il segno migliore che la nostra creatività può lasciare su un futuro nel quale abbiamo fiducia."}], "bio": "<strong>Giuliano Amato<\/strong> è Presidente della consulta scientifica della Fondazione Cortile dei Gentili. È stato due volte Presidente del Consiglio (1992-1993 e 2000-2001) e Ministro dell’Interno nel governo Prodi (2006-2008). Ha ricoperto inoltre gli incarichi di Ministro del Tesoro, Ministro delle Riforme Istituzionali e Presidente dell’Autorità Antitrust (1994-1997). È stato Vice Presidente della Convenzione sul Futuro dell’Europa, che ha redatto la nuova Costituzione Europea. Laureato in Giurisprudenza a Pisa e con un Master alla Columbia University, è stato docente di Diritto Costituzionale Comparato e Italiano alla Sapienza di Roma.", "notes": []}, "n9-ep89": {"epigraph": "Niente è mai veramente perduto, o può venir perduto,\nNon nascita, identità, forma – oggetto veruno del mondo.\nNon vita, non forza, né cosa alcuna visibile;\nLe apparenze non debbono ingannare, sfera mutata non deve confonderti il cervello.\nVasti sono il Tempo e lo Spazio – vasti i campi della Natura.\nIl corpo torpido, vecchio, freddo – ceneri che sono rimaste dai fuochi d’un tempo,\nLa luce offuscata degli occhi tornerà a risplendere;\nIl sole ora basso a occidente rinnova perenne i mattini, i meriggi;\nAlla zolla gelata ritorna perenne, invisibile, la legge della primavera,\nCon erba, con fiori, con frutti estivi e con grano."}, "n9-ep121": {"epigraph": "«Sì,» proseguì, «per te valgo meno del tuo Hermes d’avorio o del tuo fauno d’argento. Quelli ti piaceranno sempre, ma per quanto ti piacerò io? Fino al giorno in cui mi\napparirà la prima ruga, immagino. Adesso so che quando si perde la bellezza, qualunque essa sia, si perde tutto. Me lo ha insegnato il tuo quadro. Lord Henry Wotton\nha perfettamente ragione. La giovinezza è l’unica cosa che vale la pena di possedere.\nQuando mi accorgerò di invecchiare mi ucciderò.»"}, "n8-sapelli": {"paras": [{"t": "p", "h": "Il significato polisemico, multiforme, dello sport nelle comunità umane di oggi, in ogni parte del mondo in cui e verso cui volgiamo il nostro sguardo indagatore – quello di colui che vuole COMPRENDERE – emerge dalla riflessione di due grandi maestri dell’analisi sociale, sempiterne guide nel nostro cammino conoscitivo: Claude Lévi-Strauss e Marcel Mauss."}, {"t": "p", "h": "Per il primo lo sport può essere studiato e…vissuto come mito."}, {"t": "p", "h": "Per il secondo lo sport era ed è un fatto sociale totale."}, {"t": "p", "h": "Nella teoria di Lévi-Strauss, il mitema è l&#x27;unità elementare di un mito che evolve nella storia attraverso nuclei narrativi che si possono evidenziare all’interno della narrazione mitica, cosicché la struttura del mito risulta dalla combinazione di più mitemi, a loro volta permutabili per dar luogo a nuove o diverse versioni. Il che spiega perché lo sport assume dimensioni sociali diversissime (ecco i mitemi): dall’agonismo intrapersonale a quello interstatuale, dall’insieme di relazioni interstatuali diversissime e cangianti a seconda delle culture territoriali e specialistiche in cui si sviluppa e alle relazioni comunitarie ch’esso genera, con la sua struttura di relazioni personali e con le discipline attraverso cui assume le sue forme agonistiche."}, {"t": "p", "h": "Un fatto sociale totale – nella definizione del grande antropologo Marcel Mauss – è qualcosa in grado di influenzare e determinare un insieme di fenomeni coinvolgendo la gran parte dei meccanismi relazionali e di funzionamento della comunità di riferimento. Per Mauss il fatto sociale totale per antonomasia era il dono, in quanto capace di unire le pratiche e le cornici di senso riferibili ad aspetti mitopoietici, economici, politici, espressivi e religiosi. Il fatto sociale totale permetterebbe così di interpretare pezzi apparentemente lontani e diversi della stessa società."}, {"t": "p", "h": "È quello che fa lo sport: oggi lo sport, in tutto il mondo, sembra aver conquistato definitivamente il ruolo di fatto sociale totale, e proprio per il suo configurarsi nelle diversissime attività di relazione e di comunicazione della vita umana associata. Dall’agonismo regolato da sistemi giuridici di fatto molto complessi e articolati, sino alle sue scuole agonistiche formative che durano tutta una vita e creano e ricreano legami generazionali e intragenerazionali dotati sia di una vita propria sia di una vita strettamente interconnessa."}, {"t": "p", "h": "Questi legami sono costituiti dalle storie disciplinari di gruppo e dalle storie agonistiche personali dei grandi attori sportivi, che sono gli eroi del nostro tempo, come gli attori cinematografici e le figure che influenzano attraverso i nodi social dei mass media, il <em>landscape<\/em> formativo di larghissime masse umane associate dal lavoro, dal consumo, dalla foresta di narrazioni che oggi ci sovrasta sempre di più."}, {"t": "p", "h": "Questo insieme di mito e realtà è una piattaforma e insieme un palcoscenico privilegiato per leggere le dinamiche culturali e storico-concrete più generali in tutto il mondo e di tutto il mondo. Lo sport come attività umana, oggi strutturata economicamente e culturalmente in organizzazioni e in narrazioni molto complesse (che vanno ancora studiate in tutte le loro forme), ha scontato almeno due pregiudizi: quello di essere legata al tempo libero e quindi di essere percepito come attività ludica e poco seria rispetto ad altre che riguardano la struttura familiare, economica, politica o religiosa di una società; e quella di essere considerata troppo legata al corpo e in qualche modo alla natura. Come se il corpo non fosse esso stesso connesso a dinamiche e logiche culturali."}, {"t": "p", "h": "Per falsificare una simile opinione basterà pensare al fatto, per esempio, che sport e filosofia sono due attività umane sin dall’inizio della civilizzazione intimamente connesse."}, {"t": "p", "h": "Nella Grecia dei nostri studi classici, la vigorosità del corpo e quella della mente erano considerate collegate e complementari al fine di riuscire a perfezionare se stessi. Platone fu anche il lottatore che nel Timeo scrisse: «chi si dedica alla ricerca scientifica o qualche altra intensa attività intellettuale bisogna che anche al corpo dia il suo movimento». Platone, infatti, concepisce la filosofia come «dialogo vivo, corpo a corpo, lotta ed insegna ai suoi allievi assetati di conoscenza la <em>epimeleia heautou<\/em>, ossia la cura di sé come allenamento e combattimento permanente, perché nella vita ci si trova nella posizione di un lottatore che dev’essere in grado di fronteggiare, con coraggio, gli eventi». Lo sport rappresenta un microcosmo sociale in cui emergono implicazioni etiche e valoriali che devono essere indagate con sguardo critico. L’attività sportiva, infatti, è a priori una pratica umana in grado di generare valori."}, {"t": "p", "h": "Se la filosofia, infatti, è l’inesauribile amore per la sapienza e la conoscenza, lo sport è l’inesausta ricerca del miglioramento, della perfezione del gesto tecnico, della volontà di resistere e mantenere concentrazione e performatività fino all’ultimo secondo della partita. Ed è impossibile non fare un riferimento artistico al Discobolo, scultura realizzata da Mirone nel 455 a.C., statua raffigurante l’atleta nell’atto di lanciare il disco durante una competizione sportiva. Uno dei punti di forza di tale scultura è l’armonia della composizione, che richiama la consonanza armonica tra filosofia e sport, tema che abbraccia l’umanità in tutta la sua storia."}, {"t": "p", "h": "Lo sport è inoltre diventato uno strumento sempre più utilizzato nelle relazioni internazionali: i Paesi ne hanno fatto, nell’ultimo secolo, diversi usi: il boicottaggio olimpico, lo sport come strumento di propaganda e infine la creazione di organizzazioni ed eventi sportivi che hanno promosso il dialogo tra le nazioni."}, {"t": "p", "h": "Non sempre le relazioni internazionali sono state rese più fluide e amicali dallo sport e questo è mai stato così vero come in questi tempi di <em>terza guerra mondiale<\/em>. Si pensi, per esempio, all’età dei boicottaggi, ovvero al periodo che va dall’edizione dei Giochi olimpici del 1976 di Montréal a quella di Los Angeles del 1984, passando per quella di Mosca del 1980. E che dire degli eventi sportivi organizzati ai fini propagandistici? Gli esempi delle Olimpiadi di Berlino del 1936 e della Coppa del Mondo di calcio in Argentina nel 1978 sono esemplari in questo riguardo."}, {"t": "p", "h": "D’altro canto, la nascita e i primi sviluppi della UEFA e delle competizioni calcistiche da essa organizzate, ebbero un impatto positivo nel processo di integrazione europea e nel mantenere vivi i rapporti tra le nazioni divise dalla cortina di ferro. L’antica antitesi, propria della cultura greca, ci guida da sempre nell’analisi: la cosiddetta <em>tregua olimpica<\/em> è ormai un topos del nostro tempo, quale valore di riferimento disegnato nello spazio mitologico dalle edizioni moderne delle Olimpiadi. Del resto, con la Risoluzione dell’Assemblea Generale delle Nazioni Unite del 2-6 dicembre 2021 è stata istituita la <em>tregua olimpica<\/em> che ha avuto il suo primo esito con i Giochi olimpici e paralimpici di Pechino 2022, valida da sette giorni prima a sette giorni dopo l’inizio dei giochi."}, {"t": "p", "h": "E dopo l’invasione russa dell’Ucraina, il Comitato Internazionale Olimpico (CIO) ha adottato tre Risoluzioni (24, 25 e 28 febbraio 2022): con la prima, si condannava la violazione della tregua olimpica da parte della Russia in violazione della risoluzione ONU; con la seconda, tale condanna veniva confermata e si invitavano le federazioni sportive internazionali a cancellare o spostare in altri Stati gli eventi sportivi programmati per svolgersi in Russia e in Bielorussia; la terza invita a vietare agli atleti russi e bielorussi la partecipazione alle competizioni internazionali e comunque, vieta l’uso di simboli, colori, bandiere, stemmi o inni russi e bielorussi. Viene inoltre ritirato l’Ordine Olimpico in precedenza attribuito a persone con ruoli apicali all’interno del governo russo."}, {"t": "p", "h": "L’ideale Olimpico (l’<em>Olympic ideal<\/em> dei documenti ufficiali) è dunque alla base di quella che, ancora oggi, è definita tregua olimpica, e ne fonda la stessa esistenza, rappresentandone, al contempo, il simbolo e la radice. L’auspicio è che i conflitti internazionali vengano risolti in maniera pacifica e diplomatica e che gli Stati membri dell’ONU cooperino per attuare collettivamente i valori della tregua stessa nel mondo."}, {"t": "p", "h": "Ma lo sport è anche una grande passione: una passione universale che investe grandi masse e dà forma e colore sociale alle pulsioni più profonde della vita associata."}, {"t": "p", "h": "Per Aldo Schiavone, per esempio, la passione dei Romani per i giochi gladiatorii scaturiva dalla storia stessa sia della grandezza di Roma, sia delle sue più intime profondità psicologiche di massa. Secondo il grande storico, i Romani, in un’epoca antica, avrebbero sofferto di una certa insicurezza, determinata dalla paura dei propri stessi dei, oltre che di un senso di instabilità dovuto al continuo pericolo di assedio da parte di popolazioni nemiche. Per questo si può affermare che i Romani riversassero nei giochi un desiderio di esorcizzare la morte «attraverso la messinscena di altre morti, quelle [appunto] dei combattenti nei giochi»."}, {"t": "p", "h": "Agli occhi di un lettore moderno si tratta di una contraddizione quasi inspiegabile, ma anch’essa può essere intesa come portato di un mondo nel quale, nei fatti, era più frequente lo stato di guerra che non quello di pace. Mimare la guerra per festeggiare la sospensione di un conflitto reale è, in ultima analisi, un’espressione altamente simbolica dell’equilibrio continuamente altalenante tra le due situazioni."}, {"t": "p", "h": "Nel mondo antico, del resto, guerra e sport, più che presentarsi come poli opposti, erano aspetti di una stessa realtà, con un fluido confine tra un fenomeno e l’altro. Esso, in definitiva, fu ed è sempre al servizio, in egual misura, tanto della guerra quanto della pace, grazie alla costante e sempiterna identificazione dell’atleta con il guerriero. E nella prova del guerriero come in quella dell’atleta, vi è una verità che non può essere travisata o alterata e che è rappresentata, in ultima analisi, dalla vittoria il cui ricordo rimane fisso nella memoria. Ma, di converso, oggi cresce sempre di più il ruolo dello sport non come agonale attività umana, ma come esperienza di cura dei malesseri sociali e psichici che offuscano, per esempio, la vita nelle metropoli e nelle città."}, {"t": "p", "h": "Ricordo lo sport <em>urbanism<\/em>, una pratica sociale e istituzionale in crescita e con un enorme potenziale. Mi riferisco all’implementazione della pratica sportiva nelle aree urbane, in spazi pubblici e all’aperto (dunque accessibili a tutti). E questo dimostra che anche micro-interventi urbani non possono che restituire spazio agli sportivi e produrre effetti molto più ampi e significativi, allargati alla comunità tutta. Dare nuova vita a spazi pubblici urbani attraverso lo sport significa rendere un’area o anche interi quartieri più vivibili, creando isole di socialità."}, {"t": "p", "h": "Per questo lo sport <em>urbanism<\/em> è una delle modalità sempre più utilizzate per fare rigenerazione urbana garantendo l’accessibilità (spaziale ed economica) a chiunque voglia praticare uno sport. Le imprese, le fondazioni <em>not for profit<\/em>, le associazioni umanitarie, gli enti locali, possono svolgere un grande ruolo in questo campo e ridare allo sport, a fianco dell’attività agonale, quel ruolo educativo, di cura dell’essere che, nei tempestosi tempi odierni di anomia e di sofferenza sociale crescente, diviene sempre più importante."}], "bio": "", "notes": []}, "n8-alfonso": {"paras": [{"t": "p", "h": "Di certo questo numero di “Comprendere” non sarebbe piaciuto a Pierre De Coubertin: troppo spazio al business, al professionismo esasperato, alle scorciatoie per il podio, come se tutto fosse concesso e possibile pur di prevalere. Senza voler offendere l’anima amatoriale del barone, è davvero difficile oggi pensare allo sport come un semplice esercizio di appassionata partecipazione. Una resa incondizionata – la nostra – al predominio dell’industria del record? Nelle pagine che seguono vi renderete conto che non è così. Ci siamo metaforicamente allenati a studiare strategie e tattiche, percorsi e risultati, così da scendere in campo con la consapevolezza che, ancora una volta, “comprendere non è conoscere”. Perché, nonostante il prevalere degli interessi economici rispetto a quelli umani, è ancora possibile individuare il vero senso dello sport."}, {"t": "p", "h": "Questo mondo conserva un potere unico di accorciare le distanze, di qualunque genere esse siano. Nelson Mandela lo affermava con convinzione: “Lo sport ha il potere di cambiare il mondo. Ha il potere di ispirare, di unire le persone in un modo che poche altre cose fanno. Parla ai giovani in una lingua che capiscono. Lo sport può creare speranza dove una volta c&#x27;era solo disperazione”. Il suo esempio, legato anche ad una storica e tesissima finale della Coppa del mondo di rugby in Sudafrica, racchiude pienamente quel senso dello sport a cui facevamo riferimento."}, {"t": "p", "h": "Non tutto, però, è fair play. Come ogni “laboratorio sociale” anche lo sport è competizione, esaltazione, rivincita, talvolta risentimento. Gli aneddoti e i personaggi che disegnano questo tracciato di negatività sono infiniti, ma vorrei soffermarmi su quello che travalica in modo siderale lo spirito decoubertiniano, ovvero lo “sfogatoio comportamentale” di genitori assatanati sui campi di periferia o di subdole pratiche chimiche e alimentari giustificate come supporti alla prestazione. Siamo di fronte a quella che, proprio riferendosi allo sport, George Orwell definiva “una guerra senza spari”, una inaccettabile spirale di violenza verbale o fisica che è la morte stessa del senso sportivo. Tifare per la propria squadra è bellissimo, insultare l’avversario è la peggiore delle sconfitte, quella dell’uomo."}, {"t": "p", "h": "Eppure, al di là degli eccessi, lo sport ci regala lezioni profonde. Oggi, tra e-sport emergenti, inclusione paralimpica e movimenti per la sostenibilità, siamo di fronte ad una evoluzione che va stimolata da un lato e controllata da un altro. Nell’anno delle Olimpiadi invernali e dei mondiali di calcio (ma gli eventi planetari saranno nel solo 2026 oltre una dozzina), siamo convinti una volta di più che l’anello mancante, il sesto, sia nelle mani di donne e uomini che non pensano ad una medaglia o ad un record da battere. Perché se la competizione è gioia dello sforzo, rispetto dell’avversario, superamento dei limiti personali, lo sport nel suo complesso è andare oltre il risultato, stare in salute e sorridere alle difficoltà. Un crampo non ha mai fermato nessuno, lo ha solo aiutato a conoscere meglio il proprio corpo e a metterlo nelle condizioni di ossigenare ancor meglio la mente."}, {"t": "p", "h": "Secondo un recente studio dell’Organizzazione mondiale della sanità, il 31% degli adulti (ossia quasi 2 miliardi di persone) è fisicamente inattivo. Ammetto di far parte di questa non gloriosa comunità. Eppure non c’è bisogno di indossare tute fascianti o sguainare attrezzi fantascientifici per essere campioni. Si può essere migliori praticando con giudizio e costanza una semplice attività periodica, dalla camminata veloce alla bicicletta, senza con questo sentirsi meno amati di Sinner o Messi. E se la World Sport Encyclopaedia sostiene che sono quasi 8000 gli sport conosciuti, certamente sapremo trovare quello che fa per noi. Ancora una volta siamo di fronte alla metafora della vita, dove cadere e rialzarsi conta più del podio. Riscopriamolo così, per un mondo più leale, sano e solidale."}], "bio": "", "notes": []}, "n8-a1": {"paras": [{"t": "p", "h": "Questo interessante e coinvolgente numero di “Comprendere” in chiave sportiva rappresenta un prezioso contributo di approfondimenti, analisi e prospettive che consentono al lettore di misurarsi con le sfaccettature multidimensionali dello sport, inteso come piattaforma anche sociale ed economica, che si muove nell’equilibrio tra prestazioni e benessere, ad ampio spettro, rappresentando una catena del valore della quale sta crescendo anche in Italia la consapevolezza."}, {"t": "p", "h": "In quest’ottica, “Oltre il risultato” è un titolo che rappresenta un&#x27;efficace interpretazione di sintesi dello spirito del comma 7 dell’articolo 33 della Costituzione, grazie al quale da poco più di due anni «La Repubblica riconosce il valore educativo, sociale e di promozione del benessere psicofisico dell’attività sportiva in tutte le sue forme» e del modello italiano che stiamo cercando di realizzare e affermare. Nelle competizioni, ma soprattutto oltre le competizioni: nella vita di tutti i giorni."}, {"t": "p", "h": "Il riconoscimento costituzionale del valore dello Sport è un indirizzo per tutti coloro che svolgono un ruolo in questo ambito, ai vari livelli, e ancor di più per chi lo ha di alta responsabilità e rappresentanza, perché ognuno contribuisca a trasformarlo in un diritto diffuso, attraverso un impegno quotidiano finalizzato al miglioramento delle condizioni del mondo sportivo nelle sue articolazioni e all’ampliamento delle opportunità, a partire dai contesti che ne offrono di meno. Un diritto che ogni cittadino deve poter esercitare indipendentemente da età, genere, censo o luogo di residenza."}, {"t": "p", "h": "Per troppo tempo l’attenzione verso lo sport si è concentrata soprattutto sulle sue eccellenze, sulle prestazioni di atlete e atleti, delle squadre nazionali o di club delle varie discipline, sulla capacità di apporto di tecnici, società e federazioni che hanno portato l’Italia ai vertici internazionali. In questo ambito di valutazione la considerazione dell’eccellenza nazionale si allarga anche ai grandi avvenimenti che l’Italia sta continuando a ospitare, dimostrando la capacità organizzativa e di valorizzazione della nostra immagine nel mondo, che negli ormai prossimi Giochi Olimpici e Paralimpici di Milano Cortina troverà la sua massima espressione e proiezione internazionale."}, {"t": "p", "h": "Mi riferisco a un patrimonio straordinario, motivo di orgoglio e onore, chiave di incontro e dialogo e strumento di qualificazione e posizionamento globale, ma il vero salto di qualità stiamo cercando di compierlo attraverso la ricerca di un equilibrio e una corrispondenza tra questi fattori che guardano alla prestazione, alla competizione e all&#x27;affermazione, con la promozione e lo sviluppo della cultura e della pratica sportiva nella quotidianità delle persone, nelle scuole, nelle città a partire dalle periferie, nei piccoli comuni, laddove l’accesso all’attività fisica è spesso ostacolato da carenze strutturali, difficoltà economiche o limiti culturali."}, {"t": "p", "h": "Negli ultimi anni è stata avviata una politica che potremmo definire di “prossimità e quotidianità sportiva”, investendo non solo nella riqualificazione degli impianti tradizionali, ma anche nella creazione di quasi duemila spazi diffusi e gratuiti: playground, aree verdi attrezzate, percorsi ciclopedonali, impianti naturali, tutti elementi che fanno parte di progetti di rigenerazione urbana e umana, che impiegano lo sport come leva di trasformazione sociale o di equilibrio della comunità. Seguendo questa visione, negli ultimi tre anni sono stati investiti 1,6 miliardi di euro, risorse pubbliche dedicate a interventi che ambiscono a costruire un ecosistema sportivo moderno, accessibile, sostenibile, inclusivo e diffuso, che sarà sempre più il frutto della pianificazione, capace di rispondere alle nuove abitudini e alle nuove esigenze delle persone di ogni età, contribuendo a contrastare due dei “nemici” di quest’epoca: la sedentarietà e la solitudine, che lasciano segni profondi nelle persone e nella società."}, {"t": "p", "h": "Accanto agli interventi materiali, stiamo lavorando sulle cosiddette “infrastrutture immateriali”, indispensabili per accompagnare questo cambiamento: la formazione degli operatori sportivi, la promozione della sicurezza negli impianti, l’educazione alla prevenzione e alla salute attraverso l’attività motoria, la diffusione della pratica sportiva accessibile a tutte le fasce d’età. Lo sport non è solo movimento, è un luogo educativo, un contesto nel quale si impara a riconoscere e gestire le emozioni, a cadere e rialzarsi, a rispettare le regole e gli altri, a lavorare insieme. Lo sport è vita, è una difesa immunitaria sociale e comunitaria, da difendere, promuovere e rafforzare."}, {"t": "p", "h": "Il modello costruito a Caivano, per reagire alla cronaca nera provando ad anticiparla e non subirla, dove la rigenerazione sportiva ha rappresentato un punto di svolta nella ricostruzione del tessuto comunitario e nel ripristino di socialità e legalità, si è trasformato in altri otto cantieri nei quali stiamo replicando una risposta strutturata in altre aree che presentano evidenti e oggettive fragilità sociali: Rozzano, alle porte di Milano, Orta Nova a Foggia, Rosarno e San Ferdinando nella Piana di Gioia Tauro, i quartieri Quarticciolo - Alessandrino a Roma, Scampia e Secondigliano a Napoli, San Cristoforo a Catania e Borgo Nuovo a Palermo. In questi territori, lo sport inizierà a breve ad assumere una funzione centrale, contribuendo a ridurre le distanze, creando nuovi spazi e opportunità, restituendo fiducia e speranza, diventando un presidio di legalità e crescita."}, {"t": "p", "h": "Ma lo sport è anche un settore economico in espansione, che necessita di un’osservazione competente e strutturata, una piattaforma capace di generare valore aggiunto e sviluppo sostenibile, di contribuire al miglioramento delle nostre città e promuovere come nessun altro settore il turismo in tutte le sue forme, di coniugare capitale umano e tecnologia “buona”. L’introduzione di strumenti digitali, dell’intelligenza artificiale e dell’analisi dei dati sta trasformando in modo virtuoso la gestione degli impianti, la gestione degli eventi, l’allenamento degli atleti, agonisti e non solo, e perfino il rapporto individuale con il proprio benessere."}, {"t": "p", "h": "La lettura di questa brillante pubblicazione, con questo numero dedicato allo sport, nella quale ci apprestiamo a immergerci con curiosità e interesse, sottolinea proprio questo: la pratica sportiva non è più un capitolo separato della vita sociale, ma un elemento della quale è sempre più parte integrante e necessaria, che incide sull’educazione e la salute, l’inclusione e la coesione sociale, la “sostenibilità sostenibile” e la crescita economica. Per questo è necessaria una visione sistemica, un autentico “modello Italia” basato sulla collaborazione stabile tra le istituzioni nazionali, territoriali e locali, la scuola e l’università, l’associazionismo sportivo e del terzo settore, il sistema produttivo e il mondo della comunicazione."}, {"t": "p", "h": "L’articolo 33 ci consegna una sfida chiara per far sì che lo sport non resti un principio astratto o di sola concretezza economica, ma un’esperienza umana, individuale e comunitaria, quotidiana, accessibile, possibilmente a tutti. Rappresenta un investimento sociale e culturale di grande valore, capace di incidere sulla vita delle persone e di contribuire alla costruzione di una società più sana, rispettosa, coesa e consapevole. È questo, in fondo, il cuore della nostra missione."}, {"t": "p", "h": "Comprendere, oltre il risultato. Buona lettura!"}], "bio": "<strong>Andrea Abodi<\/strong> (Roma, 7 marzo 1960) è Ministro per lo Sport e i Giovani del Governo Meloni. Laureato in Economia e Commercio alla LUISS, con una tesi sulle sponsorizzazioni sportive, vanta oltre trentacinque anni di esperienza nella gestione dello sport come sistema industriale e sociale. Ha ricoperto ruoli di vertice in istituzioni e società pubbliche, tra cui la presidenza dell’Istituto per il Credito Sportivo e della Lega Nazionale Professionisti B. Giornalista pubblicista, è attivo anche nella formazione universitaria e nei master dedicati allo sport, alle infrastrutture e alla responsabilità sociale. Il 22 ottobre 2022 ha prestato giuramento nelle mani del Presidente della Repubblica Sergio Mattarella.", "notes": []}, "n8-a2": {"paras": [{"t": "p", "h": "Nel mondo dello sport, il tempo è una variabile che si misura in secondi, in risultati, in classifiche che si aggiornano senza memoria. Fuori dal campo, però, esiste un altro tempo, più lento e più esigente, quello delle responsabilità sistemiche. È in questo spazio che si colloca il lavoro di Michele Uva, oggi Executive director della UEFA per la Sostenibilità e di recente anche delegato per EURO 2032 in Italia."}, {"t": "p", "h": "Quando la rivista TIME lo ha inserito nella lista delle 100 persone più influenti al mondo per quanto riguarda le tematiche climatiche, Michele Uva è diventato il primo rappresentante del mondo dello sport a comparire in quel perimetro. Riconoscimento ricevuto per un lavoro di sistema avviato nel calcio europeo a partire dal 2021, che ha spostato la sostenibilità dal registro della dichiarazione a quello dell’impatto misurabile. Come ci racconta: <em>«Non nascondo un senso di orgoglio per me e per la UEFA, ma è un riconoscimento che condivido con il mio team e con tutti i manager della sostenibilità di  federazioni, leghe e club. Ogni giorno lavorano per consolidare il messaggio che il  calcio deve prendersi la propria parte di responsabilità nel promuovere comportamenti e azioni per il rispetto del clima. È un percorso iniziato nel 2022 che sta  già dando frutti grazie a un’accelerazione collettiva del sistema»<\/em>."}, {"t": "p", "h": "Il punto, però, non sono i riconoscimenti in sé. È la trasformazione silenziosa di un ecosistema che per sua natura resiste ai cambiamenti, perché vive di cicli brevi e di successi immediati. Michele Uva osserva lo sport europeo da dentro da oltre quarant’anni, abbastanza a lungo da distinguere le mode dalle mutazioni strutturali. E ciò che individua oggi non è una singola azione, ma uno slittamento di paradigma: la necessità di tenere insieme dimensioni che per decenni sono state considerate incompatibili. Michele Uva prosegue il suo racconto: <em>«In oltre quarant’anni di lavoro nello sport ho assistito a diversi cicli di trasformazione. La grande sfida del presente e del futuro è  coniugare le diverse dimensioni della sostenibilità – sportiva, finanziaria, sociale,  culturale e ambientale – in un piano integrato. Prima all’interno delle organizzazioni e poi nel sistema economico dello sport, che resta un unicum basato sulla  complementarità e non sulla competitività, fatta eccezione per quella sul campo»<\/em>."}, {"t": "p", "h": "Le parole, quando vengono ripetute come formule salvifiche, finiscono per perdere significato. Nel lessico degli ultimi anni, <em>sostenibilità<\/em> e <em>resilienza<\/em> hanno percorso traiettorie parallele: la prima logorata dall’abuso, la seconda caricata di retorica che spesso giustifica più di quanto trasformi. Entrambe rischiano di restare concetti inoffensivi se non sono legate a effetti misurabili e a responsabilità concrete. È in questo spazio che Michele Uva introduce uno scarto lessicale netto, scegliendo una parola più esigente e meno consolatoria: <em>«Si gira spesso intorno alla parola sostenibilità senza riuscire a darle una connotazione precisa. Per questo ho iniziato a parlare di impatto.  Il sistema sportivo europeo ha e avrà sempre più impatto su tutti gli stakeholder e  oggi nessuna strategia può prescindere dalla condivisione dei percorsi con loro. È  un gioco di squadra che richiede ascolto e capacità di anticipare le esigenze della  società civile, per poi agire con azioni concrete che arrivino alla base della piramide, composta da tifosi e comunità»<\/em>."}, {"t": "p", "h": "<em>«Non possiamo sapere se un’azione ha impatto se non definiamo prima un programma strategico con obiettivi chiari e se non misuriamo costantemente gli indicatori di performance. I risultati vanno analizzati e condivisi con i portatori di  interesse: ogni feedback è utile per migliorare il percorso, con l’unico obiettivo di  creare un impatto positivo»<\/em>."}, {"t": "p", "h": "Se l’impatto è la parola scelta per sottrarre lo sport alla retorica, l’azione e la misura ne diventa la condizione necessaria. Non come esercizio contabile, ma come atto di responsabilità. Senza numeri, indicatori, verifiche, ogni dichiarazione resta reversibile, ogni impegno negoziabile. È il passaggio più delicato: trasformare valori condivisi in criteri di valutazione, e la sostenibilità in una pratica esposta al giudizio degli altri. <em>«In UEFA abbiamo voluto  creare un linguaggio e un processo chiaro ma flessibile, adattabile alle realtà nazionali e territoriali. La sostenibilità va declinata rispettando le differenze culturali dei 55 Paesi UEFA e dei circa 250.000 club europei. Noi forniamo strumenti  e piattaforme, ma ogni realtà deve saper applicare le diverse componenti della  sostenibilità nel proprio contesto»<\/em>."}, {"t": "p", "h": "L’accelerazione non nasce nel vuoto, è il risultato di una pressione che agisce lungo tutta la filiera del calcio: istituzioni, federazioni, leghe, club, partner commerciali, tesserati, tifosi. Una spinta che non è solo valoriale, ma anche economica, e che costringe il sistema a rendere coerenti scelte, investimenti e narrazioni. Allo stesso tempo, nessuna strategia può reggere se non intercetta la base emotiva e sociale dello sport: i tifosi. È tra questi due poli – governance e comunità – che si gioca oggi la credibilità del cambiamento. <em>«Stiamo assistendo a una forte accelerazione collettiva. È positivo vedere sinergie  e condivisioni tra federazioni, leghe e club. Un ruolo importante è giocato anche  dalla pressione dei partner commerciali, che contribuiscono ad alzare l’asticella e  a rendere coerenti i loro investimenti. Più che singole azioni, conta la condivisione  continua del processo strategico e delle azioni concrete che generano impatto misurabile»<\/em>. È in questo spazio di traduzione che entrano in gioco i tifosi, non come pubblico da convincere, ma come soggetto attivo di un cambiamento che funziona solo se diventa abitudine, prosegue Michele Uva <em>«I tifosi sono  la base e la forza della passione che il calcio genera. Vanno coinvolti in modo organico e intelligente. Le istituzioni sportive non possono salvare il pianeta – rappresentiamo lo 0,000008% delle emissioni emesse ogni anno – ma devono fare  la propria parte partendo dalle azioni proprie e poi coinvolgendo tutta la propria  piramide. Ad esempio i tifosi, con piccoli gesti, possono essere il vero acceleratore  positivo. Contro il greenwashing servono azioni collettive»<\/em>."}, {"t": "p", "h": "I grandi eventi sportivi restano il punto di massima esposizione del sistema. Non solo per la loro visibilità, ma perché rendono immediatamente leggibile la distanza – o la coerenza – tra strategia e realtà. Sono stress test culturali prima ancora che logistici: mettono alla prova abitudini, infrastrutture, modelli di consumo. È qui che la sostenibilità smette di essere una dichiarazione e diventa pratica osservabile. E che la <em>legacy<\/em>, parola spesso invocata e raramente verificata, si misura nella capacità di produrre cambiamenti che restano. Lo dimostra, conclude Uva, il lavoro fatto sui grandi tornei europei: <em>«Le azioni sulla mobilità sono l’innovazione più trasformativa. Cambiare  il modo di raggiungere lo stadio significa creare abitudini quotidiane. A EURO  2024 l’82% dei tifosi non ha utilizzato l’auto, in Svizzera siamo arrivati all’86%.  Per la prima volta abbiamo organizzato un evento “zero parking”: la finale di  Youth League 2024, con 4.000 spettatori e zero macchine. Per costruire una legacy duratura, rispettare i budget e generare un impatto economico e sociale concreto serve una parola semplice, spesso dimenticata in Italia: programmazione»<\/em>."}], "bio": "<strong>Michele Uva<\/strong> è un dirigente sportivo italiano con una carriera pluridecennale nei più alti livelli del sistema sportivo italiano e europeo. Laureato all’Università di Bologna, ha lavorato nel calcio, nella pallavolo, nella pallacanestro e nel Comitato Olimpico Italiano, ricoprendo ruoli di vertice in club, federazioni e leghe. Dall’inizio del 2021 è Executive Director per la sostenibilità sociale e ambientale della UEFA, incarico in cui guida l’integrazione della sostenibilità nelle strategie della confederazione, e dal 2025 è anche delegato UEFA per l’organizzazione degli Europei di calcio 2032 in Italia. Autore di vari libri e relatore internazionale, è stato inserito nel TIME100 Climate come uno dei leader influenti per il clima.", "notes": []}, "n8-a3": {"paras": [{"t": "p", "h": "Lo sport è uno dei pochi luoghi in cui la società può riconoscere la propria immagine più autentica: non quella raccontata nei documenti programmatici, ma quella che emerge nei gesti quotidiani, nelle relazioni, nella capacità di accogliere o escludere. È un laboratorio di convivenza civile, un linguaggio universale che mette le persone di fronte al proprio limite e alla propria possibilità. Parlare di sport e inclusione significa parlare del Paese, di chi siamo e di chi vogliamo diventare."}, {"t": "p", "h": "La mia esperienza nel movimento paralimpico mi ha insegnato che lo sport è, prima di tutto, uno spazio di libertà. Libertà dal pregiudizio, dalla definizione esterna, dall’idea che qualcuno possa decidere cosa una persona sia o non sia. È uno spazio in cui la persona disabile viene messo nelle condizioni di guardare a ciò che ha e non il contrario, può riconoscersi al di fuori dello sguardo pietistico o della retorica dell’eroe: può essere atleta, studente, lavoratore, cittadino. Può essere se stessa, senza categorie riduttive. Lo sport rende visibile ciò che la società spesso fatica a vedere: che la dignità non dipende dall’integrità di un corpo, ma dalla possibilità di poter partecipare alla vita collettiva."}, {"t": "p", "h": "L’inclusione, però, non nasce spontaneamente. È un processo che richiede politiche pubbliche, investimenti, visione. Quando abbiamo costruito i percorsi paralimpici, abbiamo capito subito che l’accesso è il primo diritto da difendere. Accesso agli impianti, ai tecnici formati, agli ausili, ai percorsi nelle scuole e nelle comunità. E anche accesso alla narrazione: perché per decenni la disabilità è stata rappresentata come mancanza o eccezione, non come parte della normalità umana. Cambiare lo sguardo dei media ha significato aiutare a cambiare lo sguardo del Paese."}, {"t": "p", "h": "In questi anni ho visto cosa succede quando una persona disabile entra in una palestra non per essere <em>accolta<\/em>, ma per essere allenata. Ho visto ragazzi e ragazze scoprire una nuova identità possibile, famiglie ritrovare speranza, comunità cambiare linguaggio. Riabilitazione e sport non sono la stessa cosa: la riabilitazione restituisce funzionalità, lo sport restituisce futuro. È una differenza enorme, che riguarda il modo in cui una società sceglie di riconoscere il valore delle persone."}, {"t": "p", "h": "Ma lo sport non parla solo di disabilità: parla di tutte le differenze. Di genere, culturali, sociali, economiche, identitarie."}, {"t": "p", "h": "È uno dei pochi spazi pubblici in cui le regole sono uguali per tutti, e questo fa dello sport una palestra di democrazia. Ma perché questo sia vero, dobbiamo avere il coraggio di riconoscere che anche nello sport esistono diseguaglianze radicate: accesso limitato, barriere economiche e sociali che escludono intere fasce di popolazione."}, {"t": "p", "h": "L’inclusione non è un tema <em>buonista<\/em>: è un criterio di qualità. Uno sport che esclude è uno sport più povero, più fragile, meno capace di generare valore sociale. Uno sport che include, invece, diventa un motore di sviluppo umano, culturale ed economico. Non si tratta di aprire spazi <em>speciali<\/em>, ma di garantire condizioni ordinarie: far sì che ogni persona possa scegliere il proprio percorso senza ostacoli pregiudiziali."}, {"t": "p", "h": "Per questo ritengo che la scuola sia il primo luogo in cui l’inclusione sportiva deve diventare realtà. Non solo attraverso più ore di educazione motoria, ma attraverso un pensiero pedagogico che consideri il corpo come parte della formazione della persona. Lo sport scolastico è il primo spazio in cui bambini e bambine possono sperimentare la libertà di muoversi, cooperare, competere senza essere giudicati. Ed è anche il luogo in cui le differenze possono diventare opportunità educative, non motivo di esclusione."}, {"t": "p", "h": "L’inclusione richiede inoltre un cambiamento culturale profondo. Non basta aprire le porte: serve cambiare il modo in cui guardiamo le persone. L’ho visto nel movimento paralimpico quando abbiamo introdotto bandi pubblici per l’avviamento alle attività sportive o per gli ausili necessari, quando abbiamo portato gli atleti nelle scuole, quando abbiamo creato eventi culturali come il Festival della Cultura Paralimpica, quando abbiamo costruito percorsi condivisi con l’arte, la fotografia, la musica. Ogni volta che un linguaggio nuovo entrava in contatto con la disabilità, cadeva una barriera culturale."}, {"t": "p", "h": "La narrazione è politica. Il modo in cui raccontiamo un corpo, una vittoria, una sconfitta decide il modo in cui quel corpo sarà trattato nella società. Per questo chiedo spesso ai media di assumersi la responsabilità del proprio ruolo: raccontare la disabilità senza pietismo, raccontare le atlete donne senza ridurle a stereotipi, raccontare le identità plurali senza sensazionalismo. Lo sport costruisce immaginario, e l’immaginario costruisce il futuro. Oggi più che mai, in un Paese che invecchia rapidamente, lo sport deve essere pensato come una grande infrastruttura sociale. La longevità, la solitudine, le fragilità crescenti non possono essere affrontate senza una politica dello sport che metta al centro la salute, la prevenzione, la partecipazione. L’attività fisica è il primo presidio di autonomia: mantiene le persone attive, riduce la spesa sanitaria, crea comunità. È uno dei più potenti strumenti di welfare, ma spesso lo consideriamo ancora come un lusso o un intrattenimento."}, {"t": "p", "h": "La verità però è semplice: lo sport include quando è accessibile, quando è vicino ai territori, quando è aperto alle diversità. Include quando smette di essere eccezione e diventa normalità. E include quando le istituzioni scelgono di accompagnarlo con politiche pubbliche coraggiose, capaci di guardare oltre il risultato immediato."}, {"t": "p", "h": "Se c’è una lezione che lo sport mi ha dato, è questa: l’inclusione non è un tema da trattare, è un modo di stare al mondo. È la misura del nostro grado di civiltà. È la forma più alta di riconoscimento che possiamo dare a una persona: dirle <em>tu appartieni<\/em>, senza condizioni."}, {"t": "p", "h": "Lo sport può fare questo. E può farlo ogni giorno, in ogni campo, in ogni scuola,oratorio, in ogni palestra di periferia."}, {"t": "p", "h": "A patto che lo consideriamo davvero ciò che è: un bene pubblico, sul quale investire consapevolmente, che costruisce libertà, identità e futuro."}], "bio": "<strong>Luca Pancalli<\/strong>, già campione paralimpico con 15 medaglie, è una delle figure più autorevoli dello sport italiano. Fondatore nel 1993 della FISAPS e, dal 2000, guida della FISD, ha contribuito in modo decisivo alla nascita e allo sviluppo del Comitato Italiano Paralimpico, che ha presieduto fino al 26 giugno 2025. È stato vice presidente del CONI e segretario generale dell’EPC. Dal 2017 al 2025 è stato il primo italiano nella storia a far parte del Governing Board dell’International Paralympic Committee. Dal 2006 al 2007 ha ricoperto l’incarico di Commissario Straordinario della FIGC. Assessore allo Sport di Roma nel 2013, ha ricevuto prestigiose onorificenze nazionali e internazionali, tra cui il Paralympic Order e il titolo di Cavaliere di Gran Croce.", "notes": []}, "n8-ep41": {"epigraph": "Di gloria il viso e la gioconda voce,\nGarzon bennato, apprendi,\nE quanto al femminile ozio sovrasti\nLa sudata virtude. Attendi attendi,\nMagnanimo campion (s’alla veloce\nPiena degli anni il tuo valor contrasti\nLa spoglia di tuo nome), attendi e il core\nMovi ad alto desio. Te l’echeggiante\nArena e il circo, e te fremendo appella\nAi fatti illustri il popolar favore;\nTe rigoglioso dell’età novella\nOggi la patria cara\nGli antichi esempi a rinnovar prepara.\nDel barbarico sangue in Maratona\nNon colorò la destra\nQuei che gli atleti ignudi e il campo eleo,\nChe stupido mirò l’ardua palestra,\nNé la palma beata e la corona\nD’emula brama il punse. E nell’Alfeo\nForse le chiome polverose e i fianchi\nDelle cavalle vincitrici asterse\nTal che le greche insegne e il greco acciaro\nGuidò de’ Medi fuggitivi e stanchi\nNelle pallide torme; onde sonaro\nDi sconsolato grido\nL’alto sen dell’Eufrate e il servo lido."}, "n8-ep61": {"epigraph": "Questo campo è un campo di combattenti, questo giuoco è un giuoco di\ncombattenti. In una vecchia cronaca fiorentina si dice del calcio come gioco proprio e antico della città di Firenze, a guisa di battaglia ordinata. I\ncampioni di tutti i reparti qui si addestrano alla rapidità, all’agilità, al colpo d’occhio sicuro, al coraggio sprezzante, alla lunga lena. Qui si foggiano\ni muscoli forti e gli animi grandi. Il gioco a guisa di battaglia ordinata è la\npreparazione all’assalto d’armi. Perciò io non assisto alla festa di oggi se\nnon come combattente capo di combattenti. Pronti? Io grido. E voi come mi\nrispondete? Pronti!"}, "n7-ep7": {"epigraph": "I pacchi di banconote s'accumulavano nei suoi forzieri e, come ciascuno cui\nsia stato concesso questo terribile dono, egli divenne cupo, inaccessibile a\ntutto tranne che all'oro, sordido senza motivo, uno svergognato raccoglitore di ricchezze; e già si preparava a divenire uno di quegli esseri strani, tanto\nnumerosi nel nostro ingrato mondo, cui guarda con spavento l'uomo d'intelletto e di cuore, al quale essi paiono sepolcri imbiancati, con un cadavere\ndentro al posto del cuore."}, "n7-sapelli": {"paras": [{"t": "p", "h": "«Questa naturale e progressiva consunzione dei capitali agrarj, la quale trae con sé una proporzionata diminuzione di reddito, esige che l’uomo con sempre nuovi capitali soccorra alla possidenza. Il che si fa per due modi. O l’uomo mette in disparte ogni anno una porzione dei frutti della terra per riversarli sul di lei seno e darle alimento. O l’uomo deve cercar lucro, aggiungendo pregio alle materie disutili; il che egli fa sì col lavorarle, sì col trasportarle altrove per farne cambio con qualche oggetto più opportuno a’ suoi casi. Le materie su cui si esercitano queste due operazioni delle arti e del commercio, costituiscono la ricchezza mobile; mentre la terra cogli edificj e le adjacenze consacrate al suo immediato servigio costituiscono la ricchezza prediale. Prescindiamo per ora dai capitali forniti dall’industria e dal commercio; supponiamo che la terra venga alimentata soltanto dai capitali di origine agricola, ossia dai risparmj fatti dal proprietario, ossia dalla differenza tra il reddito ed il consumo. Nei modi che abbiamo enumerati, molte forze tendono a decimare il reddito della terra; e molte altre forze spingono l’uomo ad accrescere i consumi e a portare le spese a livello delle rendite ed anche a varcarlo. Quindi se si dovesse alimentare la fecondità del terreno unicamente colla porzione dei frutti che fosse residua al consumo, ne accadrebbe che per difetto d’alimento la fecondità delle terre verrebbe meno, e scemerebbero i redditi stessi. La diminuzione dei redditi restringerebbe sempre più il residuo destinato ad alimentare la terra; quindi la diminuzione dei redditi s’andrebbe sempre più aggravando»."}, {"t": "p", "h": "Così Carlo Cattaneo nelle sue <em>Le interdizioni Israelitiche<\/em>, un testo che apre l’orizzonte sul reticolo politico, scientifico e religioso che ogni volta ci avvolge quando si discorre di finanza, ieri e oggi, fuori dai luoghi comuni e dalla retorica a cui siamo da troppo tempo adusi. Tutto il pensiero economico classico, prima della controrivoluzione neoclassica e marginalista, aveva inteso la finanza come progenitrice di ricchezza, copiosa dei doni del benessere… era ben lungi dal pensarla, insomma, come speculazione o attività che s’opponesse alla circolazione delle merci. Essa, invece, ne favoriva la circolazione e la valorizzazione, come giunse a dispiegare nella sua lucidissima capacità critica Karl Marx nel Quinto libro de <em>Il Capitale<\/em>."}, {"t": "p", "h": "Era, del resto, la tesi che fece propria il pensatore oggi più attuale di tutti, quel Karl Polanyi de <em>La grande trasformazione<\/em> che sorprende con fuochi d’interesse che s’accendono abbaglianti, per poi spegnersi d’un tratto… Ma il suo pensiero perenne brucia sotto la cenere e ancora e sempre illumina la via della Comprensione. Questa rivista non può non ricordarlo."}, {"t": "p", "h": "In Karl Polanyi, infatti, la finanza è vista come parte integrante della dinamica della società e del mercato, e non come sfera separata e autonoma. Si critica, nell’opera tutta di Polanyi, l&#x27;idea di un mercato &quot;autoregolato&quot; dove la finanza è una merce come tutte le altre, e si sottolinea, invece, come la finanza sia sempre immersa nelle relazioni sociali e politiche e le co-determini."}, {"t": "p", "h": "Il potente strumento sociale che rese effettivo, per esempio, (e questo è il tema dei temi, con la sua sconvolgente e terribile attualità) l’interesse per la pace nel secolo in cui nacque la modernità fu l’<em>Haute Finance<\/em>, ossia quella finanza di relazione dinastica e non borghese… familiare della famiglia allargata e non della famiglia nucleare… famiglia internazionale sino ai settimi cugini e non nazionale. L’Alta finanza, i cui esponenti che appartenevano alla stessa dinastia combattevano la guerra su opposti fronti e contavano le morti dei soldati al loro comando con pari freddezza e partecipazione insieme con cui, nel frattempo, discutevano negli stessi Consigli di Amministrazione."}, {"t": "p", "h": "Il prodigio della crescita capitalistica furono l’<em>Haute Banque<\/em> e la grande banca mista che ne derivò, dove interessi industriali, commerciali, finanziari, politici e dinastici, si amalgamavano in un mondo che ci appare oggi tanto lontano quanto rimpianto."}, {"t": "p", "h": "Se si rilegge il capolavoro del maestro di coloro che quello straordinario fenomeno studiarono (e furono tutti francesi i migliori, e questo dice tutto, o quantomeno molto, della storia del mondo), ossia il capolavoro di Maurice Lévy-Leboyer, <em>Les Banques européennes et l&#x27;industrialisation internationale dans la première moitié  du XIX siècle<\/em>, ben si comprende la «straordinaria conquista del Continente da parte del fenomeno industriale: una conquista rapida, assoluta e irreversibile, dalle conseguenze più varie: una conquista che, partita dalle Isole Britanniche — paradiso della tecnica — fin dalla fine del XVIII secolo, ha progressivamente invaso l’intero spazio europeo, sostituendo alla civiltà del passato una civiltà del tutto nuova. Senza dubbio, un simile processo non può essere ricondotto a una spiegazione unica; tuttavia, è incontestabile che la questione dell’investimento occupi un posto centrale tra tutte le interpretazioni. Essa si poneva con ancora maggior urgenza in quanto, nella prima fase del fenomeno — quella iniziale — l’opinione comune non attribuiva alla banca un ruolo trainante»<sup>1<\/sup>. Tutto si produsse in Europa nel secolo che va dal Congresso di Vienna, dove si consumò la fine della Francia Napoleonica e si ritardò l’avvento dell’Europa della borghesia tra immense sofferenze, per giungere alle soglie della Prima Guerra Mondiale."}, {"t": "p", "h": "Quello “strumento”, quel “<em>role moteur<\/em>”, fu l’alta finanza. Essa ingenerava il suo potere grazie ad essere “un mondo” non governato dagli Stati (appena nascenti o costruentisi sotto la forma del dominio imperiale e non nazionalistico), ma dalle “grandi famiglie”. Le “grandi famiglie” che costruivano il principale legame tra l’organizzazione politica e l’organizzazione economica del mondo. La finanza poteva così agire come elemento moderatore delle propensioni di potenza degli Stati sovrani minori e di quelli che, dominando questi ultimi con geometrie variabili, esercitavano il dominio sul mondo in una scacchiera che costituiva il concerto delle grandi potenze e di cui la grande finanza fu l’elemento di centralizzazione e di pacificazione, sino a quando il principio di nazionalità sostituì quello dinastico nel governo mondiale. E allora un altro mondo, anzi due ben diversi mondi, s’aprirono non solo per la finanza: quel
