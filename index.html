lo europeo e quello nord americano, sin dall’inizio integralmente borghese, a differenza di quello dell’origine della finanza e di molte altre cose."}, {"t": "p", "h": "Per questo la finanza nord americana fu profondamente diversa da quella europea sin dagli inizi. Ricordate come inizia il capolavoro di Alexis De Tocqueville?"}, {"t": "p", "h": "«Tra le novità che attirarono la mia attenzione durante la mia permanenza negli Stati Uniti, nessuna mi ha maggiormente colpito dell’uguaglianza delle condizioni. Senza fatica constatai la prodigiosa influenza che essa esercita sull’andamento della società: essa dà allo spirito pubblico una determinata direzione, alle leggi un determinato indirizzo, ai governanti dei nuovi princìpi, ai governati abitudini particolari."}, {"t": "p", "h": "Subito mi accorsi che questo fatto estende la sua influenza assai oltre la vita politica e le leggi, e che domina non meno la società civile che il governo: infatti crea opinioni, fa sorgere sentimenti, suggerisce usanze e modifica tutto ciò che non crea direttamente. Pertanto, più studiavo la società americana, più vedevo nell’uguaglianza delle condizioni la forza generatrice da cui pareva derivare ogni fatto particolare; e me la ritrovavo continuamente davanti come un punto centrale, in cui convergevano tutte le mie osservazioni». L’uguaglianza delle condizioni regge lo scambio di mercato – purché si abbia il possesso o l’uso del denaro – ed è ben diverso dalla dinastia e dalla grande famiglia secolare ch’era a fondamento dell’<em>Haute Banque<\/em>…"}, {"t": "p", "h": "Profondamente incardinata nell’industria nascente, invece, e nel prestito di Borsa – in quella ch’era una nazione – sin da subito intimamente borghese. Niente castelli da abbattere, nessuna rivoluzione da compiersi, ma solo una terra da conquistare fisicamente, combattendo contro gli abitanti autoctoni e le grandi distanze per superare le quali occorreva un’immensa, immensa, accumulazione di denaro che poteva avvenire solo tramite un inedito strumento per l’Europa: la Borsa, che, come ci insegna Max Weber, nasce certo nel Vecchio Continente, dove mosse i primi passi nell’anseatiche città, ma che solo negli Usa ebbe il suo inveramento (pensiamo a quanto furono immensi i capitali raccolti per costruire le reti ferroviarie, accumulazione che poteva avvenire solo con l’indebitamento borsistico)."}, {"t": "p", "h": "Si apriva così una dialettica, o un confronto, anche aspro se si vuole, tra un capitalismo irrorato, da un lato, dal sangue – ossia dall’ereditarietà e dalla successione biologica – e un capitalismo che si fondava e si fonda sul denaro raccolto tra milioni di attori chiamati azionisti e che danno immediatamente vita a una finanza che non può che essere profondamente diversa da quella europea e che abbiamo prima descritto."}, {"t": "p", "h": "Oggi il mondo è molto cambiato perché la finanza nordamericana tramite dapprima la propria avanguardia britannica, (ecco l’<em>anglosfera<\/em> che ha vinto due guerre mondiali), ha dominato e domina il mondo. Se ne vuole una riprova? I saggi qui compresi di due grandi studiosi, pur tanto diversi come formazione e prospettiva analitica come Luca Fantacci e Niccolò Valmori e le interessanti osservazioni di Stefano Feltri ci dimostrano che nonostante – o forse proprio per questo – la trasformazione dei capitalismi mondiali in capitalismi di guerra, il ruolo della finanza nord americana, pur nella sua incessante trasformazione tra fasi di regolamentazioni, sregolamentazioni, crisi l’una all’altra conseguenti, è ancora fortissimo. Così forte da perseguire a fasi alterne anche una nuova forma di dollarificazione del mondo; proprio quando, invece, l’opinione pubblica (o ciò che ne rimane) preconizza la fine dell’egemonia monetaria degli USA su scala planetaria: essa, invece, oggi ancora caratterizza tutta l’economia mondiale."}, {"t": "p", "h": "Alla fiducia famigliare o familistica si è sostituita la <em>corporate governance<\/em>, tanto delle banche centrali “autorità indipendenti”, tanto delle banche <em>tout court<\/em>, banche che oggi sono tutte “banche miste” perché si è superata la secolare divisione tra banche commerciali e banche d’affari, con le conseguenze che sono dinanzi ai nostri occhi, con il ricorrere delle crisi a più o meno alta intensità. E la stessa cosa vale per quelle società che non sono “banche”, ma “imprese finanziarie”, dirette alla raccolta e alla valorizzazione dei patrimoni di qualsivoglia origine… ed è qui, forse, la sola eredità che oggi rimane della <em>Haute Banque<\/em>. Se la “base aurea” e il “costituzionalismo della <em>common law<\/em>” erano gli strumenti che facevano ascoltare la voce della City di Londra in molte delle nazioni che avevano adottato questi simboli di adesione al nuovo ordine internazionale, oggi è il “prolungamento” nella finanza e con la finanza – della potenza della nazione – che si fa sentire il potere di controllo della finanza USA sul mondo, in un mondo in cui il dollaro è la sola moneta di riferimento che governa il commercio mondiale."}, {"t": "p", "h": "Un mondo, dunque, quello della finanza, che sarebbe tutto stato racchiuso nell’omologazione se non fosse per la permanenza nell’economia mondiale di beni che si definiscono “pubblici”. “Pubblici” non per la forma proprietaria statale, ma per una forma non diretta al profitto individuale dei medesimi, ma essenzialmente cooperativa: ovvero implica proprietà di piccoli e grandi gruppi sociali, e ne consente l’uso a tutti coloro che vogliono accedervi, seguendo regole che ne assicurano l’infinita riproducibilità. Si pensi a quella poligamia delle forme dello scambio e insieme della proprietà, descritta nella <em>Caritas in Veritate<\/em> (cooperativa, <em>not <\/em> for profit, capitalistica): si nota immediatamente, in questo fiorire di forme di condivisione nella sfera economica, l’assenza sia della proprietà collettiva di stampo mutualistico sia della negazione del profitto come indicatore della proprietà privata delle forme regolatrici e di misurazione della performance dell’impresa. E ciò accade appunto nel not for profit e nella banca cooperativa, presente in forme diversissime, certo, ma in tutto il mondo, sino a costituire con il micro credito, l’elemento consustanziale alla marcia verso migliori e sostenibili livelli di vita di milioni e milioni di persone soprattutto nell’Indopacifico e in Africa."}, {"t": "p", "h": "Ma sino a ora, nel nostro discorrere stiamo parlando delle nuvole e non delle piogge e degli uragani che da esse possono scatenarsi. Come ci ricordava Alain Greimas nel suo <em>Conditions d&#x27;une  sémiotique du monde naturel<\/em>: «Dobbiamo postulare l’esistenza della possibilità di una semiotica del mondo naturale e concepire la relazione tra i segni e i sistemi linguistici, da un lato, e i segni e i sistemi di significazione del mondo naturale, dall’altro»<sup>2<\/sup>."}, {"t": "p", "h": "Il che è come dire che tanto tuonò che piovve. Ed è pur vero, come ci ricordò il mai abbastanza compianto Giuseppe Berta nel suo indimenticabile lavoro L’ascesa della finanza internazionale, che se: «il predominio industriale-manifatturiero britannico, nonostante qualche inevitabile cedimento, sintomo di un incipiente declino relativo, e l’assenza di un’alternativa credibile dopo la sconfitta francese nella guerra franco-prussiana… (consentiva) i meccanismi di autoregolazione che gli ambienti della City di Londra seppero mettere in atto, raggiungendo livelli estremamente elevati, capaci anche di porre in essere strumenti di controllo e di intervento nei riguardi dei membri stessi della piazza finanziaria, specie quando taluni comportamenti rischiavano di essere pregiudizievoli per la stabilità dell’intero sistema»."}, {"t": "p", "h": "Nella finanza dinastica che chiameremo “britannica e dominante” operavano, infatti, di già le regole di auto-sopravvivenza che saranno poi tipiche degli “intermediari finanziari” della finanza attuale e che se potessero essere distesamente applicate limiterebbero di molto le ricorrenti crisi finanziarie a cui siamo mondialmente adusi."}, {"t": "p", "h": "Quello che fa la differenza – diversamente da quanto accadeva ai tempi della <em>Haute Finance<\/em> dove tutto si fondava sulle relazioni di fiducia interpersonali, garantite dalla riprovazione morale – sono oggi le tecnologie e le <em>capabilities<\/em> estremamente diffuse che consentirebbero di impedire le crisi, se al fianco di esse non fossero via via prevalse pratiche molto pericolose per il risparmio privato quanto rischiosamente profittevoli per i gestori delle popolazioni organizzative privatistiche che governano la circolazione delle monete simboliche."}, {"t": "p", "h": "Si tratta financo di monete non riconosciute dalle stesse banche centrali, ossia le cosiddette <em>criptovalute<\/em>, e di monete statuali diverse da quella dominante, il dollaro statunitense, che sostituì l’oro come fondamento degli scambi dopo gli accordi (imposti dagli USA) di Bretton Woods che seguirono alla sconfitta nord americana in Vietnam, nel 1975. Un grande sommovimento di nuvole cariche di tuoni e lampi e piogge allora invisibili nel cielo che fu annunciato con una straordinaria operazione di comunicazione non della finanza mondiale – che ne era la vera protagonista dietro il palcoscenico – ma per voce degli esponenti delle classi politiche autorappresentantisi come i munifici “potenti della terra”, piuttosto che come i “potenti della finanza”."}, {"t": "p", "h": "Si trattò del fatidico incontro che si svolse nel Salone dei Cinquecento, a Firenze, dove il 21 novembre 1999 si riunirono gli allora Primi Ministri delle nazioni dominanti – sotto l’egemonia anglosferica – per celebrare “Il riformismo nel XXI secolo”. Si celebrava quello che si sarebbe chiamata con una inaudita fortuna comunicativa “la globalizzazione”, ossia un mondo fondato sulla pervasività dominate della finanza nell’inveramento di un mercato che ora si voleva, appunto, “mondializzato”. La novità rispetto a quanto abbiamo sin qui detto (ed era la trasformazione sconvolgente che via via tutti accettarono senza fiatare) era l’attuazione assai rapida di un enorme complesso di norme legislative e regolamentari statuali e non statuali dirette a controllare l’attività di tutti gli intermediari finanziari: era la cosiddetta <em>governance<\/em>, che avrebbe d’ora innanzi dominato la finanza di tutto il mondo."}, {"t": "p", "h": "Gli attori ne sarebbero stati quei <em>manager<\/em> che realizzavano la cosiddetta “teoria dell’agenzia”, chiudendo la funzione di utilità tra proprietà e controllo in forma non più asimmetrica (così sostenevano i fautori delle nuove teorie neoclassiche) grazie al fatto che la loro remunerazione sarebbe avvenuta d’ora innanzi con le <em>stock options<\/em>, ossia come accadeva e accade con gli azionisti, ossia con le <em>shares<\/em>. Nel caso dei manager risultavano così autoprodotte da sé medesimi: la sanzione morale veniva sostituita dagli incentivi, con tutte le conseguenze opportunistiche che ciò comportò e comporta sempre, come è tipico della fine del mondo regolato dalla fiducia e dalla sanzione non legislativa, ma morale."}, {"t": "p", "h": "Il ché è ciò che è successo con la sostituzione del <em>managerial capitalism<\/em> con l’<em>owner capitalism<\/em> abolendo così la divisione tra proprietà e controllo e concedendo ai manager il potenziale potere illimitato che a loro dona un’asimmetria informativa che diviene sempre più grande. È questo il nuovo compito che attende tutti coloro che profondono il loro impegno di lavoro manageriale e direttivo e di studio e di ricerca nella foresta della finanza mondiale: far convivere sanzione morale tra persone regole di governo che possono oggi dotarsi e addirittura fondarsi su tecnologie di controllo sempre più sofisticate e cogente. Si apre un campo immenso di innovazioni di responsabilità personali e collettive."}, {"t": "p", "h": "Sempre più sale in me il rimpianto di non possedere più quel “divino dono della giovinezza” – come lo chiamava Goethe – per partecipare pienamente a questa impresa."}, {"t": "p", "h": "Il “classico” <em>laissez faire<\/em> di Frédéric Bastiat e compagni lascia il posto a un mondo pieno di rischi e di contrasti che nessuno aveva previsto nell’euforia borsistica e matematizzante che pervase i tempi qui evocati della grande trasformazione, nella quale siamo ancora profondamente immersi. Ed è in questo mondo che cerchiamo di essere, tutti noi, i protagonisti."}], "bio": "", "notes": [{"n": "1", "h": "«L’extraordinaire conquête du Continent par le phénomène industriel; conquête rapide, absolue, irréversible, conséquences les plus variées: conquête qui, partie des Îles Britanniques paradis de la technique — dès la fin du XVIII° siècle, envahit progressivement l&#x27;espace européen tout entier, substituant à la civilisation du passé une civilization toute nouvelle. Sans doute, un tel processus ne peut appeler une explication unique; mais, il est incontestable que la question de l&#x27;investissement se trouve placée de toutes les explications; elle était d&#x27;autant plus pressante que l&#x27;opinion commune n&#x27;attribuait pas à la Banque, dans la première phase du phénomène — celle due démarrage — un rôle moteur»."}, {"n": "2", "h": "«Il nous faut postuler l&#x27;existence de la possibilité d&#x27;une sémiotique du monde naturel et de concevoir la relation entre les signes et les systèmes linguistiques, d’une part, et les signes et les systèmes de signification du monde naturel, de l&#x27;autre»."}]}, "n7-comin": {"paras": [{"t": "p", "h": "C’era una volta il mercato. Non un semplice luogo di scambio, ma un’idea che ha attraversato i secoli: promessa di libertà e progresso, ma anche di rischio e disuguaglianza. Nelle piazze medievali era fatto di grida, contrattazioni e strette di mano. Nei secoli successivi è diventato borsa, banca, finanza globale. Oggi vive nei grafici che scorrono sugli schermi e nei codici invisibili che regolano criptovalute e algoritmi di trading. La sua forza sta nella capacità di adattarsi e reinventarsi, restando sempre al centro della vita collettiva. “Era il mercato, bellezza!”, verrebbe da dire, parafrasando la celebre battuta di Humphrey Bogart ne Il grande sonno: un’espressione ironica, ma capace di cogliere la sostanza delle nostre società."}, {"t": "p", "h": "Parlare di mercato, oggi, significa misurarsi con una realtà che va ben oltre la finanza. È l’arena in cui si intrecciano fiducia e conflitto, regole e trasgressioni, innovazione e crisi. Giulio Sapelli ci ricorda come la finanza sia stata sin dall’inizio linfa vitale della modernità: motore di crescita e di trasformazione, ma anche fonte di squilibri. Il mercato è dominato da attori che hanno un peso enorme sulle nostre vite: banche centrali che, con una decisione, spostano equilibri globali; istituzioni pubbliche che orientano gli investimenti; fondi sovrani che muovono capitali più grandi dei bilanci di molti Stati. Ma non è solo questione di grandi numeri: riguarda anche la vita quotidiana di imprese e famiglie, il credito, i mutui, la possibilità di costruire futuro."}, {"t": "p", "h": "E tra tutti i campi, l’energia è quello che più mostra come il mercato sia insieme strumento e campo di battaglia. Le guerre degli ultimi anni hanno insegnato che il prezzo del gas o del petrolio può cambiare i destini di un Paese più di qualsiasi alleanza. Le grandi scelte sulla transizione ecologica – dall’idrogeno verde al nucleare, dalle rinnovabili ai nuovi sistemi di accumulo – non sono più solo dossier tecnici, ma questioni di sovranità e di potere. Il mercato dell’energia è specchio perfetto di questo tempo: globale e interdipendente, ma fragile, attraversato da tensioni geopolitiche e da spinte tecnologiche che lo rendono insieme indispensabile e instabile."}, {"t": "p", "h": "La tecnologia aggiunge un ulteriore livello di complessità. Blockchain e criptovalute hanno aperto nuove frontiere; l’intelligenza artificiale promette di cambiare la velocità e la natura stessa delle transazioni. Ma anche qui, senza energia e senza reti resilienti, nessuna infrastruttura finanziaria digitale potrebbe esistere. L’economia virtuale resta legata a condizioni molto concrete: l’approvvigionamento di risorse, la sicurezza degli impianti, la stabilità dei sistemi elettrici."}, {"t": "p", "h": "Il mercato, tuttavia, non si esaurisce in numeri e infrastrutture. È anche cultura e immaginario. Lo vediamo quando l’arte diventa asset finanziario, quando i meme influenzano le scelte degli investitori più giovani, quando la finanza etica cerca di conciliare rendimento e responsabilità sociale. Sono segnali di un mercato che cambia linguaggi e forme, ma che resta profondamente legato alla fiducia: senza fiducia nelle istituzioni, negli Stati, nelle comunità, nessun mercato può sopravvivere."}, {"t": "p", "h": "La finanza resta quindi il termometro dei nostri tempi. Lo vediamo nei prezzi dell’energia, che oscillano seguendo decisioni geopolitiche e tensioni sui rifornimenti; nei tassi d’interesse che incidono direttamente sulla vita di famiglie e imprese; nei mercati digitali che aprono scenari tanto promettenti quanto fragili. Non c’è aspetto della vita sociale che ne resti fuori: dal costo dei beni essenziali al destino delle filiere industriali, fino agli investimenti sulla transizione ecologica. La sfida è tenere insieme crescita e coesione, senza lasciare che l’instabilità finanziaria travolga comunità e territori."}, {"t": "p", "h": "In questo senso, comprendere il mercato significa anche capire i suoi limiti. Perché non basta affidarsi alla sua presunta capacità autoregolatrice: servono istituzioni forti, politiche lungimiranti e un tessuto sociale capace di reggere gli urti. Solo così il mercato può continuare a svolgere la sua funzione originaria: favorire lo scambio, sostenere lo sviluppo, creare opportunità. Non un mito salvifico, dunque, ma uno strumento che va governato con responsabilità."}, {"t": "p", "h": "In un’epoca di policrisi, ricordare che “C’era una volta il mercato” significa riconoscere che dietro ogni cifra ci sono persone, dietro ogni algoritmo ci sono scelte politiche, dietro ogni bolletta o barile di petrolio ci sono equilibri geopolitici e ambientali. È questa la sfida di oggi: riportare il mercato alla sua dimensione autenticamente umana, fatta di limiti e possibilità, di regole e trasgressioni, di solidarietà e conflitti. Perché, come sempre, dietro la finanza non c’è solo il denaro. Ci siamo noi."}], "bio": "", "notes": []}, "n7-a1": {"paras": [{"t": "p", "h": "La banca, è un’invenzione italiana. Paolo Zannoni, nel libro <em>Moneta e promesse. Sette storie di banchieri che hanno plasmato il mondo moderno<\/em>, riscopre la genealogia della banca ed esamina la sua internazionalizzazione in oltre trecento pagine e trentadue tavole. Pisa, Venezia: prima che nascesse la Banca d’Inghilterra, prima che il congresso continentale Nord Americano creasse la prima banca “Nazionale” per combattere gli Inglesi, gli italiani avevano già inventato e strutturato il debito bancario."}, {"t": "p", "h": "Le banche sono quindi un’istituzione che è nata parlando Italiano. «Fino alla creazione della Banca d’Inghilterra, racconta Paolo Zannoni, la lingua della finanza era l’italiano, non l’inglese, il francese né il tedesco. I banchieri internazionali che finanziavano l’impero spagnolo erano italiani, perché la Spagna non aveva un forte sistema bancario autoctono». A Pisa, già nel XIV secolo, i banchieri Paranzone Grasso e Donato Del Maestro Pietro costruivano con il libro mastro della loro banca (il <em>Libro dell’a del banco di Parazone Grasso e Donato Del Maestro Pietro<\/em>) le transazioni che eseguiva la piccola compagnia di cui erano soci e creavano già moneta di Banco."}, {"t": "p", "h": "L’Inghilterra e la Germania sarebbero arrivate solo secoli dopo e, anche allora, guardando a Venezia. Lo testimoniano le lettere spedite da Federico II di Prussia nel 1753 al banchiere tedesco Hugo Streit, in cui il sovrano chiedeva che gli fosse inviato un mercante veneziano che avesse buona conoscenza del funzionamento del Banco Giro: il re voleva incontrare qualcuno che insegnasse ai propri consiglieri come trasformare in moneta il debito a breve dello Stato."}, {"t": "h", "h": "Lady Debt"}, {"t": "p", "h": "In <em>Moneta e promesse<\/em>, Paolo Zannoni nomina la sorella gemella della moneta, <em>Lady Debt<\/em>, colei al cui servizio è ogni banchiere. Sorella più minacciosa e trascurata, è lei a reggere tutto il sistema, perché senza fiducia non c’è debito, senza debito non c’è moneta e senza moneta non c’è scambio. «La moneta delle nazioni è il debito delle banche, è la loro promessa di pagare chi la riceve», spiega Paolo Zannoni. «La moneta bancaria è una promessa, la promessa delle banche ed è questa promessa che circola come valuta nazionale e non». È un processo estremamente lineare, la cui gestione può però diventare complessa. Il valore della moneta moderna non risiede in un bene materiale ma nella catena di debiti che la sostengono di promesse che si sostengono a vicenda fino a quando uno o più cedono."}, {"t": "p", "h": "Per comprendere il meccanismo, Paolo Zannoni usa l’esempio di un pagamento con carta di credito. «Quando paghiamo un acquisto con la nostra carta di credito, è il gestore della carta che promette al venditore che pagherà il prezzo pattuito. E il gestore si indebita perché noi gli abbiamo promesso che pagheremo i debiti da lui fatti per noi. La catena di debiti è una costruzione che resiste fino a quando ogni promessa viene mantenuta e fino a quando possiamo contare sull’intervento dello stato in caso di incrinature significative»."}, {"t": "p", "h": "<em>Lady Debt<\/em>, allora, è presenza costante e vitale ed è proprio lei a far girare il mondo. Anche se noi le preferiamo la gemella <em>dame credit<\/em>."}, {"t": "p", "h": "Per comprendere meglio il funzionamento della moneta, bisogna smettere di immaginarla come un oggetto e vederla come quello che è: un sistema di debiti – promesse di stati, istituzioni, cittadini, imprese, banche. <em>Moneta e  promesse<\/em> lo dimostra con rigore documentale e forza evocativa: dalle lettere di cambio medievali ai <em>ledger<\/em> di istituzioni bancarie ciò che conta non è il supporto – carta, <em>bit<\/em>, argento – ma l’ordine delle promesse e la credibilità di chi le fa. Paolo Zannoni insiste su un punto spesso ignorato: «Quando la moneta era un pezzo d’argento, non funzionava così. Ma i debiti scritti sul libro mastro dei banchieri e la circolazione dei <em>bill of exchange<\/em>, delle lettere di cambio, col tempo sono diventate la valuta (<em>currency<\/em>) delle nazioni. La vera moneta non è un pezzo di metallo. È il debito creato dalle annotazioni sui libri mastri dei banchieri come quelli custoditi nella Pisa del Trecento o nella Rialto della Serenissima. I Debiti delle banche sono <em>currency<\/em>, che in inglese è una parola molto precisa»."}, {"t": "p", "h": "È un errore considerare la moneta come un affare tecnico, un prodotto della matematica finanziaria. La moneta moderna nasce dalla collaborazione tra lo Stato e il sistema bancario. «La moneta di ogni Stato è il debito del suo sistema bancario» spiega Zannoni. «È un patto tra due grandi istituzioni: da un lato lo Stato sovrano, dall’altro il sistema bancario. E la banca centrale è il link, l’anello che li connette». Questo legame produce benefici, ma anche vulnerabilità. La società, racconta Paolo Zannoni, «è insieme beneficiaria e vittima potenziale» di questo accordo."}, {"t": "p", "h": "Le banche, in questo schema, sono le officine dove il debito – pubblico e privato – si trasforma in moneta. E quando il sistema vacilla, lo Stato interviene. Ma cosa succede quando la successione di promesse cliente-banca-Stato su cui si fonda la moneta non arriva più da una banca? Quando a creare ed emettere moneta non sono banca e stato ma un algoritmo? È qui che si apre il grande spartiacque tra valute tradizionali e criptovalute, tra debiti e creazione attraverso un <em>mining<\/em> decentrato. Paolo Zannoni, chiarisce con precisione la distanza tra i due mondi. «La criptovaluta è creata da formule e algoritmi, e viene validata da transazioni. Per ora Stato e banche c’entrano poco o nulla». Per questo la criptovaluta è moneta ma non <em>national currency<\/em> ancora. Il cuore del cambiamento è tutto qui: non c’è più un soggetto centrale che promette di onorare un debito, ma una rete che crea e certifica ogni transazione."}, {"t": "h", "h": "Crisi bancarie e fiducia eterna"}, {"t": "p", "h": "Se la moneta è una successione di promesse ogni crisi bancaria è un momento in cui questo sistema vacilla. Ma una delle tesi più forti di <em>Moneta e  promesse<\/em> è che queste crisi, per quanto gravi, non sono mai riuscite a distruggere la moneta come debito delle banche. Le crisi bancarie, sono ricorrenti, la moneta bancaria entra in crisi. Ma poi – più o meno lentamente – rinasce più forte di prima; fino alla prossima crisi. Perché quando le promesse delle banche vacillano serve un atto sovrano per puntellarle. E questi atti sovrani non sono mai stati negati."}], "bio": "<strong>Paolo Zannoni<\/strong> è Vicepresidente Vicario del Consiglio di Amministrazione e Amministratore Esecutivo di Prada Group e advisor internazionale per Goldman Sachs. Partner di Goldman Sachs per oltre vent’anni, è stato presidente di Prysmian, Autogrill e Fiat USA. Presso la Yale University, è membro dell’Advisory Board dell’International Center for Finance e del Jackson Institute. Si è formato nelle università di Bologna, Firenze (con Giovanni Sartori) e Yale. <em>Moneta e promesse.  Sette storie di banchieri che hanno  plasmato il mondo moderno<\/em> (Rizzoli, 2024) è il suo primo libro.", "notes": []}, "n7-a2": {"paras": [{"t": "p", "h": "Nell’Europa ridisegnata dal Congresso di Vienna, il primo ministro francese il duca di Richelieu esclamava che sul continente erano sei le potenze che mantenevano l’equilibrio politico: «Gran Bretagna, Prussia, Francia, Austria, Russia, e Baring». Aldilà dell’autenticità della citazione, essa evidenzia bene come una banca privata fosse considerata non solo un attore economico ma un vero protagonista anche della diplomazia internazionale. Al pari di Baring solo Rothschild, con succursali dirette da membri della famiglia ma autonome tra di loro, istituite a Francoforte, Vienna, Parigi, Londra e Napoli, poteva competere nel ruolo di banca privata e intimo consigliere delle principali potenze europee. Oltre a dedicarsi a speculazioni su materie prime e investimenti commerciali, Baring and Rothschild divennero le principali banche nel gestire le emissioni obbligazionarie delle principali potenze europee."}, {"t": "p", "h": "Nel corso del diciannovesimo secolo la crescita economica nei Paesi europei e in Canada e Stati Uniti andò di pari passo con la crescita del numero degli attori bancari con l’eccezione del Regno Unito, dove fino al 1826 nessuna banca con più di sei partner poteva operare nell’area di 65 miglia da Londra. Con il crescere della domanda di capitali, dovuta allo sviluppo industriale, si affermano in tutta Europa banche commerciali ad azionariato diffuso. Lo sviluppo industriale in settori bisognosi di importanti riserve di capitali – come le ferrovie, le compagnie d’estrazione mineraria, o più in generale i settori ad alto tasso tecnologico dell’industria pesante – resero sempre più centrali le banche commerciali chiamate ad investire i loro capitali nei nuovi settori industriali. Legandosi strettamente ai settori industriali avanzati, le banche commerciali risentirono grandemente del rallentamento della produzione che spesso generava episodi di crisi finanziarie sistemiche."}, {"t": "p", "h": "Il diciannovesimo secolo è costellato di crisi finanziarie come quella del 1825, 1847, 1857, 1873 and 1893 nelle quali investimenti in Paesi emergenti, come nell’America del Sud, e rallentamenti della crescita economica, dopo un periodo di rapido sviluppo economico, terminavano in rovinosi crolli dei mercati azionari."}, {"t": "p", "h": "Alla vigilia del primo conflitto mondiale la Gran Bretagna era di gran lunga il primo Paese al mondo per investimenti all’estero e la piazza di Londra era il mercato finanziario più importante al mondo. La maggior parte degli investimenti britannici si riversava nei Paesi dell’impero e nel continente americano mentre gli investitori francesi, come i loro vicini tedeschi, privilegiavano l’Europa, inclusa la Russia, e il vicino Oriente. Negli Stati Uniti invece predominava la tendenza ad investire nell’America Latina ed in Europa. Benché Stati Uniti e Germania avessero sopravanzato la Gran Bretagna nella produzione industriale, Londra rimaneva la prima borsa mondiale per importanza grazie alla centralità della City nel sistema dei pagamenti internazionali e della concentrazione di servizi finanziari. Il dominio della City era anche reso possibile dal ruolo della sterlina come valuta di riserva internazionale grazie ad una bilancia commerciale favorevole. Il ruolo centrale della City, la sterlina come valuta di riserva e scambio internazionale costituiscono le principali caratteristiche del primo regime monetario aureo. La grave crisi degli anni Venti, caratterizzata dal susseguirsi di un boom legato alla ricostruzione per poi finire in un nuovo crash, mise fine al dominio della sterlina e al sistema aureo. Inoltre una serie di collassi finanziari come il fallimento della banca austriaca Creditanstalt (1931) seguita poi dal crollo della tedesca Danat aggravarono la crisi economica europea. Mentre negli Stati Uniti oltre il 40% delle banche fallirono nel corso degli anni Trenta, in Paesi dove le banche potevano sviluppare filiali in diverse aree – come il Canada o l’Australia – il propagarsi della crisi ebbe effetti minori."}, {"t": "p", "h": "La Grande Depressione e le crisi bancarie negli Stati Uniti e nell’Europa continentale portarono ad un nuovo rapporto tra politica e finanza dove lo stato introdusse vincoli più stringenti alle attività bancarie distinguendo la divisione tra attività bancarie commerciali da quelle di investimento. Questo principio era alla base del <em>Glass Steagall Act<\/em> negli Stati Uniti ma nuovi limiti alle attività bancarie erano al centro di numerose leggi bancarie che vennero approvate tra il 1930 e il 1940 (1934 leggi bancarie in Germania e Svizzera, 1936 nazionalizzazione della <em>Banque de France<\/em>, 1936 legge bancaria in Italia). Inoltre la Grande Depressione pose fine al dominio della sterlina come moneta di riserva di riferimento e l’abbandono della convertibilità in oro della sterlina nel 1931 segnò la fine del dominio di Londra come piazza finanziaria di riferimento."}, {"t": "p", "h": "Il nuovo ordinamento monetario internazionale prende forma nel 1944 alla conferenza di Bretton Woods. In quell’occasione il dollaro prende ufficialmente il posto della sterlina come valuta di riserva mondiale garantendo la sua convertibilità in oro. Il sistema di Bretton Woods resse fino allo shock petrolifero del 1973 e con la conseguente fine della convertibilità in oro del dollaro. Questo periodo segna una maggiore presenza dello stato nel condurre vari settori strategici dell’economia imponendo vincoli più stringenti all’attività bancaria. Per un quarto di secolo le banche di quasi tutto il mondo operano in uno scenario dove i tassi d’interesse rimangono strettamente controllati e le banche non sono libere di investire in qualsiasi asset. In queste condizioni, se si esclude il fallimento di Herstatt bank nel 1974, il panorama bancario era particolarmente immune da crisi finanziarie."}, {"t": "p", "h": "Gli anni Settanta però si caratterizzano per un serio rallentamento della crescita del prodotto interno lordo delle principali nazioni che devono anche fronteggiare un aumento dell’inflazione in quel fenomeno passato alla storia al nome di stagflation. Di fronte a queste condizioni le banche statunitensi, così come quelle europee e giapponesi, decidono di aggirare i vincoli sui tassi d’interesse (la cosiddetta <em>Regulation Q<\/em> che impediva alle banche americane di pagare interessi su conti correnti e limitava tassi di interesse su certificati di deposito) attraverso il mercato degli Eurobond. Questo mercato consisteva in depositi e prestiti in dollari ma al di fuori degli Stati Uniti e in quanto tali non soggetti alle leggi americane che limitavano interessi su conti bancari. Attraverso questo escamotage anche il flusso di petrodollari poteva trovare nuovi utilizzi come finanziamenti diretti o indiretti a Paesi in via di sviluppo. Il mercato degli Eurodollari passò da $4 miliardi nel 1962 a £216 miliardi nel 1973. L’espansione del mercato degli Eurobond non rimase senza conseguenze: la grande crisi del debito internazionale del 1982, che colpì in modo profondo Paesi come Messico, Brasile ma anche Paesi dell’Africa come Nigeria e Ghana, era la diretta conseguenza degli investimenti eccessivi attraverso le grandi banche commerciali dei fondi in dollari fuori dagli Stati Uniti e del rialzo dei tassi di interesse voluti dalla Fed guidata da Paul Volcker. La crisi internazionale del debito continuò per tutti gli anni Ottanta caratterizzati anche dalla crisi endemica dei Savings &amp; Loans che costrinsero il governo federale al più grande intervento dai tempi della Grande Depressione. Le spinte alla deregolamentazione si diffusero in tutto il mondo dando il via ad una concorrenza tra istituti bancari liberi di assumere nuovi rischi rispetto al periodo del secondo dopoguerra. L’esposizione a maggiori rischi convinse le banche dei Paesi appartenenti al G10 a dotarsi di criteri riguardanti il capitale e le riserve che ogni istituto bancario doveva mantenere. Nasceva così il primo accordo di Basilea nel 1988 nel quale il capitale delle banche veniva diviso in due livelli (<em>core<\/em> e <em>tier two<\/em>) e ogni asset aveva un rischio assegnato: dai meno a rischio (cash e obbligazioni di stato) ai più a rischio (mutui e obbligazioni di Paesi in via di sviluppo). Tale regolamentazione sarebbe poi stata rivista nel 2004 apportando nuove modifiche."}, {"t": "p", "h": "Fiumi di inchiostro sono stati versati sulla crisi del 2007-2008 e sulle responsabilità delle autorità politiche – democratici e repubblicani – per aver allentato la legislazione bancaria e aver favorito l’accesso ai mutui a fasce della popolazione che non potevano in alcun modo restituire il finanziamento ricevuto. Allo stesso tempo, figure di CEO e Chairman finirono sotto i riflettori per i loro anni di guida di istituzioni che avevano ignorato i rischi sempre maggiori ai quali avevano esposto le istituzioni finanziarie. Infine, la crisi aveva messo in luce quanto i paradigmi sia del shareholder value che della razionalità del mercato fossero letture parziali destinate a sprigionare una forza distruttrice ben aldilà del mondo della finanza. Così torna particolarmente attuale la lezione di Karl Polanyi sul radicamento delle élites finanziarie nelle società in cui operano. La crisi del 2007-2008 ha messo in dubbio la sostenibilità dello sviluppo tumultuoso della finanza sotto le sembianze proteiformi della cartolarizzazione. La caduta di Lehman Brothers e la contrazione dell’economia globale hanno mostrato la fragilità dell’illusione di una finanza che massimizzava utili in nome della razionalità dei mercati, come unico motore per lo sviluppo delle nazioni."}, {"t": "p", "h": "A quasi vent’anni da quella crisi, dopo che altre scosse hanno mandato segnali preoccupanti come Silicon Valley Bank e Crédit Suisse, sembra che quella crisi abbia lasciato in eredità migliori sistemi per controllare crisi di attori finanziari di prima importanza o attori regionali. Questo non toglie che un’altra crisi possa sorgere da un uso esteso di alcune innovazioni tecnologiche applicate alla finanza (<em>stablecoin<\/em>) oppure dalla fine dell’egemonia di una valuta come il dollaro. Se è difficile prevedere da dove verrà la prossima crisi finanziaria, sarebbe utile far memoria di quelle passate non per imparare passate soluzioni da applicare a nuovi problemi ma per cercare di mettere in discussione quale ruolo debba avere la finanza nelle nostre società permeate dalla complessità ma al tempo stesso incapaci di una visione di insieme che non limiti l’orizzonte della finanza all’esclusiva rendita finanziaria."}], "bio": "<strong>Niccolò Valmori<\/strong> è ricercatore presso il Robert Schuman Center, Istituto Universitario Europeo, e il Dipartimento di Storia Economica della London School of Economics dove ha insegnato “History of Banking systems”. Dopo il dottorato ottenuto all’Istituto Universitario Europeo ha ricoperto incarichi di insegnamento e ricerca presso numerosi istituti internazionali tra i quali l’Institut d’Études politiques, l’École des Hautes Études en Sciences Sociales, Stanford University, University of Pennsylvania e King’s College, Londra. Tra i suoi interessi principali l’evoluzione storica dei rapporti tra finanza e politica, oggetto del suo libro <em>Banking and Politics in the Age  of Democratic Revolution<\/em> (Liverpool University Press, 2023).", "notes": []}, "n7-a3": {"paras": [{"t": "p", "h": "I mercati lo sanno. Basta una frase, una sfumatura, una pausa fuori posto, e tutto può cambiare: il costo del denaro, il valore dei titoli, la solidità del debito sovrano. Le banche centrali sono diventate il nuovo centro di gravità del potere economico, più ascoltate di qualsiasi governo, più influenti di molti parlamenti."}, {"t": "p", "h": "Non è una novità che le loro parole muovano lo scenario economico. Ma negli ultimi decenni, qualcosa è cambiato. Il loro ruolo si è allargato, fino a uscire dai confini usuali. Da garanti silenziosi e quasi invisibili della stabilità monetaria e della disciplina fiscale, le banche centrali si sono trasformate in attori centrali dei mercati finanziari. L’economia, che un tempo percorreva la sua strada in parallelo, oggi insegue. Il cambio di paradigma comincia in particolare con la crisi del 2008 e continua con quelle degli anni successivi, dalla pandemia all’inflazione globale, sino alle guerre (commerciali e non) dei nostri giorni. Emergenza dopo emergenza, le banche centrali sono scese in campo con nuovi strumenti, non più solo per arbitrare, ma talvolta per riscrivere le regole."}, {"t": "p", "h": "In Europa, la svolta ha una data: 26 luglio 2012, quando Mario Draghi pronunciò il celebre <em>Whatever it takes<\/em>. In quel momento la Banca centrale europea ha smesso di essere solo un guardiano della moneta. È diventata uno scudo politico, un attore di salvezza sistemica. Da allora il confine tra tecnocrazia e governo si è fatto sempre più labile. Dall’altra parte dell’Atlantico, con l’uso del <em>quantitative easing<\/em> e il sostegno massiccio al debito sovrano, la Fed ha mostrato e continua a dimostrare in modo ancora più evidente il suo ruolo da regista sul palco finanziario, capace di influenzare direttamente la liquidità e i prezzi degli asset."}, {"t": "p", "h": "Ma questo nuovo protagonismo ha un prezzo. L’equilibrio tra indipendenza, legittimazione democratica e politiche economiche è sempre più fragile. La fiducia pubblica, pilastro imprescindibile per la stabilità economica, rischia di vacillare in un contesto in cui il potere tecnico si fa sempre più centrale e meno soggetto a controllo democratico. Se le banche centrali sono chiamate sempre più spesso a rispondere a crisi sistemiche, allora è inevitabile chiedersi quali siano oggi i veri confini del loro mandato, e a chi spettino le scelte più politiche in materia economica. Quanto possono (e devono) essere autonome rispetto al potere politico? E quanto sono diventate, di fatto, arbitri di una nuova stagione economica e sociale?"}, {"t": "p", "h": "«Ormai la finanza sta sopra, sotto c’è l’economia e sotto ancora tutti quanti noi». Sintetizza così Roberto Sommella, direttore di <em>Milano Finanza<\/em>, che questo sistema lo racconta ogni giorno. Per capire come siamo arrivati sin qui – e cosa ci aspetta – abbiamo analizzato con lui la trasformazione delle istituzioni monetarie nel contesto delle grandi dinamiche geopolitiche e delle sfide interne dell’Europa."}, {"t": "q", "h": "Come ha avuto inizio la trasformazione delle banche centrali da arbitri a protagonisti dei mercati?"}, {"t": "p", "h": "Per quanto riguarda la Bce, c’è una data precisa di questo cambiamento: 26 luglio 2012. In quel giorno, in piena tempesta finanziaria che aveva colpito l’euro, Mario Draghi, presidente della Bce, pronunciò la frase più famosa e importante che possa pronunciare un banchiere centrale o un capo di stato. Egli e la sua istituzione avrebbero messo in campo tutte le misure necessarie (<em>whatever it takes<\/em>) per evitare la disintegrazione. Ed esse sarebbero state sufficienti. Una frase diventata celebre, da stampare sulla carta moneta e chissà che non sto dando un’idea alla banca centrale europea, e soprattutto che anticipò un corposo acquisto di titoli di stato. Da quel momento il mandato della Bce cambiò, a dispetto del suo statuto e dei tedeschi, trasformando la sua missione da tutore della massa monetaria e del livello di inflazione a tutore della moneta stessa. Da allora, e da quel bazooka, sono passati molti anni ed ora l’Eurotower è tornata alla sua missione originaria perché nel frattempo a stampare denaro ci ha pensato la Commissione Europea col debito comune post-covid del Next Generation Eu. Anche quelli, altri tempi."}, {"t": "q", "h": "Quali sono oggi gli strumenti attraverso cui le banche centrali agiscono sui mercati finanziari?"}, {"t": "p", "h": "Per la Bce quanto detto sopra, la possibilità, in modo diverso rispetto al 2012, di intervenire nel mercato secondario dei titoli di stato, comprandoli. Per le altre banche centrali, come la Federal Reserve americana, che ha mantenuto stretto il rapporto col Tesoro americano, poco è cambiato perché i titoli li compra direttamente al mercato primario. Tra Fed e Bce c’è la stessa differenza che passa tra un concessionario di auto nuove (la Fed) e di auto usate (la Bce). Servono soldi? Negli Stati Uniti li emettono, li stampano (il Tesoro) e qualcuno li compra (la Fed). Proprio come i soldi che vanno alla casa automobilistica quando compri un’auto nuova. Nel caso europeo i soldi vanno ai possessori dell’auto usata, cioè coloro i cui titoli già emessi sono stati comprati dalla banca centrale."}, {"t": "q", "h": "Quali sono le principali distorsioni generate dalla centralità delle banche centrali sui mercati?"}, {"t": "p", "h": "Non parlerei oggi di centralità. Donald Trump alla Casa Bianca ha riportato le leve della politica monetaria nel suo Studio Ovale, o almeno ci sta provando, perché ha ben presente che non c’è atto politico più importante, perché decide del costo della vita per famiglie e imprese, di aumentare o abbassare i tassi di interesse. Saranno tempi difficili per le banche centrali e per la loro autonomia, anche in Europa, stretta tra guerre, dazi e spinte nazionaliste in continua evoluzione."}, {"t": "q", "h": "È possibile parlare di indipendenza delle banche centrali rispetto alla politica, oppure l’intreccio con le decisioni dei governi e le pressioni dei mercati ha ormai reso questo concetto sempre più relativo?"}, {"t": "p", "h": "Questa domanda si lega alla risposta precedente. Nella misura in cui una banca centrale non si fa condizionare dal presidente di turno, sarà più o meno indipendente nel decidere il costo del denaro."}, {"t": "q", "h": "Quali conseguenze ha avuto per Paesi come l’Italia il ruolo più politico assunto dalla BCE?"}, {"t": "p", "h": "All’inizio negativo, perché nel 2011-2012 passò l’idea che la Bce era intervenuta per salvare il debito italiano e un po’ era vero. Oggi le cose sono cambiate il nostro debito continua ad essere sostenibile (lo era per la verità anche con Silvio Berlusconi al governo) e addirittura oggi paga interessi inferiori agli Stati Uniti, un risultato straordinario per il nostro Paese conseguito dal governo Meloni con Giancarlo Giorgetti al Ministero dell’Economia."}, {"t": "q", "h": "Quanto conta oggi la Banca d’Italia? Ha ancora un ruolo o è subordinata alla logica comunitaria?"}, {"t": "p", "h": "La Banca d’Italia conta meno di un tempo perché non decide più la cosa che conta maggiormente, il livello del costo del denaro, in quanto con l’euro questo potere è passato alla Bce, come la vigilanza bancaria sugli istituti sistemici di grandi dimensioni. Ma conta ancora molto per la sua storia, indipendenza e affidabilità nel perseguire la stabilità di tutto il sistema bancario. Ivi compresa l’analisi delle tante offerte pubbliche di scambio nel settore del credito italiano. Nessun governo può fare a meno di questa istituzione indipendente."}, {"t": "q", "h": "Quali sono i rischi se le banche centrali continueranno a operare come attori diretti nei mercati?"}, {"t": "p", "h": "Gli attori del mercato devono essere appunto gli attori, società, risparmiatori, grandi fondi. Le banche centrali sono i registi dello spettacolo e la finanza un ponte tra l’oggi e il domani."}], "bio": "<strong>Roberto Sommella<\/strong> è un giornalista e scrittore, cittadino onorario di Ventotene e Cavaliere della Repubblica. Esperto di tematiche Antitrust e del mercato unico, è Direttore di MF-Milano Finanza e del sito milanofinanza.it. Nel 2021 ha vinto il Premio Agnes per il giornalismo economico, nel 2025 gli è stato conferito dall’Ordine dei Giornalisti il premio “Un Giglio Bianco per la pace e la libertà di stampa”. È stato componente per l’Italia della Conferenza sull’Europa e siede nel Comitato tecnico per lo studio dell’Intelligenza Artificiale presso il Dipartimento Editoria. È Presidente dell’associazione “La Nuova Europa” e docente presso l’Università Politecnica delle Marche, ha tenuto seminari presso l’Università Luiss e l’Università Roma Tre. Ha scritto per <em>Corriere della Sera<\/em>, <em>Europa<\/em>, <em>HuffPost Italia<\/em>, <em>Avvenire<\/em>, curando rubriche su Radio Radicale e lanuovaeuropa.it. Il suo ultimo libro è <em>Al verde, manifesto  dei tempi moderni<\/em> (Rubbettino, 2025).", "notes": []}, "n7-ep43": {"epigraph": "Se il denaro è il legame che mi unisce alla vita umana, alla società, alla natura e agli uomini, non è esso il legame dei legami? Non può esso sciogliere\ne stringere tutti i legami? E non è perciò anche il mezzo generale di separazione? Esso è la vera moneta divisionale, come anche il vero legamento, la\nforza galvano-chimica della società.\n[...]\nIl denaro trasforma i miei desideri-rappresentazioni, traduce la loro esistenza pensata, rappresentata, voluta, nella loro esistenza sensibile, reale,\nla rappresentazione in vita, l’essere rappresentato nell'essere reale. In quanto è questa mediazione, esso è forza veramente creatrice."}, "n7-ep75": {"epigraph": "Dicono ancora che la povertà grande fa gli uomini vili, astuti, ladri, insidiosi, fuorasciti, bugiardi, testimoni falsi; e le ricchezze insolenti, superbi,\nignoranti, traditori, disamorati, presumitori di quel che non sanno. Però la\ncommunità tutti li fa ricchi e poveri: ricchi, ch'ogni cosa hanno e possedono;\npoveri, perché non s'attaccano a servire alle cose, ma ogni cosa serve a loro.\nE molto laudano in questo le religioni della cristianità e la vita dell'Apostoli."}, "n7-ep89": {"epigraph": "Risi fra me stesso alla vista di questo danaro, e ad alta voce esclamai: “Robaccia, a che cosa sei buona? Tu non mi giovi a nulla, al gran nulla! non\ncompensi l'incomodo di levarti da terra; un di questi coltelli val più di tutto\nquesto tuo mucchio. Di te non saprei in che modo servirmi; dunque resta\ndove sei, ed affondati co' resti del vascello; tu non sei tal creatura, che meriti\nle sia salvata la vita”. Nondimeno dopo una seconda riflessione la presi tutta\nquesta robaccia, e l'avvolsi entro un pezzo di tela da vele."}, "n6-sapelli": {"paras": [{"t": "p", "h": "Il lavoro analitico e creativo raccolto in questo numero di COMPRENDERE rende manifesto uno sforzo corale della redazione della rivista per promuovere una sorta di necessaria e sempre più urgente “razionalizzazione” della questione nucleare. Un tema che si pone nel frastagliato mondo, tanto delle relazioni internazionali, quanto delle angosce collettive odierne in ogni latitudine e longitudine. Ogni tentativo di sottrarre un tema misterioso alla superficialità di sguardi approssimativi e terrificanti conduce sempre all’agnizione. Per quanto mutevole nel profondo psichico, esso determina il sorgere e il risorgere d’interminabili percorsi angosciosi, che l’intellettuale deve seguire e arginare."}, {"t": "p", "h": "<em>Comprendere<\/em> compie, come si annuncia sempiternamente nel Suo titolo (perché comprendere è ben diverso da conoscere) anche con questo numero un’operazione culturalmente complessa e poliedrica. Intende offrire una visione a tutto tondo della questione nucleare e riportarla alla sua origine: la storia dell’Ingegno umano individuale e collettivo. Gli usi civili eccezionali derivanti dall’atomo ne sono una dimostrazione e relegano l’elemento militare, troppo spesso evocato, così come quello energetico, non sempre percepito nella sua forma più benefica. Piuttosto che relegarli ai margini, il tentativo è di collocarli nel loro giusto contesto, consentendo un approccio guidato dalla ragione, anziché offuscato dall’angoscia."}, {"t": "p", "h": "Ma veniamo al tema del nucleare e della pace e della guerra, che è ora emerso potentemente alla ribalta di questi anni."}, {"t": "p", "h": "Raymond Aron – un maestro che mai come in questi tempi mi appare vicino e consolatore e stimolatore di sempre nuove fatiche, il cui lascito è duplice per un paradosso caratteristico, come accade per quel pensiero allo stesso tempo audace e modesto che è proprio dei Grandi – ambiva a presentare una teoria generale delle relazioni internazionali, in cui la questione della minaccia e della deterrenza termonucleare non poteva essere ignorata. Nella pluralità dei centri decisionali con cui la questione via via si manifestava, la “bomba atomica” diventava per Raymond Aron il punto di partenza di un percorso analitico che lo portò a definire le “sei questioni fondamentali per lo studio delle costellazioni diplomatiche”. Tra queste, le questioni oggettive: determinazione del campo, configurazione dei rapporti di forza in questo campo, tecnica della guerra."}, {"t": "p", "h": "Le questioni soggettive o “ideologico-politiche” riguardano il reciproco riconoscimento – o la sua assenza – tra le unità di guerra, i rapporti tra politica interna ed estera, e il significato e finalità di quest&#x27;ultima."}, {"t": "p", "h": "In terzo luogo, l’analisi dei sistemi internazionali – intesi come gruppi organizzati in base alla competizione tra le loro unità – porta alla distinzione tra sistemi pluripolari e bipolari. La specificità delle relazioni internazionali e la differenza fondamentale tra politica estera e politica interna, tra il modello ideale di condotta diplomatico-strategica e quello di condotta civica, costituivano il punto di forza di una analisi distintiva che dovremmo continuare ad usare anche oggi. In questo costrutto analitico, esiste una chiara differenza tra la “politica del potere” in un contesto dominato dal rischio del ricorso alla forza da parte tra unità concorrenti, e l’uso del potere coercitivo da parte dello Stato all’interno di una comunità, dove ne detiene il monopolio. Una differenza che altro non è che quella tra i conflitti e le tensioni interstatali – come le guerre – e l’impiego della forza all’interno dello Stato che, seguendo la sempiterna stella polare di Clausewitz, altro non è che l’insieme delle violenze politiche tra gruppi intra-statuali."}, {"t": "p", "h": "Ciò che rende straordinariamente utile l’insegnamento di Aron in questi tempi di rapido mutamento tecnologico – in cui la natura dell’arma atomica, tra fusione e fissione, e il suo impiego per scopi civili diventano sempre più urgenti – è il realismo calmo, avvolgente e rassicurante, contenuta nella sua analisi."}, {"t": "p", "h": "Prima ancora di Clausewitz, il maestro di Aron è Tucidide, che impone di immergere sempre la teoria nella storia: i sistemi sono per loro natura indefiniti, tanto nelle dimensioni teoriche quanto in quelle belliche e materiali. Da qui emerge una sociologia storica dei sistemi internazionali che può divenire anche sociologia storica dei sistemi antropologici viventi e delle angosce che questi determinano."}, {"t": "p", "h": "Le origini e le dinamiche della prima guerra mondiale, studiate non solo da Aron ma, più di recente, con grande finezza dal grande storico australiano Sir Christopher Munro Clark in <em>The Sleepwalkers: How Europe Went to War in 1914<\/em><sup>1<\/sup> mostrano come nella maggioranza dei casi i conflitti divampino con forza inaspettata a causa di un fallimento diplomatico o di una sorpresa tecnica. Eventi che, sebbene possano sembrare fortuiti, si combinarono per generare catastrofi indesiderate, dando luogo a vere e proprie “guerre iperboliche” del tutto impreviste."}, {"t": "p", "h": "Un tema di straordinaria attualità."}, {"t": "p", "h": "Anche la deterrenza nucleare, dunque, non è una scienza esatta. Non solo perché, secondo la concezione clausewitziana della guerra, la volontà gioca un ruolo determinante, ma soprattutto perché, come si è osservato, «è impossibile, eliminare un pericolo senza aumentarne un altro»."}, {"t": "p", "h": "La minaccia suprema è, in teoria, altamente dissuasiva ma nella pratica poco credibile, poiché implica un esito suicida. Al contrario, la minaccia anti-forza – resa ancor più efficace dalla recente rivoluzione nella precisione – è molto più credibile, ma meno deterrente. Se si tenta di rafforzarne l’efficacia dissuasiva, si finisce per aumentare il rischio di escalation, la versione nucleare di quella che Clausewitz chiamava l’ascesa agli estremi. Ciò avviene introducendo, accanto alle armi strategiche, le armi nucleari tattiche, oggi al centro dell’attenzione mediatica, ma con una volontà applicativa pressoché inesistente."}, {"t": "p", "h": "Ecco che emerge un’antinomia: tutto ciò che aumenta la probabilità dell’escalation rafforza la deterrenza ma, al tempo stesso, rende più difficile limitare un conflitto, qualora dovesse scoppiare. Più la deterrenza gioca un ruolo a livello globale, più si rafforza la stabilità al livello superiore; e tuttavia, minore è la stabilità ai livelli inferiori, meno i Grandi saranno tentati di ricorrere all’arma suprema, sentendosi liberi di usare le armi convenzionali, come bene dimostrano le proliferanti guerre di oggi."}, {"t": "p", "h": "Così continuiamo a placare i nostri terrori di un conflitto nucleare combattendo guerre convenzionali. Pare non vi sia scelta."}, {"t": "p", "h": "Non resta allora che concentrare sempre di più la nostra attenzione su ciò che ci allontana dalla guerra: il nucleare energetico e le sue applicazioni mediche e il suo immenso e misterioso potenziale computazionale, che spalanca prospettive infinite."}, {"t": "p", "h": "Aspettando Godot."}, {"t": "p", "h": "<em>VLADIMIRO: Quando ci penso... mi domando... come saresti finito...  senza di me... in tutto questo tempo... (Recisamente) Non saresti altro  che un mucchietto d’ossa, oggi come oggi; ci scommetterei. <\/em>"}, {"t": "p", "h": "<em>ESTRAGONE: (punto sul vivo) E con questo? <\/em>"}, {"t": "p", "h": "<em>VLADIMIRO: (stancamente) È troppo per un uomo solo. (Pausa. <\/em>"}, {"t": "p", "h": "<em>Vivacemente) D’altra parte, a che serve scoraggiarsi adesso, dico io.  Bisognava pensarci secoli fa, verso il 1900. <\/em>"}, {"t": "p", "h": "<em>ESTRAGONE: Piantala. Aiutami a togliere questa schifezza.<\/em>"}, {"t": "p", "h": "<em>VLADIMIRO: Tenendoci per mano, saremmo stati tra i primi a buttarci giù dalla Torre Eiffel. Eravamo in gamba, allora. Adesso è troppo  tardi. Non ci lascerebbero nemmeno salire. (Estragone si accanisce  sulla scarpa). Ma cosa fai? <\/em>"}, {"t": "p", "h": "<em>ESTRAGONE: Mi tolgo le scarpe. Non t’è mai capitato, a te? <\/em>"}, {"t": "p", "h": "<em>VLADIMIRO: Quante volte t’ho detto che bisogna levarsele tutti i  giorni! Dovresti darmi retta. <\/em>"}, {"t": "p", "h": "<em>ESTRAGONE: (debolmente) Aiutami! <\/em>"}, {"t": "p", "h": "<em>VLADIMIRO: Hai male?<\/em>"}, {"t": "a", "h": "Samuel Beckett,<em> Aspettando Godot<\/em>, Atto I"}], "bio": "", "notes": [{"n": "1", "h": "Sir Christopher Munro Clark, <em>The Sleepwalkers: How  Europe Went to War in 1914<\/em>, London: Allen Lane, 2012."}]}, "n6-alfonso": {"paras": [{"t": "p", "h": "Cosa c’entra parlare di vinili in un numero di “Comprendere” dedicato all’energia nucleare? Seguitemi, solco dopo solco, in questa traccia un po’ datata, ma che va oltre – spero – l’autobiografia."}, {"t": "p", "h": "Anno 1979, al Madison Square Garden di New York va in scena una delle molte tappe di un tour musicale anomalo, in un crescendo di partecipazione. Quelle serate tra il 19 e il 22 settembre diventeranno un disco tra i più iconici – e belli, va detto – del panorama “impegnato” dell’epoca, dal titolo esplicito: “No Nukes”."}, {"t": "p", "h": "Per me, allora diciassettenne, ascoltare gli appelli in parole e musica di Jackson Browne, Crosby Still Nash e Young, i Doobie Brothers e altre decine di star della West Coast e del rock a stelle e strisce schierate contro una paura che affondava le sue radici negli anni bui della seconda guerra mondiale e degli esperimenti atomici negli atolli del Pacifico era un modo per manifestare, per schierarmi. Anche perché quella paura era tornata prepotentemente davanti agli occhi del mondo solo pochi mesi prima e proprio negli Stati Uniti, a Three Mile Island, con una fuga radioattiva imparagonabilmente più limitata rispetto a quella che avrebbe poi colpito Chernobyl, ma in grado comunque di smuovere una grande ondata emotiva. E il fatto che partisse proprio da oltreoceano, punto di riferimento quasi obbligato – in un’epoca ancora non globalizzata dalle reti digitali – per i giovani di tutto il mondo, ne aumentava e alimentava la portata."}, {"t": "p", "h": "Mentre scrivo, ascolto in sottofondo quei brani, dai titoli espliciti e con un accompagnamento, tipico delle registrazioni live, di applausi e grida. Sembrano anni lontani, e non solo anagraficamente, se messi a confronto con la possibilità di immaginare oggi un’energia nucleare pienamente sicura e in grado di liberarci dal gioco senza futuro dello sfruttamento fossile e la fragilità sostenibile delle varie alternative. Ma eravamo solo giovani e sognatori, allora? No, non credo. La ricerca, all’epoca, non aveva ancora saputo garantire quella nuova generazione di energia nucleare che oggi sembra a portata di mano, in pochi anni. Ed era naturale che il futuro lo immaginassimo in modo tranchant, senza sfumature possibilistiche."}, {"t": "p", "h": "La puntina di diamante che, solco dopo solco, passa da “Plutonium is forever” a “Before the deluge”, fino a “Teach your children” accompagna un altro ricordo di un paio di anni dopo, il tentativo fallito – da parte dei Radicali – di raccogliere le firme per quel primo referendum contro il nucleare che si sarebbe poi tenuto nel 1987, mentre si faceva strada anche il movimento dei Verdi. Anche qui la mobilitazione era stata grande e, nonostante l’incostituzionalità del quesito proposto, era chiaro come non ci fosse spazio, in quel periodo, per affrontare compiutamente l’argomento, rimasto poi nell’alternanza tra oblìo e vampate revisionistiche nei decenni successivi."}, {"t": "p", "h": "Una nota a margine, che è ben altro dall’essere considerata episodica, è l’allineamento temporale – quasi fatalistico – tra i due appuntamenti referendari italiani promossi per rallentare nel primo caso e impedire, nel secondo, una politica nucleare nel Paese."}, {"t": "p", "h": "Pensateci: 1986 incidente di Chernobyl – 1987 referendum; 2011 incidente di Fukushima – 2011 referendum. Solo dati statistici? Non credo."}, {"t": "p", "h": "Sappiamo bene come l’opinione pubblica “respiri” e formi la sua “coscienza” indistinta attraverso gli eventi più recenti e le prese di posizione maggiormente amplificate, per toni e gesti. Fermo restando il rispetto democratico dell’esito del voto, è chiaro che se oggi si proponesse, attraverso un quesito ragionato e comprensibile, l’adozione o meno di una nuova politica energetica basata sull’utilizzo del nucleare, non è difficile immaginare che l’esito potrebbe essere molto diverso e comunque non quasi totalitario come nel passato."}, {"t": "p", "h": "Anche per queste ragioni abbiamo deciso di dedicare il numero di “Comprendere” che state leggendo ad un tema che in passato è stato enormemente divisivo e ancora oggi necessita di una profonda e corretta conoscenza."}, {"t": "p", "h": "Di certo la strada intrapresa interseca quelle della tecnologia, della sostenibilità, della geopolitica, dell’economia. E diversamente da quel disco, da quegli anni, da quelle convinzioni giovanili, il “no” può lasciare spazio ad un’altra colonna sonora."}], "bio": "", "notes": []}, "n6-a1": {"paras": [{"t": "p", "h": "L’Italia si trova oggi davanti a una scelta strategica cruciale: garantire la sicurezza energetica del Paese, contenere i costi dell’energia per famiglie e imprese e raggiungere gli obiettivi di decarbonizzazione. In questo scenario, il nucleare rappresenta un tassello fondamentale del nostro futuro energetico. Sono convinto che a partire dai primi anni ’30 il nucleare sarà una realtà operativa anche in Italia. È un percorso che dobbiamo intraprendere con determinazione, ripartendo da una solida base normativa e industriale. Dopo oltre quarant’anni di assenza da questo settore, è necessario un piano strutturato che tenga conto di innovazione tecnologica, sostenibilità economica e consenso sociale."}, {"t": "p", "h": "L’Italia non può affrontare questa sfida da sola. In un contesto europeo in cui l’energia nucleare è già un pilastro della strategia energetica di molti Paesi, il nostro ritardo non è più sostenibile. La Francia, ad esempio, ha costruito la sua indipendenza energetica proprio grazie a una solida infrastruttura nucleare, garantendosi un’energia a basso costo e a bassa emissione di CO₂. La Germania, che ha scelto di dismettere il nucleare, si trova oggi in una situazione di maggiore vulnerabilità rispetto agli shock energetici. Il ritorno dell’Italia al nucleare non è solo una questione di sostenibilità ambientale, ma anche di competitività industriale e di sicurezza geopolitica."}, {"t": "p", "h": "L’Unione Europea sta riconoscendo sempre più il ruolo del nucleare nella transizione energetica, tanto che la tassonomia verde ha incluso questa fonte tra le tecnologie sostenibili. Le alleanze tra Paesi europei a favore dell’energia nucleare si stanno rafforzando, e l’Italia deve essere parte attiva di questo processo. Abbiamo già avviato il percorso normativo per il ritorno dell’energia nucleare in Italia. La legge delega approvata dal Consiglio dei Ministri costituirà il primo passo di un iter articolato. Questa legge definirà i pilastri per la reintroduzione dell’energia nucleare, con un quadro chiaro su autorizzazioni, regolamentazione e criteri di installazione."}, {"t": "p", "h": "Entro l’autunno, mi auguro che il provvedimento venga approvato, permettendoci poi di lavorare sui decreti attuativi. Saranno necessari 12 mesi per finalizzare le regolamentazioni su <em>permitting<\/em>, certificazioni, formazione del personale specializzato e individuazione delle migliori soluzioni tecnologiche. È un percorso che stiamo affrontando con pragmatismo, ponendo l’Italia nelle condizioni di adottare le migliori pratiche a livello internazionale. Il rilancio del nucleare in Italia non può prescindere da una forte sinergia tra istituzioni, industria e ricerca."}, {"t": "p", "h": "Stiamo assistendo alla nascita di alleanze strategiche che vedono protagoniste realtà d’eccellenza come l’ENEA, che da anni lavora sulle nuove frontiere della tecnologia nucleare, e la newco tra Enel, Ansaldo Nucleare e Leonardo, creata per sviluppare competenze industriali nel settore. Questa collaborazione rappresenta un passo decisivo per il posizionamento dell’Italia nel mercato internazionale dell’energia nucleare."}, {"t": "p", "h": "L’industria italiana ha già una forte esperienza nella componentistica avanzata per il nucleare, esportando tecnologia in diversi Paesi. Ora si tratta di fare un salto di qualità, puntando su una filiera nazionale in grado di progettare e realizzare impianti di nuova generazione. L’Italia oggi guarda al futuro del nucleare con un approccio innovativo. Non si tratta di tornare ai vecchi impianti, ma di puntare su tecnologie avanzate, sicure ed efficienti. In particolare, gli <em>Small Modular Reactors<\/em> (SMR) rappresentano una soluzione concreta: reattori compatti, più sicuri, con un ridotto impatto ambientale e integrabili con le altre fonti energetiche."}, {"t": "p", "h": "Il nostro Paese vanta eccellenze industriali nel settore: aziende italiane sono già coinvolte in progetti internazionali, contribuendo allo sviluppo di reattori di ultima generazione. Dobbiamo far crescere ulteriormente un sistema di competenze che è rimasto fermo per troppi anni. Per questo, investiremo nella formazione di ingegneri e tecnici specializzati, affinché l’Italia possa essere protagonista in questo settore. Il nucleare sarà parte di un mix energetico equilibrato e diversificato. Accanto alle fonti rinnovabili, che continueranno a crescere, avremo bisogno di una fonte stabile e programmabile come il nucleare per garantire continuità di approvvigionamento e stabilità della rete. Ma la transizione energetica non si può realizzare senza una visione pragmatica. Le sole rinnovabili non bastano: l’energia eolica e solare, pur essenziali, dipendono da fattori climatici e non offrono la costanza necessaria per un sistema industriale avanzato come quello italiano. Il nucleare, invece, garantisce energia pulita, senza emissioni di CO₂, e a costi stabili nel tempo."}, {"t": "p", "h": "Un altro aspetto cruciale riguarda la gestione delle scorie nucleari. Oggi in Italia produciamo già rifiuti a bassa e media intensità radioattiva, principalmente di origine medica, che necessitano di una gestione sicura e centralizzata. Il nostro obiettivo è individuare soluzioni che garantiscano sicurezza e sostenibilità, come già avviene nei Paesi che hanno una filiera nucleare consolidata. Per le scorie ad alta attività, la prospettiva è quella di collaborare con i partner europei e adottare soluzioni avanzate di stoccaggio e trattamento. Il nucleare è una tecnologia sicura e regolamentata da standard stringenti, e il nostro approccio sarà basato sulla massima trasparenza e sulla condivisione con i cittadini. Il ritorno del nucleare non è una questione ideologica, ma una necessità concreta per l’indipendenza energetica dell’Italia. La Francia, la Cina, gli Stati Uniti e altri Paesi stanno investendo massicciamente in questa tecnologia. Non possiamo restare indietro."}, {"t": "p", "h": "Oggi vedo una crescente responsabilità nel dibattito politico, anche tra le forze di opposizione. È un tema su cui dobbiamo lavorare con spirito di collaborazione, evitando pregiudizi e guardando ai dati e alla scienza. Mi auguro che il confronto in Parlamento possa migliorare ulteriormente il testo della legge delega e portare l’Italia verso un futuro energetico più sicuro, stabile e sostenibile."}, {"t": "p", "h": "L’energia nucleare di nuova generazione rappresenta una grande opportunità per il nostro Paese. Abbiamo le competenze, le risorse e la volontà politica per farlo. A partire dai primi anni ’30 l’Italia tornerà ad avere il nucleare. Ne sono convinto."}], "bio": "<strong>Gilberto Pichetto Fratin<\/strong> è Ministro dell’Ambiente e della Sicurezza Energetica ed esponente di Forza Italia. Laureato in Economia e Commercio all’Università di Torino, ha esercitato come dottore commercialista e docente di ragioneria. Attivo in politica sin da giovane, ha ricoperto incarichi di amministrazione locale e regionale in Piemonte, entrando in Forza Italia nel 1995. È stato Senatore della Repubblica e, dal 2021, Viceministro dello Sviluppo Economico nel Governo Draghi. Il 22 ottobre 2022 ha giurato come Ministro nel Governo Meloni e, con il suo dicastero, è attualmente al lavoro per la reintroduzione dell’energia nucleare nel mix energetico nazionale.", "notes": []}, "n6-a2": {"paras": [{"t": "p", "h": "Il 28 febbraio scorso, il Consiglio dei Ministri su proposta del Presidente del Consiglio e del Ministro dell’ambiente Pichetto Fratin ha approvato la «<em>Delega al Governo in materia di energia nucleare sostenibile<\/em>»."}, {"t": "p", "h": "Inizia così un percorso che potrebbe portare l’Italia a riprendere la propria politica nucleare. Si tratta di una decisione di significativa portata politica. Innanzitutto, perché destinata a scatenare un dibattito a dir poco vivace. Il tema è tra quelli sensibili. Sul nucleare l’Italia si è in passato divisa, anche nelle urne referendarie."}, {"t": "p", "h": "Ma nella situazione attuale non si può prescindere da una discussione, sperabilmente laica e ispirata al pragmatismo."}, {"t": "p", "h": "La politica energetica è forse quella che maggiormente oggi definisce la capacità di governare il futuro, non solo a livello domestico ma anche e soprattutto sul piano planetario. La filiera di approvvigionamento energetico va ben oltre i confini nazionali, quale che sia la fonte che si considera. Secondo i dati dell’International Energy Agency (IEA), l’Italia nel 2023 dipendeva al 79,8% dalle importazioni nette di energia (in particolare gas, di cui siamo il maggior consumatore al mondo). Sempre secondo l’IEA, la nostra dipendenza dall’estero ci colloca al terzo posto in Europa e al nono nel mondo."}, {"t": "p", "h": "L’esposizione oltrefrontiera solleva questioni di sicurezza dell’approvvigionamento e di rilevanza dei costi talmente evidenti che non è necessario spendere molte parole. Nel terremoto epocale che attraversa l’assetto geopolitico mondiale, la voce energia (che significa anche materie prime per lo sviluppo delle tecnologie) è probabilmente uno dei principali <em>driver<\/em> delle scelte strategiche degli stati e del loro posizionamento nelle relazioni internazionali. Con tutto il seguito di conflitti, anche armati, che rigurgitano in ogni angolo del mondo. A ciò si aggiungano le pressioni derivanti dalle minacce del cambiamento climatico, che già da sole basterebbero a dare la misura della drammatica attualità delle questioni."}, {"t": "p", "h": "In tutto questo scenario, la domanda mondiale di energia cresce esponenzialmente, come segno della diffusione del benessere, della consapevolezza ambientale, ma anche come portato dell’altra grande rivoluzione tecnologica: l’intelligenza artificiale (i consumi dei <em>data center<\/em> sono già paragonabili a quelli dell’industria pesante). La crucialità di questi problemi è pari forse solo alla diffusione della consapevolezza che di essi ormai si ha, tanto da collocare queste considerazioni al limite della banalità."}, {"t": "p", "h": "Ce n’è abbastanza, però, per comprendere che un dibattito non era ragionevolmente eludibile. E non a caso il nucleare è stato oggetto di rinnovato interesse in numerosi paesi negli ultimi anni (IEA, <em>World Energy Outlook 2024<\/em>, 16 e 158), soprattutto tra quelli maggiormente dipendenti dall’estero."}, {"t": "p", "h": "D’altronde, in questa direzione vanno anche le raccomandazioni provenienti dai consessi internazionali e sovranazionali, soprattutto in vista del contrasto ai cambiamenti climatici: dalla conferenza Onu sul cambiamento climatico (COP 28) alla stessa IEA, fino all’Unione europea."}, {"t": "p", "h": "Quanto a quest’ultima, oltre all’ormai noto regolamento Tassonomia, si segnala il recentissimo <em>Net Zero Industry Act<\/em> (Reg. 2024/1735), il quale prevede espressamente, tra le “tecnologie a zero emissioni nette” oggetto della disciplina, anche le “<em>tecnologie per l’energia da fissione nucleare, comprese le  tecnologie del ciclo del combustibile nucleare<\/em>”."}, {"t": "p", "h": "Di fronte a un contesto così problematico e articolato, chiunque abbia onestà intellettuale non può che salutare positivamente la scelta di riaprire un dibattito troppo a lungo rimasto congelato in un quadro storico, tecnologico e politico ormai superato sotto ogni punto di vista."}, {"t": "p", "h": "Tale dibattito, prima sul disegno di legge delega all’esame del Parlamento e poi sulla fase attuativa dello stesso, potrà consentire, infatti, di confrontarsi con scelte decisive per il nostro futuro."}, {"t": "p", "h": "Il Ddl, infatti, pone implicitamente una serie di domande con cui il decisore politico e i cittadini non possono non confrontarsi."}, {"t": "p", "h": "Qual è il mix energetico più adeguato per raggiungere l’obiettivo, condiviso da tutti, di zero emissioni nette entro il 2050?"}, {"t": "p", "h": "Posto che tutte, nessuna esclusa, le tecnologie presentano vantaggi e svantaggi (in termini di sicurezza, di possibile sviluppo tecnologico e disponibilità, di costi, di occupazione del suolo, di approvvigionamento delle fonti di produzione e delle materie prime, di efficienza, di continuità di erogazione dell’energia a fronte dell’“intemittenza” di alcune fonti, di storage, di smaltimento, ecc. ecc.), quali scelte politico-strategiche sono le più adeguate all’Italia?"}, {"t": "p", "h": "È meglio puntare tutte le <em>fiches<\/em> su un’unica tipologia di fonte o è opportuno tenere aperto un paniere che consenta più flessibilità? E come dev’essere composto questo mix energetico?"}, {"t": "p", "h": "Da questo punto di vista, se si vuole evitare un approccio puramente ideologico e irrazionale, occorre un’operazione verità. In questa materia nessun pasto è gratis e ogni soluzione ha i suoi rischi e i suoi costi, non solo economici. Così come è indubitabile che ogni fonte di energia abbia la sua lobby e il suo grumo di interessi, pronti a scagliarsi contro gli altri."}, {"t": "p", "h": "Compiere scelte che siano veramente nell’interesse generale è straordinariamente complesso. Rifiutare questo dibattito, oltre che controproducente, è anche piuttosto sospetto."}], "bio": "<strong>Giovanni Guzzetta<\/strong> è professore ordinario di Diritto costituzionale presso l’Università di Roma “Tor Vergata”. Accademico di riconosciuto prestigio, ha alle spalle una lunga esperienza nell’ambito delle riforme istituzionali e della legislazione elettorale. Tra i suoi incarichi istituzionali di rilievo, è Consigliere giuridico del Ministro dell’Ambiente e della Sicurezza Energetica, incaricato di redigere il quadro giuridico per la disciplina organica del nucleare sostenibile. È stato Componente del CLEP, Presidente della Corte costituzionale di San Marino, Capo di Gabinetto del Ministro della PA, Vicepresidente del Consiglio di Presidenza della Giustizia amministrativa. È coordinatore di un Master in Lobby e processi decisionali e di un Master in Diritto dell’intelligenza artificiale e dell’innovazione tecnologica. È avvocato e Partner dello studio legale associato Legal Protection. Autore di numerosi saggi e pubblicazioni, nonché editorialista di vari quotidiani, Guzzetta è da anni protagonista del dibattito pubblico su temi di diritto costituzionale, amministrativo, europeo, governance e qualità delle istituzioni.", "notes": []}, "n6-a3": {"paras": [{"t": "p", "h": "Negli ultimi anni, il moltiplicarsi delle tensioni internazionali e l’esplosione di conflitti a carattere regionale che vedono coinvolte potenze dotate di un arsenale nucleare hanno reso nuovamente attuale nell’opinione pubblica mondiale il cosiddetto “incubo atomico”."}, {"t": "p", "h": "L’immaginario collettivo sull’energia nucleare si è nutrito tra seconda metà del Novecento ed inizio del nuovo millennio di un flusso ormai canonizzato di immagini-simbolo, su tutte il fungo atomico. Questo ha iniziato a popolare gli incubi di intere generazioni sin da quel periodizzante 6 agosto 1945, data della distruzione della città giapponese di Hiroshima. Eppure simili riferimenti sono per buona parte frutto della finzione, della fantasia o dell’intuizione di registi e scrittori, più in generale di artisti che hanno usato la loro ispirazione per immaginare quello che non era mai stato (il primo e unico conflitto che abbia visto impiegati ordigni atomici su obiettivi militari è stata la Seconda guerra mondiale) e che pure, in determinati momenti della storia della Guerra fredda, era sembrato così vicino e probabile."}, {"t": "p", "h": "Questo non vuol dire che la paura atomica sia stata solamente il parto di fantasie in punta di penna. Comprendere la genesi e l’evoluzione di questo sentimento profondamente radicato nella coscienza collettiva significa ripercorrere le fasi della storia della scienza atomica e, più in generale, i grandi snodi della Guerra fredda giacché entrambe le vicende si intersecano divenendo inscindibili l’una dall’altra. La prima di queste si sviluppa dal 1945 al 1949, anno in cui l’Unione Sovietica fece detonare la sua prima bomba atomica ponendo fine all’egemonia americana sulle armi nucleari. In questo periodo si passò molto rapidamente dallo shock causato dalla notizia della bomba su Hiroshima e Nagasaki alla comprensione del nuovo ruolo che il nucleare avrebbe svolto nel nuovo scenario bipolare."}, {"t": "p", "h": "La seconda fase coincide con il momento più buio nelle relazioni fra le due superpotenze, la guerra di Corea. Da un lato, l’atomica come arma di offesa venne vista, al di qua e al di là della cortina di ferro, come fonte di nuove angosce e timori; dall’altro, conseguentemente, come l’unico strumento di difesa. Si stabilì così un rapporto per molti versi ambiguo con la bomba e le sue plurime incarnazioni: arma di distruzione ma anche, apparentemente, unico baluardo per evitarla (il paradosso alla base del concetto di deterrenza). Proprio allora ebbe inizio la corsa agli armamenti e la proliferazione dei test su ordigni sempre più potenti, come la bomba all’idrogeno."}, {"t": "p", "h": "Negli stessi anni, parallelamente, si cercò di esorcizzare la paura della distruzione atomica tramite la campagna internazionale sull’uso pacifico e a fini civili dell’energia atomica, inaugurata dal discorso alle Nazioni Unite del presidente Dwight D. Eisenhower l’8 dicembre 1953, da lui stesso definito un appello per un «Piano Marshall atomico» fonte di ricchezza e progresso. Gli isotopi radioattivi divennero per l’opinione pubblica mondiale l’altra faccia della medaglia nucleare."}, {"t": "p", "h": "Nel 1954, una nuova paura si affiancò a quella fino ad allora predominante della distruzione atomica, un incubo molto più “misterioso” e letale perché difficile da vedere e da cui sembrava impossibile difendersi: quello delle radiazioni. Esso venne “scoperto” dall’opinione pubblica a seguito delle conseguenze disastrose ed inaspettate dei test sulla bomba all’idrogeno effettuati proprio quell’anno nel Pacifico da parte degli Stati Uniti. La terza fase, che giunge fino alla fine degli anni Cinquanta, vide così fondersi due minacce equivalenti ma di origine opposta (quella del nucleare nemico e quella del nucleare amico) nell’oramai onnipresente incubo del fallout radioattivo. Nell’immaginario pubblico, alle devastazioni portate dalle esplosioni atomiche si sommarono i timori più reconditi, per certi versi inconsci e per questo più inquietanti, di danni genetici, di degenerazioni, di mutazioni del regolare ordine naturale in grado di generare mostri. Le radiazioni divennero il reagente per scatenare le ansie più profonde della società rispetto alla paura nucleare."}, {"t": "p
