<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const LOGO = document.getElementById('logo-svg').textContent;
const app = document.getElementById('app');
const TYPE = {ed:'Editoriale',art:'Articolo',int:'Intervista',dia:'Dialogo',soglia:'Soglia',partner:'Partner'};
const TYPE_PL = {ed:'Editoriali',art:'Articoli',int:'Interviste',dia:'Dialoghi',soglia:'Soglie',partner:'Partner'};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => h.replace(/<[^>]+>/g,'');
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[’']/g,"'");
const issues = D.issues;
const byId = Object.fromEntries(issues.map(i=>[i.id,i]));
const RANGE = [Math.min(...issues.map(i=>i.num)), Math.max(...issues.map(i=>i.num))];

// indicizzazione
const ALL = [];
issues.forEach(iss => iss.sections.forEach((sec,si) => sec.entries.forEach(e => {
  e.issue = iss.id; e.secName = sec.name; e.secIdx = si;
  const people = [];
  if (e.author) (e.type==='soglia' ? [e.author] : e.author.split(/, | e (?=[A-Z])/)).forEach(a=>{ if(a.trim()) people.push(a.trim()); });
  if (e.curator) people.push(e.curator);
  e.people = people;
  e.hay = fold([e.title,e.author,e.curator,e.partner,sec.name,iss.title].join(' '));
  ALL.push(e);
})));
const readable = e => e.id && D.texts[e.id];
const minutes = id => { const t=D.texts[id]; const txt = t.epigraph || t.paras.map(p=>strip(p.h)).join(' '); return Math.max(1, Math.round(txt.split(/\s+/).length/230)); };
const isNavy = e => e.type==='soglia' || !!e.navy;
const intA = n => /^[Aa]/.test(n) ? 'intervista ad ' : 'intervista a ';

// autori presenti in più numeri
const peopleIssues = {};
ALL.forEach(e => e.people.forEach(p => { (peopleIssues[p] ||= new Set()).add(e.issue); }));
const recurring = Object.entries(peopleIssues).filter(([,s])=>s.size>1).sort((a,b)=>b[1].size-a[1].size || a[0].localeCompare(b[0]));
// elenco completo delle firme (esclusi gli autori delle soglie letterarie e i partner)
const contribIssues = {};
ALL.forEach(e => { if (e.type==='soglia'||e.type==='partner') return; e.people.forEach(p => (contribIssues[p] ||= new Set()).add(e.issue)); });
const PARTICLES = new Set(['de','De','dal','Dal','di','Di','Della','della','Del','del']);
const ORGS = new Set(['Starting Finance']);
const SURNAME = {'Ramón Palou de Comasema':'Palou de Comasema','Davide Albertini Petroni':'Albertini Petroni','Emma Nicolazzi Bonati':'Nicolazzi Bonati'};
const surnameKey = n => { if (ORGS.has(n)) return n; if (SURNAME[n]) return SURNAME[n]; const w=n.split(' '); let i=w.length-1; while(i>1 && PARTICLES.has(w[i-1])) i--; return w.slice(i).join(' '); };
const AUTHORS = Object.keys(contribIssues).map(n => ({n, k: fold(surnameKey(n)), c: contribIssues[n].size})).sort((a,b)=>a.k.localeCompare(b.k,'it'));
function authorGroups(){
  const g = {};
  AUTHORS.forEach(a => { const L = a.k[0].toUpperCase(); (g[L] ||= []).push(a); });
  return Object.entries(g).map(([L,list]) => `<div class="aa-group"><div class="aa-letter">${L}</div>${list.map(a=>`<button type="button" class="aa-name" data-person="${esc(a.n)}"><span>${esc(a.n)}</span><small>${a.c} ${a.c===1?'numero':'numeri'}</small></button>`).join('')}</div>`).join('');
}
const PEOPLE = D.people || {};
const personFor = v => { const f = fold(v.trim()); return Object.keys(peopleIssues).find(n => fold(n) === f) || null; };
function personCard(name){
  const p = PEOPLE[name] || {};
  const mine = ALL.filter(e => e.people.includes(name));
  const signed = mine.filter(e => !e.curator || e.curator !== name).length;
  const curated = mine.filter(e => e.curator === name).length;
  const what = [signed ? `${signed} ${signed===1?'contributo firmato':'contributi firmati'}` : '', curated ? `${curated} ${curated===1?'intervista curata':'interviste curate'}` : ''].filter(Boolean).join(' · ');
  const iss = [...peopleIssues[name]].sort().reverse().map(id => `<span class="tag iss" data-issue="${id}">N.${byId[id].num}</span>`).join('');
  const text = p.bio || '';
  return `<div class="pcard">
    <div class="pc-head"><h4>${esc(name)}</h4><div class="tags">${iss}</div></div>
    ${p.role ? `<p class="pc-role">${esc(p.role)}</p>` : ''}
    ${text ? `<p class="pc-bio">${text}</p>` : (!p.role ? `<p class="pc-role">Nessuna biografia pubblicata nella rivista.</p>` : '')}
    <p class="pc-what">${what} in Comprendere</p>
  </div>`;
}

document.getElementById('bar-logo').innerHTML = LOGO;
document.getElementById('bar-logo').querySelector('svg').setAttribute('aria-hidden','true');

const MENU = [
  {id:'comprendere', label:'Comprendere', sub:'Il progetto editoriale'},
  {id:'archivio', label:'Archivio', sub:`Tutti i numeri, dal ${RANGE[0]} al ${RANGE[1]}`},
  {id:'percorsi', label:'Percorsi', sub:`${D.themes.length} temi che attraversano i numeri`},
  {id:'quadro', label:'Il quadro', sub:'Le regole in vigore, spiegate'},
  {id:'autori', label:'Autori', sub:`${AUTHORS.length} firme, dalla A alla Z`},
  {id:'contatti', label:'Contatti', sub:'Comin & Partners a Roma, Milano e Bruxelles'},
];
function nav(active){
  document.getElementById('nav').innerHTML =
    issues.map(i=>`<a href="#${i.id}" data-issue="${i.id}" ${active===i.id?'aria-current="page"':''}><span class="dot"></span>N.${i.num}</a>`).join('');
  document.getElementById('menu-main').innerHTML = MENU.map(m =>
    `<a href="#${m.id}" ${active===m.id?'aria-current="page"':''}><span class="mm-l">${m.label}</span><span class="mm-s">${esc(m.sub)}</span></a>`).join('');
  document.getElementById('menu-issues').innerHTML = issues.map(i =>
    `<a href="#${i.id}" class="mi" data-issue="${i.id}" ${active===i.id?'aria-current="page"':''}>
      <span class="mi-cov"><img src="${i.id}_cover.jpg" alt="" loading="lazy"></span>
      <span class="mi-t"><span class="mi-n"><span class="dot"></span>N.${i.num} · ${esc(i.month)}</span><span class="mi-title">${esc(i.title)}</span></span></a>`).join('');
}
const menuEl = document.getElementById('menu'), menuBtn = document.getElementById('menu-btn');
function openMenu(){
  menuEl.hidden = false; menuBtn.setAttribute('aria-expanded','true');
  requestAnimationFrame(()=>{ menuEl.classList.add('open'); const f = menuEl.querySelector('.menu-main a'); if (f) f.focus(); });
  document.documentElement.classList.add('menu-on');
}
function closeMenu(refocus){
  if (menuEl.hidden) return;
  menuEl.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false');
  document.documentElement.classList.remove('menu-on');
  setTimeout(()=>{ menuEl.hidden = true; }, 200);
  if (refocus) menuBtn.focus();
}
menuBtn.addEventListener('click', ()=> menuEl.hidden ? openMenu() : closeMenu(true));
menuEl.addEventListener('click', ev => { if (ev.target.closest('[data-close]')) closeMenu(true); else if (ev.target.closest('a')) closeMenu(false); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeMenu(true); });
document.getElementById('menu-logo').innerHTML = LOGO;

// pagine autore
const slug = n => fold(n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const SLUGS = Object.fromEntries(Object.keys(peopleIssues).map(n => [slug(n), n]));
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-person]'); if (!b) return;
  ev.preventDefault(); location.hash = 'autore-' + slug(b.dataset.person);
});

function coverHTML(iss, small){
  return `<div class="cover ${small?'small':''}" data-issue="${iss.id}">
    <img src="${iss.id}_cover.jpg" alt="Illustrazione di copertina del numero ${iss.num}" loading="${small?'lazy':'eager'}">
    <div class="c-logo">${LOGO}</div>
    <div class="c-sub">Progetto editoriale a cura di Comin &amp; Partners. ${esc(iss.month)} Numero ${iss.num}</div>
    <div class="c-title">${esc(iss.title).replace(/, /,',<br>')}</div>
  </div>`;
}

function byline(e, linkPeople){
  const P = n => linkPeople ? `<button type="button" data-person="${esc(n)}">${esc(n)}</button>` : `<b>${esc(n)}</b>`;
  if (e.type==='partner') return `Contenuto partner${e.partner?` · <b>${esc(e.partner)}</b>`:''}`;
  if (e.type==='soglia') return P(e.author);
  const names = e.people.filter(p => p !== e.curator);
  let s;
  if (e.byline){
    s = esc(e.byline); let hit = 0;
    names.forEach(p => { if (s.includes(esc(p))) { s = s.replace(esc(p), P(p)); hit++; } });
    if (!hit && names.length === 1) s = s.replace(/^(di |del |della |intervista a )?(.*)$/, (m,a,b) => (a||'') + (linkPeople ? `<button type="button" data-person="${esc(names[0])}">${b}</button>` : `<b>${b}</b>`));
  } else {
    const joined = names.length > 1 ? names.slice(0,-1).map(P).join(', ') + ' e ' + P(names[names.length-1]) : P(names[0]||'');
    s = (e.type==='int' ? intA(names[0]||'') : 'di ') + joined;
  }
  if (e.curator) s += ` · a cura di ${P(e.curator)}`;
  return s;
}

function entryRow(e, opts={}){
  const ok = readable(e);
  const iss = byId[e.issue];
  const tags = [];
  if (opts.showIssue) tags.push(`<span class="tag iss" data-issue="${e.issue}">N.${iss.num} · ${esc(e.secName)}</span>`);
  tags.push(`<span class="tag ${e.type==='partner'?'partner':''}">${TYPE[e.type]}</span>`);
  if (!opts.noThemes) (e.themes||[]).forEach(t => tags.push(`<a class="tag th" href="#percorso-${t}">${esc(THEME[t].name)}</a>`));
  let go;
  if (ok) go = `<a href="#${e.id}">Leggi · ${minutes(e.id)} min</a>`;
  else if (e.type==='soglia') go = `<span>Su carta · diritti da verificare</span>`;
  else go = `<span>Su carta</span>`;
  const title = ok ? `<a class="t" href="#${e.id}">${esc(e.title)}</a>` : `<div class="t">${esc(e.title)}</div>`;
  return `<div class="entry ${ok?'':'off'}" data-issue="${e.issue}">
    <div class="pg">p. ${e.page}</div>
    <div>${title}<div class="by">${byline(e, true)}</div><div class="tags">${tags.join('')}</div></div>
    <div class="go">${go}${e.type!=='partner'?`<button type="button" class="share-btn" data-share="${ekey(e)}">Condividi</button>`:''}</div></div>`;
}

/* ---------- ARCHIVIO ---------- */
function renderHome(){
  nav(null);

  </div></section>

  <section class="finder"><div class="wrap">

    <div class="chips" aria-label="Autori presenti in più numeri"><span class="hint" style="margin:0">In più numeri:</span>${recurring.map(([p,s])=>`<button type="button" class="chip" data-person="${esc(p)}">${esc(p)}<small>${s.size}</small></button>`).join('')}

    const who = personFor(q.value);
    res.innerHTML = (who ? personCard(who) : '') + (hits.length ? `<p class="hint">${hits.length} risultati in ${new Set(hits.map(h=>h.issue)).size} numeri</p>` + hits.map(e=>entryRow(e,{showIssue:true})).join('') : `<p class="empty">Nessun contributo corrisponde a “${esc(q.value)}”.</p>`);

/* ---------- NUMERO ---------- */
function renderIssue(iss, focus){
  nav(iss.id);
  const entries = iss.sections.flatMap(s=>s.entries);
  const eds = entries.filter(e=>e.type==='ed');
  const soglia = iss.sections[0].entries.find(e=>e.type==='soglia');
  const sogliaText = soglia && readable(soglia) ? D.texts[soglia.id].epigraph : '';
  const short = t => { const s=t.replace(/\n/g,' '); if (s.length<380) return s; const cut=s.slice(0,380); return cut.slice(0,cut.lastIndexOf(' '))+' …'; };
  const firstPara = id => { const t=strip((D.texts[id].paras.find(p=>p.t==='p')||D.texts[id].paras[0]).h.replace(/<sup>.*?<\/sup>/g,'')); return t.length>300 ? t.slice(0,t.lastIndexOf(' ',300))+' …' : t; };
  const types = ['ed','art','int','dia','soglia','partner'].filter(t=>entries.some(e=>e.type===t));
  app.innerHTML = `
  <div data-issue="${iss.id}">
  <section class="ihero"><div class="wrap">
    ${coverHTML(iss)}
    <div>
      <div class="kicker">Numero ${iss.num} · ${esc(iss.month)}</div>
      <h1>${esc(iss.title)}</h1>
      <p class="lead">${esc(iss.lead)}</p>
      <div class="meta-line"><span>Chiuso in redazione il ${esc(iss.closed)}</span><span>${entries.length} contributi in ${iss.sections.length-1} sezioni</span><span>${entries.filter(readable).length} testi in anteprima</span></div>
      <div class="btns"><button class="btn primary" type="button" id="to-idx">Vai all’indice</button>${eds[0]?`<a class="btn" href="#${eds[0].id}">Editoriale di ${esc(eds[0].author.split(' ').pop())}</a>`:''}</div>
    </div>
  </div></section>
  ${quadroBand(iss)}
  ${soglia ? `<section class="soglia-band"><div class="wrap">
    <div><div class="label">La soglia</div><h3>${esc(soglia.title)}</h3><div class="who">${esc(soglia.author)}</div></div>
    <div>${sogliaText ? `<blockquote>${esc(short(sogliaText))}</blockquote><a href="#${soglia.id}">Leggi la soglia</a>` : `<blockquote>Ogni numero si apre con un testo letterario che introduce il tema. Questa soglia è nell’edizione cartacea: la pubblicazione in digitale richiede la verifica dei diritti.</blockquote>`}</div>
  </div></section>` : ''}

  <section class="eds"><div class="wrap">
    <div class="label" style="color:var(--muted)">Gli editoriali</div>
    <div class="grid">${eds.map(e=>`<a class="ed ${isNavy(e)?'navy':''}" href="#${e.id}">
      <h3>${esc(e.title)}</h3><div class="who">${esc(e.author)}</div><p>${esc(firstPara(e.id))}</p>
      <span class="more">Leggi · ${minutes(e.id)} min</span></a>`).join('')}</div>
  </div></section>

  <section class="idx" id="indice"><div class="wrap">
    <div class="idx-head"><h2>Indice integrale</h2><span class="count" id="idx-count"></span></div>
    <div class="idx-tools">
      <label for="q-iss" hidden>Filtra l’indice</label>
      <input id="q-iss" type="search" placeholder="Filtra per titolo, autore, sezione" autocomplete="off">
      <label class="toggle" for="only-r"><input type="checkbox" id="only-r"> Solo testi leggibili</label>
    </div>
    <div class="chips" id="type-chips">${['all',...types].map(t=>`<button type="button" class="chip" data-type="${t}" aria-pressed="${t==='all'}">${t==='all'?'Tutto':TYPE_PL[t]}<small>${t==='all'?entries.length:entries.filter(e=>e.type===t).length}</small></button>`).join('')}</div>
    <div id="secs"></div>
  </div></section>

  <section class="others"><div class="wrap">
    <div class="label" style="color:var(--muted)">Altri numeri</div>
    <div class="shelf" style="border:0;padding:0"><div class="row">${issues.filter(i=>i.id!==iss.id).map(i=>`
      <a class="issue-card" href="#${i.id}" data-issue="${i.id}">${coverHTML(i,true)}
        <div><div class="kicker">N.${i.num} · ${esc(i.month)}</div><h4>${esc(i.title)}</h4><p>${esc(i.lead)}</p></div></a>`).join('')}</div></div>
  </div></section>
  </div>`;

  let type='all';
  const q=document.getElementById('q-iss'), only=document.getElementById('only-r'), box=document.getElementById('secs'), cnt=document.getElementById('idx-count');
  const draw = () => {
    const v = fold(q.value.trim()); const words = v ? v.split(/\s+/) : [];
    let shown=0;
    const who = personFor(q.value);
    box.innerHTML = (who && peopleIssues[who].has(iss.id) ? personCard(who) : '') + iss.sections.map((s,si) => {
      const es = s.entries.filter(e => (type==='all'||e.type===type) && (!only.checked||readable(e)) && words.every(w=>e.hay.includes(w)));
      shown += es.length;
      if (!es.length && (words.length || type!=='all' || only.checked)) return '';
      return `<div class="sec">
        <div class="sec-side">
          ${s.img?`<div class="ph"><img src="${s.img}" alt="" loading="lazy"></div>`:''}
          <div class="n">${si===0?'In apertura':'Sezione '+si} · ${s.entries.length} voci</div>
          <h3>${esc(s.name)}</h3>${s.desc?`<p>${esc(s.desc)}</p>`:''}
        </div>
        <div class="sec-list">${es.map(e=>entryRow(e)).join('') || '<p class="empty">Nessuna voce con questi filtri.</p>'}</div>
      </div>`;
    }).join('') || `<p class="empty">Nessuna voce corrisponde ai filtri.</p>`;
    const base = entries.filter(e => (!only.checked||readable(e)) && words.every(w=>e.hay.includes(w)));
    document.querySelectorAll('#type-chips .chip').forEach(c => {
      const t = c.dataset.type, n = t==='all' ? base.length : base.filter(e=>e.type===t).length;
      c.querySelector('small').textContent = n; c.classList.toggle('zero', n===0);
    });
    cnt.textContent = `${shown} di ${entries.length} voci · in grigio i testi disponibili solo su carta`;
  };
  q.addEventListener('input', draw); only.addEventListener('change', draw);
  document.getElementById('type-chips').addEventListener('click', ev => {
    const b = ev.target.closest('[data-type]'); if(!b) return; type=b.dataset.type;
    document.querySelectorAll('#type-chips .chip').forEach(c=>c.setAttribute('aria-pressed', String(c===b))); draw();
  });
  document.getElementById('to-idx').addEventListener('click', ()=>document.getElementById('indice').scrollIntoView({behavior:'smooth'}));
  draw();
  if (focus==='indice') requestAnimationFrame(()=>document.getElementById('indice').scrollIntoView());
}

/* ---------- LETTURA ---------- */
function renderRead(e){
  const iss = byId[e.issue]; nav(iss.id);
  const t = D.texts[e.id];
  const navy = isNavy(e);
  const list = iss.sections.flatMap(s=>s.entries).filter(readable);
  const i = list.indexOf(e), prev = list[i-1], next = list[i+1];
  let body;
  if (t.epigraph) body = `<p>${esc(t.epigraph.replace(/([^\n.!?:;»”…])\n(?=[a-zà-ù])/g,'$1 '))}</p>`;
  else body = t.paras.map(p => p.t==='p' ? `<p>${p.h}</p>` : p.t==='q' ? `<p class="q">${p.h}</p>` : p.t==='a' ? `<p class="attr">${p.h}</p>` : `<h3>${p.h}</h3>`).join('')
    + (t.notes && t.notes.length ? `<ol class="notes" aria-label="Note">${t.notes.map(n=>`<li><b>${esc(n.n)}</b><span>${n.h}</span></li>`).join('')}</ol>` : '');
  const initials = n => n.split(' ').filter(w=>/^[A-ZÀ-Ü]/.test(w)).map(w=>w[0]+'.').join(' ');
  const usesLabels = t.paras && t.paras.some(p=>p.h.includes('class="sp"'));
  const legend = usesLabels ? `<div class="legend">${e.people.map(p=>`<span><b>${initials(p).split(' ').length>2 ? initials(p) : initials(p)}</b>${esc(p)}</span>`).join('')}</div>` : '';
  const kicker = e.type==='soglia' ? 'La soglia' : e.secIdx===0 ? (e.type==='ed'?'Editoriale':'In apertura') : e.secName;
  const pre = e.type==='int' ? 'intervista a ' : e.type==='soglia' ? '' : 'di ';
  app.innerHTML = `<div data-issue="${iss.id}">
    <div class="read-top"><div class="wrap"><a href="#${iss.id}">N.${iss.num} · ${esc(iss.title)}</a><span>›</span><span>${esc(e.secName)}</span></div></div>
    <article class="article ${navy?'navy':''} ${t.epigraph?'epi':''}"><div class="wrap">
      <header class="art-head">
        <div class="kicker">${esc(kicker)}</div>
        <h1 class="${e.type==='ed'||e.type==='soglia'?'ed-title':''}">${esc(e.title)}</h1>
        <div class="byline">${byline(e,false).replace(/(^|>)([^<]+)(?=<|$)/g,(m,a,b)=>a+(b.trim()?`<span class="pre">${b}</span>`:b)).replace(' · a cura di',' a cura di')}</div>
        ${legend}
        <div class="art-meta"><span>Pagina ${e.page} dell’edizione cartacea</span><span>${minutes(e.id)} min di lettura</span></div>
        <button type="button" class="btn share-main" data-share="${ekey(e)}">Condividi sui social</button>
      </header>
      <aside class="aside">
        ${t.bio?`<div class="bio">${t.bio}</div>`:''}
        <div class="toc-mini">Da <a href="#${iss.id}">Comprendere n.${iss.num}</a>, ${esc(iss.month.toLowerCase())}.<br><a href="#${iss.id}-indice">Torna all’indice</a></div>
        ${quadroAside(e)}
      </aside>
      <div class="body">${body}
        ${t.epigraph?`<p class="rights">Le soglie letterarie sono riprodotte qui solo per le opere di pubblico dominio. Traduzione come nell’edizione cartacea.</p>`:''}
      </div>
    </div></article>
    ${sameThemeBlock(e)}
    <nav class="pager" aria-label="Altri testi del numero"><div class="wrap">
      ${prev?`<a href="#${prev.id}"><span class="label">Precedente</span><span class="t">${esc(prev.title)}</span></a>`:'<span></span>'}
      ${next?`<a href="#${next.id}"><span class="label">Successivo</span><span class="t">${esc(next.title)}</span></a>`:`<a href="#${iss.id}-indice"><span class="label">Fine dell’anteprima</span><span class="t">Torna all’indice integrale</span></a>`}
    </div></nav>
  </div>`;
}

function issueDots(name){
  const set = contribIssues[name] || peopleIssues[name] || new Set();
  return issues.filter(i=>set.has(i.id)).map(i=>`<span class="idot" data-issue="${i.id}" title="N.${i.num}"></span>`).join('');
}

  if (a.dataset.act === 'open'){
    const de = DEST.find(x => x.id === SH.dest); const t = document.getElementById('sh-text').value;
    copyTextNow();
    const link = document.createElement('a'); link.href = de.url(t); link.target = '_blank'; link.rel = 'noopener'; document.body.appendChild(link); link.click(); link.remove();
  }
});

async function renderKitThumbs(){

/* ---------- IL QUADRO ---------- */
const QBASE = D.quadro || {};
const QLIVE = {};                       // versioni salvate dalla redazione (db condiviso)
const CAN = {db:null, user:null, edit:false, me:null, demo: !!window.__DEMO_EDIT && !(window.claude && typeof window.claude.use === 'function')};
const ED = {on:false, issue:null, draft:null, startRev:0, dirty:false, hist:null, conflict:false, saving:false};
const clone = o => JSON.parse(JSON.stringify(o));
const qGet = id => (QLIVE[id] && QLIVE[id].content) || QBASE[id] || null;
const qRev = id => (QLIVE[id] && QLIVE[id].rev) || 0;
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const itDate = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); return m ? `${+m[3]} ${MESI[+m[2]-1]} ${m[1]}` : ''; };
const todayISO = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; };
const daysSince = iso => Math.floor((Date.now() - new Date(iso+'T12:00:00').getTime())/864e5);
const STALE_DAYS = 90;
const AREAS = ['Sostegno economico','Lavoro','Congedi','ISEE','Fisco','Scuola e servizi'];
const KINDS = ['Legge','INPS','Parlamento','Ministero','Unione europea','Sintesi','Altro'];
const STATES = [['fatto','Fatto'],['in corso','In corso'],['atteso','Atteso']];
const stCls = s => 's-' + String(s).replace(/\s+/g,'-');
const qFor = entryId => { for (const i of issues){ const q = qGet(i.id); if (q && (q.related||[]).includes(entryId)) return [i.id, q]; } return null; };
const multi = s => esc(s).replace(/\n/g,'<br>');

function quadroBand(iss){
  const q = qGet(iss.id); if (!q) return '';
  return `<section class="q-band" aria-label="Il quadro di questo numero"><div class="wrap">

    <div class="qb-r"><span class="qb-upd">Aggiornata al ${itDate(q.updated)}</span><a class="btn primary" href="#quadro-${iss.id}">Apri la scheda</a></div>
  </div></section>`;
}
function quadroAside(e){
  const hit = qFor(e.id); if (!hit) return '';
  const [id, q] = hit;
  return `<a class="q-aside" href="#quadro-${id}"><span class="label">Il quadro</span><b>${esc(q.title)}: le regole in vigore</b><span class="s">Aggiornata al ${itDate(q.updated)}</span></a>`;
}

    </div>` : '';

  <header class="qd-head"><div class="wrap">
    <a class="back" href="#quadro">Il quadro</a>
    <div class="kicker">N.${iss.num} · ${esc(iss.title)}</div>
    <h1>${esc(q.title)}</h1><p class="lead">${esc(q.dek)}</p>

    ${tools}
  </div></header>
  ${stale ? `<div class="q-stale" role="note"><div class="wrap">Questa scheda non viene verificata da più di tre mesi: alcune informazioni potrebbero non essere più attuali.</div></div>` : ''}
  <div class="wrap qd-grid">
    <nav class="qd-toc" aria-label="Sezioni della scheda">${toc.map(([k,l])=>`<button type="button" data-goto="${k}">${l}</button>`).join('')}</nav>
    <div class="qd-main">
      <section class="qd-sec q-brief" id="q-breve"><h2>In trenta secondi</h2>${q.brief.map(p=>`<p>${esc(p)}</p>`).join('')}</section>

      <section class="qd-sec" id="q-oggi"><h2>Cosa prevede oggi</h2>
        ${areas.length > 1 ? `<div class="q-filter" role="group" aria-label="Filtra per ambito">${['Tutte',...areas].map((a,i)=>`<button type="button" class="chip" data-area="${esc(a)}" aria-pressed="${i===0}">${esc(a)}<small>${i===0?q.measures.length:q.measures.filter(m=>m.area===a).length}</small></button>`).join('')}</div>` : ''}
        <div class="q-measures">${q.measures.map(m => `<article class="q-m" data-area="${esc(m.area)}">
          <span class="area">${esc(m.area)}</span><h3>${esc(m.title)}</h3><p class="br">${esc(m.brief)}</p>
          ${m.figures.length ? `<div class="q-figs">${m.figures.map(([v,l])=>`<div class="q-fig"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>` : ''}
          ${m.rows.length ? `<dl class="q-rows">${m.rows.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
          ${m.src.length ? `<div class="q-refs">Fonti ${m.src.filter(s=>srcN[s]).map(s=>`<button type="button" class="q-ref" data-goto="q-src-${s}" aria-label="Fonte ${srcN[s]}">${srcN[s]}</button>`).join('')}</div>` : ''}

      <section class="qd-sec" id="q-cambia"><h2>Cosa sta cambiando</h2>
        <ol class="q-tl">${q.timeline.map(t=>`<li class="${stCls(t.state)}"><span class="w">${esc(t.when)}</span><span class="t">${esc(t.what)}</span><span class="q-st ${stCls(t.state)}">${esc(t.state)}</span></li>`).join('')}</ol>

      <section class="qd-sec" id="q-esempi"><h2>Esempi pratici</h2><p class="hint">Casi indicativi, calcolati con gli importi base del ${itDate(q.updated).split(' ').pop()}. Non tengono conto di tutte le maggiorazioni possibili.</p>
        <div class="q-ex">${q.examples.map((x,i)=>`<article><span class="n">Caso ${i+1}</span><h3>${esc(x.title)}</h3><p class="setup">${esc(x.setup)}</p><p>${esc(x.text)}</p></article>`).join('')}</div>

        <div class="q-ideas">${q.ideas.map(x => { const e = entry(x.entry); if (!e) return '';
          return `<div class="q-idea"><div><blockquote>«${esc(x.quote)}»</blockquote>${x.why?`<p class="why">${esc(x.why)}</p>`:''}</div>
            <div class="who"><b>${esc(namesOf(e) || e.author)}</b>${esc(e.title)}<br>${readable(e)?`<a href="#${e.id}">Leggi l’articolo</a>`:`<span class="hint">Su carta, p. ${e.page}</span>`}</div></div>`; }).join('')}</div>

        <div class="q-log qd-sec" id="q-log"><h3>Storico delle modifiche</h3><ol>${q.changelog.map(c=>`<li><time datetime="${esc(c.date)}">${itDate(c.date)}</time><span>${esc(c.text)}</span></li>`).join('')}</ol></div>
        <p class="q-disc">Questa scheda ha scopo informativo e non costituisce consulenza legale, fiscale o previdenziale. Importi, requisiti e scadenze vanno verificati sui testi ufficiali e presso l’INPS o un patronato prima di presentare una domanda.</p>
      </section>
    </div>
  </div></div>`;
}

/* --- modifica --- */
const fld = (path, val, label, o={}) => `<label class="qf ${o.cls||''}"><span>${label}</span>${o.input ? `<input type="${o.input}" data-path="${path}" value="${esc(val||'')}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}>` : `<textarea data-path="${path}" rows="${o.rows||2}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}>${esc(val||'')}</textarea>`}<span class="err-msg" hidden></span></label>`;
const ta = (path, val, ph, label) => `<textarea data-path="${path}" rows="1" placeholder="${esc(ph)}" aria-label="${esc(label||ph)}">${esc(val||'')}</textarea>`;
const ctl = (list, i, n, what) => `<div class="q-ctl"><button type="button" data-act="up" data-list="${list}" data-i="${i}" ${i===0?'disabled':''} aria-label="Sposta su ${what}">↑</button><button type="button" data-act="down" data-list="${list}" data-i="${i}" ${i===n-1?'disabled':''} aria-label="Sposta giù ${what}">↓</button><button type="button" class="del" data-act="del" data-list="${list}" data-i="${i}" aria-label="Elimina ${what}">Elimina</button></div>`;
const sel = (path, val, opts, label) => `<select data-path="${path}" aria-label="${esc(label)}">${opts.map(o => { const [v,l] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`; }).join('')}</select>`;

  return `<div class="qd editing" data-issue="${id}">
  <header class="qd-head"><div class="wrap">
    <div class="kicker">Modalità redazione · N.${iss.num}</div>
    ${fld('title', q.title, 'Titolo della scheda', {cls:'title', rows:1})}

    <div class="q-edit-note" role="note"><span>${CAN.demo ? '<b>Anteprima della modalità redazione.</b> Puoi modificare testi, cifre, link e fonti, aggiungere o spostare elementi: in questa versione dimostrativa nulla viene pubblicato. Nella versione definitiva, al salvataggio la scheda si aggiorna per tutti, la data “Aggiornata al” diventa quella di oggi e la nota finisce nello storico.' : '<b>Stai modificando la scheda.</b> I lettori continuano a vedere la versione pubblicata finché non salvi. Al salvataggio la data “Aggiornata al” diventa quella di oggi e la nota finisce nello storico.'}</span></div>

    <div class="qd-main">
      <section class="qd-sec" id="q-breve"><h2>In trenta secondi</h2>
        ${fld('brief', q.brief.join('\n\n'), 'Testo: separa i paragrafi con una riga vuota', {cls:'big', rows:6})}</section>

          <button type="button" class="q-add" data-act="add" data-list="measures.${i}.rows">+ Aggiungi un dettaglio</button>
          <div class="q-sub">Fonti collegate</div>
          <div class="q-picks">${srcOpts.map(([sid,n])=>`<label title="${esc(q.sources[n-1].label)}"><input type="checkbox" data-srcpick="${i}" value="${sid}" ${m.src.includes(sid)?'checked':''}>${n}</label>`).join('')}</div>
        </div>`).join('')}</div>
        <datalist id="q-areas">${AREAS.map(a=>`<option value="${esc(a)}">`).join('')}</datalist>
        <button type="button" class="q-add" data-act="add" data-list="measures" style="margin-top:14px">+ Aggiungi una misura</button>

      <section class="qd-sec" id="q-cambia"><h2>Cosa sta cambiando</h2>

      <section class="qd-sec" id="q-esempi"><h2>Esempi pratici</h2>
        <div class="q-ex">${q.examples.map((x,i)=>`<div class="q-ed"><div class="q-ed-head"><span class="n">Caso ${i+1}</span>${ctl('examples',i,q.examples.length,'esempio')}</div>
          ${fld(`examples.${i}.title`, x.title, 'Titolo', {rows:1})}${fld(`examples.${i}.setup`, x.setup, 'Situazione di partenza')}${fld(`examples.${i}.text`, x.text, 'Che cosa spetta', {rows:4})}</div>`).join('')}</div>

      <section class="qd-sec" id="q-idee"><h2>Le idee della rivista</h2>

          <label class="qf"><span>Articolo</span>${sel(`ideas.${i}.entry`, x.entry, issueEntries.map(e=>[e.id, `${e.author||e.partner} · ${e.title}`]), 'Articolo')}</label>

              <a href="${esc(s.url)}" target="_blank" rel="noopener" data-open="${i}">Apri ${ARROW}</a>

    <div class="msg" id="q-msg" aria-live="polite"></div>
  </div></div>
  </div>`;
}

  measures: () => ({id:'m'+Date.now().toString(36), area:'Sostegno economico', title:'', brief:'', figures:[['','']], rows:[['','']], src:[]}),
  figures: () => ['',''], rows: () => ['',''],
  timeline: () => ({when:'', what:'', state:'atteso'}),
  examples: () => ({title:'', setup:'', text:''}),
  ideas: () => ({entry:'', quote:'', why:''}),
  sources: () => ({id:'s'+Date.now().toString(36), kind:'Legge', label:'', url:'', ok:false}),
};
const getAt = (o, path) => path.split('.').reduce((a,k)=>a==null?a:a[k], o);
function setAt(o, path, v){ const ks = path.split('.'); const last = ks.pop(); const t = ks.reduce((a,k)=>a[k], o); t[last] = v; }
function markDirty(){ ED.dirty = true; const s = document.getElementById('q-state'); if (s) s.innerHTML = '<span class="dirty">Modifiche non salvate</span>'; }
function qMsg(html){ const m = document.getElementById('q-msg'); if (m) m.innerHTML = html; }
function toast(t){ const el = document.createElement('div'); el.className = 'q-toast'; el.setAttribute('role','status'); el.textContent = t; document.body.appendChild(el); setTimeout(()=>el.remove(), 3200); }

function renderQuadro(id, keepScroll){
  const y = window.scrollY;
  nav('quadro');
  app.innerHTML = (ED.on && ED.issue === id) ? qEdit(id) : qView(id);
  if (keepScroll) window.scrollTo(0, y);
  wireQuadro(id);
}

function wireQuadro(id){
  const root = app.querySelector('.qd'); if (!root) return;
  // filtri per ambito
  root.querySelectorAll('[data-area]').forEach(b => b.tagName==='BUTTON' && b.addEventListener('click', () => {
    root.querySelectorAll('.q-filter .chip').forEach(c => c.setAttribute('aria-pressed', String(c===b)));
    root.querySelectorAll('.q-m').forEach(m => { m.hidden = !(b.dataset.area==='Tutte' || m.dataset.area===b.dataset.area); });
  }));
  // indice laterale: evidenzia la sezione visibile
  const toc = [...root.querySelectorAll('.qd-toc button')];
  if ('IntersectionObserver' in window && toc.length){
    const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) toc.forEach(b => b.setAttribute('aria-current', String(b.dataset.goto === en.target.id))); }), {rootMargin:'-30% 0px -60% 0px'});
    toc.forEach(b => { const s = document.getElementById(b.dataset.goto); if (s) io.observe(s); });
  }
  if (!ED.on){
    const eb = document.getElementById('q-edit');
    if (eb) eb.addEventListener('click', () => qStartEdit(id));
    const vb = document.getElementById('q-verify');
    if (vb) vb.addEventListener('click', () => qVerify(id, vb));
    const hb = document.getElementById('q-hist-btn');
    if (hb) hb.addEventListener('click', () => qHistory(id, hb));
    return;
  }
  // modifica
  const grow = el => { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; };
  root.querySelectorAll('textarea').forEach(grow);
  root.addEventListener('input', ev => {
    const t = ev.target;
    if (t.tagName === 'TEXTAREA') grow(t);
    if (t.dataset.path){
      let v = t.type === 'checkbox' ? t.checked : t.value;
      if (t.dataset.path === 'brief') v = v.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
      setAt(ED.draft, t.dataset.path, v); markDirty();
      if (/^sources\.\d+\.url$/.test(t.dataset.path)){ const a = t.closest('.urlrow').querySelector('a'); a.href = t.value; }
      const box = t.closest('.qf'); if (box && box.classList.contains('err')){ box.classList.remove('err'); box.querySelector('.err-msg').hidden = true; }
    } else if (t.dataset.srcpick !== undefined){
      const m = ED.draft.measures[+t.dataset.srcpick]; const set = new Set(m.src); t.checked ? set.add(t.value) : set.delete(t.value);
      m.src = ED.draft.sources.map(s=>s.id).filter(s=>set.has(s)); markDirty();
    } else if (t.dataset.relpick !== undefined){
      const set = new Set(ED.draft.related||[]); t.checked ? set.add(t.value) : set.delete(t.value); ED.draft.related = [...set]; markDirty();
    }
  });
  root.addEventListener('change', ev => { if (ev.target.tagName === 'SELECT') ev.target.dispatchEvent(new Event('input', {bubbles:true})); });
  root.addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const list = getAt(ED.draft, b.dataset.list), i = +b.dataset.i, act = b.dataset.act;
    if (act === 'add'){ const key = b.dataset.list.split('.').pop(); list.push(TEMPL[key]()); }
    else if (act === 'up' && i > 0) [list[i-1], list[i]] = [list[i], list[i-1]];
    else if (act === 'down' && i < list.length-1) [list[i+1], list[i]] = [list[i], list[i+1]];
    else if (act === 'del'){
      const gone = list.splice(i,1)[0];
      if (b.dataset.list === 'sources') ED.draft.measures.forEach(m => m.src = m.src.filter(s => s !== gone.id));
      toast('Elemento eliminato. Puoi ancora annullare tutte le modifiche.');
    }
    markDirty(); renderQuadro(id, true);
    if (act === 'add'){ const n = getAt(ED.draft, b.dataset.list).length - 1; const f = app.querySelector(`[data-path^="${b.dataset.list}.${n}."]`); if (f){ f.scrollIntoView({block:'center'}); f.focus({preventScroll:true}); } }
  });
  document.getElementById('q-cancel').addEventListener('click', () => qStopEdit(id));
  document.getElementById('q-save').addEventListener('click', () => qSave(id, false));
}

function qStartEdit(id, from){
  ED.on = true; ED.issue = id; ED.draft = clone(from || qGet(id)); ED.startRev = qRev(id); ED.dirty = !!from; ED.conflict = false;
  renderQuadro(id); window.scrollTo(0,0);
}
function qStopEdit(id, force){
  if (ED.dirty && !force){
    qMsg(`Le modifiche non salvate andranno perse. <button type="button" class="btn" id="q-discard">Esci senza salvare</button><button type="button" class="btn" id="q-stay">Continua a modificare</button>`);
    document.getElementById('q-discard').onclick = () => qStopEdit(id, true);
    document.getElementById('q-stay').onclick = () => qMsg('');
    return;
  }
  ED.on = false; ED.draft = null; ED.dirty = false; ED.issue = null;
  renderQuadro(id);
}

function qValidate(){
  let first = null; const bad = (path, msg) => {
    const el = app.querySelector(`[data-path="${path}"]`); if (!el) return; const box = el.closest('.qf');
    if (box){ box.classList.add('err'); const m = box.querySelector('.err-msg'); if (m){ m.textContent = msg; m.hidden = false; } }
    else el.style.borderColor = '#C0392B';
    first ||= el;
  };
  const q = ED.draft;
  if (!q.title.trim()) bad('title', 'Il titolo non può essere vuoto.');
  q.measures.forEach((m,i) => { if (!m.title.trim()) bad(`measures.${i}.title`, 'Dai un titolo alla misura.'); });
  q.sources.forEach((s,i) => { if (!/^https?:\/\/[^\s.]+\.[^\s]+$/.test(s.url.trim())) bad(`sources.${i}.url`, 'Inserisci un link completo, che inizi con https://'); if (!s.label.trim()) bad(`sources.${i}.label`, 'Manca il titolo della fonte.'); });
  q.ideas.forEach((x,i) => { if (!x.entry) bad(`ideas.${i}.entry`, 'Scegli l’articolo.'); if (!x.quote.trim()) bad(`ideas.${i}.quote`, 'Manca la citazione.'); });
  if (first){ first.scrollIntoView({behavior:'smooth', block:'center'}); first.focus({preventScroll:true}); return false; }
  return true;
}

async function qWrite(id, content, note, force){
  const ref = CAN.db.doc('quadro/' + id);
  const cur = await ref.get();
  const prev = cur.exists ? cur.data() : null;
  const prevRev = prev ? prev.rev || 0 : 0;
  if (!force && prevRev !== ED.startRev) return {conflict:true, prev};
  await ref.collection('history').doc('r' + String(prevRev).padStart(5,'0')).set({
    rev: prevRev, content: prev ? prev.content : QBASE[id], savedAt: prev ? prev.savedAt : null, by: prev ? prev.by || null : null,
    note: prev ? prev.note || '' : 'Versione originale della scheda'});
  const doc = {content, rev: prevRev + 1, savedAt: new Date().toISOString(), by: CAN.me, note};
  await ref.set(doc);
  QLIVE[id] = doc;
  return {ok:true};
}

async function qSave(id, force){
  if (ED.saving) return;
  if (CAN.demo){
    if (!qValidate()){ qMsg('Controlla i campi evidenziati in rosso.'); return; }
    qMsg(`Anteprima: le modifiche non vengono pubblicate. Nella versione definitiva la scheda si aggiornerebbe ora per tutti i lettori, con la data di oggi e la tua nota nello storico. <button type="button" class="btn" id="q-demo-exit">Esci dall’anteprima</button><button type="button" class="btn" id="q-stay">Continua a provare</button>`);
    document.getElementById('q-demo-exit').onclick = () => qStopEdit(id, true);
    document.getElementById('q-stay').onclick = () => qMsg('');
    return;
  }
  if (!CAN.db){ qMsg('Il salvataggio non è disponibile in questa visualizzazione.'); return; }
  if (!ED.dirty && !force){ qMsg('Non ci sono modifiche da salvare.'); return; }
  if (!qValidate()){ qMsg('Controlla i campi evidenziati in rosso.'); return; }
  const note = (document.getElementById('q-note').value || '').trim() || 'Aggiornamento dei contenuti.';
  const content = clone(ED.draft);
  content.brief = (Array.isArray(content.brief) ? content.brief : [content.brief]).filter(Boolean);
  content.updated = todayISO();
  content.changelog = [{date: content.updated, text: note}, ...(content.changelog||[])];
  const btn = document.getElementById('q-save'); ED.saving = true; btn.disabled = true; btn.textContent = 'Salvataggio…';
  try {
    const r = await qWrite(id, content, note, force);
    if (r.conflict){
      ED.saving = false; btn.disabled = false; btn.textContent = 'Salva e pubblica';
      const when = r.prev && r.prev.savedAt ? new Date(r.prev.savedAt).toLocaleString('it-IT', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}) : '';
      qMsg(`Mentre modificavi, un’altra persona ha salvato una nuova versione${when?` (${when})`:''}. <button type="button" class="btn" id="q-force">Sovrascrivi con la mia</button><button type="button" class="btn" id="q-reload">Riparti dalla nuova</button>`);
      document.getElementById('q-force').onclick = () => qSave(id, true);
      document.getElementById('q-reload').onclick = () => { ED.on = false; ED.dirty = false; qStartEdit(id); };
      return;
    }
    ED.saving = false; ED.on = false; ED.dirty = false; ED.draft = null;
    renderQuadro(id); window.scrollTo(0,0); toast('Scheda salvata e pubblicata.');
  } catch(err){
    ED.saving = false; btn.disabled = false; btn.textContent = 'Salva e pubblica';
    qMsg(err && err.code === 'invalid_argument' ? 'Non hai i permessi per salvare questa scheda.' : 'Salvataggio non riuscito. Riprova tra qualche secondo: le modifiche sono ancora qui.');
  }
}

async function qVerify(id, btn){
  if (!CAN.db) return;
  btn.disabled = true; btn.textContent = 'Salvataggio…';
  const content = clone(qGet(id)); content.updated = todayISO();
  content.changelog = [{date: content.updated, text: 'Verifica periodica delle fonti: nessuna modifica ai contenuti.'}, ...(content.changelog||[])];
  ED.startRev = qRev(id);
  try { const r = await qWrite(id, content, 'Verifica periodica', true); if (r.ok){ renderQuadro(id, true); toast('Data di aggiornamento portata a oggi.'); } }
  catch(err){ btn.disabled = false; btn.textContent = 'Segna come verificata oggi'; toast('Operazione non riuscita. Riprova.'); }
}

async function qHistory(id, btn){
  const box = document.getElementById('q-hist-box');
  if (btn.getAttribute('aria-expanded') === 'true'){ box.innerHTML = ''; btn.setAttribute('aria-expanded','false'); return; }
  btn.setAttribute('aria-expanded','true');
  box.innerHTML = `<div class="q-hist"><h3>Versioni precedenti</h3><ol><li><span class="meta">Caricamento…</span></li></ol></div>`;
  let rows = [];
  try { const s = await CAN.db.doc('quadro/'+id).collection('history').orderBy('rev','desc').limit(50).get(); rows = s.docs.map(d => d.data()); }
  catch(err){ box.querySelector('ol').innerHTML = `<li><span class="meta">Impossibile caricare le versioni precedenti.</span></li>`; return; }
  let names = {};
  try { const ids = [...new Set([...rows.map(r=>r.by), QLIVE[id] && QLIVE[id].by].filter(Boolean))]; if (ids.length && CAN.user && CAN.user.profiles){ const ps = await CAN.user.profiles(ids); ids.forEach(i => names[i] = (ps[i] && ps[i].name) || ''); } } catch(e){}
  const cur = QLIVE[id];
  const fmt = iso => iso ? new Date(iso).toLocaleString('it-IT', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'}) : 'Versione di partenza';
  box.innerHTML = `<div class="q-hist"><h3>Versioni precedenti <button type="button" class="btn" data-restore="base">Torna alla versione originale</button></h3><ol>
    ${cur ? `<li><span><b>In linea</b> · ${esc(fmt(cur.savedAt))}${names[cur.by]?` · ${esc(names[cur.by])}`:''}<br><span class="meta">${esc(cur.note||'')}</span></span><span class="meta">attuale</span></li>` : `<li><span><b>In linea</b> · versione originale</span><span class="meta">attuale</span></li>`}
    ${rows.filter(r => r.rev > 0).map((r,k) => `<li><span>${esc(fmt(r.savedAt))}${names[r.by]?` · ${esc(names[r.by])}`:''}<br><span class="meta">${esc(r.note||'')}</span></span><button type="button" class="btn" data-restore="${k}">Riprendi</button></li>`).join('')}
  </ol></div>`;
  const list = rows.filter(r => r.rev > 0);
  box.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', () => {
    const src = b.dataset.restore === 'base' ? QBASE[id] : list[+b.dataset.restore].content;
    qStartEdit(id, clone(src));
    const n = document.getElementById('q-note'); if (n) n.value = b.dataset.restore === 'base' ? 'Ripristino della versione originale.' : 'Ripristino di una versione precedente.';
    qMsg('Hai caricato una versione precedente come bozza: controlla e salva per pubblicarla.');
  }));
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-goto]'); if (!b) return;
  const el = document.getElementById(b.dataset.goto); if (!el) return;
  ev.preventDefault();
  el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
  if (el.tagName === 'LI'){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 1600); }
});
window.addEventListener('beforeunload', ev => { if (ED.on && ED.dirty && !CAN.demo){ ev.preventDefault(); ev.returnValue = ''; } });

// collegamento al db condiviso (solo dentro claude.ai; altrove resta la versione di base)
(async () => {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch(e){ return; }
  if (!db) return;
  CAN.db = db; CAN.user = user;
  try { CAN.edit = user ? await user.canEdit() : false; CAN.me = user ? await user.id() : null; } catch(e){ CAN.edit = false; }
  let first = true;
  db.collection('quadro').onSnapshot(snap => {
    snap.docs.forEach(d => { const v = d.data(); if (v && v.content) QLIVE[d.id] = v; });
    if (ED.on) { if (!first && QLIVE[ED.issue] && QLIVE[ED.issue].rev !== ED.startRev) qMsg('Un’altra persona ha appena salvato una nuova versione: al salvataggio potrai scegliere quale tenere.'); first = false; return; }
    first = false;
    const h = location.hash.slice(1);
    if (h === 'quadro' || h.startsWith('quadro-') || /^n\d/.test(h)) route(true);
  }, () => {});
  if (CAN.edit && location.hash.startsWith('#quadro-') && !ED.on) route(true);
})();

function route(keep){
  const h = location.hash.slice(1);
  if (ED.on && ED.dirty && !CAN.demo && h !== 'quadro-' + ED.issue){
    history.replaceState(null, '', '#quadro-' + ED.issue);
    qMsg('Hai modifiche non salvate: salva o annulla prima di lasciare la scheda.');
    document.getElementById('q-save') && document.getElementById('q-save').focus();
    return;
  }
  if (ED.on && h !== 'quadro-' + ED.issue){ ED.on = false; ED.draft = null; ED.issue = null; }
  const m = h.match(/^(n\d)(?:-(.+))?$/);
  closeMenu(false);
  if (h === 'comprendere') renderAbout();
  else if (h === 'archivio') renderArchive();
  else if (h === 'autori') renderAuthors();
  else if (h === 'percorsi') renderThemes();
  else if (h.startsWith('percorso-') && THEME[h.slice(9)]) renderTheme(h.slice(9));
  else if (h === 'contatti') renderContacts();
  else if (h === 'quadro') renderQuadroIndex();
  else if (h.startsWith('quadro-') && byId[h.slice(7)] && qGet(h.slice(7))) renderQuadro(h.slice(7));
  else if (h.startsWith('quadro-')) renderQuadroIndex();
  else if (h.startsWith('autore-')) { const n = SLUGS[h.slice(7)]; n ? renderAuthor(n) : renderAuthors(); }
  else if (!m || !byId[m[1]]) renderHome();
  else if (!m[2] || m[2]==='indice') renderIssue(byId[m[1]], m[2]);
  else { const e = ALL.find(x=>x.id===h); if (e && readable(e)) renderRead(e); else renderIssue(byId[m[1]]); }
  if (!keep && !/indice$/.test(h)) window.scrollTo(0,0);
}
window.addEventListener('hashchange', () => route());
route();
})();
</script>
