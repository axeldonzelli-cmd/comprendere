<style>
/* Layout: masthead + three magazine "rooms" (archive, issue, reading); the print grid's 1/3 sidebar + text column carried to screen. */
:root{
  --navy:#002C4D;          /* colore istituzionale della rivista */
  --bg:#FFFFFF;
  --fg:#002C4D;            /* la rivista compone anche il corpo in blu */
  --muted:#4F6576;
  --line:#D5DCE2;
  --sand:#EEE8DA;          /* box biografico */
  --sand-ink:#8C8357;      /* nome autore nel box */
  --deep:#002C4D;          /* superfici blu (soglie, secondo editoriale) */
  --deep-fg:#FFFFFF;
  --deep-accent:#5FC3D6;
  --chip:#EEF2F5;
  --focus:#129EB5;
  --font-display:"Fira Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-text:"Crimson Pro","Iowan Old Style",Georgia,"Times New Roman",serif;
  --step--1:clamp(.8rem,.78rem + .1vw,.86rem);
  --step-0:clamp(1rem,.97rem + .15vw,1.08rem);
  --step-1:clamp(1.18rem,1.1rem + .35vw,1.35rem);
  --step-2:clamp(1.45rem,1.3rem + .7vw,1.85rem);
  --step-3:clamp(1.9rem,1.6rem + 1.4vw,2.8rem);
  --step-4:clamp(2.3rem,1.8rem + 2.6vw,4.2rem);
  /* accenti per numero, presi dalle copertine */
  --n7-acc:#A23B55; --n7-tint:#F8ECD4; --n7-on:#002C4D;
  --n8-acc:#0F5057; --n8-tint:#E1ECEB; --n8-on:#FFFFFF;
  --n9-acc:#80621F; --n9-tint:#E9EDE4; --n9-on:#FFFFFF;
  --n6-acc:#2D5FA8; --n6-tint:#E6EDF7; --n6-on:#FFFFFF;
  --n5-acc:#2D7A5F; --n5-tint:#E5F2EB; --n5-on:#002C4D;
  --n4-acc:#6A4C93; --n4-tint:#EDE8F3; --n4-on:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#00182B; --fg:#E8EEF3; --muted:#9FB2C2; --line:#1E3D55; --sand:#0D2B42; --sand-ink:#CFC38E;
  --deep:#00243F; --deep-fg:#FFFFFF; --deep-accent:#6FD0E2; --chip:#0B2C45; --focus:#5FC3D6;
  --n7-acc:#EE9AAE; --n7-tint:#22231F; --n8-acc:#7FCACA; --n8-tint:#0B2D33; --n9-acc:#DDBB72; --n9-tint:#1A2621; --n6-acc:#8DB4F0; --n6-tint:#0F1F35; --n5-acc:#86D3B2; --n5-tint:#0F2620; --n4-acc:#C5A9EC; --n4-tint:#1E1A2B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#00182B; --fg:#E8EEF3; --muted:#9FB2C2; --line:#1E3D55; --sand:#0D2B42; --sand-ink:#CFC38E;
  --deep:#00243F; --deep-fg:#FFFFFF; --deep-accent:#6FD0E2; --chip:#0B2C45; --focus:#5FC3D6;
  --n7-acc:#EE9AAE; --n7-tint:#22231F; --n8-acc:#7FCACA; --n8-tint:#0B2D33; --n9-acc:#DDBB72; --n9-tint:#1A2621; --n6-acc:#8DB4F0; --n6-tint:#0F1F35; --n5-acc:#86D3B2; --n5-tint:#0F2620; --n4-acc:#C5A9EC; --n4-tint:#1E1A2B;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-text);font-size:var(--step-0);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font-family:var(--font-display);font-size:var(--step--1);letter-spacing:.09em;text-transform:uppercase;font-weight:500}
[data-issue="n7"]{--acc:var(--n7-acc);--tint:var(--n7-tint);--cover-on:var(--n7-on)}
[data-issue="n8"]{--acc:var(--n8-acc);--tint:var(--n8-tint);--cover-on:var(--n8-on)}
[data-issue="n9"]{--acc:var(--n9-acc);--tint:var(--n9-tint);--cover-on:var(--n9-on)}
[data-issue="n6"]{--acc:var(--n6-acc);--tint:var(--n6-tint);--cover-on:var(--n6-on)}
[data-issue="n5"]{--acc:var(--n5-acc);--tint:var(--n5-tint);--cover-on:var(--n5-on)}
[data-issue="n4"]{--acc:var(--n4-acc);--tint:var(--n4-tint);--cover-on:var(--n4-on)}

/* barra superiore */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;padding-block:12px}
.bar .logo{display:block;color:var(--fg)}
.bar .logo svg{height:20px;width:auto;display:block}
.bar nav.quick{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
.bar nav a{font-family:var(--font-display);text-decoration:none;font-size:var(--step--1);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:3px;color:var(--muted)}
.bar nav a[aria-current="page"],.bar nav a:hover{color:var(--fg);background:var(--chip)}
.bar nav a .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px}

/* copertina ricomposta */
.cover{position:relative;aspect-ratio:1100/1362;max-width:100%;background:var(--tint);overflow:hidden;border-radius:2px;box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(0,30,55,.45)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .c-logo{position:absolute;left:9%;right:9%;top:6.5%;color:var(--cover-on)}
.cover .c-logo svg{width:100%;height:auto;display:block}
.cover .c-sub{position:absolute;left:0;right:0;top:19.5%;text-align:center;font-family:var(--font-text);font-size:clamp(5px,1.05cqw,9px);color:var(--cover-on);opacity:.9}
.cover .c-title{position:absolute;right:7%;top:24%;width:58%;text-align:right;font-family:var(--font-display);font-weight:600;line-height:1.02;color:var(--cover-on);font-size:clamp(14px,7.6cqw,46px)}
.cover{container-type:inline-size}
.cover.small .c-sub{display:none}

/* archivio */
.masthead{padding-block:clamp(28px,5vw,64px) 18px}
.masthead .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:end}
.masthead .big-logo{color:var(--fg);width:min(100%,640px)}
.masthead .big-logo svg{width:100%;height:auto;display:block}
.masthead .claim{font-family:var(--font-text);font-style:italic;font-size:var(--step-1);color:var(--muted);margin-top:14px}
.masthead .facts{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);display:grid;gap:4px;border-left:1px solid var(--line);padding-left:16px}
.masthead .facts b{color:var(--fg);font-weight:500}

.latest{padding-block:28px 40px}
.latest .wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.latest .cover{width:100%}
.kicker{font-family:var(--font-display);font-size:var(--step--1);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:600}
.latest h2{font-size:var(--step-4);font-weight:600;margin-top:8px;color:var(--fg)}
.latest .lead{font-size:var(--step-1);margin-top:14px;max-width:46ch}
.secs{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:0;border-top:1px solid var(--line);max-width:620px}
.secs li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--font-display);font-size:var(--step-0)}
.secs li span{color:var(--acc);font-variant-numeric:tabular-nums;font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{font-family:var(--font-display);font-size:var(--step-0);font-weight:500;text-decoration:none;padding:10px 16px;border-radius:3px;border:1px solid var(--fg);color:var(--fg);background:transparent;cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--deep-fg);color:#002C4D;border-color:var(--deep-fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--deep-fg);color:#002C4D;border-color:var(--deep-fg)}}
.btn:hover{border-color:var(--acc,var(--focus))}
.stat{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);margin-top:14px}

.shelf{padding-block:36px;border-top:1px solid var(--line)}
.shelf h3,.finder h3,.idx-head h2{font-size:var(--step-2);font-weight:500}
.shelf .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:28px;margin-top:20px}
.issue-card{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;text-decoration:none;align-items:start}
.issue-card h4{font-size:var(--step-2);font-weight:600;margin-top:4px}
.issue-card p{margin-top:8px;color:var(--muted);font-size:var(--step-0)}
.issue-card:hover h4{color:var(--acc)}

.finder{padding-block:36px 56px;border-top:1px solid var(--line)}
.finder .intro{color:var(--muted);margin-top:6px;max-width:62ch}
.field{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.field input{flex:1 1 260px;min-width:0;font-family:var(--font-display);font-size:var(--step-1);padding:12px 14px;border:1px solid var(--line);border-bottom:2px solid var(--fg);border-radius:3px 3px 0 0;background:var(--bg);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.chip{font-family:var(--font-display);font-size:var(--step--1);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.chip.zero{opacity:.45}
.chip.more{background:transparent;border-color:var(--fg);font-weight:500}
.chip.more[aria-expanded="true"]{background:var(--fg);color:var(--bg)}
.all-auth{margin-top:16px;padding:18px 0 4px;border-top:1px solid var(--line)}
.aa-cols{columns:4 210px;column-gap:28px;margin-top:14px}
.aa-group{break-inside:avoid;margin-bottom:14px}
.aa-letter{font-family:var(--font-display);font-weight:600;color:var(--muted);font-size:var(--step--1);letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:4px}
.aa-name{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:4px 0;font-family:var(--font-display);font-size:var(--step-0)}
.aa-name small{color:var(--muted);font-size:var(--step--1);white-space:nowrap;font-variant-numeric:tabular-nums}
.aa-name:hover span{text-decoration:underline;text-underline-offset:3px}
.aa-name:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pcard{background:var(--sand);padding:20px 22px;border-radius:2px;margin:18px 0 6px;display:grid;gap:10px;max-width:780px}
.pc-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.pc-head h4{font-size:var(--step-2);font-weight:600}
.pc-head .tags{display:flex;gap:6px}
.pc-bio,.pc-role{font-family:var(--font-display);font-size:var(--step-0);line-height:1.5;font-weight:300;max-width:70ch}
.pc-bio strong{font-weight:600;color:var(--sand-ink)}
.pc-role{font-weight:400}
.pc-what{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.chip.zero[aria-pressed="true"]{opacity:1}
.results{margin-top:18px;border-top:1px solid var(--line)}
.hint{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);margin-top:12px}

/* righe dell'indice */
.entry{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:baseline}
.entry .pg{font-family:var(--font-display);font-variant-numeric:tabular-nums;color:var(--muted);font-size:var(--step--1)}
.entry .t{font-family:var(--font-display);font-size:var(--step-1);font-weight:500;line-height:1.2}
.entry a.t{text-decoration:none}
.entry a.t:hover{text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px}
.entry .by{font-family:var(--font-display);font-size:var(--step-0);color:var(--muted);margin-top:3px;font-weight:300}
.entry .by b{font-weight:500;color:var(--fg)}
.entry .by button{all:unset;cursor:pointer;font-weight:500;color:var(--fg);border-bottom:1px dotted var(--muted)}
.entry .by button:hover{color:var(--acc)}
.entry .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-family:var(--font-display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted)}
.tag.partner{border-style:dashed}
.tag.iss{border-color:var(--acc);color:var(--acc)}
.entry .go{font-family:var(--font-display);font-size:var(--step--1);white-space:nowrap;text-align:right}
.entry .go a{color:var(--acc);font-weight:600;text-decoration:none}
.entry .go a:hover{text-decoration:underline}
.entry .go span{color:var(--muted)}
.entry.off .t{color:var(--muted);font-weight:400}

/* pagina del numero */
.ihero{background:var(--tint);padding-block:clamp(28px,5vw,60px)}
.ihero .wrap{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center}
.ihero h1{font-size:var(--step-4);margin-top:10px}
.ihero .lead{font-size:var(--step-1);margin-top:16px;max-width:48ch}
.meta-line{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);margin-top:16px;display:flex;flex-wrap:wrap;gap:6px 18px}

.soglia-band{background:var(--deep);color:var(--deep-fg)}
.soglia-band .wrap{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:28px;padding-block:clamp(32px,5vw,56px)}
.soglia-band .label{color:var(--deep-accent)}
.soglia-band h3{font-size:var(--step-2);font-weight:600;margin-top:8px}
.soglia-band .who{font-family:var(--font-display);font-weight:400;margin-top:4px;font-size:var(--step-1)}
.soglia-band blockquote{margin:0;font-size:var(--step-1);line-height:1.55;max-width:60ch;white-space:pre-line}
.soglia-band a{color:var(--deep-fg);font-family:var(--font-display);font-size:var(--step--1);letter-spacing:.06em;text-transform:uppercase;display:inline-block;margin-top:16px}

.eds{padding-block:44px 8px}
.eds .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px;margin-top:18px}
.ed{display:flex;flex-direction:column;gap:10px;padding:24px;border:1px solid var(--line);border-radius:3px;text-decoration:none;min-width:0}
.ed.navy{background:var(--deep);color:var(--deep-fg);border-color:var(--deep)}
.ed h3{font-size:var(--step-2);font-weight:600}
.ed .who{font-family:var(--font-display);font-size:var(--step-0)}
.ed p{font-size:var(--step-0);opacity:.92}
.ed .more{font-family:var(--font-display);font-size:var(--step--1);letter-spacing:.06em;text-transform:uppercase;margin-top:auto}
.ed:hover h3{text-decoration:underline;text-underline-offset:4px}

.idx{padding-block:40px 64px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 56px)}
.idx-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;border-bottom:2px solid var(--fg);padding-bottom:12px}
.idx-head .count{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.idx-tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:16px}
.idx-tools input[type=search]{flex:1 1 220px;min-width:0;font-family:var(--font-display);font-size:var(--step-0);padding:9px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg)}
.toggle{font-family:var(--font-display);font-size:var(--step--1);display:flex;gap:8px;align-items:center;cursor:pointer}
.toggle input{accent-color:var(--acc);width:16px;height:16px}
.sec{margin-top:34px;display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:28px}
.sec-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;display:grid;gap:10px}
.sec-side .ph{aspect-ratio:4/3;max-width:100%;overflow:hidden;border-radius:2px;background:var(--tint)}
.sec-side .ph img{width:100%;height:100%;object-fit:cover;display:block}
.sec-side h3{font-size:var(--step-2);font-weight:600}
.sec-side p{font-size:var(--step-0);color:var(--muted);font-style:italic}
.sec-side .n{font-family:var(--font-display);font-size:var(--step--1);color:var(--acc);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.sec-list{border-top:1px solid var(--line);min-width:0}
.empty{font-family:var(--font-display);color:var(--muted);padding:14px 0}
.others{border-top:1px solid var(--line);padding-block:36px 60px}

/* lettura */
.read-top{background:var(--tint);padding-block:14px}
.read-top .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--font-display);font-size:var(--step--1)}
.read-top a{text-decoration:none;color:var(--acc);font-weight:600}
.read-top span{color:var(--muted)}
.article{padding-block:clamp(28px,5vw,64px) 40px}
.article .wrap{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:clamp(24px,4vw,56px)}
.art-head{grid-column:2}
.art-head .kicker{margin-bottom:12px}
.art-head h1{font-size:var(--step-4);font-weight:300;line-height:1.04;letter-spacing:-.005em}
.art-head h1.ed-title{font-weight:600;font-size:var(--step-3)}
.byline{font-family:var(--font-display);font-size:var(--step-1);margin-top:18px}
.byline .pre{font-weight:200}
.byline b{font-weight:600}
.art-meta{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 16px}
.aside{grid-column:1;grid-row:2;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.bio{background:var(--sand);padding:16px 18px;font-family:var(--font-display);font-size:var(--step--1);line-height:1.45;border-radius:2px}
.bio strong{color:var(--sand-ink);font-weight:600}
.toc-mini{margin-top:18px;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.toc-mini a{color:var(--acc);text-decoration:none;font-weight:600}
.body{grid-column:2;grid-row:2;max-width:66ch;min-width:0}
.body p{font-size:clamp(1.12rem,1.05rem + .3vw,1.27rem);line-height:1.62;margin-bottom:.9em;hyphens:auto;-webkit-hyphens:auto}
.body > p:first-child:not(.q):not(.attr)::first-letter{font-family:var(--font-display);font-weight:600;float:left;font-size:3.3em;line-height:.86;padding:.06em .08em 0 0;color:var(--acc)}
.body h3{font-family:var(--font-text);font-weight:600;font-size:var(--step-1);margin:1.6em 0 .6em}
.body .attr{font-family:var(--font-display);font-size:var(--step--1);text-align:right;opacity:.8;margin:-.3em 0 1.6em}
.body sup{font-size:.62em;line-height:0;font-family:var(--font-display);font-weight:600;color:var(--acc)}
.article.navy .body sup{color:var(--deep-accent)}
.body strong.sp{font-family:var(--font-display);font-weight:600;font-size:.82em;letter-spacing:.06em;color:var(--acc);margin-right:.35em}
.article.navy .body strong.sp{color:var(--deep-accent)}
.body p strong{font-weight:600}
.notes{margin:2em 0 0;padding:1em 0 0;border-top:1px solid var(--line);font-family:var(--font-display);font-size:var(--step--1);line-height:1.5;list-style:none;display:grid;gap:.7em}
.notes li{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:4px}
.notes b{color:var(--acc)}
.legend{font-family:var(--font-display);font-size:var(--step--1);margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 14px;opacity:.9}
.legend b{color:var(--acc);letter-spacing:.06em;margin-right:4px}
.article.navy .legend b{color:var(--deep-accent)}
.body .q{font-family:var(--font-text);font-weight:600;font-size:clamp(1.12rem,1.05rem + .3vw,1.27rem);line-height:1.5;margin:1.5em 0 .5em}
.article.navy{background:var(--deep);color:var(--deep-fg)}
.article.navy .art-meta,.article.navy .bio{color:var(--deep-fg)}
.article.navy .art-meta{opacity:.8}
.article.navy .kicker{color:var(--deep-accent)}
.article.navy .body > p:first-child::first-letter{color:var(--deep-accent)}
.epi .body p{font-size:clamp(1.2rem,1.1rem + .4vw,1.4rem);white-space:pre-line}
.epi .body > p:first-child::first-letter{all:unset}
.rights{font-family:var(--font-display);font-size:var(--step--1);margin-top:22px;padding:12px 14px;border:1px dashed currentColor;border-radius:3px;opacity:.85;max-width:66ch}
.pager{border-top:1px solid var(--line);padding-block:28px 64px}
.pager .wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.pager a{text-decoration:none;display:grid;gap:4px}
.pager a:last-child{text-align:right}
.pager .label{color:var(--muted)}
.pager .t{font-family:var(--font-display);font-size:var(--step-1);font-weight:500}
.pager a:hover .t{color:var(--acc)}
.foot{border-top:1px solid var(--line);padding-block:22px 34px;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media (max-width:820px){
  .masthead .wrap,.latest .wrap,.ihero .wrap,.soglia-band .wrap{grid-template-columns:minmax(0,1fr)}
  .latest .cover,.ihero .cover{max-width:300px}
  .sec{grid-template-columns:minmax(0,1fr);gap:14px}
  .sec-side{position:static;grid-template-columns:110px minmax(0,1fr);align-items:start;gap:4px 14px}
  .sec-side .ph{grid-row:span 3}
  .sec-side:not(:has(.ph)){grid-template-columns:minmax(0,1fr)}
  .article .wrap{grid-template-columns:minmax(0,1fr)}
  .art-head,.body,.aside{grid-column:1}
  .aside{grid-row:auto;position:static}
  .body{grid-row:auto}
  .entry{grid-template-columns:2.6em minmax(0,1fr)}
  .entry .go{grid-column:2;text-align:left}
  .bar .logo svg{height:16px}
  .bar .wrap{gap:12px}
  .bar nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}
  .bar nav::-webkit-scrollbar{display:none}
  .bar nav a{white-space:nowrap;padding:6px 8px}
}

/* menu */
.burger{margin-left:8px;display:inline-flex;align-items:center;gap:10px;background:transparent;border:1px solid var(--line);border-radius:3px;padding:7px 10px 7px 12px;color:var(--fg);font-family:var(--font-display);font-size:var(--step--1);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.burger:hover{border-color:var(--fg)}
.burger-ico{display:grid;gap:4px;width:18px}
.burger-ico i{display:block;height:1.5px;background:currentColor;border-radius:1px}
.burger-ico i:nth-child(2){width:70%;justify-self:end}
.menu{position:fixed;inset:0;z-index:50}
.menu-scrim{position:absolute;inset:0;background:rgba(0,20,36,.45);opacity:0;transition:opacity .2s ease}
.menu-panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--deep);color:var(--deep-fg);overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(22px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) 26px;display:grid;align-content:start;gap:26px}
.menu.open .menu-scrim{opacity:1}
.menu.open .menu-panel{transform:none}
html.menu-on{overflow:hidden}
.menu-top{display:flex;justify-content:space-between;align-items:center}
.menu-logo svg{height:18px;width:auto;display:block;color:var(--deep-fg)}
.menu-close{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--deep-fg);border-radius:3px;padding:6px 10px;font-family:var(--font-display);font-size:var(--step--1);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.menu-main{display:grid;border-top:1px solid rgba(255,255,255,.18)}
.menu-main a{display:grid;gap:2px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.18);text-decoration:none;color:var(--deep-fg)}
.mm-l{font-family:var(--font-display);font-weight:500;font-size:var(--step-3);line-height:1.05}
.mm-s{font-family:var(--font-text);font-style:italic;font-size:var(--step-0);opacity:.75}
.menu-main a:hover .mm-l,.menu-main a[aria-current="page"] .mm-l{color:var(--deep-accent)}
.menu-issues .label{color:var(--deep-accent);margin-bottom:10px}
#menu-issues{display:grid;gap:4px}
.mi{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:center;padding:6px 0;text-decoration:none;color:var(--deep-fg)}
.mi-cov{width:38px;aspect-ratio:1100/1362;overflow:hidden;border-radius:1px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mi-cov img{width:100%;height:100%;object-fit:cover;display:block}
.mi-t{display:grid;min-width:0}
.mi-n{font-family:var(--font-display);font-size:var(--step--1);opacity:.75}
.mi-title{font-family:var(--font-display);font-size:var(--step-0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .dot,.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px}
.mi:hover .mi-title,.mi[aria-current="page"] .mi-title{text-decoration:underline;text-underline-offset:3px}
.menu-panel [data-issue="n4"]{--acc:#C5A9EC}.menu-panel [data-issue="n5"]{--acc:#86D3B2}.menu-panel [data-issue="n6"]{--acc:#8DB4F0}
.menu-panel [data-issue="n7"]{--acc:#EE9AAE}.menu-panel [data-issue="n8"]{--acc:#7FCACA}.menu-panel [data-issue="n9"]{--acc:#DDBB72}
.foot-links{display:flex;gap:14px;flex-wrap:wrap}
.foot-links a{color:var(--muted)}

/* testate di pagina */
.page-head{padding-block:clamp(32px,6vw,72px) 18px}
.page-head h1{font-size:var(--step-4);margin-top:10px;max-width:20ch}
.page-head .kicker{color:var(--muted)}
.page-head .lead{font-size:var(--step-1);margin-top:14px;max-width:58ch;color:var(--muted)}

/* comprendere */
.about-hero{background:var(--deep);color:var(--deep-fg)}
.about-hero .wrap{padding-block:clamp(40px,7vw,96px);display:grid;gap:26px}
.about-logo{width:min(100%,720px);color:var(--deep-fg)}
.about-logo svg{width:100%;height:auto;display:block}
.about-tag{font-family:var(--font-text);font-weight:400;font-size:var(--step-2);line-height:1.3;max-width:34ch;font-style:italic}
.about-body .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:clamp(28px,5vw,72px);padding-block:clamp(32px,5vw,64px)}
.about-text{display:grid;gap:1em;max-width:64ch;align-content:start}
.about-text p{font-size:clamp(1.15rem,1.05rem + .4vw,1.35rem);line-height:1.6}
.about-text p:first-child::first-letter{font-family:var(--font-display);font-weight:600;float:left;font-size:3.2em;line-height:.86;padding:.06em .08em 0 0}
.masthead-box{border-top:2px solid var(--fg);padding-top:12px;align-self:start}
.masthead-box .label{color:var(--muted)}
.masthead-box dl{margin:12px 0 0;display:grid;gap:12px}
.masthead-box dt{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);letter-spacing:.04em}
.masthead-box dd{margin:2px 0 0;font-family:var(--font-display);font-size:var(--step-0)}
.masthead-box dd a{text-decoration:none;border-bottom:1px dotted var(--muted)}
.masthead-box dd a:hover{border-bottom-color:var(--fg)}
.about-shelf{border-top:1px solid var(--line)}
.about-shelf .wrap{padding-block:32px 56px;display:grid;gap:18px;justify-items:start}
.about-shelf .label{color:var(--muted)}
.mini-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px;width:100%}
.mini-shelf a{display:grid;gap:6px;text-decoration:none;font-family:var(--font-display);font-size:var(--step--1);color:var(--acc);font-weight:600}
.mini-shelf a:hover .cover{transform:translateY(-3px)}
.mini-shelf .cover{transition:transform .2s ease}

/* archivio */
.arc .wrap{padding-bottom:64px}
.arc-year{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:24px;border-top:2px solid var(--fg);padding-top:14px;margin-top:26px}
.arc-y{font-family:var(--font-display);font-weight:200;font-size:var(--step-3);line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.arc-list{display:grid}
.arc-row{display:grid;grid-template-columns:136px minmax(0,1fr) auto;gap:clamp(18px,3vw,36px);padding:18px 0 26px;border-bottom:1px solid var(--line);align-items:start;position:relative}
.arc-row:last-child{border-bottom:0}
.arc-row::before{content:"";position:absolute;inset:0 -16px;background:var(--tint);opacity:0;transition:opacity .2s ease;z-index:-1;border-radius:3px}
.arc-row:hover::before{opacity:1}
.arc-cov{display:block}
.arc-cov .cover{transition:transform .25s ease}
.arc-row:hover .arc-cov .cover{transform:rotate(-1.5deg) translateY(-2px)}
.arc-main{min-width:0;display:grid;gap:8px}
.arc-main h2{font-size:var(--step-3);font-weight:600}
.arc-main h2 a{text-decoration:none}
.arc-main h2 a:hover{color:var(--acc)}
.arc-lead{font-size:var(--step-1);max-width:56ch}
.arc-secs{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);max-width:70ch;line-height:1.6}
.arc-foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-family:var(--font-display);font-size:var(--step--1);margin-top:4px}
.arc-foot span{color:var(--muted)}
.arc-foot a{color:var(--acc);font-weight:600;text-decoration:none;letter-spacing:.04em;text-transform:uppercase}
.arc-foot a:hover{text-decoration:underline}
.arc-num{font-family:var(--font-display);font-weight:200;font-size:clamp(3.4rem,2rem + 6vw,7.5rem);line-height:.8;color:var(--acc);font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* autori */
.authors .wrap{padding-bottom:64px}
.au-tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border-top:2px solid var(--fg);padding-top:16px}
.au-tools input{flex:1 1 240px;min-width:0;font-family:var(--font-display);font-size:var(--step-1);padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg)}
.au-letters{display:flex;flex-wrap:wrap;gap:2px}
.au-letters button{all:unset;cursor:pointer;font-family:var(--font-display);font-size:var(--step--1);font-weight:500;width:1.9em;text-align:center;padding:4px 0;border-radius:2px;color:var(--muted)}
.au-letters button:hover,.au-letters button:focus-visible{background:var(--chip);color:var(--fg)}
.au-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.au-legend .idot{margin-right:5px}
.idot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);vertical-align:1px}
.au-cols{columns:3 260px;column-gap:36px;margin-top:22px}
.au-group{break-inside:avoid;margin-bottom:18px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.aa-letter{font-family:var(--font-display);font-weight:600;color:var(--muted);font-size:var(--step--1);letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:4px}
.au-name{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;text-decoration:none;font-family:var(--font-display);font-size:var(--step-0)}
.au-name:hover span:first-child{text-decoration:underline;text-underline-offset:3px}
.au-dots{display:inline-flex;gap:4px;flex-shrink:0}

.author .wrap{padding-block:clamp(24px,4vw,48px) 64px;display:grid;gap:18px}
.back{font-family:var(--font-display);font-size:var(--step--1);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.back::before{content:"← "}
.back:hover{color:var(--fg)}
.au-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:24px 48px;align-items:end;border-bottom:2px solid var(--fg);padding-bottom:18px}
.au-head h1{font-size:var(--step-4);font-weight:600;margin-top:8px}
.au-head .kicker{color:var(--muted)}
.au-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:12px;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.au-social{display:grid;gap:8px;align-content:end}
.au-social .label{color:var(--muted)}
.soc{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;text-decoration:none;font-family:var(--font-display);font-size:var(--step-0)}
.soc b{font-weight:600;min-width:5.5em}
.soc span{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soc .ext,.online-list .ext{width:11px;height:11px;margin-left:auto;flex-shrink:0}
.soc:hover{border-color:var(--fg)}
.soc-none{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);padding:9px 12px;border:1px dashed var(--line);border-radius:3px}
.au-role{font-family:var(--font-display);font-size:var(--step-1);max-width:64ch}
.au-role.muted{color:var(--muted);font-size:var(--step-0)}
.au-bio{font-family:var(--font-text);font-size:var(--step-1);line-height:1.55;max-width:64ch;background:var(--sand);padding:18px 22px;border-radius:2px}
.au-bio strong{color:var(--sand-ink);font-weight:600}
.au-h2{font-size:var(--step-2);font-weight:500;margin-top:16px}

/* contatti */
.contacts .wrap{padding-bottom:64px;display:grid;gap:34px}
.offices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0;border-top:2px solid var(--fg)}
.office{padding:18px 22px 22px 0;border-bottom:1px solid var(--line);display:grid;gap:8px;align-content:start}
.office h3{font-size:var(--step-2);font-weight:600}
.office address{font-style:normal;font-family:var(--font-text);font-size:var(--step-1);line-height:1.45}
.tel{font-family:var(--font-display);font-size:var(--step-0)}
.sel{user-select:all;font-variant-numeric:tabular-nums;font-weight:500}
.online .label{color:var(--muted);margin-bottom:10px}
.online-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px}
.online-list a{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;text-decoration:none;font-family:var(--font-display);font-size:var(--step-0)}
.online-list a b{min-width:5.5em;font-weight:600}
.online-list a span{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.online-list a:hover{border-color:var(--fg)}

@media (max-width:980px){ .bar nav.quick{display:none} .burger{margin-left:auto} }
@media (max-width:820px){
  .about-body .wrap,.au-head{grid-template-columns:minmax(0,1fr)}
  .arc-year{grid-template-columns:minmax(0,1fr);gap:4px}
  .arc-row{grid-template-columns:92px minmax(0,1fr)}
  .arc-num{display:none}
  .arc-row::before{inset:0 -8px}
}
@media (prefers-reduced-motion:reduce){ .menu-panel,.menu-scrim,.arc-cov .cover,.mini-shelf .cover{transition:none} }

/* percorsi */
.tag.th{border-style:solid;border-color:transparent;background:var(--chip);color:var(--fg);text-decoration:none;text-transform:none;letter-spacing:.01em;font-size:.76rem}
.tag.th:hover{background:var(--fg);color:var(--bg)}
.draft{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 12px;max-width:70ch}
.draft b{color:var(--fg);font-weight:600}
.themes .wrap,.theme .wrap{padding-bottom:64px;display:grid;gap:22px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px}
.theme-card{display:grid;gap:12px;align-content:start;padding:22px;border:1px solid var(--line);border-radius:3px;text-decoration:none}
.theme-card:hover{border-color:var(--fg)}
.theme-card h2{font-size:var(--step-2);font-weight:600}
.theme-card p{color:var(--muted);font-size:var(--step-0)}
.tc-meta{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.dist{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;height:84px;align-items:end;padding-top:6px}
.dist.big{height:130px;max-width:560px}
.dist-col{display:grid;grid-template-rows:auto 1fr auto;height:100%;align-items:end;justify-items:center;gap:3px}
.dist-bar{width:100%;max-width:46px;background:var(--acc);border-radius:2px 2px 0 0;align-self:end}
.dist-n{font-family:var(--font-display);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:end}
.dist-l{font-family:var(--font-display);font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.th-issue{border-top:2px solid var(--fg);padding-top:14px;margin-top:10px}
.th-head{display:grid;grid-template-columns:60px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none}
.th-cov .cover{width:60px}
.th-title{display:block;font-family:var(--font-display);font-size:var(--step-2);font-weight:600;margin-top:2px}
.th-head:hover .th-title{color:var(--acc)}
.th-issue .results{margin-top:10px}
.same-theme{border-top:1px solid var(--line)}
.same-theme .wrap{padding-block:30px 10px;display:grid;gap:26px}
.st-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.st-head .label{color:var(--muted)}
.st-head a{font-family:var(--font-display);font-size:var(--step--1);font-weight:600;color:var(--fg);text-decoration:none}
.st-head a:hover{text-decoration:underline}
.st-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:12px}
.st-item{display:grid;gap:4px;padding:14px 16px;background:var(--tint);border-radius:3px;text-decoration:none}
.st-n{font-family:var(--font-display);font-size:var(--step--1);color:var(--acc);font-weight:600}
.st-t{font-family:var(--font-display);font-size:var(--step-1);font-weight:500;line-height:1.2}
.st-a{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.st-item:hover .st-t{text-decoration:underline;text-underline-offset:3px}

/* condivisione */
.share-btn{all:unset;cursor:pointer;display:block;margin-top:6px;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);text-align:right}
.share-btn:hover,.share-btn:focus-visible{color:var(--fg);text-decoration:underline}
.share-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.share-main{margin-top:16px;font-size:var(--step--1);padding:8px 14px}
.article.navy .share-main{color:var(--deep-fg);border-color:rgba(255,255,255,.5)}
.share{position:fixed;inset:0;z-index:60}
.share-scrim{position:absolute;inset:0;background:rgba(0,20,36,.55);opacity:0;transition:opacity .18s ease}
.share-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);opacity:0;transition:transform .2s ease,opacity .2s ease;
  width:min(1120px,calc(100% - 24px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--bg);color:var(--fg);border-radius:4px;
  padding:22px max(22px,env(safe-area-inset-right,0px)) 26px max(22px,env(safe-area-inset-left,0px));box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.share.open .share-scrim{opacity:1}
.share.open .share-panel{transform:translate(-50%,-50%);opacity:1}
.sh-top{display:flex;justify-content:space-between;gap:16px;align-items:start;border-bottom:2px solid var(--fg);padding-bottom:12px}
.sh-top .label{color:var(--muted)}
.sh-top h2{font-size:var(--step-2);margin-top:4px;max-width:40ch}
.sh-close{color:var(--fg);border-color:var(--line)}
.sh-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;margin-top:18px}
.sh-left,.sh-right{display:grid;gap:12px;align-content:start;min-width:0}
.sh-right .label{color:var(--muted)}
.sh-formats{display:flex;gap:6px;flex-wrap:wrap}
.sh-formats button,.sh-dest button{cursor:pointer;display:grid;gap:1px;text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);font-family:var(--font-display);font-size:var(--step--1)}
.sh-formats button b,.sh-dest button b{font-weight:600;font-size:var(--step-0)}
.sh-formats button span,.sh-dest button span{color:var(--muted)}
.sh-formats button[aria-selected="true"],.sh-dest button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.sh-dest{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sh-fig{margin:0;display:grid;gap:8px;justify-items:center;background:var(--chip);border-radius:3px;padding:14px}
.sh-fig img{display:block;max-width:100%;height:auto;max-height:56vh;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)}
.sh-fig.f16x9 img{aspect-ratio:16/9}
.sh-fig.f4x5 img{aspect-ratio:4/5}
.sh-fig.f9x16 img{aspect-ratio:9/16}
.sh-fig.loading img{opacity:.35}
.sh-fig figcaption{justify-self:stretch}
.sh-copy-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.sh-variant{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.sh-variant button{all:unset;cursor:pointer;font-family:var(--font-display);font-size:var(--step--1);padding:5px 10px;color:var(--muted)}
.sh-variant button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sh-variant button:focus-visible{outline:2px solid var(--focus)}
#sh-text{width:100%;font-family:var(--font-text);font-size:var(--step-0);line-height:1.45;padding:12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);resize:vertical}
.sh-count{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);font-variant-numeric:tabular-nums}
.sh-count.over{color:#B3261E}
.sh-actions{display:flex;flex-wrap:wrap;gap:8px}
.sh-actions .btn{font-size:var(--step--1);padding:9px 14px}
.sh-status{font-family:var(--font-display);font-size:var(--step--1);min-height:1.2em}
.sh-note{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);line-height:1.5}
.sh-note b{color:var(--fg)}
.kit .kit-intro{color:var(--muted);max-width:70ch;margin-top:6px}
.kit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px;margin-top:14px}
.kit-card{all:unset;cursor:pointer;display:grid;gap:6px;align-content:start}
.kit-card img{width:100%;aspect-ratio:16/9;background:var(--chip);border-radius:2px;display:block;object-fit:cover}
.kit-card:hover img{outline:2px solid var(--acc);outline-offset:2px}
.kit-card:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.kit-t{font-family:var(--font-display);font-size:var(--step-0);font-weight:500;line-height:1.25}
.kit-n{font-family:var(--font-display);font-size:var(--step--1);color:var(--acc);font-weight:600}
@media (max-width:820px){ .sh-grid{grid-template-columns:minmax(0,1fr)} .sh-dest{grid-template-columns:repeat(2,minmax(0,1fr))} .share-btn{text-align:left} .sh-fig img{max-height:46vh} }
@media (prefers-reduced-motion:reduce){ .share-panel,.share-scrim{transition:none} }
@media (prefers-reduced-motion:no-preference){
  main{animation:fade .35s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
}

/* ---------- IL QUADRO ---------- */
.q-index{padding-block:8px 72px}
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px;margin-top:8px}
.q-card{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;padding:16px;border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:3px;text-decoration:none;color:inherit;background:var(--bg);transition:border-color .15s,transform .15s}
a.q-card:hover{border-color:var(--acc);transform:translateY(-2px)}
.q-card .cover{width:92px}
.q-card .q-ct{display:flex;flex-direction:column;gap:6px;min-width:0}
.q-card .q-title{font-family:var(--font-display);font-weight:600;font-size:var(--step-2);line-height:1.08}
.q-card .q-dek{color:var(--muted);font-size:var(--step-0)}
.q-card .q-upd{margin-top:auto;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.q-card .q-upd b{color:var(--fg);font-weight:500}
.q-card.soon{border-top-color:var(--line);background:transparent}
.q-card.soon .cover{opacity:.55;filter:grayscale(.5)}
.q-card.soon .q-title{color:var(--muted);font-size:var(--step-1)}
.q-method{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:18px 28px;border-top:1px solid var(--line);padding-top:26px}
.q-method h3{font-size:var(--step-0);margin-bottom:6px}
.q-method p{color:var(--muted);font-size:var(--step-0)}

.qd-head{background:var(--tint);border-bottom:1px solid var(--line);padding-block:clamp(26px,5vw,56px) 26px}
.qd-head h1{font-size:var(--step-4);margin-top:10px;max-width:18ch}
.qd-head .kicker{margin-top:14px}
.qd-head .lead{font-size:var(--step-1);margin-top:12px;max-width:56ch;color:var(--muted)}
.qd-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:18px;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.qd-meta .upd{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--acc);padding:5px 10px;border-radius:2px;color:var(--fg)}
.qd-meta .upd b{font-weight:600}
.linkish{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.q-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.q-tools .btn{font-size:var(--step--1);padding:8px 13px}
.q-tools .note{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.q-stale{background:#FFF4D6;color:#5A4300;border-bottom:1px solid #EBD38E;font-family:var(--font-display);font-size:var(--step--1)}
.q-stale .wrap{padding-block:10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .q-stale{background:#3A2F0E;color:#F3DFA2;border-color:#5C4A16}}
:root[data-theme="dark"] .q-stale{background:#3A2F0E;color:#F3DFA2;border-color:#5C4A16}

.qd-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding-block:36px 80px}
.qd-toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px;font-family:var(--font-display)}
.qd-toc button{all:unset;cursor:pointer;padding:7px 10px;border-left:2px solid var(--line);color:var(--muted);font-size:var(--step--1);letter-spacing:.04em}
.qd-toc button:hover,.qd-toc button[aria-current="true"]{color:var(--fg);border-left-color:var(--acc)}
.qd-toc button:focus-visible{outline:2px solid var(--focus)}
.qd-main{min-width:0;display:flex;flex-direction:column;gap:56px}
.qd-sec{scroll-margin-top:84px}
.qd-sec > h2{font-size:var(--step-2);margin-bottom:16px;display:flex;align-items:baseline;gap:12px}
.qd-sec > h2 .n{font-size:var(--step--1);color:var(--acc);letter-spacing:.08em}
.qd-sec > .hint{margin:-6px 0 18px}
.q-brief{background:var(--tint);border-left:4px solid var(--acc);padding:22px 26px;border-radius:0 3px 3px 0}
.q-brief p{font-size:var(--step-1);line-height:1.45}
.q-brief p + p{margin-top:12px}
.q-brief > h2{font-size:var(--step--1);letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}

.q-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.q-measures{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.q-m{border:1px solid var(--line);border-radius:3px;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.q-m[hidden]{display:none}
.q-m .area{font-family:var(--font-display);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);font-weight:600}
.q-m h3{font-size:var(--step-1)}
.q-m .br{color:var(--fg)}
.q-figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.q-fig{background:var(--tint);padding:10px 12px;border-radius:2px}
.q-fig b{display:block;font-family:var(--font-display);font-weight:600;font-size:var(--step-1);line-height:1.1}
.q-fig span{display:block;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);margin-top:3px;line-height:1.25}
.q-rows{margin:0;display:flex;flex-direction:column;gap:8px}
.q-rows div{display:grid;grid-template-columns:minmax(0,1fr);gap:1px}
.q-rows dt{font-family:var(--font-display);font-size:var(--step--1);font-weight:600}
.q-rows dd{margin:0;font-size:var(--step-0);color:var(--fg)}
.q-refs{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.q-ref{all:unset;cursor:pointer;min-width:22px;height:22px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:2px;font-size:.75rem;color:var(--fg)}
.q-ref:hover{border-color:var(--acc)}
.q-ref:focus-visible{outline:2px solid var(--focus)}

.q-tl{list-style:none;margin:0;padding:0;position:relative}
.q-tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.q-tl li{position:relative;padding:0 0 18px 32px;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:4px 16px;align-items:baseline}
.q-tl li::before{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--acc)}
.q-tl li.s-fatto::before{background:var(--acc)}
.q-tl li.s-in-corso::before{background:linear-gradient(90deg,var(--acc) 50%,var(--bg) 50%)}
.q-tl .w{font-family:var(--font-display);font-weight:600;font-size:var(--step--1);letter-spacing:.03em}
.q-st{font-family:var(--font-display);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.q-st.s-in-corso{border-color:var(--acc);color:var(--acc)}
.q-st.s-atteso{border-style:dashed}

.q-ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.q-ex article{border:1px solid var(--line);border-radius:3px;padding:18px 20px}
.q-ex .n{font-family:var(--font-display);font-size:var(--step--1);color:var(--acc);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.q-ex h3{font-size:var(--step-1);margin:6px 0 8px}
.q-ex .setup{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}

.q-ideas{display:flex;flex-direction:column;gap:14px}
.q-idea{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;padding:20px 0;border-top:1px solid var(--line)}
.q-idea blockquote{margin:0;font-size:var(--step-1);font-style:italic;line-height:1.4}
.q-idea .why{margin-top:10px;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.q-idea .who{font-family:var(--font-display);font-size:var(--step--1)}
.q-idea .who b{display:block;font-size:var(--step-0);font-weight:600}
.q-idea .who a{display:inline-block;margin-top:8px;color:var(--acc);font-weight:500}
.q-editorial{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);border-left:3px solid var(--acc);padding:4px 0 4px 12px;margin-bottom:6px}

.q-src{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column}
.q-src li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);scroll-margin-top:90px}
.q-src li .num{font-family:var(--font-display);font-weight:600;color:var(--acc)}
.q-src li a{text-decoration-color:var(--line);text-underline-offset:3px}
.q-src li a:hover{text-decoration-color:var(--acc)}
.q-src .kind{font-family:var(--font-display);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.q-src li.flash{background:var(--tint)}
.q-chk{font-family:var(--font-display);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;margin-left:6px;white-space:nowrap}
.q-chk.ok{color:#1F6B3A;border:1px solid #9FCCAF}
.q-chk.ko{color:#8A5A00;border:1px solid #E2C27A}
.q-log{margin-top:28px}
.q-log h3{font-size:var(--step-0);margin-bottom:8px}
.q-log ol{margin:0;padding:0;list-style:none}
.q-log li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:var(--step-0)}
.q-log li time{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.q-disc{margin-top:26px;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);background:var(--chip);padding:14px 16px;border-radius:3px}

/* fascia nel numero e richiamo negli articoli */
.q-band{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg);box-shadow:inset 4px 0 0 var(--acc)}
.q-band .wrap{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:16px 28px;align-items:center;padding-block:20px}
.q-band .label{color:var(--acc);font-weight:600}
.q-band .qb-sub{display:block;font-family:var(--font-display);font-size:var(--step--1);color:var(--muted);margin-top:2px}
.q-band h3{font-size:var(--step-1)}
.q-band p{color:var(--muted);margin-top:3px}
.q-band .qb-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.q-band .qb-upd{font-family:var(--font-display);font-size:var(--step--1);color:var(--muted)}
.q-aside{display:block;margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:2px;text-decoration:none;font-family:var(--font-display);background:var(--bg)}
.q-aside:hover{border-color:var(--acc)}
.q-aside .label{color:var(--acc);font-weight:600;display:block}
.q-aside b{display:block;font-size:var(--step-0);font-weight:600;margin-top:4px;color:var(--fg)}
.q-aside span.s{display:block;font-size:var(--step--1);color:var(--muted);margin-top:2px}
.article.navy .q-aside{background:transparent;color:var(--deep-fg);border-color:rgba(255,255,255,.3)}
.article.navy .q-aside b{color:var(--deep-fg)}
.article.navy .q-aside .label{color:var(--deep-accent)}
.article.navy .q-aside span.s{color:rgba(255,255,255,.75)}

/* modalità redazione */
.qd.editing .qd-head{background:repeating-linear-gradient(135deg,var(--tint) 0 14px,transparent 14px 28px),var(--tint)}
.q-edit-note{display:flex;gap:10px;align-items:flex-start;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:3px;font-family:var(--font-display);font-size:var(--step--1);margin-top:18px;max-width:72ch}
.q-edit-note b{font-weight:600}
.qf{display:flex;flex-direction:column;gap:4px;width:100%}
.qf > span{font-family:var(--font-display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qf textarea,.qf input,.qf select,.q-mini input,.q-mini select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%;resize:vertical;line-height:1.4}
.qf textarea:focus,.qf input:focus,.qf select:focus,.q-mini input:focus,.q-mini select:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.qf textarea{field-sizing:content;min-height:2.6em}
.qf.big textarea{font-size:var(--step-1)}
.qf.title textarea{font-family:var(--font-display);font-weight:600;font-size:var(--step-3);line-height:1.1}
.qf.err textarea,.qf.err input{border-color:#C0392B;box-shadow:0 0 0 1px #C0392B}
.qf .err-msg{font-family:var(--font-display);font-size:var(--step--1);color:#C0392B}
.q-ed{border:1px dashed var(--acc);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.q-ed-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.q-ed-head .n{font-family:var(--font-display);font-size:var(--step--1);font-weight:600;color:var(--acc);letter-spacing:.06em;text-transform:uppercase}
.q-ctl{display:flex;gap:4px;flex-shrink:0}
.q-ctl button,.q-add{font-family:var(--font-display);font-size:var(--step--1);border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:3px;padding:4px 9px;cursor:pointer;line-height:1.3}
.q-ctl button:hover,.q-add:hover{border-color:var(--acc)}
.q-ctl button[disabled]{opacity:.35;cursor:default}
.q-ctl button.del:hover{border-color:#C0392B;color:#C0392B}
.q-add{align-self:flex-start;background:transparent;border-style:dashed;padding:8px 14px}
.q-mini{display:grid;gap:8px;align-items:start}
.q-mini.fig{grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr) auto}
.q-mini.row{grid-template-columns:minmax(0,.7fr) minmax(0,2fr) auto}
.q-mini.tl{grid-template-columns:150px minmax(0,1fr) 120px auto}
.q-mini textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%;resize:vertical;field-sizing:content;min-height:2.6em;line-height:1.4}
.q-mini textarea:focus{outline:2px solid var(--focus);border-color:transparent}
.q-sub{font-family:var(--font-display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.q-picks{display:flex;flex-wrap:wrap;gap:6px}
.q-picks label{font-family:var(--font-display);font-size:var(--step--1);display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:3px;padding:3px 8px;cursor:pointer}
.q-picks label:has(input:checked){border-color:var(--acc);background:var(--tint)}

.q-src-ed .num{font-family:var(--font-display);font-weight:600;color:var(--acc);padding-top:8px}
.q-src-ed .fields{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px}
.q-src-ed .fields .wide{grid-column:1/-1}
.q-src-ed .urlrow{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.q-src-ed .urlrow a{font-family:var(--font-display);font-size:var(--step--1);white-space:nowrap}
.q-toggle{font-family:var(--font-display);font-size:var(--step--1);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.q-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 -10px 30px -12px rgba(0,20,40,.5);padding-bottom:env(safe-area-inset-bottom,0px)}
.q-bar .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 18px;align-items:center;padding-block:12px}
.q-bar .st{font-family:var(--font-display);font-size:var(--step--1);display:flex;flex-direction:column;gap:2px;min-width:150px}
.q-bar .st b{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;color:#9FD9E6}
.q-bar .st span.dirty{color:#FFD27A}
.q-bar input{font:inherit;font-family:var(--font-display);font-size:var(--step--1);background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:3px;padding:9px 12px;width:100%}
.q-bar input::placeholder{color:rgba(255,255,255,.6)}
.q-bar input:focus{outline:2px solid #5FC3D6;border-color:transparent}
.q-bar .acts{display:flex;gap:8px}
.q-bar .btn{color:#fff;border-color:rgba(255,255,255,.5);font-size:var(--step--1);padding:9px 14px}
.q-bar .btn.primary{background:#fff;color:#002C4D;border-color:#fff}
.q-bar .btn[disabled]{opacity:.5;cursor:default}
.q-bar .msg{grid-column:1/-1;font-family:var(--font-display);font-size:var(--step--1);color:#FFD27A}
.q-bar .msg:empty{display:none}
.q-bar .msg .btn{margin-left:8px;padding:5px 10px}
.qd.editing .qd-grid{padding-bottom:160px}
.qf.title textarea{min-height:0}

.qd.editing .qf.title textarea{font-family:var(--font-display);font-weight:600;font-size:var(--step-3);line-height:1.1}
.qd.editing .qf.big textarea{font-size:var(--step-1)}
.q-ctl{align-self:start}
.q-src-ed .fields select{align-self:start}
.q-src-ed .urlrow a{display:inline-flex;align-items:center;gap:4px}
.q-src-ed .urlrow a .ext{width:10px;height:10px;flex:none}

.qd.editing .q-measures,.qd.editing .q-ex{grid-template-columns:minmax(0,1fr);gap:20px}

.q-hist{border:1px solid var(--line);border-radius:3px;margin-top:16px;max-width:760px;background:var(--bg)}
.q-hist h3{font-size:var(--step-0);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.q-hist ol{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.q-hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-family:var(--font-display);font-size:var(--step--1)}
.q-hist li:first-child{border-top:0}
.q-hist li .meta{color:var(--muted)}
.q-hist li .btn{font-size:var(--step--1);padding:5px 10px}
.q-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;font-family:var(--font-display);font-size:var(--step--1);padding:10px 16px;border-radius:3px;z-index:30;box-shadow:0 8px 24px -8px rgba(0,20,40,.5)}

er": "", "byline": "", "navy": false, "themes": ["societa"]}, {"page": 131, "type": "art", "title": "Ciascuno riscopra il proprio talento", "author": "Maurizio Carvelli", "curator": "", "partner": "", "byline": "", "navy": false, "themes": ["demografia", "societa"]}]}]}], "texts": {"n9-ep7": {"epigraph": "Rimproveriamo ogni giorno il destino: “Perché quello è stato rapito a metà\ndella corsa? Perché non viene rapito quello? Perché protrae una vecchiaia\ngravosa sia per sé che per gli altri?” Ritieni più giusto, ti prego, che tu obbedisca alla natura oppure che la natura obbedisca a te? Che cosa importa poi quanto presto tu esca da dove comunque bisogna uscire? Dobbiamo\nimpegnarci non per vivere a lungo, ma per (vivere) abbastanza; infatti per\nvivere a lungo c’è bisogno del destino, per vivere abbastanza (c’è bisogno)\ndell’animo. La vita è lunga se è piena; d’altra parte si riempie quando l’animo ha restituito a sé stesso il suo bene e ha trasferito a sé il dominio su sé\nstesso. Che giovano a quello ottant’anni trascorsi nell’inerzia? Costui non\nè vissuto, ma si è attardato nella vita, né è morto tardi, ma a lungo. “È vissuto ottant’anni.” È importante da quale giorno tu conti la sua morte. “Ma\nquello se n’è andato (ancora) giovane.” Ma ha portato a termine i compiti\ndi buon cittadino, di buon amico, di buon figlio; in nessun ruolo è venuto\nmeno; benché la sua età sia incompleta, la sua vita è completa. “È vissuto\nottant’anni.” Anzi, è esistito ottant’anni, a meno che per caso tu non dica\nche egli è vissuto così come si dice che vivono gli alberi. Ti prego, Lucilio,\nfacciamo in modo che, come le cose preziose, così la nostra vita non si estenda molto, ma pesi molto; misuriamola dall’azione, non dal tempo."}, "n9-sapelli": {"paras": [{"t": "h", "h": "I. Declino dei matrimoni e migrazioni non familiari"}, {"t": "p", "h": "In Cina il numero di nuove unioni non è mai stato così basso dal 1986, da quando Pechino ha iniziato a pubblicarne le statistiche. La serie storica rende plasticamente l’entità della caduta. Nel 2013 i matrimoni registrati furono 13 milioni. In poco più di un decennio, il loro numero si è dimezzato. Un crollo senza precedenti nella storia demografica moderna del paese, che riflette trasformazioni culturali profonde e difficilmente reversibili nel breve periodo. Parallelamente aumentano i divorzi. Nel 2024, quasi 2,6 milioni di coppie hanno rotto il loro vincolo."}, {"t": "p", "h": "Non sembra funzionare il mix di interventi e misure messo in campo dalle autorità. Dal 2022, la Family Planning Association ha lanciato programmi per creare una “nuova era del matrimonio e della procreazione”, “arruolando” decine di città per promuovere il “valore sociale della procreazione”, incoraggiando i giovani a sposarsi e partorire e avere figli a un’“età appropriata”."}, {"t": "p", "h": "La polverizzazione della famiglia tradizionale indotta da decenni di politica del “figlio unico” continua. Una generazione intera è cresciuta senza fratelli, senza la rete di solidarietà che la famiglia allargata garantiva, e con aspettative individualistiche che mal si conciliano con le esigenze della vita di coppia e della genitorialità. Per comprendere pienamente il movimento storico-concreto in atto su scala mondiale, mentre pensiamo al declino demografico di un gigante come la civiltà cinese demograficamente intesa, riflettiamo sul movimento immenso che si è messo in moto con sempre più forza da alcuni anni su scala mondiale: le migrazioni transoceaniche e trans-continentali."}, {"t": "p", "h": "Mentre da un lato “si scende”, lentamente e inesorabilmente, dall’altro lato “ci si sposta” impetuosamente."}, {"t": "h", "h": "II. I migranti: un fenomeno mondiale e maschile"}, {"t": "p", "h": "281 milioni i migranti internazionali che si spostano in tutto il mondo (ossia il 3,6% della popolazione globale). Ad essi aggiungiamo i 117 milioni di migranti forzati costretti a fuggire a causa di guerre, persecuzioni, violenze diffuse e disastri ambientali. Questi numeri testimoniano una mobilità umana senza precedenti nella storia, che ridisegna continuamente gli equilibri demografici, economici e culturali di intere regioni del pianeta. E queste migrazioni forzate dividono famiglie e coppie potenziali di sesso diverso."}, {"t": "p", "h": "Negli ultimi 20 anni, infatti, si è registrato un crescente divario di genere nell’ambito della migrazione internazionale a favore di quella maschile. Nel 2000 erano 88 milioni i migranti di sesso maschile rispetto alle 86 milioni di donne migranti; nel 2020, invece, si è giunti a 146 milioni di migranti uomini e 135 milioni di donne migranti (rispettivamente il 51,9 e il 48,1%)."}, {"t": "p", "h": "Va sottolineato il fatto che i continenti che hanno ospitato il maggior numero di migranti internazionali sono stati l’Europa e l’Asia, con rispettivamente 87 e 86 milioni di persone (il 61% della migrazione a livello globale), seguiti dal Nord America, con quasi 59 milioni nel 2020 (il 21% della migrazione internazionale), dall’Africa con il 9%, dall’America Latina e dai Caraibi con il 5% e dall’Oceania con il 3%."}, {"t": "p", "h": "Ma è l’Asia che, dal 2000 al 2020, ha registrato una crescita esponenziale del numero di migranti internazionali con circa 37 milioni di persone (74% delle migrazioni a livello globale), seguita dall’Europa con un aumento di 30 milioni di migranti internazionali, 18 milioni in Nord America e 10 milioni in Africa. L’industrializzazione mondiale continua a muovere i suoi passi e la necessità dell’esercito industriale di riserva, che ne consente l’affermazione storicamente determinata, continua a essere uno dei fattori più potente di mobilizzazione della forza lavoro su scala mondiale."}, {"t": "p", "h": "Le conseguenze economiche di questo gigantesco processo sociale sono continuamente sottovalutate, mentre esse, invece, spiegano come sia stato possibile quel mutamento così profondo delle ragioni di scambio su scala mondiale, che consente alle nazioni periferiche di attestarsi a livelli di crescita prossimi a quelle del centro dell’accumulazione mondiale."}, {"t": "p", "h": "Questo significa sottolineare il ruolo svolto dalla crescita storica esponenziale delle rimesse internazionali: dal 2000 a oggi la percentuale delle rimesse è aumentata, infatti, del 650%, passando da 128 miliardi di dollari nel 2000 a 831 miliardi di dollari nel 2025, di cui 647 miliardi sono stati inviati dai migranti verso i paesi a basso e medio reddito. India, Messico, Cina, Filippine ed Egitto sono stati i primi cinque paesi destinatari delle rimesse: le migrazioni internazionali, quindi, continuano – dall’Ottocento – a essere un motore fondamentale dello sviluppo umano e della crescita economica."}, {"t": "p", "h": "Le rimesse dei migranti, infatti, superano gli investimenti esteri nel promuovere il PIL dei paesi in via di sviluppo. Si tratta di un canale di redistribuzione della ricchezza su scala planetaria che nessuna istituzione finanziaria internazionale è riuscita a replicare nella sua efficienza capillare, perché fondato su legami familiari e di comunità che attraversano i confini nazionali. Non dimentichiamolo mai."}, {"t": "p", "h": "Ma questo processo è tra le principali cause della crisi demografica, separando famiglie, impedendo i ricongiungimenti, diminuendo il tasso di ringiovanimento dei sistemi sociali. E questo per le differenze di stili di vita e la separazione culturale ancora pesantissima che esiste in tutto il mondo tra residenti e immigrati, abbassando, in tal modo, drasticamente il numero dei matrimoni misti, a fronte dell’impossibilità preclara della crescita di quelli tra le stesse culture, viste le separazioni familiari prevalenti e il basso numero di donne migranti a fronte dei maschi."}, {"t": "p", "h": "Il numero di migranti internazionali nel mondo, nel 2024, è stato stimato dalle Nazioni Unite in 304 milioni: un valore quasi doppio di quello del 1990 (154 milioni). Nello stesso periodo la loro quota rispetto alla popolazione mondiale è aumentata dal 2,9 al 3,7%. È interessante notare come questo valore sia rimasto stabile fino al 2005, mentre dal 2010 ha iniziato a crescere con una certa regolarità. Segno che, nonostante le crisi economiche, la pandemia di Covid-19 e le politiche di chiusura, i fattori di spinta e quelli di attrazione hanno intensificato la loro azione negli ultimi vent’anni. Tra questi hanno avuto un peso importante le crisi umanitarie in diversi paesi del mondo: un quinto degli 83 milioni in più di migranti internazionali che si registra tra 2010 e 2024 è, infatti, attribuibile all’aumento dei rifugiati, dei richiedenti asilo e delle altre persone sotto protezione internazionale. Categorie cresciute complessivamente di 18 milioni in questo intervallo di tempo, arrivando a metà del 2024 a contare in tutto 51,7 milioni. Si tratta di un sesto di tutti i migranti nel mondo: la quota più alta da quando nel 1950 si è iniziato a raccogliere i dati su questo aspetto del fenomeno."}, {"t": "p", "h": "Scendendo più nel dettaglio si possono individuare quattro principali aree di destinazione: l’Unione Europea con Regno Unito con 79 milioni di migranti, il Nord America con 61,2, l’Asia occidentale con 49,2 e Australia e Nuova Zelanda con 9,6."}, {"t": "p", "h": "Il sistema migratorio europeo – va sottolineato – costituisce la più grande area di libera circolazione delle persone esistente al mondo e rappresenta il polo di maggiore attrazione, ampliando la distanza con il Nord America che, negli stessi anni, ha visto crescere il numero di immigrati meno intensamente. L’aumento maggiore dell’ultimo ventennio si è invece registrato nell’Asia occidentale, che ha visto più che raddoppiare il numero di migranti internazionali diventando la principale destinazione dei flussi, accogliendo sia movimenti per lavoro sia di natura politica."}, {"t": "h", "h": "III. Il degiovanimento: un fenomeno mondiale. Nascita e morte non si bilanciano: si accompagnano."}, {"t": "p", "h": "Nella popolazione italiana aumentano gli anziani e gli immigrati, eppure dal 2014 i residenti totali sono in continua riduzione. Il motivo è il fatto che il processo di degiovanimento è diventato più accentuato dell’invecchiamento e dei flussi di entrata. In altre parole, l’Italia perde abitanti non perché le persone emigrino in massa, ma perché semplicemente non nascono abbastanza bambini da compensare le morti, e questa dinamica strutturale tende ad autoalimentarsi in un circolo vizioso difficile da interrompere senza politiche radicalmente diverse da quelle finora adottate."}, {"t": "p", "h": "Ed il fenomeno è assai simile su scala mondiale."}, {"t": "p", "h": "Come ha affermato giustamente Rosina: «Sono molti i prodotti che se improvvisamente sparissero o diventassero sempre meno disponibili metterebbero in crisi un Paese. Per assurdo ipotizziamo di non avere più aerei, o non aver più telefoni, o non aver più computer, o non aver più farmaci da banco, sarebbe certo un disastro ma sopravviveremmo in qualche modo…"}, {"t": "p", "h": "C’è però un bene che conta, forse, più di tutti questi, senza il quale anche altri beni perdono di utilità e significato: le persone. Anche le persone vengono “prodotte” in qualche modo, attraverso il processo che porta chi è già in vita a generare, in una relazione di coppia, un’altra vita. Se ad un certo punto nessuno più decidesse di avere figli, prima ancora di arrivare all’estinzione ci si troverebbe con uno scenario tra i più distopici: la popolazione andrebbe a concentrarsi sempre più in età avanzata, con sempre più anziani in condizioni di fragilità e non autosufficienza, con sempre meno personale e risorse per fornire condizioni minime dignitose di vita». È questo l’orizzonte a cui assolutamente non dobbiamo rassegnarci. Ed è un disordine mondiale. Un disordine che non ha precedenti, che scuote le fondamenta dei sistemi previdenziali, dei mercati del lavoro, della trasmissione intergenerazionale della cultura e del sapere. Nessuna civiltà ha mai affrontato un simile svuotamento demografico in condizioni di pace e di relativo benessere, il che rende ancor più paradossale e drammatico il fenomeno."}, {"t": "p", "h": "Perché è un orizzonte mai apparso sino a ora nella storia del mondo, con tanta violenza inaspettata."}, {"t": "p", "h": "Nascita e morte, per secoli e secoli, si accompagnavano: si viveva assai pochi anni e, nel mentre questi pochi anni passavano, i giovani crescevano, perché le nascite si susseguivano in un movimento ascensionale ininterrotto. La morte era precoce ma la vita si perpetuava con una vitalità generativa che oggi appare quasi inconcepibile: le famiglie numerose non erano una scelta ma una necessità biologica e sociale, una risposta collettiva all’alta mortalità infantile e alla fragilità dell’esistenza umana in epoche prive di moderne tutele sanitarie e previdenziali."}, {"t": "p", "h": "Oggi la caduta delle nascite è essenzialmente dovuta alla drastica diminuzione del numero di donne e di uomini in età fertile: le figlie del baby boom – in tutto il mondo – hanno ormai abbandonato l’età fertile, e non sono state sostituite, né dalle nuove leve, né dagli ingressi di donne immigrate."}, {"t": "p", "h": "La spiegazione più convincente della bassa fecondità e della fecondità tardiva dei paesi ricchi nell’ultimo cinquantennio, dopo la fine della grande transizione demografica del 1770-1970, sta nel paradigma della seconda transizione demografica."}, {"t": "p", "h": "Questo paradigma descrive il passaggio da una società in cui i valori collettivi e la famiglia come istituzione primaria guidavano le scelte riproduttive, a una società in cui prevalgono l’autorealizzazione individuale, l’instabilità delle relazioni di coppia e il progressivo rinvio – fino alla rinuncia – della maternità e della paternità. Questo schema è ampio, e coinvolge l’interpretazione dei cambiamenti sessuali, di coppia e riproduttivi dell’ultimo cinquantennio. Questo nuovo paradigma deve fare i conti anche con i crescenti oneri legati ai figli. Il costo monetario dei figli aumenta, sia in termini assoluti che relativi; cresce anche il loro costo in termine di tempo: le indagini mostrano come – anno dopo anno – i genitori trascorrano con i figli un numero di ore sempre più elevato."}, {"t": "p", "h": "Questa interpretazione è utile per spiegare il declino e il ritardo della fecondità in tutti i paesi ricchi, ma non è sufficiente per comprendere come mai si è formato un ampio cluster di paesi con bassissima fecondità (Italia, Spagna, Grecia e paesi balcanici, Giappone e Corea del Sud...) che resiste a tutte le politiche che cercano di contrastarla."}, {"t": "p", "h": "Si tratta di nazioni accomunate antropologicamente da legami familiari forti, con stretti rapporti economici, sociali e culturali fra genitori e figli. In tali contesti, il figlio non è semplicemente un individuo che si affranca dalla famiglia d’origine per costruire la propria vita autonoma: è un progetto collettivo nel quale la famiglia intera investe risorse, tempo, aspettative e identità, creando un circolo di dipendenza reciproca che pesa, paradossalmente, sulla decisione stessa di metterlo al mondo."}, {"t": "p", "h": "Prevale la larga diffusione della famiglia estesa modificata, con accentuata prossimità abitativa, intensi scambi di aiuti monetari e non monetari fra genitori e figli, contatti fisici, telefonici e sociali particolarmente intensi fra i membri della stessa famiglia."}, {"t": "p", "h": "Questi legami sono spesso rinforzati da legislazioni favorevoli su eredità e donazioni, obblighi di assistenza, tassazione delle case. In paesi come Giappone e Corea del Sud, sulla mancata nascita del secondo figlio pesano anche i fortissimi investimenti sull’istruzione dei figli, necessari per aumentare la loro probabilità di superare i test di ingresso a scuole che aprono la porta agli impieghi più prestigiosi e meglio remunerati."}, {"t": "p", "h": "Come ha affermato molto giustamente Giampiero Della Zuanna: «Nel ventennio 2004-23, vaste regioni della Cina, dell’India e di altri stati dell’Asia si sono aggregate al gruppo dei paesi con fecondità inferiore a 1,5 figli per donna, parallelamente all’incremento del reddito pro-capite e alla diffusione della contraccezione moderna. Nella società attuale la nascita dei bambini è condizionata alla loro possibilità di diventare un valore non in contrasto con l’autorealizzazione dei genitori, in particolare delle donne, su altri aspetti della vita»."}, {"t": "p", "h": "In questi paesi degli <em>strong family ties<\/em> non si è sviluppato un sistema di welfare pro-family paragonabile a quello di altri paesi del Centro e Nord Europa, perché era scontato che la famiglia “bastasse a sé stessa”. Non si è sviluppata neppure una società mobile e flessibile come quella statunitense, dove i contatti fra genitori e figli sbiadiscono rapidamente dopo il secondo decennio di vita. In conclusione, nel Sud Europa e in Asia Orientale, il futuro dei figli è fortemente dipendente dall’investimento messo in atto dai genitori, che avrebbero un figlio invece di due, oppure due invece di tre, per evitare di penalizzare – con un figlio in più – il destino dei figli già nati, o dell’unico figlio già nato."}, {"t": "p", "h": "Commentando questa ipotesi, all’inizio del nuovo secolo i demografi John Caldwell e Thomas Schindlmayr affermarono che: «... se questa spiegazione – suggerita esaminando la fecondità dei paesi della sponda Nord del Mediterraneo, in gran parte il modello italiano, centrato sul patriarcato e sul capofamiglia – è corretta, allora la tendenza alla bassissima fecondità con l’aumento dei redditi finirà per verificarsi in gran parte del resto del mondo, perché il patriarcato è diffuso in tutta l’Asia e l’Africa».<sup>1<\/sup> Nel ventennio 2004-23, infatti, vaste regioni della Cina, dell’India e di altri stati dell’Asia si sono aggregate al gruppo dei paesi con fecondità inferiore a 1,5 figli per donna, parallelamente all’incremento del reddito pro-capite e alla diffusione della contraccezione moderna. Quindi, quanto preconizzato vent’anni fa da Caldwell e Schindlmayr sembrerebbe in fase di realizzazione. In questa prospettiva, i paesi di tradizione anglosassone e dell’Europa Centrale sarebbero un’eccezione, piuttosto che una regola, perché il loro sistema a <em>weak family ties<\/em>, da un lato genererebbe una minore responsabilità dei genitori sul futuro dei figli, dall’altro avrebbe favorito la nascita di società più mobili, meno familiste e meno patriarcali, spesso (ma non sempre) accompagnate anche da un welfare più favorevole alle famiglie con figli."}, {"t": "h", "h": "IV. Il futuro… l’urbanizzazione, il tasso di natalità e l’invecchiamento"}, {"t": "p", "h": "L’aumento o la diminuzione della popolazione non devono necessariamente essere pensati come una minaccia o un’opportunità, ma rappresenta sicuramente un grande cambiamento per il futuro del mondo. Il grande momento di definizione del XXI secolo avverrà tra circa tre decenni, quando la popolazione globale inizierà a diminuire. Quest’ultima affermazione potrebbe stupire molti di noi: siamo abituati ad ascoltare gli effetti negativi della sovrappopolazione, in termini di distruzione dell’ambiente e del pianeta, ma la popolazione non sta aumentando fuori controllo. Oggi l’umanità ha raggiunto gli 8 miliardi di abitanti e avrà difficoltà ad arrivare a 8,5 miliardi prima di precipitare in declino."}, {"t": "p", "h": "Le forze che guidano questo declino sono già in atto e ne percepiamo gli effetti in molti aspetti della nostra vita quotidiana. Inoltre, con l’avvento della pandemia Covid-19, il declino e la diminuzione della popolazione potrebbe iniziare ancor prima."}, {"t": "p", "h": "Perché la popolazione mondiale, presumibilmente tra circa tre decenni, diminuirà? Tre fattori chiave stanno cambiando radicalmente la struttura della nostra popolazione: l’urbanizzazione, il tasso di natalità e l’invecchiamento
