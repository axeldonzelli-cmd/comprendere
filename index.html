i ad ogni latitudine, emergenze sociali, criminalità dilagante, paura dell’ignoto. Il micidiale cocktail che ogni giorno viene servito al bar della imprevedibilità globale mette a dura prova anche i più risoluti ottimisti. Ma è davvero tutto così fosco e preoccupante ciò che viviamo e che, soprattutto, ci apprestiamo a vivere? In fondo abbiamo risorse naturali, finanziarie, culturali sufficienti ad affrontare le crisi che si susseguono attorno a noi. Perché allora tanta preoccupazione? Qual è la chiave di lettura (e di scrittura) giusta?"}, {"t": "p", "h": "Preparando il quarto numero di “Comprendere” ci siamo resi conto del controsenso esistenziale in cui siamo immersi ogni giorno e della difficoltà di rispondere a queste domande e a tanti altri dilemmi: le tecnologie al nostro servizio si fanno via via più intelligenti eppure le loro capacità generative alimentano i timori di un terzo millennio dominato da robotica e algoritmi. Il nucleare torna ad essere una possibile alternativa alla perenne carenza di risorse, ma gli incubi del passato offuscano le prospettive a basso impatto delle microenergie. Il cibo abbonda sulle tavole dell’Occidente mentre scarsità d’acqua e di suolo prosciugano le speranze di vita del terzo e quarto mondo."}, {"t": "p", "h": "Insomma, se da un lato dovremmo essere felici, dall’altro le ansie aleggiano e prevalgono in questa stagione tanto complessa e densa di interrogativi. Ed è stato partendo da tali contraddizioni che abbiamo provato a muoverci alla ricerca – se non di una soluzione – almeno di un approccio consapevole. Un percorso che non poteva lasciare da parte il viaggio nell’io più profondo, quello di un individuo oggi più che mai individualista, ma che per fortuna non dimentica l’umanità del dono e la necessità antropologica dell’agire. Ne è nato, come leggerete e guarderete (perché “Comprendere” è una metarivista, ossia un periodico che si gusta anche attraverso immagini e grafica) un reticolare intreccio di sensazioni, speranze, opinioni, dubbi e certezze, che poi è lo specchio neuronale dell’uomo (o donna, o +) della nostra epoca."}, {"t": "p", "h": "Le (in)sicurezze sono racchiuse in molte più evenienze e situazioni di quella piccola parentesi che trovate in copertina. Troppi faticano a riconoscersi nell’illusione di una modernità accomodante, urlando inascoltati o richiudendosi in una solitudine angosciata e dominata dalle paure, non solo fisiche. L’effimero che prevale è tanto (in) sicuro quanto la difficoltà di accettare l’altro, così come protervia e autoritarismo diventano lessico abituale per presunti leader a caccia di un consenso quanto mai liquido. Il disfattismo, però, non appartiene a “Comprendere”. Anche di fronte agli scenari più pessimistici scatta – quasi in segno di sfida – la ricerca verso un segnale di ostinata positività. E anche questa volta è stato così."}, {"t": "p", "h": "Due le parole chiave, anzi i passepartout, che aprono ad uno scenario di sostenibile prospettiva: partecipazione e conoscenza. Nell’era bulimica dell’informazione e dell’autocomunicazione l’eccesso di dati rischia di mandare in tilt la crescente fragilità del sapere. Bisogna saper interpretare, tenendo salda in mano la certezza dei diritti e delle regole, senza mai far venir meno l’ottimismo della volontà."}, {"t": "p", "h": "Per questo il “ticket” dell’esserci e dell’essere rappresenta una quasi elementare scorciatoia verso l’obiettivo naturale dell’uomo, quello della felicità, che oggi appare spesso nebuloso se non addirittura irraggiungibile."}, {"t": "p", "h": "Conoscere il Male, il proprio corpo, le pieghe dell’anima, le paure generazionali, le contese territoriali non è esercizio semplice, ma assolutamente necessario. È lo sforzo a cui ognuno è chiamato per evitare di rimanere indeciso e confuso e, ci ripetiamo, amorfo rispetto alla volontà propositiva e disinteressato al contribuire. Compiere questo sforzo per comprendere appieno, ad esempio, che la tecnologia può essere sostenibile o che le nuove generazioni meritano concrete investiture e non teorici investimenti è il primo passo, e il passo giusto, per una vera sicurezza."}, {"t": "p", "h": "Questa volta senza parentesi."}], "bio": "", "notes": []}, "n4-a1": {"paras": [{"t": "p", "h": "<em>È un pomeriggio d’inverno quando l’economista Giulio Sapelli e lo  psichiatra Giorgio Legnani si incontrano, per un confronto sui timori  e tremori sociali e le profonde insicurezze che caratterizzano la nostra  epoca. Dal loro colloquio emerge una riflessione sulle ansie collettive,  le dinamiche psichiche e le trasformazioni della psicoanalisi negli ultimi decenni. <\/em>"}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Si parla molto di insicurezza e di tremore sociale, di angoscia, di tutte quelle sensazioni psichiche che Ernesto De Martino aveva rappresentato come spirito dei tempi nel suo ultimo seminale lavoro sull’Apocalisse e che richiamava al fondamento psichico, profondo di questo sentire, di questo tremore che è sociale e insieme individuale."}, {"t": "p", "h": "Credo che si debba iniziare – nell’affrontare questo tema, a cui dedichiamo questo numero di “Comprendere” – proprio dalle scienze del profondo, dalla psicanalisi, e nessuno meglio di te può aiutarci in questo tentativo."}, {"t": "p", "h": "<strong class=\"sp\">G. L.<\/strong> Ma allora bisogna iniziare dal cambiamento della psicoanalisi."}, {"t": "p", "h": "Negli anni della mia formazione (nei primi anni ‘70 del Novecento) non esistevano ancora le scuole di psicoterapia e la formazione avveniva solo attraverso l’analisi personale seguendo gli indirizzi allora prevalenti (freudiani, junghiani, kleiniani, ecc.)."}, {"t": "p", "h": "La tua domanda pone il problema del cambiamento, sia teorico, sia clinico che è avvenuto negli ultimi 50 anni, in cui i modelli teorici, e la pratica clinica, si sono molto modificati, tanto da rimodulare in significati diversi i capisaldi della psicoanalisi, come il complesso di Edipo, che si è arricchito con nuovi apporti teorici e modelli relazionali dell’attaccamento."}, {"t": "p", "h": "Nel 2016 la rivista “Psicoterapia e scienze umane” ha svolto a questo proposito un’approfondita inchiesta ponendo una serie di domande a una ottantina fra i più famosi psicoanalisti mondiali in merito ai principali temi della psicoanalisi, per capirne le modificazioni avvenute, sia teoriche, sia applicative. Mi limito qui a esporne alcune cui s’era chiamati a rispondere; il tipo e la qualità delle domande ben esprime il livello di dibattito, i problemi e le contraddizioni che si agitano all’interno di questo mondo:"}, {"t": "p", "h": "1. A suo parere cosa caratterizza la “psicoanalisi contemporanea” e quando ha avuto inizio?"}, {"t": "p", "h": "2. Cosa pensa della proliferazione delle scuole psicoanalitiche? 3. Quali sono l’identità e le differenze fra psicoanalisi e psicoterapia? 4. Il concetto di Edipo ha ancora un significato? In caso, quale? 5. Cosa resta della teoria freudiana del sogno?"}, {"t": "p", "h": "6. Come valutare il rapporto fra psicoanalisi, neuroscienze, neurobiologia e più in generale fra psicoanalisi e altre discipline? 7. Quali concetti centrali della psicanalisi hanno mantenuto la loro validità e quali sono le loro evidenze empiriche?"}, {"t": "p", "h": "E altre ancora."}, {"t": "p", "h": "Non posso certo qui riferire le risposte a questi e agli altri quesiti, ma la qualità delle domande è indice di quanto grande, complesso e spesso contraddittorio fosse e sia il dibattito su questi argomenti. Alcuni concetti centrali – come quello relativo al funzionamento mentale, alla concezione dell’inconscio e alla importanza nella pratica clinica della relazione transferale e controtransferale – sono confermati come validi e da mantenere quasi da tutti. Sembrano invece sempre più in via di revisione: la centralità del concetto freudiano di Edipo, l’importanza delle pulsioni sessuali infantili, sempre più sostituite dai bisogni e dalle dinamiche relazionali riguardanti la vita infantile. Resta aperto anche il dibattito intorno al rapporto con le neuroscienze, da alcuni vissuto come un’alleanza nella verifica delle ipotesi freudiane, da altri come la conferma del funzionamento di un modello mentale alternativo alla psicoanalisi."}, {"t": "p", "h": "Ultima considerazione, è la difficoltà di far convivere la tecnica e la pratica clinica di una disciplina complessa nella sua applicazione (tempo, denaro, rapidità di risultato) con una cultura pragmatica e efficientista oggi dominante, che può portare a una chiusura settaria e eccessivamente difensiva."}, {"t": "p", "h": "Come si vede, il dibattito è più che aperto soprattutto per quanto riguarda la ricerca di confine fra psicoanalisi e neuroscienze."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Se questo è lo scenario culturale in cui si dipana il lavoro scientifico e terapeutico cosa puoi dirci del grande tremore a cui oggi siamo soggetti, quello della guerra, della minaccia e della “visione” della guerra che si dipana nel mondo delle relazioni “audiovisive”, con un continuo bombardamento di immagini terrificanti (a cui però possiamo assuefarci) dinanzi a noi?"}, {"t": "p", "h": "<strong class=\"sp\">G. L.<\/strong> Facciamo un passo indietro."}, {"t": "p", "h": "Dal momento in cui veniamo al mondo passiamo da uno stato di massima sicurezza a uno di totale insicurezza e dipendenza. La sicurezza ci è solo permessa dalla capacità di creare legami che ci garantiscano benessere e sopravvivenza fisica e affettiva. Per tutta la vita inseguiamo poi questo mito che si può declinare come un incubo regressivo, dove la massima sicurezza è garantita con il massimo della regressione (regimi autoritari, carceri, manicomi), oppure perseguiamo la ricerca continua della costruzione di legami positivi sia sociali sia all’interno di ciascuno di noi."}, {"t": "p", "h": "La guerra costituisce la rappresentazione più drammatica di questo conflitto; con la motivazione di assicurare condizioni di sicurezza stabili si distrugge ogni legame e dunque il fondamento di ogni reale condizione di sopravvivenza. La garanzia di sicurezza viene addirittura invocata contemporaneamente come motivazione di conflitto da parte di ambedue i belligeranti. È una tragica ripetizione che sembra riproporsi inesorabilmente."}, {"t": "p", "h": "Nel carteggio fra Einstein e Freud, avvenuto su sollecitazione della Società delle Nazioni nel 1932, emerge la domanda fondamentale: “C’è un modo per liberare gli uomini dalla fatalità della guerra? Si può dirigere l’evoluzione psichica degli uomini per sottrarli alla pazzia della distruzione?”."}, {"t": "p", "h": "Freud, dopo una serie ragionamenti, conclude ribadendo la Sua teoria circa le due forze psichiche in campo, secondo la teoria delle pulsioni. Quelle che tendono a conservare e unire, e quelle che tendono a distruggere, e considera ambedue indispensabili alla vita. Conclude dicendo che tutto ciò che promuove l’evoluzione civile, lavora contro la guerra. Chi si è occupato maggiormente in Italia di questo tema è stato Franco Fornari, non solo per l’apporto dei suoi contenuti teorici (in <em>Psicoanalisi della guerra<\/em>), ma anche con una partecipazione attiva (il “Gruppo anti H” e le presenza alle conferenze ONU per la pace). Nel suo pensiero è costante la ricerca delle origini della violenza e dunque delle motivazioni profonde che portano alla guerra."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Pone dunque in primo piano il tema del male…"}, {"t": "p", "h": "<strong class=\"sp\">G. L.<\/strong> Sì, il tema è quello dell’origine del male e della sua insopportabilità a essere “contenuto” dentro di noi, e che ci porta a liberarcene buttandolo fuori dal nostro mondo interno, costituendolo come un nemico esterno da cui ci si deve difendere trasformando ogni guerra in guerra di difesa. Melanie Klein affrontò questo problema facendone risalire l’origine ai nostri primi atti di vita, quando passiamo da momenti di totale pienezza, visibili soprattutto nei momenti della suzione e dell’allattamento (presenza della madre, seno nutriente, ecc.), a altri di vuoto e di annichilimento corrispondenti al distacco e alla fame (assenza della madre). Il bambino si difende da questa percezione con una operazione difensiva che consiste nel costruire fantasie che gli permettono di sdoppiare la madre, costituendosi in modo fantasmatico un seno buono e uno cattivo, mettendo il male in quello cattivo e dunque allontanandolo da sé per non esserne perseguitato. Quando, però, dopo qualche tempo questa difesa non funziona più perché il bambino percepisce la madre come un essere unico che contiene in sé il bene e il male, l’infante deve rinunciare a questa difesa e trattenere in sé una porzione del male andando così incontro a una fase “depressiva”, che inizierà a elaborare successivamente secondo le proprie capacità creative e riparative."}, {"t": "p", "h": "Vediamo in azione, fin dai primi momenti di vita, tutti quei meccanismi difensivi che tendono a esportare il male al di fuori di noi. Partendo da questa impostazione Fornari – attraverso l’analisi dei sogni delle donne in gravidanza e i meccanismi del parto – vede l’origine della violenza nel meccanismo stesso del parto, che contiene in sé la violenza originaria e, insieme, il drammatico processo di separazione dal corpo materno che ne permette la nascita."}, {"t": "p", "h": "Il padre, o meglio, la funzione paterna, si fa carico di questa violenza, e dunque della morte in essa contenuta, dotandola di senso e rappresentandola come necessaria alla possibilità di vita."}, {"t": "p", "h": "In questo modo la morte viene riconosciuta e accettata in quanto contenuta fin dall’inizio nella vita di ciascuno di noi e, dunque, può essere superato il bisogno di doverla proiettare all’esterno."}, {"t": "p", "h": "Inizia qui il lungo cammino di Franco Fornari che lo porterà alla definizione di un inconscio funzionale alla vita e alla sopravvivenza."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Ma si tratta di temi che ci offrono una prospettiva affatto diversa da quella comune proprio oggi, con lo scatenarsi dell’aggressione Russa all’Ucraina."}, {"t": "p", "h": "<strong class=\"sp\">G. L.<\/strong> A proposito della guerra russo-ucraina facciamo, anche questa volta, un passo indietro. La conferenza di Yalta divise i Paesi dell’Europa e la Germania stessa in due zone di influenza sotto il predominio degli Stati Uniti in Occidente e dell’Unione sovietica in Oriente. Possiamo fantasticare questa divisione come un contratto di separazione, “separazione armata”, fra due genitori con l’intento di sostenere una speranza o forse un futuro progetto di riconciliazione. Questo impianto si reggeva sul possesso degli armamenti atomici da parte delle due potenze, che permetteva di sostituire il delirio paranoico legato alla guerra “mors tua vita mea” con un più realistico “mors tua mors mea” che, facendo leva sulla paura di totale e reciproca distruzione, ha assicurato un periodo di relativa stabilità."}, {"t": "p", "h": "Gli Stati Uniti e l’Unione Sovietica si erano spartiti i figli costituendo due famiglie separate: una affidata al padre (l’Occidente) e l’altra alla madre (l’Unione Sovietica)."}, {"t": "p", "h": "Questo equilibrio è mutato con la caduta del muro di Berlino. In un modo per certi versi miracoloso era terminata una guerra senza morti né spargimento di sangue. Era la grande occasione perché i genitori ricominciassero a parlarsi e i figli a conoscersi. Per alcuni anni, questo parve potersi avverare, e i figli separati cominciarono la loro crescita, seppure in regime di protezione e di controllo. L’insieme degli stati europei si potevano allora fantasticare come il corpo di un adolescente in continuo mutamento, pieno di energie di progetti, di ideali, ma spesso in difficoltà nel renderli reali. I modelli identificativi, che i genitori avevano loro proposto, erano spesso in contrapposizione."}, {"t": "p", "h": "A Occidente prevaleva un modello che definirei “paterno”, spesso autoritario, competitivo e dissipativo; a Oriente un modello “materno perverso” che opprime ogni tentativo di crescita e di emancipazione legato al mito della grande madre onnipotente. Elemento comune, e in certo modo prevalente, sembra essere quello di non favorire la crescita e l’autonomia dei figli e, men che meno, che potessero riconoscersi come fratelli. Come tutti gli adolescenti, questi fratelli dovevano affrontare, per potersi davvero riconoscere fratelli, un rito di passaggio, capace di traghettarli da una crescita adolescenziale e personale a una nascita sociale attraverso l’esperienza del gruppo."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> La storia, però, ha preso una strada assai diversa."}, {"t": "p", "h": "<strong class=\"sp\">G. L.<\/strong> Sì. Tutto è stato più complesso, perché mentre per il singolo l’esperienza dell’innamoramento permette il superamento del narcisismo e dunque l’accoppiamento e l’amore verso appartenenti a membri di un altro gruppo, chi compie questo passo viene considerato, invece, all’interno del proprio gruppo, come un traditore, con tutti i conflitti che ne conseguono."}, {"t": "p", "h": "La storia di Giulietta e Romeo è a questo proposito tragicamente istruttiva, purtroppo."}, {"t": "p", "h": "I gruppi non posseggono questo strumento di amore verso l’esterno, e tendono invece a coalizzarsi, investendo le loro energie erotiche su quello che riconoscono “leader”, innamorandosi prontamente di lui: la tragica storia di ogni autoritarismo ne è una triste e inesorabile conferma."}, {"t": "p", "h": "Sono molti i passaggi che questo giovane corpo di adolescente deve ancora compiere per potersi dotare di un proprio corpo adulto, che a mio parere non potrà che definirsi attraverso la nascita di una propria “Costituzione” (sana e robusta). Penso che la drammatica guerra russo-ucraina contenga molti di questi elementi affettivi che rendono indispensabile il superamento dei conflitti fra questi fratelli, se non vogliono continuare a essere perennemente indipendenti e separati."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> L’evocazione di questo tragico tema così originalmente evocato mi porta a chiederti come interpreti l’attuale contesto in cui il grande universo della sessualità e del genere condizionano il nostro essere nel mondo."}, {"t": "p", "h": "<strong class=\"sp\">G. L.<\/strong> Bisogna ben distinguere fra sesso e genere. Il primo è inscritto nei nostri cromosomi e si esprime poi fenotipicamente negli apparati sessuali. Altra cosa è il genere che è come uno si sente riguardo il proprio sesso: qui può esserci una totale identificazione con il proprio sesso genetico, o ci si può muovere in un ampio spazio fra maschile e femminile. Dunque riguardo al genere l’orientamento sessuale è soggetto a numerose variabili."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Ma parlare di vita, di sopravvivenza, ci impone di affrontare il grande tema identitario della sessualità. Un tema che è diventato sempre più importante e che genera insicurezza. Come mai questo aspetto, un tempo era declinato nella identità sessuale generalmente consolidata, è divenuto oggi così importante?"}, {"t": "p", "h": "<strong class=\"sp\">G. L.<\/strong> Questo è un enigma per me. Ma forse accade perché in un momento in cui la società è diventata molto più diseguale, molto più insicura per lo sviluppo della vita, non si è più alberi che crescono, ma foglie che cadono, e che occasionalmente cercano una nuova ricollocazione in un altro albero. E allora ecco il problema del corpo, che è un tema della sessualità. Ma che tipo di corpo è rappresentabile in questo momento? Secondo me è rappresentabile come il corpo di un adolescente, in via di costruzione: corpo sociale, voglio dire. Un adolescente in via di costruzione, che mette insieme i pezzi del suo puzzle, ma non è ancora costruito del tutto. È un corpo che sa che deve arrivare da qualche parte, perché è naturalmente destinato a crescere, ma non è lui che mette insieme i pezzi, è come se fosse biologicamente spinto da una forza esterna che compie questa operazione di assemblaggio. A me viene in mente l’Europa, intesa come tema erotico con tutta la sua fantasia. Pensiamo a quello che era successo in Europa dopo la seconda guerra mondiale: i due genitori, padre America e madre Unione Sovietica, prendono in braccio questa Europa, questo figlio che si è sfasciato e costituiscono due specie di protettorati, uno maschile, diciamo quello americano, e uno tipicamente materno, quello dell’Unione Sovietica. Ma torniamo al tema della sessualità. Ossia dell’identità."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Mi chiedo: è possibile l’unione psichica, la sicurezza interiore, in una società che fondamentalmente ci richiede moltissimo e soprattutto ci educa all’individualismo e al riconoscimento dell’eccezionalità? La rivendicazione dell’io e dell’ego consente l’unità, perché difende, anche all’interno dell’individualismo, tutte le diverse personalità che si posseggono.È legittimata l’identità molteplice, e tutto genera insicurezza. Penso che uno dei dati più significativi del tremore (uso questo termine del tremore per non dire insicurezza), è che abbiamo sempre più identità: questa molteplicità è sempre più nuova. Anche perché siamo sottoposti a un universo virtuale che ci domina e a un <em>landscape<\/em> ideologico, un immaginario collettivo che è esterno a noi, ma che diventa nostro, violentemente."}, {"t": "p", "h": "<strong class=\"sp\">G. L.<\/strong> Si parla di individualismo, ma non è ridurre tutto a uno, ma ridurre tutto al molteplice, nel senso che come si impara la relazione con la propria molteplicità, si impara la relazione con la molteplicità del mondo. Solo se si riconosce la propria pluralità interna, è possibile riconoscere la pluralità del mondo."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Un mondo quindi sempre più instabile. E le rivoluzioni tecnologico-digitali, quanto incidono su questo tremore, sull’insicurezza?"}, {"t": "p", "h": "<strong class=\"sp\">G. L.<\/strong> Questo ci porta al discorso del tempo e dello spazio. Qual è la cornice, il contenitore di tutto ciò di cui discutiamo? Penso che sia la rivoluzione scientifica, nel senso della rivoluzione della relatività, della quantistica e della psicoanalisi: sono le tre grandi innovazioni scientifiche del secolo. La relatività e la quantistica hanno messo in discussione il tempo e lo spazio: il tempo non ha più una dimensione lineare. E lo spazio non ti è più dato come una certezza, muta continuamente perché mutano coloro che lo abitano come mai era successo, basta pensare alle migrazioni, alla compresenza fisica, esperienziale di diverse culture e soggettività."}, {"t": "p", "h": "Ecco emergere la tua coscienza, il tuo io, con la psicoanalisi. C’è sempre stato l’inconscio, ma oggi è diverso: non si è più capaci di governare sé stesso, perché sei “parlato” da qualcun altro dentro di te. Dunque, ecco ciò che ha rivoluzionato i nostri parametri fondamentali vitali: il tempo, lo spazio e la coscienza."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> E questa coscienza diventa sempre più presente: si è dominati, e il dominato è consapevole delle dominazioni. Perché oggi mandare il bambino da uno psicologo è una cosa normale, ma un tempo non lo era affatto. Questo è essere dominati dall’inconscio, quando invece si cerca di governarlo. La ragione? Forse perché non c’è più un asse. Il fatto che la gente non vada più in chiesa è un fatto sociale, non è un fatto religioso. Nessuno controlla più la psiche e quello che appariva solo come una forza negativa era una forza psichica collettiva che manteneva l’ordine sociale."}, {"t": "p", "h": "<strong class=\"sp\">G. L.<\/strong> Giulio, non riesco a entrare in questo discorso, lo capisco, mi piace moltissimo, ma non riesco a entrare. Qual è il mio punto di vista clinico in merito?"}, {"t": "p", "h": "Quello che un tempo era senso di colpa, adesso è vergogna: è il nascondimento della colpa. È molto peggio. La colpa si sente a livello di coscienza, è sintomo se c’è qualcosa che non va. Faccio delle cose che non so cosa siano e mi interrogo su cosa sia successo, e scopro che ho un trauma, qualcosa che comunque è recuperabile. La vergogna, invece, è qualcosa che si trova dentro di sé, e che non si sa dove mettere, perché non c’è un oggetto su cui proiettare la vergogna, se non dentro di sé. E questo provoca un danno interiore molto maggiore, perché spesso porta anche a compiere azioni di cui non si è responsabili, ma che si compiono lo stesso. Perché? Come psichiatra e psicoterapeuta provo a chiedermi e a chiedere: “Ma di cosa ti vergogni?”."}, {"t": "p", "h": "Ed è sempre difficile trovare una risposta."}], "bio": "<strong>Giorgio Legnani<\/strong> è medico psichiatra e psicoterapeuta. Ha lavorato in ospedale psichiatrico, quindi come primario all’Ospedale Bassini di Cinisello Balsamo e come direttore di dipartimento dell’ospedale San Gerardo di Monza.", "notes": []}, "n4-a2": {"paras": [{"t": "p", "h": "Non c’è segmento del tempo in cui viviamo che non sia toccato da radicali cambi di paradigma."}, {"t": "p", "h": "I progressi in campo scientifico e tecnologico, il Covid-19 e il timore di nuove pandemie, gli scenari bellici e i diversi equilibri geopolitici, il terrorismo internazionale, le grandi migrazioni e le tensioni socio-culturali nell’ambito dei processi di integrazione, le cyber-minacce, le fragilità sociali ed economiche: cambiamenti tanto radicali da delineare nell’opinione comune quello di un vero e proprio mutamento d’epoca."}, {"t": "p", "h": "Nuove sono anche le forme di aggressione criminale. Le mafie hanno subito negli ultimi decenni una “mutazione genetica” che ne ha trasformato il profilo: assumendo una dimensione sempre più affaristica, si avvalgono in maniera sempre più raffinata della corruzione, dell’evasione fiscale e degli altri reati economico finanziari e sono abili nell’avvalersi della globalizzazione dei mercati, alla ricerca di nuove opportunità di investimento, ben oltre i confini nazionali, sfruttando anche le disomogeneità tra le legislazioni dei vari Stati."}, {"t": "p", "h": "Gran parte di quelle che oggi vengono considerate come le grandi minacce alla sicurezza sono caratterizzate dalla transnazionalità, dall’asimmetria, dalla fluidità, dall’imprevedibilità."}, {"t": "p", "h": "Viviamo un’epoca eccezionale nella misura in cui i tanti cambiamenti inevitabilmente richiedono nuove forme di governo finalizzate a rinnovati equilibri. In questo scenario, la sicurezza è percepita sempre più come bene ad alto valore sociale, come fattore tra i più importanti della qualità della vita individuale e collettiva. La commissione di un reato travalica il disvalore oggettivo dell’azione commessa, andando a colpire il sentimento stesso di pacifica e serena convivenza civile."}, {"t": "p", "h": "Tante volte si è scritto e si è detto che le nostre Istituzioni democratiche sono presidiate da sistemi di prevenzione e contrasto all’avanguardia, in grado di generare sicurezza e senso di protezione."}, {"t": "p", "h": "Bisogna rivendicare con orgoglio le ragioni del successo del nostro sistema di sicurezza: il coordinamento delle Forze di Polizia, l’azione di prevenzione contro il terrorismo, la cooperazione tra Enti che favorisce la cultura della sicurezza urbana e della sicurezza integrata. E ricordare ancora che la nostra legislazione antimafia – studiata e apprezzata in tutto il mondo – è patrimonio irrinunciabile per fronteggiare le nuove pervasive modalità di infiltrazione delle organizzazioni criminali di stampo mafioso. L’esigenza di schermare il sistema economico dalle ingerenze e dai condizionamenti della criminalità è ancora più avvertita rispetto ai flussi finanziari legati all’attuazione del PNRR, un’imprescindibile occasione per il rilancio e la crescita del Paese."}, {"t": "p", "h": "Nel campo della sicurezza, particolare rilievo rivestono i recenti approdi della ricerca scientifica e tecnologica, da cui è scaturita una moltiplicazione e diversificazione della minaccia. Penso al <em>cybercrime<\/em>, ai reati d’odio commessi anche tramite strumento informatico, al terrorismo internazionale e alla stessa criminalità organizzata con i suoi sofisticati mezzi di riciclaggio. Se il crimine evolve con il progresso scientifico e tecnologico, mutano di pari passo anche gli strumenti d’indagine, che si avvalgono delle più avanzate tecnologie e delle migliori competenze."}, {"t": "p", "h": "Anche le nostre città, soprattutto quelle di grandi dimensioni in cui con maggiore intensità interagiscono i fenomeni che creano allarme sociale, sono al centro dell’attenzione del sistema di sicurezza, da tempo pronto a superare, con autentica vocazione alla prossimità, le proprie funzioni tradizionali, assicurando anche inedite forme di gestione della complessità del presente. Tuttavia, non possiamo non prendere atto di come anche nel nostro Paese, come in tutto il mondo occidentale, si sconti un diffuso senso di insicurezza. Un’insicurezza che è figlia della complessità del III millennio, dei suoi ripetuti e rapidissimi cambiamenti, delle incertezze innescate dall’instabilità globale e delle ansie più o meno giustificate che pervadono le nuove generazioni."}, {"t": "p", "h": "La risposta a tale sensazione di insicurezza non può che essere collettiva e intercettare più fattori. Una risposta che impone di convogliare tutte le energie in un sistema unitario e coeso, perché i beni da tutelare – sicurezza e con essa benessere, ricchezza, competitività, attrattività – appartengono alla comunità nazionale nel suo insieme."}, {"t": "p", "h": "Se la sicurezza è presupposto delle libertà, è attorno a un progetto comune e condiviso di sicurezza che possono essere esercitati diritti e libertà fuori da ogni sentimento di incertezza, di precarietà, di frammentazione sociale. Occorre lavorare per ricostruire il senso di appartenenza a una comunità, ripensando, ove occorra, le categorie della politica, dei corpi intermedi, delle forme di partecipazione sociale, nella consapevolezza che il senso attivo della cittadinanza è la pietra angolare di una democrazia matura, che garantisca l’esercizio delle libertà e dei diritti costituzionalmente riconosciuti."}], "bio": "<strong>Matteo Piantedosi<\/strong> è Ministro dell’Interno. Nato a Napoli nel 1963, laureato in Giurisprudenza, è avvocato. Assegnato alla Prefettura di Bologna nel 1989, diventa Vice Prefetto nel 2007. Dal 2009 al Ministero dell’Interno, ha diretto l’Ufficio Relazioni Parlamentari e ricoperto vari incarichi di gabinetto e coordinamento. È stato Prefetto di Lodi e Bologna, e dal 2020 al 2022 Prefetto di Roma. Nel Governo Conte I, è stato Capo di Gabinetto del Ministro dell’Interno Matteo Salvini.", "notes": []}, "n4-a3": {"paras": [{"t": "p", "h": "Un risultato è chiaro, dopo le elezioni per il Parlamento europeo e le elezioni legislative in Francia: il motore franco-tedesco è in stallo, non riuscirà più a funzionare come forza trainante dell’Unione europea. Emmanuel Macron appare comunque indebolito, anche se è riuscito a fermare l’assalto del Rassemblement National. La coalizione tedesca è fragile, con la batosta subita dalla SPD, mentre continua a salire Alternative für Deutschland. La geografia del voto dimostra che è soprattutto l’insicurezza economica a contare per i cittadini europei. Una insicurezza combinata, nei due paesi-chiave del Vecchio Continente, alle proteste contro l’immigrazione e il Green Deal."}, {"t": "p", "h": "Certo, il dato essenziale è che la destra radicale non è (o non è ancora) in grado di espugnare né la Francia né Bruxelles, dove resiste il ruolo dominante del Partito Popolare. E dove è possibile fare leva su una maggioranza parlamentare di centro. Ma metterla puramente così – le cose stanno cambiando ma nulla cambierà per l’Unione europea – non è produttivo. Perché l’Europa non ha affatto il problema di restare com’era; ha il problema di evolversi, e anche rapidamente, per potere affrontare le molte sfide dell’età della “poli-crisi”."}, {"t": "p", "h": "La realtà, infatti, è che l’Europa è alle prese con il rischio di un declino strutturale: potrà essere più o meno lento, più o meno brutale, ma di declino si tratta. La traiettoria demografica, in un continente che vive una sindrome giapponese sul piano allargato, è il primo campanello d’allarme: nessuna società in rapido invecchiamento riesce a restare vitale sul piano economico o a difendere, in modo particolare, i sistemi di welfare. Il secondo segnale è la mancanza di risorse per attuare le due transizioni – energetica e tecnologica – in cui l’Europa è impegnata: se si sommano insieme le reticenze ad attivare strumenti di debito comune, i vincoli fiscali dei bilanci nazionali e l’incapacità di investire il risparmio privato nella crescita industriale europea, lo stallo è evidente. Lo conferma una comparazione fra l’andamento dell’economia americana e statunitense: nel 1992, i due Continenti avevano una quota simile di PIL mondiale, oggi l’Europa è nettamente dietro agli Stati Uniti, con un reddito medio pro-capite dei suoi cittadini inferiore di circa un terzo a quello americano."}, {"t": "p", "h": "Si aggiunge, ma non certo come semplice addendum, il riflesso della guerra in Ucraina. Dal punto di vista della sicurezza, l’Europa torna ad avere una minaccia diretta ai suoi confini orientali: il lungo sogno kantiano è finito. Il problema è che l’Unione europea è stata concepita come un’organizzazione per tempi di pace, non per tempi di guerra. Le sue capacità di difesa restano largamente affidate alla NATO. Ma è ormai evidente, anche senza bisogno di aspettare l’esito delle elezioni americane del prossimo novembre, che l’America non ha più intenzione di sostenere l’onere principale della difesa europea: le sue priorità, nell’epoca della competizione sistemica con la Cina, sono altrove, nell’Indo-Pacifico. E quindi: o la NATO diventerà più europea o non reggerà. Questo significa un aumento delle spese militari – che è in corso ma che ha già prodotto la inevitabile ripresa del vecchio dibattito fra “burro e cannoni” – e lo sviluppo di una base industriale della difesa europea, che è solo agli inizi. Di qui un circolo vizioso, sulle priorità di bilancio: sostenere il peso del welfare all’europea e insieme spendere sulla difesa non è semplice. Se i governi europei provano a farlo, rischiano la sconfitta elettorale."}, {"t": "p", "h": "È d’altra parte difficile concepire una capacità di difesa europea senza una politica estera comune: le posizioni, su come gestire la Russia di Putin, appaiono meno divaricate negli ultimi anni ma non sono certo univoche. E non lo saranno, vedi ancora l’Ungheria di Orban, sulle dinamiche di un futuro allargamento ai paesi dei Balcani occidentali od eventualmente all’Ucraina. Si propongono soluzioni istituzionali: l’abolizione dell’unanimità in politica estera e nella difesa. Ma a parte la difficoltà di arrivarci (l’unanimità richiede l’unanimità, per essere abolita), il problema vero è culturale e politico: siamo disabituati a pensare che la pace va difesa, e che la difesa ha – appunto – un costo. La guerra in Ucraina non pone solo problemi di sicurezza. Ha dimostrato l’entità del contagio fra sicurezza ed economia. Prendiamo l’energia: la fine del legame con Mosca ha danneggiato uno dei famosi pilastri del modello tedesco: l’import di gas a basso costo dalla Russia. La crisi di competitività dell’Europa, rispetto all’America, ha molto a che fare con lo scarto fra i prezzi dell’energia. L’Europa ha perso il serbatoio di risorse collegato all’asse euro-asiatico. Deve ricostruirlo sull’asse NordSud, guardando al ruolo dell’Africa. Cosa semplice a dirsi (il piano Mattei) ma meno semplice a farsi, visto che presuppone capacità diplomatiche e investimenti notevoli. E implica una capacità di recupero. Come dimostra la crisi libica, abbiamo per anni lasciato troppo spazio a Russia e Turchia. Come conferma l’espulsione della Francia dal Sahel, siamo stati divisi sulla questione africana, con le sue conseguenze in termini di flussi migratori. E come indica infine la presenza rilevante della Cina, abbiamo a lungo trascurato il fatto che risorse essenziali per l’agricoltura o la transizione energetica hanno bisogno di una partnership con l’Africa. Si misurerà qui, e non solo sul fronte orientale, la capacità dell’Europa di darsi una visione strategica."}, {"t": "p", "h": "L’Unione europea è figlia dei tempi di ieri. Va adattata ai tempi di oggi, che vedono una transizione del potere internazionale – fasi sempre rischiose e conflittuali nella storia – e una deglobalizzazione parziale, con il suo impatto sulle catene del valore. L’Europa, che importa materie prime e deve esportare, ha bisogno di mercati relativamente aperti per vivere. E deve posizionarsi rispetto alla competizione del secolo: la rivalità fra Stati Uniti e Cina, giocata largamente sul predominio tecnologico, come dimostrano le restrizioni sui semi-conduttori o gli investimenti rispettivi nell’Intelligenza Artificiale. Sicurezza e scelte democratiche spingono verso un’America che ha tuttavia tentazioni isolazioniste e protezionistiche. Le priorità economiche anche: l’entità dell’area transatlantica per commercio e investimenti tende ad essere regolarmente trascurata. Al tempo stesso, esiste l’interesse a mantenere in vita i legami con la Cina, al di là di un limitato “de-risking” in campo tecnologico. Sono sempre più evidenti, d’altra parte, le vulnerabilità collegate a dipendenze eccessive. Attuare il Green Deal, per come è stato impostato, non ha solo le conseguenze economiche e sociali che spiegano una parte dell’esito elettorale di giugno (una percezione diffusa è che i costi si scarichino sui consumatori, mentre le aziende europee restano comunque poco competitive, con poche eccezioni, in chiave globale). Un rischio ulteriore è di passare dalla dipendenza da Mosca per il gas alla dipendenza da Pechino per i materiali e le tecnologie collegate alle energie rinnovabili. I risultati elettorali produrranno quasi certamente un’agenda più pragmatica in materia di transizione climatica."}, {"t": "p", "h": "L’Unione europea potrà al tempo stesso impostare con Washington un rapporto più “transattivo”, come fa l’America stessa. Per esempio: gli Stati Uniti non possono chiederci di serrare i ranghi sui trasferimenti di tecnologia alla Cina e intanto decidere nuove tariffe sull’import europeo. Resta il fatto che l’Europa, come dimostra l’evoluzione del governo italiano in materia di rapporti con la Cina, non è nelle condizioni di permettersi ammiccamenti eccessivi verso i rivali autoritari delle democrazie occidentali. Alla prova del governo, una parte delle spinte eterodosse in politica estera tendono a normalizzarsi. Vedremo se sarà così, per i partiti della destra radicale, anche negli anni futuri."}, {"t": "p", "h": "Fra economia e sicurezza, l’Europa potrà combattere il declino relativo del Vecchio Continente solo a tre condizioni: cambiare agenda, capendo anzitutto che l’istinto per la regolazione non può sostituire investimenti veri nell’innovazione e sviluppi ulteriori del mercato unico; cambiare approccio alle politiche fiscali e della concorrenza, come condizioni di una vera ripresa industriale, anche nel settore della difesa; e riuscire a compiere scelte decisionali molto più rapide, cosa che probabilmente richiede forme di “integrazione differenziata” e quindi una maggiore flessibilità nel funzionamento interno dell’Unione."}, {"t": "p", "h": "L’Unione europea, a valle di una successione di crisi, deve insomma cambiare in modo sostanziale per invertire la sua parabola negativa. Come e in che direzione è ciò che si sarebbe dovuto discutere prima delle elezioni. Facciamolo dopo, senza cadere nell’illusione che tutto possa continuare com’è."}], "bio": "<strong>Marta Dassù<\/strong> dirige la rivista “Aspenia” ed è Senior Advisor European Affairs di Aspen Institute. È stata Vice-Ministro agli Affari Esteri negli anni 2011-2014. È VicePresidente del Centro Studi Americani e membro del Board dello European Council for Foreign Relations. Fa parte del Consiglio di Amministrazione di Renantis, della Fondazione Eni Enrico Mattei, dell’Advisory Board del Gruppo Marcegaglia. Fra le sue pubblicazioni recenti <em>L’età  della nostalgia. L’emozione che  divide l’Occidente<\/em> (2020, Egea). È editorialista del quotidiano “la Repubblica”. Ha ricevuto il Dottorato Honoris Causa in International Affairs dalla John Cabot University.", "notes": []}, "n4-ep37": {"epigraph": "Ora voglio raccontarvi, signori, che desideriate sentirlo oppure no, perché\nnon sono stato capace di diventare neppure un insetto. Vi dirò solennemente che molte volte ho voluto diventare un insetto. Ma neppure questo\nho meritato. Vi giuro, signori, che essere troppo coscienti è una malattia,\nun’autentica, completa malattia. Per la vita quotidiana dell’uomo sarebbe\npiù che sufficiente una comune coscienza umana, cioè una metà, un quarto della dose che tocca in sorte all’uomo evoluto del nostro sventurato diciannovesimo secolo, che abbia, oltre a ciò, la speciale sventura di abitare\na Pietroburgo, la città più astratta e premeditata di tutto il globo terrestre.\n(Le città possono essere premeditate o non premeditate.) Sarebbe più che\nsufficiente, per esempio, la coscienza con cui vivono tutti i cosiddetti uomini immediati e d'azione. Scommetto che voi pensate che io scriva tutto ciò\nper farmi bello, per fare dello spirito sugli uomini d’azione, e inoltre per una\nspacconata di cattivo gusto faccia baccano con la spada, come il mio ufficiale. Ma, signori, chi mai può vantarsi delle proprie malattie, e oltretutto\nfarsene bello?\nDel resto, che dico? Lo fanno tutti; si vantano appunto delle malattie, e io,\nforse, più di tutti. Non discuteremo; la mia obiezione è assurda. E tuttavia\nsono fermamente convinto che non solo l’eccesso di coscienza, ma addirittura qualsiasi coscienza è una malattia. Insisto su questo. Ma lasciamo da\nparte anche ciò per un attimo. Ditemi un po’: perché, come a farlo apposta,\nin quegli stessi, sì, proprio nei medesimi momenti in cui ero più capace di\nriconoscere ogni sottigliezza di “tutto ciò che è sublime ed elevato”, come si\ndiceva da noi una volta, mi capitava non già di riconoscere, ma di commettere azioni così indecenti, che... ma sì, insomma, che magari tutti commettono, ma che a me, come a farlo apposta, venivano proprio quando ero più\ncosciente del fatto che non andavano assolutamente commesse? Quanto\npiù ero cosciente del bene e di tutto quel “sublime ed elevato”, tanto più mi\nsprofondavo nel mio limo e tanto più ero capace di invischiarmene completamente. Ma l’aspetto principale era che tutto ciò non pareva casuale in me,\ncome se in qualche modo dovesse essere così."}}, "people": {"Nando Pagnoncelli": {"bio": "<strong>Nando Pagnoncelli<\/strong>, da 41 anni ricercatore sociale e di mercato, è presidente di Ipsos, società leader in Italia nel settore delle ricerche demoscopiche. È Consigliere di Amministrazione dell’Università Cattolica, dove insegna <em>“Analisi  della pubblica opinione”<\/em>, e della Fondation Robert Schumann di Parigi. È Presidente della School of Government della LUISS e membro del Consiglio Generale di ISPI, del Comitato Scientifico della Fondazione Symbola, nonché del Consiglio Direttivo del Touring Club Italiano. Collabora con Giovanni Floris al programma <em>Di Martedì<\/em> e cura la rubrica settimanale <em>Scenari<\/em> del «Corriere della Sera». È autore di saggi su argomenti di attualità sociale."}, "Alessandro Rosina": {"bio": "<strong>Alessandro Rosina<\/strong> è Professore ordinario di Demografia e Statistica sociale dell’Università Cattolica di Milano, dove dirige il Center for Applied Statistics in Business and Economics. È Consigliere esperto del CNEL su nomina del Presidente della Repubblica; coordinatore scientifico del “Rapporto giovani” dell’Istituto Toniolo; esperto della Commissione parlamentare di inchiesta sugli effetti economici e sociali della transizione demografica; parte del Team di Thematic Experts della European Commission. È autore di diverse pubblicazioni, fra cui <em>La  scomparsa dei giovani. Le 10 mappe  che spiegano il declino demografico  dell’Italia<\/em> (Chiarelettere) ed editorialista per «Il Sole 24 Ore»."}, "Giuliano Amato": {"bio": "<strong>Giuliano Amato<\/strong> è Presidente della consulta scientifica della Fondazione Cortile dei Gentili. È stato due volte Presidente del Consiglio (1992-1993 e 2000-2001) e Ministro dell’Interno nel governo Prodi (2006-2008). Ha ricoperto inoltre gli incarichi di Ministro del Tesoro, Ministro delle Riforme Istituzionali e Presidente dell’Autorità Antitrust (1994-1997). È stato Vice Presidente della Convenzione sul Futuro dell’Europa, che ha redatto la nuova Costituzione Europea. Laureato in Giurisprudenza a Pisa e con un Master alla Columbia University, è stato docente di Diritto Costituzionale Comparato e Italiano alla Sapienza di Roma."}, "Paolo Manfredi": {"bio": "<strong>Paolo Manfredi<\/strong> si occupa da oltre vent’anni di innovazione e trasformazione dei territori e delle piccole imprese. È consulente per la trasformazione digitale e responsabile sport di Confartigianato Imprese, professore a contratto all’Università di Milano-Bicocca e autore di saggi e articoli sull’economia, i territori, il cibo e il lavoro. Gira l’Italia per conoscerla, spesso in bicicletta."}, "Stefania Bandini": {"bio": "<strong>Stefania Bandini<\/strong> è professoressa ordinaria di Informatica presso l’Università degli Studi di MilanoBicocca. Dal 2008 collabora stabilmente con The University of Tokyo, prima con il Research Center for Advanced Science and Technology e oggi con il Department of Aeronautics and Astronautics. I suoi principali interessi di ricerca riguardano l’Intelligenza Artificiale e il suo ruolo nella modellazione e simulazione dell’Intelligenza Collettiva."}, "Gabriele Fava": {"bio": "<strong>Gabriele Fava<\/strong> è presidente dell’INPS dall’aprile 2024. Founder &amp; Chairman dello Studio legale Fava &amp; Associati, ha oltre trent’anni di esperienza in diritto del lavoro, societario e civile, ed è esperto di relazioni sindacali, ristrutturazioni aziendali e corporate governance. È docente a contratto di Diritto del lavoro all’Università Cattolica del Sacro Cuore. Ha rivestito numerose cariche istituzionali fra cui Commissario Straordinario di Alitalia, Presidente di Autostrade Alto Adriatico e, dal 2018 al 2023, componente e vicepresidente del Consiglio di presidenza della Corte dei conti."}, "Matteo Caroli": {"bio": "<strong>Matteo Caroli <\/strong>è professore ordinario di gestione delle imprese internazionali all’Università Luiss Guido Carli e Associate Dean per la sostenibilità e l’impatto alla Luiss Business School, dove è anche direttore dell’area della “ricerca applicata e osservatori”. In questo ambito è responsabile del filone di attività inerenti “l’economia della longevità” e ha pubblicato: <em>L’argento della Patria. Vivere e  lavorare in Italia dopo i sessanta  anni<\/em> (Luiss University Press, 2026), <em>Il Silver housing innovativo<\/em> (Edizioni Over, 2024)."}, "Andrea Rocchetti": {"bio": "<strong>Andrea Rocchetti<\/strong> è in Moneyfarm dal 2014, dove ha ricoperto ruoli di responsabilità crescente fino a diventare oggi Global Head of Wealth, supervisionando le attività legate agli investimenti gestiti della società. Ha conseguito la Laurea Magistrale in Quantitative Finance presso l’Università di Bologna nel 2012 ed è Analista Certificato di Investimenti Internazionali (CIIA). È iscritto all’Albo dei Consulenti Finanziari ed è socio ordinario AIAF, l’Associazione Italiana per l’Analisi Finanziaria."}, "Vincenzo Caridi": {"bio": "<strong>Vincenzo Caridi<\/strong> è Capo Dipartimento del lavoro del Ministero del lavoro e delle politiche sociali. Già Direttore Generale dell’INPS, in precedenza ha guidato la Direzione Centrale Tecnologia, Informatica e Innovazione dell’istituto, ricoprendo anche il ruolo di Vicario del Direttore Generale. In INPDAP è stato Direttore Centrale del Personale, Vicario del Direttore Generale e responsabile di Organizzazione e Previdenza. Laureato con lode in Economia e Commercio a Messina, ha conseguito un master in Innovazioni Tecnologiche al Politecnico di Milano e un MBA."}, "Davide Albertini Petroni": {"bio": "<strong>Davide Albertini Petroni<\/strong> è Presidente di Confindustria Assoimmobiliare. Da dicembre 2024 è Presidente e socio di SPACEST By Roomless, piattaforma digitale di affitti residenziali a medio-lungo termine operante in Italia e in Europa. Da  gennaio 2024 a febbraio 2025 è stato CEO del Gruppo COSTIM, attivo nello sviluppo immobiliare e nell’ingegneria, con un fatturato di 300 milioni di euro. Dal 2009 al 2023 è stato Amministratore Delegato di Risanamento S.p.A., società quotata in Borsa, supervisionando la gestione e vendita di asset per 3 miliardi di euro a Parigi, New York e in Italia, oltre al progetto Milano Santa Giulia."}, "Ferdinando Boccia": {"bio": "<strong>Ferdinando Boccia<\/strong> è Presidente della Cassa Dottori Commercialisti. Dottore Commercialista dal 1992, è Revisore Legale, CTU e Consulente del Pubblico Ministero in materia di reati societari e Tutor per l’Ente Nazionale per il Microcredito. Ha fondato lo Studio Boccia, specializzato in consulenza aziendale e societaria, finanza d’impresa e pianificazione finanziaria. Ha presieduto l’Unione Giovani Dottori Commercialisti di Bari ed è stato Consigliere di Amministrazione della Cassa nel mandato 2020-2024. È componente di Advisory Board di Fondi di Private Equity e relatore su previdenza e welfare di categoria."}, "Nico Tonti": {"bio": "<strong>Nico Tonti<\/strong> è Ricercatore in tenure track presso il Dipartimento di Scienze Giuridiche dell’Università di Bologna, dove si occupa principalmente dei rapporti tra diritto e fenomeno religioso associato, con particolare attenzione alla libertà religiosa, al pluralismo confessionale e al principio di laicità. Nel corso degli anni ha preso parte a numerosi convegni nazionali e internazionali, contribuendo al dibattito scientifico su temi emergenti relativi alle intersezioni tra diritto e religioni."}, "Tommaso Scalzi": {"bio": "<strong>Tommaso Scalzi<\/strong> è esperto di Public Affairs e relazioni istituzionali, opera tra Italia ed Europa sviluppando strategie di advocacy, comunicazione e networking per aziende, fondazioni e organizzazioni internazionali. Ha maturato esperienza nei settori healthcare, senior living, innovazione sociale e formazione, collaborando con istituzioni pubbliche, Parlamento Europeo e stakeholder strategici. Speaker e moderatore in contesti istituzionali e corporate, unisce visione politica, sviluppo progettuale e comunicazione strategica per creare connessioni tra imprese, istituzioni e società civile."}, "Simonetta Sciandivasci": {"bio": "<strong>Simonetta Sciandivasci<\/strong> (1985) vive e lavora a Roma. Giornalista alla «Stampa» dal 2021, dove per due anni è stata responsabile delle pagine di Cultura. Nel 2022 ha pubblicato <em>I figli che non voglio<\/em> per Mondadori. Ha lavorato al «Foglio» a lungo. Ha collaborato con «la Repubblica», «Linkiesta», «Rolling Stone». Autrice e conduttrice per Radio1, è stata consulente per diversi programmi televisivi in Rai. Si occupa con particolare attenzione di temi di genere."}, "Emma Nicolazzi Bonati": {"bio": "<strong>Emma Nicolazzi Bonati<\/strong> è nata a Parma nel 2003. È studentessa di lettere classiche all’Università di Bologna. Dal 2023 è attiva nel team che ha portato la città di Parma a candidarsi e ottenere il riconoscimento di Capitale Europea dei Giovani 2027. Oggi è presidente del Comitato per Parma European Youth Capital 2027 e membro del Consiglio Locale dei Giovani di Parma."}, "Gustavo De Santis": {"bio": "<strong>Gustavo De Santis<\/strong> è professore di demografia presso l’Università degli studi di Firenze e Presidente dell’associazione culturale Neodemos (www.neodemos.it). Si è recentemente interessato ai problemi legati all’invecchiamento della popolazione, soprattutto in relazione alle difficoltà che esso pone al sistema previdenziale. Su questo tema ha pubblicato numerosi articoli scientifici e divulgativi, e ha scritto il volume <em>Nati con la pensione<\/em> (Il Mulino, 2025)."}, "Maurizio Ambrosini": {"bio": "<strong>Maurizio Ambrosini<\/strong> è Professore ordinario di Sociologia delle migrazioni all’Università degli Studi di Milano. Ha tenuto corsi per diversi anni anche all’Università di Nizza, nella sede italiana della Stanford University, a Sciences-Po Parigi, all’universidad Complutense di Madrid. Dirige il Centro studi Medì (Migrazioni nel Mediterraneo) di Genova, dove cura la rivista «Mondi migranti» e la Scuola estiva di Sociologia delle migrazioni.  Ha fatto parte del CNEL (2017-2022), dove ha coordinato l’organismo dedicato alle politiche per l’integrazione dei cittadini stranieri. Collabora regolarmente con «Avvenire» e con lavoce.info, contribuendo al dibattito pubblico sui temi migratori."}, "Raffaele Marchetti": {"bio": "<strong>Raffaele Marchetti<\/strong> è Direttore Centro Studi Internazionali e Strategici e Professore ordinario di Relazioni internazionali alla Luiss Guido Carli di Roma, con incarico congiunto presso il Dipartimento di Scienze Politiche e la School of Government. Dirige il Campus Arabo-Mediterraneo, oltre a coordinare percorsi executive in affari strategici e diplomazia globale. È editor delle collane <em>Innovations in International  Affairs<\/em> (Routledge) e <em>Radar<\/em> (Luiss University Press) ed editorialista per la <em>Berliner Zeitung<\/em>. Si occupa di governance globale, diplomazia ibrida, cybersecurity e democrazia."}, "Ester Gallo": {"bio": "<strong>Ester Gallo<\/strong> è professoressa associata di Antropologia presso il Dipartimento di Sociologia e Ricerca Sociale dell’Università di Trento. Ha ricoperto incarichi di ricerca e didattica presso l’Istituto Universitario Europeo-Centro Robert Schuman for Advanced Studies e le Università di Gediz, Edimburgo, Perugia, del Sussex e presso il Centre for Development Studies-CDS (India). I suoi interessi di ricerca riguardano parentela, migrazione e religione, genere e storia coloniale, memorie familiari e classe sociale, e metodi di ricerca etnografici e qualitativi."}, "Piergiorgio Donatelli": {"bio": "<strong>Piergiorgio Donatelli<\/strong> è professore ordinario di Filosofia morale presso la Sapienza Università di Roma, dove ha diretto il Dipartimento di Filosofia dal 2019 al 2025. I suoi interessi riguardano l’etica, la bioetica e le trasformazioni legate all’intelligenza artificiale, con attenzione alle intersezioni tra forme di vita ed esperienza democratica. Tra i suoi volumi recenti: <em>Le storie dell’etica<\/em> (Carocci, 2022), <em>The Politics of Human Life<\/em> (Routledge, 2021), <em>La filosofia  e la vita etica<\/em> (Einaudi, 2020). È Presidente della Consulta di Bioetica e Vicepresidente della Società Italiana per l’Etica dell’Intelligenza Artificiale."}, "Linda Laura Sabbadini": {"bio": "<strong>Linda Laura Sabbadini<\/strong>, statistica, studiosa di cambiamenti sociali, pioniera negli studi di genere, è stata direttrice dell’Istat. Ha guidato il rinnovamento radicale delle statistiche sociali e di genere e ha fatto parte di numerosi gruppi di alto livello e centri di eccellenza di Onu, Ocse, Eurostat. È editorialista del quotidiano «la Repubblica» e Chair di Women20. Ha ricevuto l’onorificenza di Commendatore dal Presidente Carlo Azeglio Ciampi e di Grande Ufficiale dal Presidente Mattarella."}, "Sarah Dierna": {"bio": "<strong>Sarah Dierna<\/strong> è dottoranda in Scienze dell’Interpretazione presso il Dipartimento di Scienze Umanistiche dell’Università di Catania, dove collabora con la cattedra di Filosofia teoretica. Ha pubblicato saggi, articoli e recensioni per varie riviste scientifiche e su volumi collettanei. Nel 2023 ha curato, per Oxford University Press, la traduzione italiana di <em>The Misanthropic  Argument for Antinatalism<\/em> di David Benatar. Nel 2025 ha pubblicato la monografia <em>È il nascere che  non ci voleva. Storia e teoria  dell’Antinatalismo<\/em> (Mimesis). Da settembre 2025 svolge la sua attività di ricerca come Visiting Scholar presso la Klassik Stiftung/ Nietzsche-Kolleg di Weimar."}, "Giorgio Calabrese": {"bio": "<strong>Giorgio Calabrese<\/strong> è uno dei maggiori esperti mondiali in materia di diete e nutrizione. Laureato in Medicina a Catania e specializzato in Scienze dell’Alimentazione a Pavia, è docente di Dietologia umana e Dietoterapia all’Università di Torino e del Piemonte Orientale. Già dietologo della Juventus F.C. e Presidente del CNSA, è stato membro dell’EFSA a Bruxelles e oggi siede nella New York Academy of Sciences e nell’American Association for the Advancement of Science. È consulente e volto noto di RAI, oltre che firma di «Corriere della Sera», «La Stampa» e «Repubblica»."}, "Filippo Ongaro": {"bio": "<strong>Filippo Ongaro<\/strong> è medico, autore e speaker di fama internazionale, pioniere della medicina della longevità e imprenditore nel settore. Dal 2000 al 2007 è stato medico degli astronauti all’ESA, collaborando con NASA e Agenzia Spaziale Russa. Primo italiano certificato negli USA in medicina anti-aging (ABAARM) e funzionale (IFM), ha fondato e diretto per 10 anni il primo istituto italiano di medicina anti-aging. Ha seguito astronauti, militari d’élite, atleti, manager e artisti, ed è autore di diversi bestseller. Certificato in coaching strategico (RobbinsMadanes e Centro di Terapia Strategica del Prof. Nardone), vive in Svizzera e si dedica a coaching, divulgazione e imprenditoria."}, "Francesco Vidoli": {"bio": "<strong>Francesco Vidoli<\/strong> è Professore associato di Statistica Economica presso il Dipartimento di Economia, Società, Politica dell’Università degli Studi di Urbino Carlo Bo. Ha conseguito la laurea in Statistica Economica e il Dottorato di ricerca in Statistica Economica presso l’Università di Roma La Sapienza. La sua attività di ricerca si concentra sull’analisi dell’efficienza dei servizi pubblici, con particolare attenzione alla valutazione delle performance delle amministrazioni territoriali. I suoi interessi includono lo sviluppo e l’applicazione di indicatori compositi per la misurazione di fenomeni multidimensionali, nonché l’utilizzo di metodologie statistiche avanzate per la stima e il controllo dell’eterogeneità spaziale nei dati economici e sociali."}, "Ramón Palou de Comasema": {"bio": "<strong>Ramón Palou de Comasema <\/strong>è Presidente e Amministratore Delegato Healthcare in Merck Italia da gennaio 2024. Entrato in Merck nel 2015 come Business Unit Head Oncology per la Spagna, ha svolto un ruolo cruciale nell’ingresso dell’azienda nel settore dell’immuno-oncologia. Successivamente è stato promosso a Vice President, Global Oncology Brand Lead del Gruppo. Prima di entrare in Merck, ha ricoperto diverse posizioni in Amgen, tra cui quella di Direttore della filiale portoghese dell’azienda. Laureato in Ingegneria Industriale presso l’Università Politecnica della Catalogna, ha conseguito un diploma post-laurea in Scienze presso l’Università di Tecnologia di Tampere (Finlandia) e un MBA presso la ESADE Business School di Barcellona."}, "Laura Rienzi": {"bio": "<strong>Laura Rienzi<\/strong> è embriologa clinica con 30 anni di esperienza nel settore della Procreazione Medicalmente Assistita, Professoressa associata presso il Dipartimento di Scienze Biomolecolari dell’Università di Urbino, membro dello Scientific Advisory Board di IVI-RMA Global Research Alliance e Direttrice scientifica del network GENERA in Italia. Dal 2025 è Presidente di AIFe - Associazione Italiana Fertilità."}, "Andrea Abodi": {"bio": "<strong>Andrea Abodi<\/strong> (Roma, 7 marzo 1960) è Ministro per lo Sport e i Giovani del Governo Meloni. Laureato in Economia e Commercio alla LUISS, con una tesi sulle sponsorizzazioni sportive, vanta oltre trentacinque anni di esperienza nella gestione dello sport come sistema industriale e sociale. Ha ricoperto ruoli di vertice in istituzioni e società pubbliche, tra cui la presidenza dell’Istituto per il Credito Sportivo e della Lega Nazionale Professionisti B. Giornalista pubblicista, è attivo anche nella formazione universitaria e nei master dedicati allo sport, alle infrastrutture e alla responsabilità sociale. Il 22 ottobre 2022 ha prestato giuramento nelle mani del Presidente della Repubblica Sergio Mattarella."}, "Michele Uva": {"bio": "<strong>Michele Uva<\/strong> è un dirigente sportivo italiano con una carriera pluridecennale nei più alti livelli del sistema sportivo italiano e europeo. Laureato all’Università di Bologna, ha lavorato nel calcio, nella pallavolo, nella pallacanestro e nel Comitato Olimpico Italiano, ricoprendo ruoli di vertice in club, federazioni e leghe. Dall’inizio del 2021 è Executive Director per la sostenibilità sociale e ambientale della UEFA, incarico in cui guida l’integrazione della sostenibilità nelle strategie della confederazione, e dal 2025 è anche delegato UEFA per l’organizzazione degli Europei di calcio 2032 in Italia. Autore di vari libri e relatore internazionale, è stato inserito nel TIME100 Climate come uno dei leader influenti per il clima."}, "Luca Pancalli": {"bio": "<strong>Luca Pancalli<\/strong>, già campione paralimpico con 15 medaglie, è una delle figure più autorevoli dello sport italiano. Fondatore nel 1993 della FISAPS e, dal 2000, guida della FISD, ha contribuito in modo decisivo alla nascita e allo sviluppo del Comitato Italiano Paralimpico, che ha presieduto fino al 26 giugno 2025. È stato vice presidente del CONI e segretario generale dell’EPC. Dal 2017 al 2025 è stato il primo italiano nella storia a far parte del Governing Board dell’International Paralympic Committee. Dal 2006 al 2007 ha ricoperto l’incarico di Commissario Straordinario della FIGC. Assessore allo Sport di Roma nel 2013, ha ricevuto prestigiose onorificenze nazionali e internazionali, tra cui il Paralympic Order e il titolo di Cavaliere di Gran Croce."}, "Paolo Condò": {"bio": "<strong>Paolo Condò<\/strong> ha iniziato la sua carriera al «Piccolo di Trieste», per poi lavorare a lungo alla «Gazzetta dello Sport» e a «la Repubblica». Dal 2015 è talent di Sky Sport e oggi scrive per il «Corriere della Sera». Ha seguito sette Mondiali, cinque Europei, due Olimpiadi, undici finali di Champions e otto Giri d’Italia. Tra i suoi libri, la biografia di Francesco Totti, scritta con lui, <em>Un Capitano<\/em>, da cui è stato tratto il docufilm <em>Mi chiamo Francesco  Totti<\/em> che ha vinto il David di Donatello."}, "Silvia Aymonino": {"bio": "<strong>Silvia Aymonino<\/strong> inizia il suo percorso alla sartoria Tirelli, dove lavora con Gabriella Pescucci, ricoprendo ruoli dalla produzione manuale alla direzione organizzativa. Negli anni successivi si dedica soprattutto all’opera lirica, alla quale dedica una carriera trentennale, firmando i costumi dell’inaugurazione del 7 dicembre 2024 alla Scala di Milano con <em>La Forza del Destino<\/em>. Partecipa inoltre a produzioni cinematografiche italiane e internazionali come costume e wardrobe supervisor. La sua prima esperienza nelle Cerimonie Olimpiche è Torino 2006; successivamente collabora con Marco Balich per Londra 2012, Sochi 2014, Rio 2016 e il Flag Handover di Pechino 2022 per Milano-Cortina 2026. Nel 2020 riceve il Premio Franco Abbiati per i costumi di Agnese."}, "Andrea Muratore": {"bio": "<strong>Andrea Muratore<\/strong> è analista geopolitico ed economico, collabora con “Inside Over” e con Ispi, per il quale realizza analisi di politica estera per &quot;Insider&quot; di Sky Tg24. Già Responsabile Analisi dell’Osservatorio sulla Sicurezza del Sistema Industriale Strategico Nazionale del Centro Italiano di Strategia e Intelligence (Cisint), svolge oggi attività di ricerca e analisi geopolitica presso Confapi Brescia. Nel 2019 è stato tra i co-fondatori di Osservatorio Globalizzazione, centro di ricerca milanese sui fenomeni globali presieduto dal professor Aldo Giannuli."}, "Francesco Giorgianni": {"bio": "<strong>Francesco Giorgianni<\/strong> è un avvocato specializzato in diritto civile, commerciale e internazionale, che ha unito profonda expertise nel diritto e regolazione dell&#x27;energia, guidando le relazioni istituzionali per Enel a Bruxelles, negli USA e in America Latina. Oggi consiglia i propri clienti sulle regole all&#x27;intersezione di tre mondi: energia. digitale, globale. Con competenze all&#x27;avanguardia in intelligenza artificiale, protezione dei dati e cybersecurity, affianca clienti nel settore sanitario, della ricerca e della medicina digitale. Supporta con la sua visione strategica aziende e fondazioni innovative attraverso la partecipazione ai loro board. Come <em>Of Counsel<\/em> presso lo Studio Legale LCa-amm e Docente di Trasformazione Digitale e Diritto della Privacy alla Pontificia Università Lateranense, trasferisce la sua esperienza alle giovani generazioni."}, "Antonella Baldino": {"bio": "<strong>Antonella Baldino<\/strong> è Amministratore Delegato e Direttore Generale dell’Istituto per il Credito Sportivo e Culturale. Vanta una solida esperienza internazionale nel corporate e investment banking e nella finanza per lo sviluppo, con competenze in finanza di progetto, operazioni straordinarie e strumenti di finanza pubblica e sostenibile. Nel 2015 entra in Cassa Depositi e Prestiti come Chief Business Officer, assumendo successivamente la guida della Cooperazione Internazionale e della Finanza per lo Sviluppo. Nel 2024 ha copresieduto il Gruppo di Esperti G7 su Sport e Sviluppo Sostenibile e guida dal 2022 la Coalizione per lo Sviluppo Sostenibile attraverso lo Sport nell’ambito del network Finance in Common. Ha ricoperto incarichi nei CdA di Terna, Ansaldo Energia, Fintecna, SACE, Simest e Generali. Laureata con lode in Economia alla Sapienza, ha un Master in Economia Internazionale al Graduate Institute di Ginevra."}, "Andrea Monti": {"bio": "<strong>Andrea Monti<\/strong> è Chief Communications Officer della Fondazione Milano Cortina 2026. Giornalista di lungo corso, ha diretto Panorama, Sette, GQ, Oggi e per più di dieci anni La Gazzetta dello Sport. Ha ricoperto ruoli chiave in Mondadori e RCS MediaGroup, contribuendo attivamente alla strategia di comunicazione dei gruppi media in cui ha lavorato."}, "Umberto Zapelloni": {"bio": "<strong>Umberto Zapelloni<\/strong> scrive di sport dagli anni Ottanta. Ha seguito il Mondiale di Formula 1, Giochi Olimpici e tante partite di calcio e basket come inviato de <em>il Giornale<\/em> di Montanelli, poi è stato responsabile della redazione sportiva del <em>Corriere  della Sera<\/em> e vicedirettore della <em>Gazzetta dello Sport<\/em>. Attualmente cura l&#x27;inserto sportivo (e quello dedicato alla Mobilità) de <em>Il Foglio<\/em>, scrive di F1 per <em>il Giornale<\/em> ed è opinionista di <em>Race Anatomy<\/em> su Sky e <em>Pressing<\/em> sulle reti Mediaset. Scrive libri dedicati allo sport."}, "Antonio Maria Napoli": {"bio": "<strong>Antonio Maria Napoli<\/strong> è consulente finanziario con esperienza in ambito istituzionale e nella produzione di eventi culturali e musicali. Laureato in Relazioni Internazionali, collabora con il Centro Studi Geopolitica.info, concentrando la propria attività di ricerca e analisi sull’Europa e sulla regione artica."}, "Francesca Buttara": {"bio": "<strong>Francesca Buttara<\/strong> è manager e consulente strategico con oltre 15 anni di esperienza nei settori delle relazioni istituzionali e della comunicazione. È stata responsabile delle relazioni istituzionali e della comunicazione della Lega Pro, la Serie C di calcio. Ha collaborato come consulente strategico, tra gli altri, con Lega Basket Serie A, Lega Pallavolo Serie A, Lega Basket Femminile, Lega Pallavolo Femminile, Fondazione Laureus Italia, Federazione Ginnastica d’Italia, Golf Club Milano con l’obiettivo di promuovere il valore economico, politico e sociale dello sport. In precedenza, ha maturato esperienza nel settore corporate e consulenziale in UnipolSai, Deloitte e Reti, lavorando a progetti complessi di advocacy, stakeholder engagement e comunicazione istituzionale."}, "Lamberto Ciabatti": {"bio": "<strong>Lamberto Ciabatti<\/strong> è autore tv e documentarista. Tra i suoi documentari, <em>Un Selfie con il Papa<\/em> (su e con Papa Francesco) e <em>Gli  Immortali<\/em> (su e con Jovanotti). Autore di programmi sia culturali che di intrattenimento, ha lavorato con le principali emittenti televisive e piattaforme di streaming. È inoltre ideatore e autore del format “Il Supplente”, trasmesso dalla RAI e da Discovery (venduto in Spagna e Portogallo). Per Sem ha pubblicato <em>ULTRAS<\/em> (2025), in cui racconta dodici storie di ultras di altrettante squadre (i diritti sono stati opzionati da Cattleya che, dal libro, sta sviluppando una serie tv)."}, "Manuel Orazi": {"bio": "<strong>Manuel Orazi<\/strong> insegna presso l&#x27;Accademia di architettura di Mendrisio, Università della Svizzera italiana. Dal 2003 collabora con la casa editrice <em>Quodlibet<\/em> di Macerata, dove cura diverse collane dedicate ad architettura, paesaggio e urbanistica. Scrive per <em>Il Foglio<\/em>, <em>Domus<\/em>, <em>Log<\/em>, <em>Volume<\/em> e altre riviste. Nel 2025 ha co-curato la mostra <em>Stadi. Architettura e mito<\/em> al MAXXI di Roma, la prima grande esposizione italiana dedicata a questo tema."}, "Martina Caironi": {"bio": "<strong>Martina Caironi<\/strong> è una delle più note atlete paralimpiche italiane, specializzata nei 100 metri e nel salto in lungo. Dopo l’incidente del 2007 intraprende l’atletica e, negli anni, diventa una delle sportive più titolate del movimento paralimpico. Ha vinto tre ori e quattro argenti ai Giochi paralimpici, oltre a numerosi titoli mondiali ed europei. Tesserata per le Fiamme Gialle, è Ambassador e Legacy Specialist per Milano Cortina 2026. Partecipa a iniziative divulgative e a progetti multimediali dedicati allo sport e al mondo paralimpico."}, "Federico Smanio": {"bio": "<strong>Federico Smanio <\/strong>è CEO di Wylab, primo incubatore <em>sport-tech<\/em> in Italia, e oggi un partner strategico per l’innovazione di aziende corporate, startup e istituzioni. Ex calciatore professionista, con oltre 25 anni di esperienza nello sport professionistico e 10 anni come consulente per startup, corporate e istituzioni, è esperto di innovazione, trasformazione digitale e imprenditorialità. Docente in master universitari e speaker in eventi nazionali e internazionali, dal 2022 è anche Program Director di WeSportUp, acceleratore sport &amp; wellness promosso da CDP Venture Capital."}, "Alberto Zoli": {"bio": "<strong>Alberto Zoli<\/strong> è Direttore Generale del Grande Ospedale Metropolitano NIguarda di Milano ed è stato individuato da Regione Lombardia come Medical Care Manager per i Giochi Olimpici e Paralimpici Milano Cortina 2026, con la responsabilità di coordinare tutti i medical service che opereranno durante i Giochi sul territorio lombardo. Già Direttore Generale dell&#x27;AREU, l&#x27;Agenzia Regionale Emergenza Urgenza della Lombardia, si è da sempre occupato dei grandi temi legati all&#x27;emergenza, con incarichi strategici a livello nazionale; tra questi, l&#x27;avvio e la diffusione, nell&#x27;ambito del progetto del Ministero dell&#x27;Interno, del Numero Unico dell&#x27;Emergenza 112 in Italia."}, "Vito Cozzoli": {"bio": "<strong>Vito Cozzoli<\/strong> è Amministratore delegato di Autostrade dello Stato S.p.A. Già Presidente e Amministratore Delegato di Sport e Salute, ha ricoperto ruoli apicali nelle istituzioni italiane: Capo dell’Avvocatura della Camera dei deputati (2006-2014), Capo di Gabinetto del Ministero dello Sviluppo Economico (2014-2016 e 2018-2020) e al Ministero del Lavoro e Politiche Sociali (2018- 2019). È stato inoltre a capo del Servizio Sicurezza della Camera dei deputati (2017-2018)."}, "Daniela Simonetti": {"bio": "<strong>Daniela Simonetti<\/strong> è una giornalista e saggista italiana. Ha iniziato la sua carriera nel 1988 all’ANSA, prima come giornalista parlamentare e poi nel settore sportivo. Nel 2017 ha fondato la prima associazione italiana contro gli abusi nello sport, <em>ChangeTheGame<\/em>. È autrice di <em>Impunità di Gregge. Sesso, bugie  e omertà nel mondo dello sport<\/em> (Chiarelettere, prefazione di Marco Travaglio), il primo libro-inchiesta sugli abusi sessuali nello sport, vincitore del Premio Letterario Internazionale Città di Como, con Dacia Maraini in giuria. Nel 2021 è stata inserita tra i cento Sport Thinkers nella classifica a cura di Moris Gasparri e Mauro Berruto, pubblicata su «Il Foglio»."}, "Marco Mezzaroma": {"bio": "<strong>Marco Mezzaroma<\/strong>, imprenditore, e Presidente di Sport e Salute. Negli anni ha ricoperto diversi ruoli dirigenziali: è stato Amministratore Delegato dell’A.S. Roma, Consigliere e Vicepresidente della Lega Nazionale Serie B, e comproprietario dell’U.S. Salernitana."}, "Maria Cecilia Morandini": {"bio": "<strong>Maria Cecilia Morandini<\/strong> è avvocato, consigliera nazionale del CONI e Presidente di ASC - Attività Sportive Confederate. È la prima donna alla guida di un ente di promozione sportiva riconosciuto dal Coni."}, "Paolo Zannoni": {"bio": "<strong>Paolo Zannoni<\/strong> è Vicepresidente Vicario del Consiglio di Amministrazione e Amministratore Esecutivo di Prada Group e advisor internazionale per Goldman Sachs. Partner di Goldman Sachs per oltre vent’anni, è stato presidente di Prysmian, Autogrill e Fiat USA. Presso la Yale University, è membro dell’Advisory Board dell’International Center for Finance e del Jackson Institute. Si è formato nelle università di Bologna, Firenze (con Giovanni Sartori) e Yale. <em>Moneta e promesse.  Sette storie di banchieri che hanno  plasmato il mondo moderno<\/em> (Rizzoli, 2024) è il suo primo libro."}, "Niccolò Valmori": {"bio": "<strong>Niccolò Valmori<\/strong> è ricercatore presso il Robert Schuman Center, Istituto Universitario Europeo, e il Dipartimento di Storia Economica della London School of Economics dove ha insegnato “History of Banking systems”. Dopo il dottorato ottenuto all’Istituto Universitario Europeo ha ricoperto incarichi di insegnamento e ricerca presso numerosi istituti internazionali tra i quali l’Institut d’Études politiques, l’École des Hautes Études en Sciences Sociales, Stanford University, University of Pennsylvania e King’s College, Londra. Tra i suoi interessi principali l’evoluzione storica dei rapporti tra finanza e politica, oggetto del suo libro <em>Banking and Politics in the Age  of Democratic Revolution<\/em> (Liverpool University Press, 2023)."}, "Roberto Sommella": {"bio": "<strong>Roberto Sommella<\/strong> è un giornalista e scrittore, cittadino onorario di Ventotene e Cavaliere della Repubblica. Esperto di tematiche Antitrust e del mercato unico, è Direttore di MF-Milano Finanza e del sito milanofinanza.it. Nel 2021 ha vinto il Premio Agnes per il giornalismo economico, nel 2025 gli è stato conferito dall’Ordine dei Giornalisti il premio “Un Giglio Bianco per la pace e la libertà di stampa”. È stato componente per l’Italia della Conferenza sull’Europa e siede nel Comitato tecnico per lo studio dell’Intelligenza Artificiale presso il Dipartimento Editoria. È Presidente dell’associazione “La Nuova Europa” e docente presso l’Università Politecnica delle Marche, ha tenuto seminari presso l’Università Luiss e l’Università Roma Tre. Ha scritto per <em>Corriere della Sera<\/em>, <em>Europa<\/em>, <em>HuffPost Italia<\/em>, <em>Avvenire<\/em>, curando rubriche su Radio Radicale e lanuovaeuropa.it. Il suo ultimo libro è <em>Al verde, manifesto  dei tempi moderni<\/em> (Rubbettino, 2025)."}, "Milena Messori": {"bio": "<strong>Milena Messori<\/strong> è capo dell’u!icio del Gruppo BEI in Italia dal febbraio 2024, responsabile per i finanziamenti a infrastrutture, utilities e settore pubblico. Durante la sua carriera alla BEI, ha maturato una vasta esperienza in operazioni al di fuori dell’Unione Europea, ricoprendo i ruoli di Direttrice ad interim per il settore privato e di Capo della divisione equity e venture capital. Dal 2009 al 2012 ha guidato l’u!icio della BEI a Bucarest. In precedenza, ha lavorato alla Banca Mondiale su progetti infrastrutturali in Europa dell’Est e Asia Centrale. Ha ottenuto un MBA a Insead, un Master in A!ari Internazionali alla George Washington University - Elliott School in quanto Fulbright scholar, e si è laureata in Scienze Internazionali e Diplomatiche presso l’Università di Trieste."}, "Alberto Saravalle": {"bio": "<strong>Alberto Saravalle<\/strong> è professore di Diritto dell’Unione europea all’Università di Padova. È stato tra i fondatori e presidente di uno dei principali studi legali italiani. Ha collaborato con vari ministeri in veste di consigliere giuridico e, da ultimo, è stato componente del Comitato scientifico per il futuro dell’Europa istituito nel 2021. Dopo la laurea a Padova, ha conseguito un Master all’Università di Cambridge e uno alla Yale Law School (Fulbright Scholar Program). Suoi editoriali sono stati pubblicati, tra gli altri, sul <em>Corriere  della Sera<\/em>, <em>Il Foglio<\/em>, <em>la Repubblica<\/em> (sezione A!ari e Finanza), <em>Il Sole 24  Ore<\/em>, <em>The Wall Street Journal<\/em>. È autore di diversi volumi, fra cui <em>Capitalismo  di guerra<\/em> (Fuoriscena, 2025), scritto con Carlo Stagnaro."}, "Francesco Bonami": {"bio": "<strong>Francesco Bonami<\/strong> è un curatore d’arte contemporanea di fama internazionale, ha iniziato la carriera a New York negli anni Ottanta. È stato direttore artistico della Fondazione Sandretto Re Rebaudengo (1995– 2017) e della 50ª Biennale di Venezia (2003), oltre a curare importanti rassegne in tutto il mondo. È stato senior curator presso il Museum of Contemporary Art di Chicago, dove ha organizzato la prima retrospettiva di Je! Koons e ha collaborato alla realizzazione delle mostre di alcuni dei più famosi artisti della scena contemporanea, tra cui Damien Hirst, Maurizio Cattelan, Rudolf Stingel e Takashi Murakami. Scrittore e podcaster, è autore di numerosi saggi sull’arte. Oggi dirige il centro d’arte JNBY a Huangzhou progettato da Renzo Piano. Collabora con <em>Il Foglio<\/em> e <em>Vanity Fair<\/em>, e nel 2025 ha pubblicato <em>Artista Fallito<\/em> negli Stati Uniti."}, "Stefano Feltri": {"bio": "<strong>Stefano Feltri<\/strong> è laureato in Economia alla Bocconi. Dopo gli inizi alla <em>Gazzetta di Modena<\/em>, ha lavorato per <em>Il Foglio<\/em>, <em>Il Riformista<\/em> e per <em>il Fatto Quotidiano<\/em>, dove è stato responsabile dell’economia e poi vicedirettore. Ha conseguito un MBA alla Booth School of Business di Chicago, collaborando con Luigi Zingales e lo Stigler Center. Tornato in Italia, ha fondato e diretto <em>Domani<\/em> fino al 2023. Oggi cura la newsletter <em>Appunti<\/em>, scrive per varie testate e conduce il programmapodcast <em>t<\/em> su Radio3. È professore a contratto all’Università di Bologna."}, "Pietro Spirito": {"bio": "<strong>Pietro Spirito<\/strong> è docente di Management delle Infrastrutture presso l’Universitas Mercatorum e di Economia Applicata presso l’Università Pegaso. Ha dedicato il suo impegno professionale nel settore dei trasporti: è stato Presidente della Autorità di Sistema Portuale del Mar Tirreno Centrale, Presidente e Direttore Generale dell’Interporto di Bologna, Direttore Centrale Operazioni di Atac, dirigente per vent’anni nel Gruppo Ferrovie dello Stato. Ha pubblicato di recente: <em>Il nuovo  capitalismo della mobilità<\/em> (Gui
