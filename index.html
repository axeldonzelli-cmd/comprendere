", "h": "Proprio al tornante tra anni ’50 e ’60 si manifestarono i primi grandi segnali di diffidenza e critica della politica nucleare allora in atto, quando una oramai matura e diffusa coscienza pacifista e antinuclearista si affermò in Occidente e nel resto del mondo dovendo fare i conti con uno dei momenti più aspri del confronto fra Stati Uniti e Unione Sovietica. Nei giorni della crisi missilistica di Cuba (ottobre 1962), la paura dell’olocausto nucleare raggiunse l’acme dando origine ad appelli per un deciso e non più procrastinabile cambio di rotta nelle relazioni fra blocchi, pena il completo annichilimento del genere umano. Negli anni della distensione, la paura della guerra termonucleare rimase un potente monito che spinse le due superpotenze a regolamentare gli esperimenti e la proliferazione di testate sempre più potenti. Contemporaneamente, gli sviluppi tecnologici e gli investimenti pubblici furono alla base di politiche economiche che vedevano nel nucleare una possibile alternativa alle tradizionali fonti di energia."}, {"t": "p", "h": "La recrudescenza delle tensioni tra Est ed Ovest alla fine degli anni Settanta non fece altro che riportare in auge una narrazione pubblica sul nucleare e sulle radiazioni le cui origini risalivano a trenta anni prima. Il nucleare nel corso degli anni Ottanta divenne nuovamente sinonimo di morte di massa e di sofferenze indicibili. L’incidente alla centrale di Chernobyl del 26 aprile 1986 sancì in maniera oramai definitiva agli occhi di molti l’impossibilità per l’uomo di poter controllare l’atomo e la sua forza. Anche l’ultimo mito positivo dell’<em>atomic age<\/em>, le potenzialità creatrici e progressive di un uso accorto del nucleare per usi civili veniva spazzato via dal vento che in quei giorni portò l’incubo radioattivo a minacciare la tranquillità delle case e delle tavole di molte famiglie europee."}], "bio": "<strong>Maurizio Zinni<\/strong> insegna Storia contemporanea e Storia dei partiti politici e dei movimenti sociali presso l’Università di Roma Sapienza. I suoi interessi di ricerca riguardano i rapporti fra culturale e politica nel XX e XXI secolo, in particolare lo studio delle icone moderne e dei media come fonti della storia contemporanea. Tra le sue pubblicazioni <em>Fascisti di celluloide.  La memoria del ventennio nel cinema  italiano (1945-2000)<\/em> e <em>Schermi  radioattivi. L’America, Hollywood e l’incubo nucleare da  Hiroshima alla crisi di Cuba<\/em> entrambi editi da Marsilio. Nel 2021 ha pubblicato con Alessandro Volterra il volume <em>Il leone, il giudice e il capestro.  Storia e immagini della repressione  italiana in Cirenaica (1928-1932)<\/em> con l’editore Donzelli.", "notes": []}, "n6-ep55": {"epigraph": "“Se possedessimo questa conoscenza,” disse, “pensate a ciò che potremmo\nrealizzare! Non solo saremmo in grado di sfruttare l’uranio e il torio; non\nsolo avremmo una fonte di energia così potente che un uomo potrebbe tenere nel palmo della mano la forza necessaria per illuminare un’intera città\nper un anno, affrontare una flotta da guerra o spingere uno dei nostri grandi\ntransatlantici attraverso l’Atlantico; ma avremmo anche una chiave capace,\nfinalmente, di accelerare il processo di disintegrazione in tutti gli altri elementi, dove il decadimento è ancora così lento da sfuggire alle nostre più\nfini misurazioni. Ogni singolo frammento di materia solida nel mondo diventerebbe un serbatoio disponibile di forza concentrata. Vi rendete conto,\nsignore e signori, di cosa significherebbe tutto questo per noi?”\nIl capo annuì. “Oh! Continua, continua.”\n“Significherebbe un mutamento nelle condizioni umane che posso paragonare solo alla scoperta del fuoco, quella prima rivelazione che sollevò l’uomo al di sopra della bestia.”"}, "n6-ep101": {"epigraph": "E se lo si costringesse a guardare la luce stessa, non sentirebbe male agli\nocchi e non fuggirebbe volgendosi verso gli oggetti di cui può sostenere la\nvista? e non li giudicherebbe realmente piú chiari di quelli che gli fossero\nmostrati? – È cosí, rispose. – Se poi, continuai, lo si trascinasse via di lí a forza, su per l’ascesa scabra ed erta, e non lo si lasciasse prima di averlo tratto\nalla luce del sole, non ne soffrirebbe e non s’irriterebbe di essere trascinato? E, giunto alla luce, essendo i suoi occhi abbagliati, non potrebbe vedere\nnemmeno una delle cose che ora sono dette vere. – Non potrebbe, certo, rispose, almeno all’improvviso. – Dovrebbe, credo, abituarvisi, se vuole vedere il mondo superiore. E prima osserverà, molto facilmente, le ombre e poi le\nimmagini degli esseri umani e degli altri oggetti nei loro riflessi nell’acqua,\ne infine gli oggetti stessi; da questi poi, volgendo lo sguardo alla luce delle\nstelle e della luna, potrà contemplare di notte i corpi celesti e il cielo stesso\npiú facilmente che durante il giorno il sole e la luce del sole. – Come no?\n– Alla fine, credo, potrà osservare e contemplare quale è veramente il sole,\nnon le sue immagini nelle acque o su altra superficie, ma il sole in se stesso,\nnella regione che gli è propria. – Per forza, disse. – Dopo di che, parlando del\nsole, potrebbe già concludere che è esso a produrre le stagioni e gli anni e a\ngovernare tutte le cose del mondo visibile, e ad essere causa, in certo modo,\ndi tutto quello che egli e i suoi compagni vedevano. [...]\nRifletti ora anche su quest’altro punto. Se il nostro uomo ridiscendesse e\nsi rimettesse a sedere sul medesimo sedile, non avrebbe gli occhi pieni di\ntenebra, venendo all’improvviso dal sole? – Sí, certo, rispose. – E se dovesse\ndiscernere nuovamente quelle ombre e contendere con coloro che sono rimasti sempre prigionieri, nel periodo in cui ha la vista offuscata, prima che\ngli occhi tornino allo stato normale? e se questo periodo in cui rifà l’abitudine fosse piuttosto lungo? Non sarebbe egli allora oggetto di riso? e non si\ndirebbe di lui che dalla sua ascesa torna con gli occhi rovinati e che non vale\nneppure la pena di tentare di andar su? E chi prendesse a sciogliere e a condurre su quei prigionieri, forse che non l’ucciderebbero, se potessero averlo\ntra le mani e ammazzarlo? – Certamente, rispose."}, "n6-comin": {"paras": [{"t": "p", "h": "Si torna a discutere di nucleare. A dodici anni da Fukushima, che fu la causa dello stop al secondo piano nucleare italiano dopo il primo referendum del 1987, il governo ha consegnato al Parlamento una legge delega che, se non ci saranno intoppi, riporterà al Paese le norme necessarie a regolare il settore. La legge è arrivata dopo un approfondito lavoro della “Piattaforma Nazionale per un nucleare sostenibile” che sotto l’egida di Enea (l’Ente di ricerca delle energie alternative che non ha mai abbandonato la ricerca, anche applicata) e di Rse, il centro ricerca economica del Gse ha coinvolto università, imprese private, enti pubblici in una fotografia dello stato dell’arte per sviluppare una roadmap, con orizzonte 2030 e 2050, per seguire e coordinare gli sviluppi delle nuove tecnologie nucleari. A completare il quadro la nascita di una società partecipata da Enel, Ansaldo e Leonardo, che dovrà approfondire tecnologie ed essere pronta ai nuovi reattori non appena la legislazione sarà completata."}, {"t": "p", "h": "A differenza del Piano del decennio scorso, che aveva sposato la tecnologia francese Epr e il modello di centrale di terza generazione in costruzione a Flamanville, il percorso ipotizzato dal ministro Gilberto Pichetto Fratin, non esclude nessuna tecnologia né generazione, con una particolare attenzione alla terza plus e alla quarta, con un orizzonte temporale di 30-40 anni. Questo approccio dovrebbe evitare veti incrociati tra detentori delle diverse tecnologie e inciampi geopolitici, e soprattutto consentirà all’Italia – che è restata inevitabilmente indietro – di recuperare con l’ultima tecnologia disponibile, non aggiustando e correggendo la più vecchia."}, {"t": "p", "h": "Fin qui tutto bene. I più entusiasti di un ritorno all’era nucleare sono i professori e gli ingegneri, costretti a lavorare nell’ombra in questi anni per tenere viva la fiammella della ricerca. Poi le aziende, Enel, Edison, Eni, Nucleo e altre che stanno scaldando i muscoli o che hanno concentrato le loro competenze all’estero. E poi ci sono i siderurgici, come Duferco, pronti a partecipare al nucleare italiano per garantirsi energia a prezzi competitivi."}, {"t": "p", "h": "E i cittadini italiani? Il tema dell’accettabilità sociale e della comunicazione è centrale. Affrontare un piano nucleare senza aver “preparato il terreno” e promosso una nuova sensibilità nell’opinione pubblica è un sicuro fallimento. Ci sono però, oggi, molti elementi che possono generare fiducia negli operatori e nelle istituzioni. Il primo è la nuova sensibilità sui temi della sostenibilità e dei cambiamenti climatici. Il nucleare è entrato nella tassonomia europea ed è generalmente riconosciuto come la tecnologia che può, assieme alle rinnovabili e agli accumuli/batterie, battere i carburanti fossili. Di questo sono forse più convinti i movimenti giovanili più battaglieri che le storiche associazioni dell’ambientalismo classico. Il secondo: la guerra ucraina e la conseguente crisi del gas ha messo tutti di fronte al rischio di restare al buio e al freddo. L’eccessiva dipendenza da una risorsa e da un Paese – il gas russo – ha dimostrato la fragilità del nostro sistema. In pochi mesi il governo prima Draghi, ora Meloni, ha garantito risorse alternative, da Paesi però che non garantiscono stabilità eterna. L’unica soluzione per un Paese che non ha risorse naturali proprie è l’indipendenza che può dare il nucleare. Il terzo: dopo anni di critiche all’approccio scientifico oggi pare recuperare nell’opinione pubblica diffusa un certo rispetto per il pensiero scientifico. Il Covid, pur dando voce a sparute minoranze no vax, ha riportato nei cittadini la consapevolezza che ricerca e tecnologia sono fondamentali per il benessere dei cittadini."}, {"t": "p", "h": "Il quarto: rispetto al precedente Piano nucleare oggi la comunicazione si è resa più sofisticata. Abbiamo capacità di monitorare le conversazioni online, diffondere in modo massiccio il pensiero e i contenuti, arginando l’uso strumentale della rete."}, {"t": "p", "h": "Basterà tutto questo? Certamente no. L’avvio di una riflessione sul nucleare richiede un approccio sistemico della comunicazione e l’uso delle tecnologie e delle tecniche più sofisticate di coinvolgimento. Metodi che le principali aziende possono mettere in campo con risorse economiche adeguate. Nel decennio scorso, l’Enel si fece carico non solo dell’approccio tecnico e ingegneristico, ma anche di proporre e sostenere un articolato piano di informazione degli stakeholders che è ancora oggi un modello di comunicazione integrata."}, {"t": "p", "h": "Il cosa fare, dunque, lo sappiamo: analisi continua delle opinioni di diverse categorie di cittadini, studi del linguaggio più adatto a dialogare con i diversi stakeholder, capacità di analizzare i potenziali conflitti, tempestività nel comunicare attivando la maggioranza silenziosa, anche con strumenti come il dibattito pubblico. Quest’ultimo strumento, mutuato dall’esperienza sulle grandi infrastrutture, può essere determinante nel superare gli “stalli” dell’opinione pubblica su posizioni apparentemente inconciliabili. Lo fa consentendo ai partecipanti di esprimere, su un piano razionale ed evitando le dinamiche “muro contro muro”, i propri argomenti a favore e contro una scelta, portando perciò il consenso (e il dissenso, dove non sia possibile trovare una mediazione) su un piano razionale e documentato."}, {"t": "p", "h": "Proprio il tema del nucleare in Italia non è nuovo a pratiche di discussione informata."}, {"t": "p", "h": "Più di tutto, dunque, conterà la coerenza e la perseveranza. Gli <em>stop and go<\/em>, i cambi di linea, i messaggi contraddittori sono le pillole avvelenate in un dibattito che può essere certo anche teso e vivace in alcuni momenti, ma anche riflettere una maturità nelle scelte che in molti casi i cittadini italiani mostrano di avere."}], "bio": "", "notes": []}, "n5-sapelli": {"paras": [{"t": "p", "h": "Il mondo ha subito negli ultimi dieci anni tante profonde trasformazioni che hanno tutte un segno distintivo: improvvisamente catene di relazioni tra merci, persone, tecnologie e sistemi di riconoscimento culturale, antropologico, che parevano collaudate da sempre e per sempre, si sono interrotte, con il blocco intermittente dei flussi della vita umana associata. Quella vita umana minacciata di contaminazione, privata tanto della distribuzione di macchine per la produzione di macchine, quanto impedita della capacità di transito attraverso plessi strategici per il commercio mondiale: è la continuità stessa del vivere che si è vista e si vede minacciata da avversità pandemiche e naturali e guerre di ogni genere."}, {"t": "p", "h": "È coraggioso, in un simile contesto, fermarsi e chiedere a molti di coloro che lavoravano al continuo rinnovarsi dell’essere e che creano così la foresta rigogliosa e minacciata della vita, è coraggioso chiedere Loro, di interrompere per un momento il lavoro e interrogarsi su che cosa sia cambiato in questo mondo – tra ieri e oggi – in questi ultimi dieci anni così densi di trasformazioni. Che poi questo fermarsi e questo periodizzare trovi un punto di appoggio nella vicenda ormai decennale di una avventura intellettuale, prima che economica, come Comin &amp; Partners non è casuale. E non è casuale che tale avventura inizi quando il decennio ha un plesso significativo di cambiamento epocale."}, {"t": "p", "h": "Per questo pare pertinente e necessario, ora che siamo giunti al quinto numero di COMPRENDERE, dedicare un lavoro di riflessione collettiva al tema della trasformazione in corso tra il passato, il presente e il futuro: sì, il tempo che passa e che segna l’avvento del futuro, in quel continuo presente che – come ci insegnava Sant’Agostino – è il nostro destino, tra ricordo, riflessione e memoria, speranza e immaginazione…"}, {"t": "p", "h": "E abbiamo voluto che questa riflessione fosse costruita attraverso un rapporto tra diverse generazioni attraverso gli autori che su questo numero scrivono."}, {"t": "p", "h": "Sono tempi terribili. Tempi di un orrore che pensavamo fosse dietro di noi e che invece è ritornato per non finire presto. La storia ci chiama a prove gigantesche. Per questo il filo della comprensione e della relazione sociale non si deve spezzare, anche se pare che, invece, possa accadere ogni momento. Per questo abbiamo lavorato a questo nuovo numero di “Comprendere”."}, {"t": "p", "h": "Nessuno meglio del Mario Luzi della maturità poteva rappresentare il nostro lavoro e il nostro intendere:"}, {"t": "p", "h": "<em>“Qui il filo si spezza. <\/em>"}, {"t": "p", "h": "<em>Non cedimento dell’anima, solo stanchezza dello scriba – mi dico – o ne mormora una voce lontana da sotto i rimasugli, lingue ultime schioccanti, di ghetto in fiamme.<\/em>"}, {"t": "p", "h": "<em>Stanchezza di lui guardato a vista con papiri e carte dal suo sosia l’ardente matematico seduto nello scranno accanto in penombra o da altri, anche più impenetrabili, dalla faccia di quisling.<\/em>"}, {"t": "p", "h": "<em>Conosco questi testimoni e giudici. Quei giustizieri. Prevarranno?<\/em>"}, {"t": "p", "h": "<em>Non prevarranno – mi dice la mia anima fatta anima”<\/em>"}, {"t": "a", "h": "Mario Luzi,<em> Su fondamenti invisibili<\/em>"}], "bio": "", "notes": []}, "n5-comin": {"paras": [{"t": "p", "h": "Questo numero di “Comprendere”, dedicato al decennale di Comin &amp; Partners, vuole offrire ai lettori uno sguardo sul recente passato (i dieci anni passati, appunto) e uno sul prossimo futuro. Abbiamo affidato queste analisi temporali a esperti, giovani e meno giovani in una alternanza che credo possa essere interessante."}, {"t": "p", "h": "D’altra parte anche Comin &amp; Partners è un esempio imprenditoriale che unisce l’esperienza dei partner fondatori con la freschezza e la forza di decine di giovani neolaureati o poco più che lavorano o hanno lavorato con noi."}, {"t": "p", "h": "In questi dieci anni, infatti, il nostro obiettivo è stato molto più che creare un’agenzia di comunicazione e lobby. La sfida è stata dare vita a una comunità viva, fatta di persone, soprattutto giovani, con cui abbiamo esplorato nuovi orizzonti, mescolando competenze, intuizioni e, soprattutto, energia."}, {"t": "p", "h": "I dieci temi scelti rappresentano questioni cruciali che ci toccano tutti: dalla crisi delle democrazie globali all’evoluzione della comunicazione, fino alle frontiere dell’innovazione e al nostro rapporto con la natura. Con queste riflessioni, “Comprendere” si fa interprete del nostro impegno a leggere e anticipare i cambiamenti, una piattaforma dove cultura, società e professioni si incontrano in un dialogo autentico e arricchente."}, {"t": "p", "h": "A ciascuno di voi – che tenete tra le mani questa rivista – voglio dire grazie. Questo decennale è solo l’inizio di un nuovo capitolo, una fonte di ispirazione che ci spinge a continuare a innovare e crescere insieme."}], "bio": "", "notes": []}, "n5-a1": {"paras": [{"t": "q", "h": "Dieci anni fa è iniziata l’avventura Comin &amp; Partners. Cosa è cambiato oggi?"}, {"t": "p", "h": "<strong>Gianluca Comin:<\/strong> I valori e le emozioni che ci guidano non sono cambiati. Sono cambiati il mercato, il contesto, le esigenze dei clienti."}, {"t": "p", "h": "Come qualsiasi cosa che richiede manutenzione, anche i nostri valori sono stati costantemente nutriti: una pianta trascurata appassisce, proprio come le relazioni tra le persone, che si mantengono vive solo se alimentate da momenti di condivisione, da una visione comune per il futuro e dalla capacità di affrontare insieme le difficoltà e risolvere i problemi che emergono."}, {"t": "p", "h": "D’altra parte, come per tutte le aziende, sia grandi che piccole, la missione fondamentale è la crescita. Sin dalla sua nascita, Comin &amp; Partners ha sempre guardato alle opportunità di sviluppo, che possono includere nuovi mercati, strumenti innovativi e servizi che offrono ai clienti un vantaggio competitivo in un ambiente sempre più sfidante."}, {"t": "q", "h": "Dove va il mondo? Come cambia il mestiere del comunicatore?"}, {"t": "p", "h": "<strong>Gianluca Comin:<\/strong> Non è facile immaginare in che direzione andiamo nel mondo della comunicazione, il nostro è un settore dinamico e imprevedibile. Mentre possiamo prevedere tendenze nell’aerospazio o nell’energia, nella comunicazione ci troviamo di fronte a fattori totalmente intangibili che influenzano i costumi, le aspettative delle persone e persino la politica. Questo rende difficile anticipare come ci relazioneremo in futuro."}, {"t": "p", "h": "Per questo motivo, dobbiamo sviluppare antenne e capacità interpretative che ci permettano di captare segnali deboli e di elaborarli. È fondamentale prestare attenzione agli strumenti e ai trend emergenti, come l’intelligenza artificiale, i social media, la comunicazione informale e la lobby diffusa, che richiederanno un’attenzione particolare. Tuttavia, ho sempre sostenuto che, sebbene gli strumenti siano importanti, ciò che conta di più sono i contenuti. Essi rappresentano il cuore della comunicazione e sono essenziali per trasmettere le idee costruite nel momento giusto. Negli ultimi anni, eventi come guerre e crisi hanno evidenziato l’importanza di comprendere come cambiano i sentimenti delle persone, quali sono le loro priorità. Per questo credo che la nostra società, con un’età media di 32 anni, incoraggia tutti a esprimere il proprio punto di vista con libertà e fantasia, perché la freschezza di visione e la sensibilità nei confronti dell’opinione pubblica che portano con sé i giovani sono risorse preziose che non possiamo sottovalutare."}, {"t": "p", "h": "<strong>Elena Di Giovanni:<\/strong> Se dovessi lasciare un messaggio in una capsula che verrà aperta da qui a 10 anni, mi vengono in mente due parole chiave che ci guideranno nei prossimi anni: “contenuti” e “ambiente”. Chi comunichiamo? Comunichiamo le aziende, le istituzioni e le persone e queste devono confrontarsi col mercato e con le sfide ambientali attuali. Non possiamo limitarci a parlare di tecnologie e strumenti senza approfondire i contenuti che alimentano l’intelligenza artificiale e non possiamo continuare a parlare di ESG senza lasciare una vera <em>legacy<\/em> ai giovani. Nei prossimi dieci anni, vedo una comunicazione radicalmente diversa riguardo a questi due temi, anche legati tra loro: non sarà solo retorica fatta di storytelling e tomi di bilanci di sostenibilità ma piuttosto avrà un approccio pratico e incisivo, caratterizzato da verità e azione. Questo binomio implica anche un recupero del tempo nella comunicazione, per garantire qualità ai contenuti. La rapidità ha il suo valore, specialmente quando si tratta di rispondere a una crisi, ma anche la lentezza – per citare Calvino che nelle sue <em>Lezioni Americane<\/em> fa l’elogio della rapidità che non esclude la lentezza – ha la sua importanza per avere un futuro più sostenibile. E speriamo che I’IA diventi sempre più intelligenza e meno artificiale."}, {"t": "p", "h": "<strong>Gianluca Giansante:<\/strong> Credo che ci siano tre parole chiave che devono continuare a guidarci per rimanere all’avanguardia nei cambiamenti futuri. La prima è innovazione: dobbiamo saper cogliere le innovazioni utili, non quelle fini a sé stesse, ma quelle che ci consentono di lavorare meglio, più rapidamente e con una qualità superiore, offrendo un valore aggiunto alle persone con cui interagiamo e raggiungendo un pubblico sempre più ampio. Negli ultimi anni, abbiamo già affrontato l’ingresso di piattaforme che sono diventate indispensabili per raggiungere i nostri stakeholder e dovremo sempre cercare di anticipare l’emergere di nuovi strumenti e modalità per ottenere un vantaggio competitivo. La seconda parola è “rispetto”, cioè attenzione a tutti gli stakeholder. Questo principio ci ha sempre contraddistinto e continuerà a farlo, soprattutto mentre ci aspettiamo di crescere ulteriormente."}, {"t": "p", "h": "Infine, la terza parola è “qualità”, perché “solo il bel fare può durare”. Credo fermamente che la produzione di prodotti di alta qualità sia essenziale per mantenere la fiducia e la reputazione in un mercato così competitivo e in rapida evoluzione."}, {"t": "p", "h": "Penso che nei prossimi dieci anni la comunicazione diventerà sempre più veloce, breve, tecnologica e multimediale. Dobbiamo essere capaci di produrre contenuti rapidamente. La sfida della brevità è significativa, considerando quanto sia difficile esprimere messaggi concisi, ma questa tendenza è ormai consolidata. Inoltre, stiamo assistendo a un cambiamento guidato dalla tecnologia, con uno spostamento dall’uso della parola scritta verso un uso predominante di immagini e, sempre più, di video e di contenuti multimediali."}, {"t": "p", "h": "<strong>Lelio Alfonso:<\/strong> Prima di tutto, ricordiamoci che non possiamo prevedere con certezza come cambieranno le cose; ed è questa è la sfida più affascinante. Abbiamo già vissuto e testato molte situazioni evolutive. Alcune, basti pensare al metaverso, di cui abbiamo parlato per mesi come del futuro della comunicazione digitale, sono praticamente scomparse. Quando insegnavo all’università, ogni anno dovevo modificare il programma, non perché ci fossero nuovi libri di testo, ma perché il panorama cambiava continuamente: prima è arrivato Facebook, poi Twitter, quindi Instagram e TikTok. E così continuerà ad essere."}, {"t": "p", "h": "Insomma, questo scenario complesso aumenta il nostro ruolo come professionisti, in quanto ci impone di interpretare e gestire linguaggi che si intrecciano sempre di più tra giornalismo, informazione, comunicazione e reputazione. Ci troviamo di fronte a un’enorme quantità di dati, informazioni, immagini e stimoli che richiedono un approccio professionale per essere gestiti efficacemente. Altrimenti, corriamo il rischio di creare una vera e propria Torre di Babele digitale, che potrebbe minacciare e mettere in difficoltà le forme di comunicazione tradizionali, compreso il giornalismo. È nostro dovere, oltre che un nostro obiettivo, riflettere su questi linguaggi, saperli interpretare e comunicarli in modo efficace."}, {"t": "p", "h": "<strong>Federico Fabretti:<\/strong> Se penso al nostro ruolo come comunicatori nel raccontare la verità (se esiste ancora il concetto di verità in un’epoca di “post verità”...), mi sento di dire che non credo nella fine di alcuni mezzi di comunicazione, come alcune Cassandre prevedono. Piuttosto, ci sarà una coesistenza sempre più intrecciata e ibrida tra molteplici media. L’intelligenza artificiale avrà un impatto significativo, amplificherà le potenzialità umane su molti aspetti, soprattutto su quelli analitici e rappresentativi. Ma la nostra risposta a questo scenario che cambia sarà tanto più incisiva quanto più saremo veloci ad adattarci, da un lato, ma soprattutto quanto più manterremo “credibilità”. Noi costruiamo la realtà di fatti e assistiamo le aziende nel farlo, e la trasmettiamo ai media che la valutano, la verificano e la trasmettono a chi legge e fruisce di queste informazioni. In questo processo la nostra credibilità deve rimanere un presupposto imprescindibile."}, {"t": "q", "h": "Un momento che non scordate di questi dieci anni di Comin &amp; Partners?"}, {"t": "p", "h": "<strong>Gianluca Comin:<\/strong> Ci sono stati molti momenti emozionanti, significativi e belli in questi dieci anni. Se dovessi elencarne alcuni, il primo è sicuramente quando abbiamo costituito la società, una scelta che per me è stata irreversibile. Fino a quel momento avevo avuto diverse opportunità, ma con la nascita di Comin &amp; Partners ho preso una decisione definitiva, almeno nella mia mente. Un secondo momento è stato il primo <em>offsite<\/em>, a Radicofani, durante il quale abbiamo posto le basi per la crescita della società. Infine, un’esperienza che non scorderò è quando, in pieno agosto del 2018, ho lasciato amici e famiglia e sono andato a Genova, per seguire da vicino la tragedia del crollo del ponte Morandi. È stato un momento di grande impatto, sia per la sua gravità che per l’importanza del lavoro svolto."}, {"t": "p", "h": "Infine, questo momento, alle porte del decimo anniversario, è altrettanto significativo. Quando abbiamo iniziato, non avremmo mai immaginato che il tempo sarebbe passato così in fretta. Siamo cresciuti, passando da 0 a 80 dipendenti, e questo ci riempie di orgoglio."}, {"t": "p", "h": "<strong>Elena Di Giovanni:<\/strong> Ricordo un weekend in barca con amici, nei primi di luglio 2014. Un weekend che ha cambiato la mia vita, anche se in quel momento non era chiaro cosa sarebbe nato. Gianluca aveva lasciato Enel e io ero ancora con Sala all’Expo."}, {"t": "p", "h": "Parlammo di fondare una società insieme, lavorammo insieme a un progetto che stava seguendo lui. Rientravo da poco dopo vari anni all’estero"}, {"t": "p", "h": "e conoscevo Gianluca da quando lui aveva iniziato a lavorare in Enel e io alla Biennale di Venezia. Non ero pienamente consapevole del potenziale che avevamo e di quello che avremmo potuto realizzare ma Gianluca ha sempre avuto visione. Una volta scesi dalla barca, andai a cercare l’ufficio e trovai Santi Apostoli e pensammo subito a come inserire l’angolo bar in un ufficio di meno di 200 mq."}, {"t": "p", "h": "Guardando indietro, questi anni sono stati un viaggio straordinario e un percorso di apprendimento continuo sia con tutti i soci, sia con i giovani che ci accompagnano."}, {"t": "p", "h": "<strong>Gianluca Giansante:<\/strong> Ricordo un caffè da Donay, anni dopo rispetto a quando avevo conosciuto Gianluca Comin, in occasione di una festa Enel dove spritz e sigari non mancavano! Ma sono due i momenti a cui sono più legato: il primo è la nostra primissima riunione, quando non avevamo ancora un ufficio e ci appoggiavamo in una piccola stanza di uno studio legale. Senza una sede stabile, cominciavamo a gettare le basi per un approccio strategico, come l’evento Tweet Politics: un progetto che già dimostrava la nostra attenzione verso gli stakeholder, la tecnologia e la voglia di innovare."}, {"t": "p", "h": "Il secondo momento è stato l’inaugurazione del nostro ufficio in piazza Santi Apostoli. È stato un evento che ci ha fatto realizzare quanto fossimo riusciti a fare in così poco tempo. Grazie alla presenza di tantissimi amici, l’inaugurazione è stata molto partecipata, piena di affetto. Porto con me quell’immagine della nostra capacità di costruire relazioni solide, basate sulla fiducia e sulla reputazione che abbiamo saputo consolidare."}, {"t": "p", "h": "<strong>Lelio Alfonso:<\/strong> L’apertura dell’ufficio di Milano è stato un grande momento di soddisfazione personale e di gruppo. Dopo tanti anni, desideravo tornare a lavorare in questa città, ma in un modo completamente diverso. Abbiamo iniziato in due, con Chiara Scilhanick, in un piccolo ufficio e con un solo cliente, in un luogo che definirei con un eufemismo “provvisorio”."}, {"t": "p", "h": "Poi abbiamo trovato un ufficio straordinario, ed è stato un passo importante per Comin &amp; Partners. Quel cambiamento non riguardava solo la bellezza del luogo, vista Duomo, ma anche il posizionamento della società, che da quel giorno non è più stata solo una grande realtà romana, ma è diventata un’azienda consolidata e di respiro nazionale. Anche se avevamo già clienti fuori Roma, aprire un ufficio a Milano, una città con molte altre società di consulenza, è stato un passo fatto con umiltà. Non siamo arrivati imponendoci, ma abbiamo costruito tutto gradualmente e i risultati ci hanno ripagato, rendendo quel momento e quella scelta davvero speciale."}, {"t": "p", "h": "Un altro momento importante è stato il lancio di “Comprendere”. Con la scienza e sapienza di Giulio Sapelli abbiamo dato vita ad una rivista che ad ogni numero ci stupisce ed emoziona. Ci tenevo molto, perché desideravo tornare alla direzione di una testata, ma è soprattutto un progetto bellissimo, che ci permette di raccontare il mondo e le sue sfide provando appunto a “comprendere” quello che accade e che accadrà, insieme al team straordinario che alterna il lavoro “normale” a quello redazionale."}, {"t": "p", "h": "<strong>Federico Fabretti:<\/strong> Il momento che scelgo racchiude sia una parte personale sia una riflessione più ampia sul nostro posizionamento. Mi riferisco a tutte le attività istituzionali che svolgiamo, un un po’ per tutti i clienti. Alcuni in misura ampia, come il Meeting di Rimini, il G7 o la Fondazione Natalità. Altri forse meno. Sento che questa dimensione sia nelle mie corde, forse perché ho trascorso trent’anni in grandi aziende pubbliche. Allo stesso tempo, rafforza indubbiamente il posizionamento di C&amp;P, che pur essendo privata e gestita da imprenditori, ha guadagnato una forte riconoscibilità anche a livello istituzionale."}, {"t": "p", "h": "Se penso invece ad un momento meno legato a specifiche attività, mi viene da rispondere “i nostri <em>offsite<\/em>”. Mi piace considerarli come un seme che viene piantato in una sorta di ritiro di riflessione e che poi genera energia per tutto l’anno. Sono occasioni in cui non solo facciamo il punto su ciò che abbiamo realizzato, ma soprattutto elaboriamo nuove idee, alimentiamo il senso di gruppo, di creatività e di forza che ci accompagna per tutto l’anno.Questi momenti di condivisione e di <em>team building<\/em> sono per me il cuore pulsante della nostra attività."}, {"t": "q", "h": "Qual è la parola che ha caratterizzato il vostro percorso?"}, {"t": "p", "h": "<strong>Gianluca Comin:<\/strong> La mia parola chiave è stata divertimento. È su questo che si fonda la mia passione, la motivazione a superare le difficoltà e a cercare persone con cui condividere la stessa visione. In questi anni non sono stati né il guadagno né il potere a spingermi, ma il desiderio di continuare a divertirmi, tanto quanto ho vissuto con piacere i miei lavori precedenti."}, {"t": "p", "h": "<strong>Elena Di Giovanni:<\/strong> La parola che mi ha sempre guidato è passione. Per me, la passione è stata la stella polare che ha tracciato la nostra direzione. In essa si trovano pathos, impegno, lavoro e fatica, che generano quell’energia necessaria per rendere il lavoro gratificante e divertente. È proprio la passione che ci guida verso il futuro e che dobbiamo trasmettere ai giovani."}, {"t": "p", "h": "<strong>Gianluca Giansante:<\/strong> Il primo pensiero che mi viene in mente è la gratitudine. Gratitudine verso tutti gli stakeholder con cui ci confrontiamo quotidianamente: il mondo della comunicazione, dell’informazione e delle istituzioni, che ci ascoltano con rispetto e ci offrono la possibilità di dialogare. Ma anche gratitudine verso i soci e i colleghi di Comin &amp; Partners, e le aziende con cui collaboriamo, che ci hanno dato e continuano a darci fiducia. Senza di loro, la crescita non sarebbe possibile."}, {"t": "p", "h": "<strong>Lelio Alfonso:<\/strong> La mia parola è insegnamento. Quando si raggiunge una certa età (evitiamo di chiamarla maturità) si tende a pensare di sapere già tutto. Eppure, in questi dieci anni, abbiamo avuto l’opportunità di apprendere un mestiere che praticavamo e conoscevamo in altre forme, ma in modi nuovi, condividendo esperienze e crescendo insieme. Abbiamo anche avuto il privilegio di trasmettere ciò che sappiamo ai giovani, con un approccio da mentori, e di vederli crescere. Continuare a insegnare e imparare ci permette di mantenere viva la consapevolezza di chi siamo e di ciò che facciamo. Forse non siamo i migliori – anche se ci fa piacere quando ce lo riconoscono – ma ciò che offriamo è passione, gratitudine e divertimento. La nostra più grande soddisfazione è proprio condividere questi valori con i giovani, che non solo aumentano di numero, ma crescono come professionisti, donne e uomini pronti a essere il futuro di questa professione."}, {"t": "p", "h": "<strong>Federico Fabretti:<\/strong> La mia parola è energia. In oltre 30 anni di attività ho avuto modo di vivere diverse aziende e istituzioni, eppure l’energia creativa e professionale che percepisco qui dentro è stato sin da subito l’aspetto che mi ha colpito di più. L’energia è il motore che dal niente crea qualcosa di unico e insostituibile e che l’intelligenza artificiale non potrà mai sottrarci: genera idee, alimenta la passione, sviluppa il lavoro, crea legami, sostiene il gruppo e rafforza l’unione. Dinamica e potente, l’energia quindi è quella forza che ci permette ogni giorno di imparare qualcosa e di poterla insegnare, perché non si perda e diventi stile di lavoro."}, {"t": "q", "h": "Quali consigli darebbe a un giovane che intende fare il comunicatore?"}, {"t": "p", "h": "<strong>Gianluca Comin:<\/strong> Prima di tutto, voglio sottolineare l’importanza di perseguire questo lavoro, che considero uno dei più belli in assoluto. Ci consente di essere al centro di ciò che accade e, talvolta, di essere protagonisti degli eventi, una posizione che non è comune."}, {"t": "p", "h": "Un secondo elemento fondamentale è la necessità di studiare, informarsi e continuare a farlo, sempre. Anche dopo decenni di esperienza, il nostro percorso continua perché solo chi non smette di cercare sa trovare nuove strade. Essere curiosi riguardo a ciò che ci circonda è essenziale. La curiosità è la molla che, a mio avviso, ha mosso me sin dall’inizio della mia carriera giornalistica. Significa cercare di comprendere cosa c’è oltre ciò che è visibile. Questo approccio ci offre un valore aggiunto rispetto a coloro che si limitano a guardare solo quello che appare."}], "bio": "", "notes": []}, "n5-a2": {"paras": [{"t": "p", "h": "<em>Un dialogo intergenerazionale a due voci, incentrato sui temi cruciali del  nostro tempo e sui cambiamenti radicali e irreversibili che hanno caratterizzato gli ultimi decenni. Il professor Giulio Sapelli e l’editore Francesco Giubilei discutono gli scenari sociali, politici ed economici emergenti,  in una riflessione che si alimenta e si arricchisce attraverso il confronto.  Insieme, esplorano con apertura e chiarezza il contesto in cui viviamo.<\/em>"}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Viviamo in un mondo senza filosofia. Per avviare la nostra riflessione sui cambiamenti che ci sono stati e su quelli che saranno – a cui dedichiamo questo numero di “Comprendere” – è fondamentale partire da quello che considero il mutamento più radicale nella vita sociale. In passato, il percorso di individuazione della Persona avveniva attraverso la relazione, mentre oggi è sempre più definita dalla <em>performance<\/em>. Se questa affermazione è vera, dobbiamo chiederci: perché?"}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Credo che ci sia stato un cambio repentino nel giro di dieci anni. Se confronto la mia generazione, quella nata negli anni ’90, con quella dei 2000, noto una profonda differenza. Questo divario è principalmente legato all’influenza crescente delle tecnologie, che hanno progressivamente permeato ogni aspetto della vita quotidiana, con inevitabili ripercussioni sulle relazioni umane."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Quindi, ritieni che le cause di questo fenomeno siano da attribuire all’uso crescente della tecnologia e ai comportamenti solitari che essa tende a favorire?"}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Le tecnologie hanno indubbiamente contribuito alla disgregazione del concetto di comunità. Negli ultimi venti o trent’anni, i principi e i valori fondamentali che caratterizzavano le comunità – soprattutto nei piccoli centri, ma anche nelle province e, in parte, nelle grandi città – sono progressivamente scomparsi. Basti pensare al ruolo, un tempo centrale, della famiglia, delle parrocchie e dei partiti. Queste organizzazioni hanno perso la loro influenza, e con essa, la loro funzione sociale."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Mi viene in mente la riflessione di Henry Sumner Maine, uno dei più eminenti antropologi, sociologi e storici del diritto dell’Inghilterra vittoriana – che in <em>Ancient Law<\/em> (London, Murray, 1861), sosteneva che la storia mondiale segnava il passaggio inesorabile <em>from status to contract<\/em>, ossia dalle società fondate sulla comunità valoriale a quelle dominate dal mercato che faceva trionfare l’individualismo dispiegato. Per Sumner Maine il mercato si sarebbe affermato per una sorta di trasformazione sociale, che scaturiva dalla lenta, inesorabile marcia delle relazioni tra gruppi e non per imposizione statuale. Si sarebbe affermato non tramite il principio di gerarchia, ma con la concorrenza inveratasi per via spontanea e tramite la relazione tra le classi e i ceti sociali liberamente organizzati. Lo stato avrebbe favorito ma non imposto questo processo, come invece oggi accade, trasformando tutto in una società gerarchica dominata da funzionari."}, {"t": "p", "h": "Oggi il mercato è imposto dallo stato, dalla legislazione e dai regolamenti definiti dalle élite del potere decisionale che, volta a volta, predominano nella società. Ecco il concetto di <em>governance<\/em> che bene esprime ciò che accade: è una casta che governa con regole, non con leggi dei parlamenti, il corpo sociale: una sorta di <em>neo cameralismo<\/em>, che gli incolti definiscono capitalismo sociale di mercato invece di definirlo <em>ordo-liberismo<\/em>."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Questo ha portato alla prevalenza del concetto di individuo su quello di comunità. È qui che si trova la grande differenza tra pensiero conservatore e pensiero liberale. Il liberalismo mette al centro l’individuo, concependo la comunità come una somma di singoli. Al contrario, il conservatorismo valorizza l’identità degli individui, ma solo nella misura in cui essi fanno parte di una comunità."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Questo è l’elemento fondamentale che avvicinava un tempo il pensiero conservatore a una parte significativa della sinistra storica – oggi scomparsa –, poiché anche quest’ultima aveva nel comunitarismo e nel recupero delle <em>relazioni<\/em>, i suoi punti fermi. Certo in una parte spesso dominante della sinistra prevaleva e ancora prevale una visione socialista statualista, ossia imperniata sul possesso statale dei mezzi di produzione, invece che sull’autogestione e sui <em>common  goods<\/em>. Emmanuel Mounier, per esempio (e che esempio!), parlava di personalismo e di comunitarismo insieme. In questo contesto, il comunitarismo valorizza l’individuo senza abbracciare il liberalismo e recupera la dimensione relazionale senza essere socialista statalista ma comunitario. Tuttavia, questa dinamica viene fortemente compromessa dall’impatto delle tecnologie proto-individualistiche: in questo sono d’accordo."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Ritengo sia importante distinguere tra il conservatorismo di tradizione latina e quello di tradizione anglosassone. Nell’ambito anglosassone, il conservatorismo tende a sovrapporsi al liberalismo, che pone l’individuo al centro. Al contrario, il conservatorismo di tradizione latina è più attento ai temi sociali e al <em>welfare  state<\/em>, e in questo contesto, la dimensione comunitaria si avvicina a certi aspetti della sinistra."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Assolutamente, il cattolicesimo è una fonte profonda di ispirazione non capitalista. Chi avrebbe mai immaginato che Benedetto XVI potesse redigere un testo così rivoluzionario come <em>Caritas in veritate<\/em>, in cui si affrontano temi come la proprietà privata, la proprietà capitalistica, la proprietà cooperativa e i beni comuni? Storicamente, il cattolicesimo ha abbracciato queste questioni con grande spirito antiborghese, ma oggi sembra aver (inesorabilmente?) perso questa dimensione teorica molto ben delineata e potente."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Tutto ciò ci riporta al concetto di secolarizzazione, che considero una delle cause principali dell’aumento della solitudine. Un problema significativo in Occidente, a mio avviso, è la perdita di identità, un fenomeno che colpisce in particolare le nuove generazioni, le quali spesso faticano a trovare un proprio punto di riferimento."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Sì, sono convinto che questo fenomeno sia trasversale e interessi diverse culture. Un esempio emblematico è il fondamentalismo, sia suicida sia omicida, che si manifesta in possenti aree culturali del mondo islamico."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Anche in questo caso, ci sono diversi fattori che contribuiscono a questo fenomeno, tra cui la digitalizzazione. Abbiamo sostituito le religioni tradizionali con nuove forme di religioni dogmatiche. Ad esempio, un certo ambientalismo è diventato una sorta di culto, intoccabile e indiscutibile. Chi prova a mettere in discussione queste idee viene attaccato come se stesse negando l’esistenza di un dio ai seguaci di una religione. Questo passaggio verso dogmi intoccabili mette in luce come la società contemporanea tenda a semplificare questioni complesse, relegando a una sorta di ortodossia ogni forma di critica."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Un fenomeno analogo si osserva nell’ossessione dell’elettrificazione inesorabile delle tecnologie dei trasporti, e non solo di esse. Attualmente, per esempio, una minoranza delle automobili in circolazione è elettrica, eppure ci si aspetta di avere un numero enorme di auto elettriche senza aver provveduto a creare una rete di supporto di tecniche e di tecnologie adeguata che consenta di creare una nuova e diversa base industriale, non solo di servizi terziari, con tutte le devastanti conseguenze sociali che tutta questa follia ideologica sta generando, distruggendo la stessa economia europea e nordamericana, se proseguisse come oggi succede nell’UE, dove essa è imposta da una regolazione verticale che distrugge i rapporti sociali e la politica. Ecco la <em>governance<\/em> al posto del governo politico democratico… Tutte le innovazioni tecnologiche richiedono tempo e pianificazione, nel passaggio dalle carrozze alle automobili, abbiamo dovuto costruire stazioni di servizio, procurare carburante e creare migliaia di segnali stradali. Ci è voluto quasi un secolo per completare questa transizione, eppure oggi sembra che non ci sia la stessa consapevolezza riguardo alle sfide infrastrutturali legate all’elettrificazione..."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Ciò conferma che siamo di fronte a nuove forme di religione, potenzialmente pericolose, poiché sono accettate esclusivamente dall’Europa, e non da tutto il mondo. Esistono infatti parti del mondo, come la Cina, che non stanno seguendo queste politiche."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Pertanto, si può affermare che una delle trasformazioni più significative rispetto al passato è stata lo sviluppo di una tecnologia che ha <em>scoperto<\/em> e amplificato le ideologie."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Sì, e credo che ci sia un altro tema importante su cui riflettere. Negli ultimi trent’anni abbiamo assistito a due fenomeni distinti: il primo, iniziato a metà degli anni ’80, è una globalizzazione spinta e non regolamentata, che ha generato delocalizzazioni e contribuito all’impoverimento dei ceti sociali più vulnerabili nei Paesi occidentali. Il secondo fenomeno è l’accelerazione delle questioni ambientaliste, che sta inevitabilmente interrompendo questo percorso."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Da un punto di vista culturale, stiamo assistendo alla formazione di un’ideologia che rappresenta, in ultima analisi, la secolarizzazione delle religioni tradizionali e l’emergere di nuove forme di fede."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Sì, e ciò che mi sorprende delle politiche <em>green<\/em> è la loro somiglianza con il concetto di eresia. Gli ambientalisti rifiutano ogni forma di critica, etichettando come negazionista climatico chiunque non si allinei con il loro pensiero. Inoltre, sembrano ignorare i cambiamenti che si sono verificati negli ultimi anni: le politiche formulate nel 2019 non sono più valide oggi, a causa del Covid, della guerra in Ucraina e dei molti altri conflitti globali emersi nel frattempo."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Qui emerge la simmetria tra politica e cultura. Un sistema decisionale non eletto, come quello dell’UE, non può essere paragonato a un sistema politico eletto, ma molti non sembrano rendersene conto. Quando Gramsci parlava della crisi organica dei partiti, si riferiva alla mancanza di un legame con il territorio e con la storicità della relazione politica che aggrega la società con e grazie alla cultura in senso antropologico. Oggi, questa connessione è assente, poiché le decisioni vengono prese senza un reale rapporto con le persone e il contesto locale, basandosi su una burocrazia travestita da tecnocrazia e spesso “eletta” in seconda istanza. Un libro di Paul Tucker, <em>Unelected Power: The Quest for Legitimacy in Central  Banking and the Regulatory State<\/em>, analizza questi poteri. Quello che si considerava caratteristico di un’istituzione come l’UE si applica anche al potere dell’ONU e del Fondo Monetario Internazionale."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Soprattutto queste istituzioni trascurano un aspetto fondamentale: il principio di sussidiarietà. Spesso si trovano a una certa distanza dai cittadini e sfuggono al controllo delle popolazioni."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Proprio per questo, non esiste più opposizione politica, il che rappresenta una differenza significativa rispetto al passato."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Secondo me, a volte viviamo in una bolla, quella della cultura, del giornalismo e della politica. Ci relazioniamo principalmente con chi condivide le nostre stesse idee, dimenticando le visioni e le esigenze di gran parte della gente."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Un tempo, il popolo era attivamente coinvolto nella politica: i democristiani erano sia operai, sia impiegati, sia padroni piccoli e grandi, così come i comunisti e i socialisti. Tutti i partiti erano interclassisti: solo la sinistra comunista (sino agli anni Ottanta del Novecento) era profondamente fondata sulla differenza sociale e di classe. Oggi si è consumato un cambiamento radicale: nessun partito ha più un insediamento sociale e territoriale profondo, così come una classe intellettuale che guidi la classe politica paretianamente intesa."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Oggi, il popolo mostra disinteresse."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Anche perché, nel nostro contesto occidentale, abbiamo privato le persone della speranza. Consideriamo, per esempio, la crescente disuguaglianza economica: soprattutto in Europa, assistiamo a una progressiva perdita di fiducia nel futuro. Al contrario, in altre parti del mondo, l’umanità continua a lottare per quelli che pensa siano i propri diritti. Pensiamo a quanto sta accadendo in Myanmar, dove la guerra civile imperversa da anni e Aung San Suu Kyi, premio Nobel per la Pace nel 1991, è attualmente in carcere. Diverse tribù-nazioni stanno combattendo contro una giunta militare sostenuta dalla Cina. Perché nel resto del mondo si combatte, mentre qui, nonostante la grande disuguaglianza economica, non si innesca nemmeno una reazione culturale che non sia solo risentimento?"}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Assistiamo anche a un significativo impoverimento, evidente soprattutto nella classe media delle grandi città e delle province italiane. Vent’anni fa, il centro storico di qualsiasi città, sia al nord che al sud, era vivace e pieno di negozi. Oggi, invece, molti di questi esercizi commerciali sono in vendita o in affitto."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> La radice di questo fenomeno risiede nel fatto che abbiamo trasformato i comuni in aziende e le università in imprese. Abbiamo aziendalizzato il mondo, e questa rappresenta un’altra grande trasformazione che ci porterà inesorabilmente alla decadenza civile e culturale."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Ciò che mi preoccupa è che ci sono categorie che, fino a pochi anni fa, facevano parte del ceto medio, ma ora non lo sono più e stanno diventando sempre più povere. Queste categorie dovrebbero provare un sentimento di speranza ma, troppo spesso, prevale in loro la disillusione."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Un altro tema legato alla perdita di speranza e che rappresenta un fattore di cambiamento rispetto alla mia generazione, è la trasformazione delle modalità di aggregazione e svago, come dimostra il fenomeno della <em>movida<\/em>. Dovremmo considerarlo un problema sociologico e antropologico?"}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Questo fenomeno ha le sue radici nel periodo post ‘68. La ribellione del ‘68, che ha minato i principi di obbligazione e autorità, ha avviato una delle principali cause della crisi attuale: la contestazione dell’autorità, sia familiare che scolastica."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Il movimento di quegli anni ha dato inizio a una tendenza pericolosa, preannunciata da Herbert Marcuse nel libro <em>Eros e civiltà<\/em>, che rappresenta una sorta di bibbia del cambiamento in cui ci troviamo immersi. Ho trovato sconvolgente la notizia della nascita a Torino di una nuova attività assistenziale legata al tanto meritorio Gruppo Abele, un’associazione che si dedica a difendere i genitori vittime dei propri figli."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Il genitore sembra aver perso il proprio ruolo educativo e, sempre più spesso, anziché educare, diventa amico del figlio. Questa tendenza si riflette anche nella decisione di eliminare i voti a scuola, recentemente sperimentata in un liceo pubblico a Roma, per paura che la valutazione possa traumatizzare i giovani. Tuttavia, scelte simili hanno come conseguenze che gli studenti non si abitueranno a essere valutati e, quando entreranno nel mondo del lavoro, mancheranno della preparazione necessaria per inserirsi nella società. Rimuovere l’attribuzione di voti a scuola significa crescere una generazione incapace di affrontare il mondo reale, un segnale di ulteriore fragilità."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Questo rappresenta un altro dei grandi cambiamenti, forse quello più fondamentale e ontologico: la caduta del principio di obbligazione, anche nella genitorialità e nella responsabilità educativa. Le piante offrono frutti da consumare, non radici, poiché queste ultime sono solide e indigeribili. Tuttavia, molti giovani di oggi sembrano <em>mangiare le radici<\/em>, poiché rinunciare al principio di genitorialità equivale a rinunciare al concetto stesso di radice, ossia di una fondazione ontologica della società grazie a principi di obbligazione morale, sociale, politica in senso civico…"}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Non so se concorda, ma credo che la tendenza alla diffusione dell’identità <em>woke<\/em> e della <em>cancel culture<\/em> in Occidente sia strettamente legata a questo fenomeno. Questa tendenza mira a negare le proprie radici e coinvolge più ampiamente la nostra civiltà. Il problema è evidente nelle derive estreme della moda <em>genderless<\/em> e nella crescente difficoltà di esprimere critiche a queste tendenze. Ciò crea un grave problema per la libertà di espressione, rendendo impossibile, all’interno di un dibattito pubblico, criticare certe correnti – che non significa attaccare una persona, ma mettere in discussione un modello – per il timore di essere etichettati come estremisti."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Ciò che risulta più esplosivo è, in effetti, il linguaggio stesso, che rappresenta una evidente manifestazione di un condizionamento sociale profondo."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Esistono diversi aspetti del nostro modo di vivere e di essere, interessati da una profonda trasformazione. Tuttavia, se si osano fare osservazioni, anche con toni pacati, si rischia di essere etichettati come complottisti o estremisti. Questo accade frequentemente nelle trasmissioni televisive, dove chi esprime un’opinione può diventare facilmente bersaglio di accuse e reazioni esagerate per l’uso di termini considerati politicamente scorretti."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Paradossalmente, in un mondo che dovrebbe mettere al centro il soggettivismo, si osserva invece una prevalenza del senso comune e delle reazioni di gruppo, simili a quelle di un branco."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Questo fenomeno si riflette anche nel modo in cui viene trattato il Papa, il quale viene accolto o silenziato a seconda delle sue posizioni su temi etici. Senza entrare nel merito di questi argomenti, vedo in questo atteggiamento una questione di principio: in una democrazia, teoricamente, dovremmo avere la libertà di esprimere le nostre idee, a condizione che non siano diffamatorie. Tuttavia, oggi il rischio di censure preventive è sempre presente."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Un altro aspetto che mi colpisce è la perdita di caratterizzazione della cultura storicamente prodotta dall’<em>anglosfera<\/em>, che una volta aveva la capacità di esercitare un’egemonia culturale, anche nelle relazioni internazionali. Oggi, invece, sembra essere diventato un impero riluttante, riluttante ad agire e a pensare. Molti dei temi di cui stiamo discutendo si ritrovano nel capolavoro di Philip Roth, <em>La macchia umana<\/em>. Del resto, le università nord-americane e inglesi, che sono spesso state fucine di pensiero critico, hanno invece esercitato ed esercitano un effetto devastante sulla stessa civilizzazione, implementando i fenomeni a cui facevi riferimento. Se torniamo al testo di Herbert Marcuse, <em>Eros e civiltà<\/em>, possiamo riconoscere in esso le basi per alcuni processi psichici collettivi che oggi si manifestano nell’ideologia <em>woke<\/em>. In questo modo, si delinea un percorso di pensiero che ha influenzato profondamente le attuali dinamiche culturali e sociali."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Un fenomeno che stiamo osservando in Europa è caratterizzato da una forma ingiustificata di inferiorità culturale, che ci porta a importare temi e argomenti dai campus americani, spesso estranei al nostro contesto culturale. Questo comportamento rappresenta un chiaro segnale del processo di disgregazione che è in corso nel panorama culturale europeo."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Un tempo, i leader politici si formavano attraverso lo studio dei testi greci e latini e della più avvertita sociologia ed economia, classica o neoclassica che fosse, acquisendo una notevole capacità strategica. Tuttavia, a partire dagli anni ’70 e ’80, abbiamo assistito a un cambiamento significativo: la cultura in senso tradizionale di <em>kultur<\/em>, che non era appannaggio delle sole élite intellettuali di professione ma anche delle élite sociali, popolari, ha iniziato a perdere terreno, a franare sino a scomparire nelle classi e nei ceti dominanti della società e della politica."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Ciò che mi preoccupa è la crescente tendenza a innalzare sempre di più l’asticella: tutto è iniziato nel 1968, poi dieci anni fa abbiamo assistito a un’emergente sensibilità verso il politicamente corretto, che ha portato all’imposizione della <em>cancel culture<\/em>, e ora ci troviamo di fronte all’ideologia <em>woke<\/em>."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Ci troviamo nell’era del transumanesimo, dove molte persone credono di poter raggiungere l’immortalità."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Esattamente, stiamo osservando un crescente predominio del materialismo a scapito della dimensione spirituale, con l’individuo che si percepisce come invincibile."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> È un riflesso della crisi della democrazia, sia nordamericana sia inglese. Quando il Regno Unito ha smesso di essere un faro culturale e si è trasformato in un centro dell’ideologia <em>woke<\/em>, è venuto meno il punto di riferimento di una civiltà fondata sui valori culturali del <em>Commonwealth<\/em>. Qual è la situazione attuale a livello internazionale? In passato, il mondo era suddiviso in blocchi caratterizzati da autorevolezza e deterrenza; oggi, invece, è diventato un insieme frattale dove non funzionano più né la deterrenza né la deferenza…"}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Stiamo assistendo a una chiara crisi dell’Occidente, che si riflette anche nella sfera della politica estera. L’Occidente, e in particolare gli Stati Uniti, sembrano aver perso la forza e l’influenza che avevano venti o trent’anni fa."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Quello che io definisco l’<em>Impero Orientale<\/em> conquista sempre più potere nelle relazioni di potenza mondiali. Si tratta non di una relazione di potenza organica, ma tuttavia potente: lo si definisce il Sud del mondo, che in sostanza, però, non esiste come organica unità, tanto è frastagliato e complesso e contraddittorio, ma tuttavia si erge come antemurale contro la cultura occidentale e a quello che ne rimane dei suoi alleati."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Una serie di errori, tra cui il principale è stato il nostro approccio nei confronti della Cina, ha portato a questa situazione. Abbiamo consentito alla Cina di entrare nell’Organizzazione Mondiale del Commercio e abbiamo delocalizzato le produzioni, in particolare quelle tecnologiche, senza considerare che stavamo perdendo l’opportunità di acquisire competenze e <em>know-how<\/em>. La Cina, con la sua civiltà millenaria, si sta preparando a diventare un attore geopolitico molto più temibile, anche rispetto alla Russia, nel lungo termine."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Un altro elemento antropologico cruciale per comprendere la natura del sistema di potere della Cina è l’essere una società priva di religione e di una filosofia della salvezza. La sua morale autoritaria è disegnata per sostenere il potere degli anziani e del partito comunista: la <em>burocrazia celeste<\/em> di Étienne Balazs si è trasformata in potere hobbesiano delle classi politiche."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> La situazione è indubbiamente molto preoccupante per noi, poiché si è formato un blocco <em>antistorico<\/em> che trae alimento dall’odio e dagli errori dell’Occidente, fondato sull’asse Russia-Cina. Questo blocco è caratterizzato da più nemici che alleati, considerando le loro diverse tradizioni."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Questo insieme di strutture ideologiche ha ingenerato la convinzione che la Russia non faccia più parte dell’Europa e che l’Europa possa esistere senza la Russia."}, {"t": "p", "h": "Ma io vorrei ora discutere un altro aspetto del nostro problema: il cambiamento nel rapporto tra generazioni, che è diventato evidente negli ultimi anni. La mia generazione vedeva le precedenti come un punto di riferimento, mentre oggi si percepisce una netta rottura tra generazioni, alimentata anche da una corrente di opinione pervasiva che enfatizza il conflitto intergenerazionale."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Nelle civiltà tradizionali, la figura centrale nei villaggi era l’anziano, riconosciuto dalla comunità per la sua saggezza. Nella Roma antica, era il <em>pater familias<\/em>, che godeva di autorità grazie alla sua esperienza. Oggi, però, molti giovani non vedono più gli anziani come punti di riferimento, ma piuttosto come ostacoli. Questo malinteso è alimentato da una certa retorica giovanilista alla quale mi oppongo. Non possiamo semplicemente affermare di dare spazio ai giovani, dobbiamo dare spazio ai giovani come persone di valore. La stessa logica si applica alla questione della parità di genere."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Anche in questo contesto, il discorso sulle <em>quote<\/em> riflette la tendenza degli ultimi anni a ridurre tutto a una dimensione matematica e a privare di significato, di ontologia, il nostro modo di essere. Questo porta a ripetere frequentemente l’idea della centralità dei dati. Personalmente, non credo nel predominio dei dati. In passato, siamo riusciti a dominare il mondo anche con un numero limitato di informazioni. Certo, i dati possono essere utili in alcuni settori industriali, ma non li considero un elemento di controllo <em>biopolitico<\/em>. Questa visione mi sembra esagerata."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> In questo senso, sarà fondamentale l’evoluzione dell’intelligenza artificiale, perché sono convinto che si tratterà di una rivoluzione ancor più significativa di quella di Internet, destinata a influenzare profondamente le nostre vite. Se in questa fase iniziale non riusciremo a integrare l’intelligenza artificiale con i principi etici, assisteremo a conseguenze drammatiche, specialmente nel mercato del lavoro. Anche nel settore delle cure mediche, dove l’intelligenza artificiale sta iniziando a supportare le diagnosi, è cruciale ricordare che ogni caso clinico è unico e richiede un’attenzione personalizzata."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Da una prospettiva di formazione marxista in economia, cattolica e umanista filosoficamente, temo che se l’intelligenza artificiale potrà essere accessibile a tutti in alcune filiere e settori, ci saranno comunque prestazioni e servizi che solo i più abbienti potranno permettersi. Sono convinto che l’intelligenza artificiale, nel sistema capitalistico, amplificherà ulteriormente il divario tra ricchi e poveri, tra chi detiene il potere e chi ne è privo. Si tratta di uno strumento di dominio – non di classe, ma di ceto e di <em>quasi gruppi<\/em>, come li definiva Luciano Gallino – che contribuirà ad aumentare le disuguaglianze."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Temo, di nuovo, che l’errore che stiamo commettendo sia di cercare modelli altrove, al di fuori delle nostre tradizioni. Non sto esprimendo una tendenza anti-occidentale o anti-europea; critico piuttosto il fatto che l’Occidente abbia perso il suo modello, i suoi valori e i suoi riferimenti. Queste derive stanno minando le fondamenta dell’Occidente."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> Immagina se su questo punto ci fosse un consenso politico generale. In passato, c’era un accordo <em>bipartisan<\/em> su questo tema. Cinquant’anni fa, non era nemmeno considerato un argomento di discussione."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> Al giorno d’oggi, esiste una parte della nostra società che nutre pulsioni anti-occidentali e tende a idealizzare modelli provenienti da altre culture."}, {"t": "p", "h": "<strong class=\"sp\">G. S.<\/strong> È fondamentale ripartire dall’istruzione, concepita come un’opportunità per trasmettere i valori su cui si fonda la civiltà occidentale, costruita nel corso dei secoli: istruzione come <em>Bildung<\/em>, dunque, e non come informazione. Solo in questo modo potremo restituire centralità alle radici culturali che hanno consentito all’Occidente di affrontare e superare le grandi crisi della storia, emergendo persino più forte culturalmente volta a volta."}, {"t": "p", "h": "<strong class=\"sp\">F. G.<\/strong> È essenziale creare un nuovo patto tra le generazioni, una piattaforma di dialogo capace di rinnovare i modelli sociali. Questo patto deve fondarsi sui valori del passato, adattandoli a un contesto che presenta sfide sia tradizionali sia contemporanee."}], "bio": "", "notes": []}, "n5-a3": {"paras": [{"t": "p", "h": "Il fenomeno populista, nelle sue diverse articolazioni, si è sviluppato nell’ultimo decennio con una velocità impressionante a livello globale non solo per la sua forza persuasiva, ma perché ha trovato davanti a sé ampi spazi che le democrazie liberali hanno lasciato sguarniti. Il suo combustibile è la sfiducia. Molti segnali indicano che negli ultimi decenni è in calo la fiducia verso istituzioni e autorità varie: Stati, governi, istituzioni sovranazionali, media, partiti politici, organizzazioni economiche, religioni, università. Uno studio delle Nazioni Unite mostra che dal 2000 al 2020 la fiducia dei cittadini a livello globale verso i propri governi è scesa di diversi punti, attestandosi attorno al 35%. Il calo non è stato lineare, ma si è manifestato in diverse ondate che ricalcano vari momenti di crisi. Nel primo quarto di questo secolo si possono riconoscere cinque momenti significativi di crisi che hanno contribuito a logorare la fiducia in sistemi e strutture che sembravano ancorate saldamente a certezze acquisite e irreversibili. Sono cinque delusioni che hanno reso fragile il terreno su cui camminano gli abitanti di questo tempo."}, {"t": "p", "h": "La prima delusione è, appunto, quella democratica. Le guerre in Afghanistan e in Iraq mosse dagli Stati Uniti e dalla coalizione occidentale sull’onda degli attentati dell’11 settembre 2001 non avevano solo lo scopo di scovare e punire i responsabili degli attacchi ma di esportare la democrazia nei luoghi che fornivano terreno fertile per il terrorismo. Osama Bin Laden è stato scovato e ucciso ma la missione di impiantare un sistema democratico con gli eserciti dopo averci provato con McDonald’s e il mercato è fallita. Di quella stagione rimangono le successive reincarnazioni del brand terroristico di al Qaeda e la vergognosa fuga degli occidentali da Kabul, con i talebani che riprendono il potere e restaurano il loro regime di oppressione con rinnovata convinzione. Questa epopea di disillusione ha raffreddato anche i più calorosi adepti della democrazia liberale come destino definitivo dell’umanità e <em>fine della storia<\/em>."}, {"t": "p", "h": "La seconda delusione è quella economica. La crisi finanziaria del 2008 ha messo in ginocchio il sistema del risparmio e scoperchiato il verminaio di avidità delle banche d’investimento. Il collasso ha generato la Grande Recessione e, a cascata, ha contribuito alla crisi del debito sovrano in Europa, con il dramma della Grecia che ha rischiato di mandare gambe all’aria l’Eurozona. Il progetto europeo ha resistito ma l’intera economia globale ha sofferto la stagione nera della crisi che ha lasciato molte cicatrici. La generazione dei millennial che si è affacciata sul mercato del lavoro in quegli anni di sofferenza è cresciuta alla scuola della frustrazione e ha interiorizzato il senso di una promessa tradita."}, {"t": "p", "h": "La terza delusione è quella della tecnologia digitale. Nel giro di un decennio le speranze celestiali che hanno accompagnato l’alba della rivoluzione digitale sono state rimpiazzate dalla percezione che nello sviluppo tecnologico si annidasse qualcosa di demoniaco. Le compagnie della Silicon Valley si sono trasformate da propulsori di una rivoluzione in infradito in mostri assetati di dati e profitti. Google si è mangiato tutta la navigazione online, Amazon è diventata l’orda barbarica che ha spazzato via tutti gli altri dal mercato, Mark Zuckerberg ci permetteva di rimanere in contatto con i parenti lontani e si è trovato davanti a una commissione del Congresso americano in cui il più gentile gli ha detto che <em>ha le mani sporche di sangue<\/em>. Elon Musk in pochi anni è passato da geniale inventore di auto elettriche efficientissime a strambo colonizzatore di Marte a pazzotico propagandista trumpiano, che gioca con i social media e controlla satelliti che possono decidere le sorti delle guerre. San Francisco, paradiso dell’innovazione e del progresso, è diventata l’inferno delle disuguaglianze e della criminalità, abitata da masse di indigenti marginalizzati che sopravvivono a due passi da signori della tecnologia che sfrecciano su auto senza conducente, più odiati dei banchieri di Wall Street negli anni Ottanta."}, {"t": "p", "h": "La quarta delusione è quella della scienza che si è manifestata con la pandemia di Covid-19. La ricerca scientifica ha fatto passi grandiosi per contrastare in tempi brevissimi un virus che ha ucciso circa 7 milioni di esseri umani ma l’ottimismo neopositivista che aveva regnato nei decenni precedenti ne è uscito malconcio. Si credeva che con un tocco magico si potesse risolvere tutto. La storia della pandemia, invece, è anche la storia dei misteri della malattia che non siamo riusciti ad afferrare, degli effetti a lungo termine che ci sfuggono, dei litigi fra esperti, dello scetticismo sui vaccini, della rabbia sociale per i lockdown, della resistenza alla dittatura sanitaria, del rigurgito antiscientifico, della paranoia complottista."}, {"t": "p", "h": "Infine, l’ultima delusione è quella della pace. L’invasione dell’Ucraina da parte della Russia nel 2022 ha riportato lo spettro della guerra nel cuore dell’Europa. I conflitti non si erano mai del tutto allontanati dal vecchio continente ma l’invasione sul larga scala dell’Ucraina ha riproposto la guerra nel suo peggiore volto novecentesco, riportando in auge i bombardamenti aerei a tappeto, i carriarmati, il logoramento sulla linea del fronte, la brutalità di assedi che si protraggono per anni. Soprattutto, ha restaurato l’idea della violazione dell’integrità di uno stato e dell’occupazione di territori come via credibile per affrontare i rapporti fra gli stati. Un mondo che sembrava archiviato è improvvisamente riemerso. La Russia, invece di trovare l’isolamento della comunità internazionale, ha trovato l’aiuto e la solidarietà della Cina e di tutto il sud globale. Nella guerra fra Russia e Ucraina, la maggior parte dell’umanità è con Mosca e contro la reazione occidentale al fianco di Kiev. Un’altra delusione che ha rinfocolato i sentimenti dei nazionalpopulisti di tutto il mondo."}], "bio": "<strong>Mattia Ferraresi<\/strong> è giornalista per il quotidiano “Domani”. È stato per dieci anni corrispondente per “Il Foglio” dagli Stati Uniti e, tra il 2018 e il 2019, <em>fellow<\/em> alla Nieman Foundation for Journalism di Harvard. Scrive regolarmente per alcuni giornali americani,fra cui “The New York Times” e “The Boston Globe”. Ha scritto con Martino Cervo <em>Obama. L’irresistibile  ascesa di un’illusione<\/em>, <em>Politica  americana<\/em>, <em>La febbre di Trump<\/em>, <em>Il secolo greve<\/em>, con Massimo Camisasca <em>Oltre la paura<\/em>, <em>Solitudine<\/em> e ha pubblicato quest’anno <em>I demoni  della mente<\/em>.", "notes": []}, "n4-ep7": {"epigraph": "Carissimo padre,\ndi recente mi hai domandato perché mai sostengo di avere paura di te. Come\nal solito, non ho saputo risponderti niente, in parte proprio per la paura che\nho di te, in parte perché questa paura si fonda su una quantità tale di dettagli che parlando non saprei coordinarli neppure passabilmente. E se anche\ntento di risponderti per iscritto, il mio tentativo sarà necessariamente assai\nincompleto, sia perché anche nello scrivere mi sono d’ostacolo la paura che\nho di te e le sue conseguenze, sia perché la vastità del materiale supera di\ngran lunga la mia memoria e il mio intelletto.\nPer te la cosa è sempre stata molto semplice, almeno nella misura in cui ne\nhai parlato davanti a me e, indiscriminatamente, davanti a molti altri. Ti\npareva che stesse più o meno così: tu hai lavorato sodo per tutta una vita,\nhai sacrificato ogni cosa per i tuoi figli, soprattutto per me; di conseguenza\nio ho fatto la bella vita, ho avuto la massima libertà di studiare quello che\nvolevo, non ho dovuto preoccuparmi né di procurarmi il cibo né di qualsiasi\naltra cosa; tu non pretendevi per questo la mia gratitudine, la conosci, “la\ngratitudine dei figli”, ma almeno un po’ di gentilezza, qualche accenno di\ncompassione, e invece io mi sono sempre rifugiato davanti a te, in camera\nmia, tra i miei libri, coi miei amici stravaganti, nelle mie idee eccentriche;\nnon ti ho mai parlato apertamente, non mi sono mai messo accanto a te nel\ntempio né ti sono mai venuto a trovare a Franzensbad; inoltre non ho mai\navuto il senso della famiglia, non mi sono mai occupato del negozio e delle\naltre cose tue, la fabbrica l’ho addossata a te e poi ti ho abbandonato, ho\ndato man forte a Ottla’ nella sua testardaggine, e mentre per te non muovo un dito (non ti prendo nemmeno i biglietti per il teatro), per gli amici\nfaccio tutto. Riassumendo il tuo giudizio su di me, ne emerge che non mi\nrimproveri, a dire il vero, qualcosa di davvero sconveniente o malvagio (fatta eccezione forse per il mio ultimo progetto matrimoniale), ma freddezza,\ndistanza, ingratitudine."}, "n4-sapelli": {"paras": [{"t": "p", "h": "<em>“Sì, e forse per la mia debolezza e per la mia malinconia, com’egli è potentissimo su tali spiriti,  m’inganna per dannarmi. Avrò motivi più rilevanti di questo”.<\/em>"}, {"t": "a", "h": "William Shakespeare, <em>Amleto<\/em>, atto II, scena II"}, {"t": "p", "h": "Si è più insicuri oggi di quanto non lo fossimo un tempo, noi umani dei nostri giorni?"}, {"t": "p", "h": "Leggiamo Michel de Montaigne, saggio per tutti i tempi: «Non muori perché sei malato, muori perché sei vivo». E dunque sempre è in te stesso che trovi la sicurezza o l’insicurezza, purché Tu comprenda la meraviglia d’esser vivo, appunto. A differenza del XVI secolo da molte delle malattie, sconosciute o per le quali non esisteva una cura al tempo di Montaigne, oggi invece si può guarire. Pensare che sia la malattia a portare alla morte e non il corso stesso della vita è un grave errore. «Preparati, dunque, alla morte, ma fai sì ch’essa non rappresenti più una minaccia per la tua vita», affermava il grande Montaigne."}, {"t": "p", "h": "Oggi, come secoli orsono, il problema è lo stesso: l&#x27;insicurezza è un’esperienza spirituale in mondi fisici diversi e cangianti. E ieri come oggi il “senso” del vivere è oscuro, se non lo illuminiamo di una ricerca spirituale. Così evitiamo che la paura di morire si trasformi in paura di vivere eterna, paura di ammalarsi, di non essere all’altezza delle aspettative degli altri, di soffrire, di essere delusi, di perdere qualsiasi cosa: il lavoro, l’amore, lo <em>status<\/em>. Ma esiste una storicità dell’insicurezza e ogni epoca storica ha elaborato delle rappresentazioni della medesima che sono nel contempo tentativi di spiegazione e di cura."}, {"t": "p", "h": "L’opera d’arte pittorica ne è un esempio lampante allorché si manifesta come “discorso sulla Melanconia”."}, {"t": "p", "h": "Nel De Chirico di <em>Malinconia Ermetica<\/em> (1919) la tristezza non è uno stato d’animo ma una contemplazione di sé e del mondo: è <em>melanconia<\/em> ermetica non solo perché <em>Ermes<\/em> è il dio che custodisce questo sentimento, ma perché ha a che fare con l’enigma, con l’ignoto, con l’inconoscibile che è la nostra coscienza nel mondo in ogni epoca storica."}, {"t": "p", "h": "È un discorso poetico ben diverso da quello dell’opera fondamentale con cui ci confrontiamo tutti: l’immagine di Dürer del 1514, dove la malinconia è la coscienza di sé, concetto e esperienza straordinariamente moderni, attualissimi. Ma oggi sono tempi di un nuovo romanticismo, ossia di uno stupore del soggetto dinanzi a un mondo in cui siamo – come nella <em>Folla solitaria<\/em> di David Riesman – consegnati a noi stessi nella solitudine, come dimostra il COVID che nella solitudine ci ha ricollocati tutti, pur nel mondo degli eterni interconnessi. Caspar David Friedrich nel <em>Monaco in riva al mare<\/em> (1808-1810) enfatizzava la polarità tra io e mondo, polarità di cui è fatto l’immaginario romantico e in cui, appunto, la pandemia ci ha abbattuti. L’uomo contempla l’immensità dell’universo, l’immensità inarrivabile della natura che pare tutto distruggere: rimane una figura ritratta di spalle. Una presenza umana di fronte all’ignoto."}, {"t": "p", "h": "La <em>Melanconia<\/em>, allora, è una <em>nuova coscienza dell’io<\/em> che nasce iconograficamente con Dürer e riappare in Van Gogh, in Munch, in Sironi. Una iconografia che riapparirà come immagine dell’io melanconico (Arnold Böcklin, in <em>Ulisse e Calipso<\/em>)."}, {"t": "p", "h": "Oggi – nel pieno di ciò che rimane dell’angoscia della paura della contaminazione pandemica e della morte per guerra europea che è in corso con l’aggressione russa all’Ucraina – il nostro immaginario è quello de <em>L’Ora blu<\/em> (1890) di Max Klinger, che ci parla dell’ora del crepuscolo, della notte che sta arrivando."}, {"t": "p", "h": "Altro polo conduttore del nostro discorso è la “nuova coscienza dell’io che passa attraverso la natura” e quindi, “nuovo sentimento della natura” che è disvelato dalla coscienza ambientalista e dalle sue paure. Un tema su cui scrisse pagine memorabili Francesco Arcangeli, per il quale il nuovo sentimento della natura portava con sé una nuova idea di spazializzazione e di panico naturalistico."}, {"t": "p", "h": "Pensiamo agli acquerelli di Turner dove il vero sembra dissolversi: uno spazio ormai senza coordinate, senza confini, uno spazio in cui noi quasi ci perdiamo."}, {"t": "p", "h": "Ieri e oggi."}], "bio": "", "notes": []}, "n4-alfonso": {"paras": [{"t": "p", "h": "Catastrofi naturali, conflitt
